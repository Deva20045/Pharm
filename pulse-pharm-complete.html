<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE · Pharmacology — Marrow Edition 8 Companion</title>
<style>
  :root{
    --bg:#120d1a; --card:#221a30; --card2:#2b2139; --line:#3a2d52;
    --txt:#f4eefb; --mut:#a89bbd; --pink:#e0607e; --gold:#c99a4b;
    --teal:#5fd0b5; --good:#3ddc84; --bad:#ff5d6c; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 60px;}
  header.top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:#120d1af2; border-bottom:1px solid var(--line); max-width:560px; margin:0 auto;}
  header.top .brand{font-weight:800; font-size:20px; letter-spacing:.3px; flex:1;}
  header.top .back{font-size:22px; cursor:pointer; color:var(--mut); padding:2px 8px 2px 0;}
  .hstat{font-weight:800; font-size:15px; white-space:nowrap;}
  .hidden{display:none !important;}
  .hero{background:linear-gradient(160deg,#3a2547,#221a30 70%); border:1px solid var(--line);
    border-radius:22px; padding:26px 22px; margin:16px 0;}
  .hero .kick{font-size:12px; letter-spacing:2.5px; color:var(--mut);}
  .hero h1{font-family:var(--serif); font-size:42px; margin:8px 0 10px; line-height:1.05;}
  .hero p{color:#cbbfe0; font-size:15px; line-height:1.55; margin:0 0 12px;}
  .hero a{color:var(--pink); font-weight:700; text-decoration:none; font-size:15px; cursor:pointer;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px; text-align:center;}
  .stat b{font-size:22px; display:block;} .stat span{font-size:12px; color:var(--mut);}
  .btn{display:block; width:100%; margin-top:12px; padding:15px; font-size:16px; font-weight:700;
    color:#1a0f14; background:linear-gradient(135deg,#f0788f,var(--pink)); border:0; border-radius:14px; cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--txt); border:1.5px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,#e0b45f,var(--gold)); color:#1d1405;}
  h2.page{font-family:var(--serif); font-size:30px; margin:18px 0 2px;}
  p.sub{color:var(--mut); margin:0 0 14px; font-size:14px;}
  .chrow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin:10px 0; cursor:pointer;}
  .chrow.locked{opacity:.45; cursor:default;}
  .chnum{min-width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    font-weight:800; font-size:17px; background:linear-gradient(135deg,#d96a84,#b34a62); color:#fff;}
  .chrow.locked .chnum{background:#3a2f4d; color:var(--mut);}
  .chrow .t{flex:1; font-weight:700; font-size:15.5px; line-height:1.35;}
  .chrow .u{font-size:12.5px; color:var(--teal); white-space:nowrap; font-weight:700;}
  .chrow.locked .u{color:var(--mut);}
  .pathsec{text-align:center; color:var(--mut); font-size:12px; letter-spacing:2.5px; margin:26px 0 6px;
    display:flex; align-items:center; gap:10px;}
  .pathsec::before,.pathsec::after{content:""; flex:1; height:1px; background:var(--line);}
  .node{display:flex; flex-direction:column; align-items:center; position:relative; padding:10px 0 4px;}
  .node:not(:last-child)::after{content:""; width:3px; height:26px; margin-top:10px; border-radius:2px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px);}
  .ball{width:86px; height:86px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; font-weight:800; cursor:pointer; border:4px solid transparent;}
  .ball.done{background:#1d3a2a; border-color:var(--good); color:var(--good); font-size:32px;}
  .ball.current{background:radial-gradient(circle at 35% 30%,#e0b45f,var(--gold) 70%);
    color:#fff; box-shadow:0 0 0 6px #c99a4b33, 0 8px 24px #c99a4b55; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 6px #c99a4b33;}50%{box-shadow:0 0 0 11px #c99a4b22;}}
  .ball.locked{background:#241c33; border-color:#171224; color:#6f6386; cursor:default; font-size:30px;}
  .ntitle{margin-top:8px; font-weight:700; font-size:14.5px; text-align:center; max-width:230px; line-height:1.35;}
  .ncount{font-size:12px; color:var(--mut); margin-top:2px;}
  .guide{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-top:16px;}
  .guide .kick{font-size:12px; letter-spacing:2px; color:var(--gold); font-weight:800;}
  .guide h2{font-family:var(--serif); font-size:26px; margin:8px 0 10px; line-height:1.25;}
  .guide p{color:#d8cde9; line-height:1.65; font-size:15.5px;}
  .qbar{height:10px; background:var(--card2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:16px 0 14px;}
  .qbar i{display:block; height:100%; width:0; background:var(--pink); transition:width .3s;}
  .qcount{font-size:12px; letter-spacing:2px; color:var(--mut); font-weight:700;}
  .qtag{display:inline-block; font-size:11.5px; color:var(--teal); border:1px solid #5fd0b555;
    border-radius:999px; padding:3px 10px; margin-top:8px;}
  .qtext{font-family:var(--serif); font-size:25px; line-height:1.35; margin:10px 0 16px;}
  .opt{display:block; width:100%; text-align:left; margin:10px 0; padding:16px; font-size:16px;
    color:var(--txt); background:var(--card); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; line-height:1.4;}
  .opt:not(:disabled):active{border-color:var(--pink);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:#3ddc841c;}
  .opt.wrong{border-color:var(--bad); background:#ff5d6c1c;}
  .fb{margin-top:12px; padding:14px 15px; border-radius:14px; font-size:14.5px; line-height:1.6; display:none;}
  .fb.show{display:block;}
  .fb.good{background:#3ddc8412; border:1px solid #3ddc8466;}
  .fb.bad{background:#ff5d6c12; border:1px solid #ff5d6c66;}
  .donebox{text-align:center; padding:30px 10px;}
  .donebox .big{font-size:64px;}
  .donebox h2{font-family:var(--serif); font-size:30px; margin:10px 0 4px;}
  .rev{margin:8px 0; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
    font-size:13.5px; background:var(--card); line-height:1.5; text-align:left;}
  .rev b{color:var(--good);}
  footer{text-align:center; color:var(--mut); font-size:12px; margin-top:22px; line-height:1.7;}
  .float{position:fixed; font-weight:800; pointer-events:none; animation:rise 1s ease-out forwards; z-index:50;}
  @keyframes rise{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);}}
</style>
</head>
<body>
<header class="top">
  <span class="back hidden" id="backBtn" onclick="goBack()">‹</span>
  <span class="brand" id="brand">PULSE</span>
  <span class="hstat">🔥 <span id="hStreak">0</span></span>
  <span class="hstat">✦ <span id="hXP">0</span></span>
</header>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="hero">
      <div class="kick">MARROW EDITION 8 · COMPANION</div>
      <h1>Pharmacology</h1>
      <p id="heroSub"></p>
      <a onclick="show('chapters')">Browse chapters →</a>
    </div>
    <div class="stats">
      <div class="stat"><b id="sXP">0</b><span>Total XP</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="sUnits">0</b><span>Units done</span></div>
    </div>
    <button class="btn ghost" onclick="unlockAll()">🔓 Unlock all units (testing)</button>
    <button class="btn" onclick="continueLearning()">▶ Continue learning</button>
  </div>

  <!-- CHAPTERS -->
  <div id="chapters" class="hidden">
    <h2 class="page">Chapters</h2>
    <p class="sub" id="chSub"></p>
    <div id="chList"></div>
  </div>

  <!-- PATH -->
  <div id="path" class="hidden">
    <p class="sub" id="pathKick" style="margin-top:16px;"></p>
    <h2 class="page" id="pathTitle" style="margin-top:0;"></h2>
    <p class="sub" id="pathSub"></p>
    <div id="nodes"></div>
  </div>

  <!-- GUIDE -->
  <div id="guide" class="hidden">
    <div class="guide">
      <div class="kick" id="gKick"></div>
      <h2 id="gTitle"></h2>
      <p id="gText"></p>
      <p class="sub" id="gCount"></p>
      <button class="btn gold" onclick="beginUnit()">Start unit →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qbar"><i id="qbar"></i></div>
    <div class="qcount" id="qcount"></div>
    <div><span class="qtag" id="qtag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn" onclick="nextQ()">Continue →</button>
  </div>

  <!-- UNIT DONE -->
  <div id="unitdone" class="hidden">
    <div class="donebox">
      <div class="big">🎉</div>
      <h2>Unit complete!</h2>
      <p class="sub" id="dSub"></p>
      <div class="stats">
        <div class="stat"><b id="dScore">–</b><span>Score</span></div>
        <div class="stat"><b id="dXP">–</b><span>XP earned</span></div>
        <div class="stat"><b id="dAcc">–</b><span>Accuracy</span></div>
      </div>
      <div id="dRev"></div>
      <button class="btn" onclick="afterUnit()">Continue →</button>
      <button class="btn ghost" onclick="openGuide(curUnit)">↻ Redo unit</button>
    </div>
  </div>

  <footer>PULSE · Pharmacology · question order follows the book line-by-line<br>options shuffled every run · progress saved on this device</footer>
</div>

<script>
const QUESTIONS = [{"id":"PHARM-C1-001","sec":"Definitions","page":1,"q":"As defined on this page, pharmacokinetics is the study of:","opts":["Movement of drugs in the body after intake through any route","Drug-induced change in the body","Binding of drugs to their specific receptors","Variation of drug response between individuals"],"ans":0,"exp":"Pharmacokinetics = study of movement of drugs in the body after intake through any route; the drug-induced change in the body is pharmacodynamics. (Book p1)"},{"id":"PHARM-C1-002","sec":"Definitions","page":1,"q":"Pharmacodynamics is defined as:","opts":["The movement of the drug within the body after intake","The chemical breakdown of the drug in the liver","The elimination of the drug via the kidney","The drug-induced change in the body"],"ans":3,"exp":"Pharmacodynamics = drug-induced change in the body (what the drug does to the body). (Book p1)"},{"id":"PHARM-C1-003","sec":"Figure legend","page":1,"q":"In the course-of-drug flowchart, which processes are colour-coded as pharmacokinetics?","opts":["Drug, binds to target and effect","Intake, binding and onset of action","Absorption, distribution, metabolism and excretion","Adipose storage, redistribution and tubular secretion"],"ans":2,"exp":"The legend marks absorption, distribution, metabolism and excretion as pharmacokinetics; the drug, binding to target and effect are marked as pharmacodynamics. (Book p1)"},{"id":"PHARM-C1-004","sec":"Figure legend","page":1,"q":"According to the flowchart legend, which trio is treated as pharmacodynamic events?","opts":["Absorption, distribution, excretion","Distribution, metabolism, excretion","Absorption, effect, redistribution","Drug, binding to target, effect"],"ans":3,"exp":"The legend highlights the drug itself, 'binds to target' and 'effect' as pharmacodynamics. (Book p1)"},{"id":"PHARM-C1-005","sec":"Absorption & distribution","page":1,"q":"A drug is taken orally. Per the flowchart, the first pharmacokinetic step it undergoes is:","opts":["Distribution","Metabolism","Excretion","Absorption"],"ans":3,"exp":"The orally taken drug undergoes absorption first, and only then reaches the systemic circulation. (Book p1)"},{"id":"PHARM-C1-006","sec":"Absorption & distribution","page":1,"q":"Immediately after absorption, the drug enters the:","opts":["Systemic circulation","Adipose tissue","Bile","Target receptor"],"ans":0,"exp":"Absorption delivers the drug into the systemic circulation; from there it can be distributed (e.g., to adipose tissue) or carried on to the remaining drug steps. (Book p1)"},{"id":"PHARM-C1-007","sec":"Absorption & distribution","page":1,"q":"In the flowchart, the movement of drug toward the adipose tissue is labelled:","opts":["Absorption","Metabolism","Excretion","Distribution"],"ans":3,"exp":"The arrow carrying drug to the adipose tissue is labelled distribution. (Book p1)"},{"id":"PHARM-C1-008","sec":"Absorption & distribution","page":1,"q":"Some drugs reach the adipose tissue by a variant of distribution termed:","opts":["Redistribution","Reabsorption","Bioactivation","Ion trapping"],"ans":0,"exp":"The second arrow to adipose tissue reads 'Some drugs: Redistribution' — these drugs shift into fat after entering the circulation. (Book p1)"},{"id":"PHARM-C1-009","sec":"Drugs reaching adipose tissue","page":1,"q":"Which set correctly lists the features of drugs reaching adipose tissue?","opts":["Very short acting, high lipid solubility, crosses the BBB","Long acting, water soluble, confined to plasma","Very short acting, water soluble, cannot cross the BBB","Long acting, high lipid solubility, excluded from the CNS"],"ans":0,"exp":"Drugs reaching adipose tissue are very short acting, have increased lipid solubility and cross the blood–brain barrier — e.g., the anaesthetics propofol and thiopentone. (Book p1)"},{"id":"PHARM-C1-010","sec":"Drugs reaching adipose tissue","page":1,"q":"Drugs that partition into adipose tissue share which solubility profile?","opts":["High water solubility","High lipid solubility","Poor membrane permeability","Exclusive plasma protein binding"],"ans":1,"exp":"Adipose-seeking drugs have increased lipid solubility, which also lets them cross the BBB. (Book p1)"},{"id":"PHARM-C1-011","sec":"Drugs reaching adipose tissue","page":1,"q":"Owing to their high lipid solubility, the adipose-reaching anaesthetics readily cross the:","opts":["Blood–testis barrier","Blood–retinal barrier","Placental barrier only","Blood–brain barrier"],"ans":3,"exp":"Increased lipid solubility → crosses the blood–brain barrier, the property exploited by intravenous anaesthetics like propofol and thiopentone. (Book p1)"},{"id":"PHARM-C1-012","sec":"Drugs reaching adipose tissue","page":1,"q":"The intravenous anaesthetics cited as examples of drugs reaching adipose tissue are:","opts":["Ketamine and etomidate","Propofol and thiopentone","Halothane and sevoflurane","Midazolam and dexmedetomidine"],"ans":1,"exp":"The examples given are the anaesthetics propofol and thiopentone. (Book p1)"},{"id":"PHARM-C1-013","sec":"Drugs reaching adipose tissue","page":1,"q":"A patient wakes within minutes of stopping a propofol infusion. Per the flowchart, propofol's 'very short acting' behaviour is best explained by its:","opts":["Rapid hepatic acetylation","Active renal tubular secretion","Irreversible binding to its target","Redistribution into adipose tissue"],"ans":3,"exp":"Lipid-soluble anaesthetics such as propofol and thiopentone move into adipose tissue (distribution/redistribution) and are therefore very short acting. (Book p1)"},{"id":"PHARM-C1-014","sec":"Target binding & effect","page":1,"q":"In the flowchart, the systemic circulation containing the remaining drug passes it next to which event?","opts":["Binding to the target","Immediate renal excretion","Storage in bone","Conversion into a prodrug"],"ans":0,"exp":"Systemic circulation containing the remaining drug → binds to target. (Book p1)"},{"id":"PHARM-C1-015","sec":"Target binding & effect","page":1,"q":"The drug produces its clinical effect only after it:","opts":["Is excreted into the gut","Binds to its target","Reaches the adipose tissue","Becomes water soluble"],"ans":1,"exp":"'Binds to target' → 'effect': binding to the target is the pharmacodynamic step that produces the effect. (Book p1)"},{"id":"PHARM-C1-016","sec":"Target binding & effect","page":1,"q":"How do most drugs bind to their target?","opts":["Irreversibly","Covalently and permanently","Reversibly","By denaturing the receptor"],"ans":2,"exp":"Most drugs bind reversibly; hence breakdown of the bond later releases the drug back into the circulation. (Book p1)"},{"id":"PHARM-C1-017","sec":"Target binding & effect","page":1,"q":"According to the loop in the flowchart, breakdown of the drug–target bond causes the drug to:","opts":["Be destroyed immediately","Return to the systemic circulation","Deposit in adipose tissue","Lose all water solubility"],"ans":1,"exp":"Because most drugs bind reversibly, breakdown of the bond returns the drug to the systemic circulation. (Book p1)"},{"id":"PHARM-C1-018","sec":"Hepatic metabolism","page":1,"q":"Metabolism in the liver breaks the drug down and makes it more:","opts":["Lipid soluble","Protein bound","Unionized","Water soluble"],"ans":3,"exp":"Liver metabolism = breakdown that makes the drug water soluble, preparing it for excretion. (Book p1)"},{"id":"PHARM-C1-019","sec":"Hepatic metabolism","page":1,"q":"The purpose of converting the drug into a water-soluble form is to promote its:","opts":["Crossing of the BBB","Excretion from the body","Storage in adipose tissue","Binding to the target"],"ans":1,"exp":"Once made water soluble, most drugs pass via the systemic circulation to the kidney for excretion (some via the gut). (Book p1)"},{"id":"PHARM-C1-020","sec":"Excretion","page":1,"q":"Per the flowchart, most drugs are excreted through the:","opts":["Gut","Skin","Lungs","Kidney"],"ans":3,"exp":"Most drugs are excreted via the systemic circulation into the kidney; the gut handles the remainder. (Book p1)"},{"id":"PHARM-C1-021","sec":"Excretion","page":1,"q":"Besides the kidney, the other excretory route shown is the:","opts":["Gut","Sweat","Saliva","Lungs"],"ans":0,"exp":"Excretion = most drugs via systemic circulation → kidney, and some via the gut. (Book p1)"},{"id":"PHARM-C1-022","sec":"Course of drug through the body","page":1,"q":"Arrange the course of an orally administered drug in the correct order:","opts":["Absorption → systemic circulation → target binding → effect → hepatic metabolism → excretion","Absorption → hepatic metabolism → target binding → systemic circulation → effect","Systemic circulation → absorption → excretion → target binding → effect","Target binding → absorption → distribution → excretion → effect"],"ans":0,"exp":"Oral drug → absorption → systemic circulation → binds to target → effect; remaining drug is metabolised in the liver to a water-soluble form and excreted via the kidney (most drugs) or the gut. (Book p1)"},{"id":"PHARM-C2-001","sec":"Absorption","page":2,"q":"Across the biological membrane in the absorption diagram, which group of mechanisms is bracketed as 'ATP not required'?","opts":["Filtration, simple/passive diffusion and facilitated diffusion","Filtration and active transport","Facilitated diffusion and active transport","Simple diffusion and active transport"],"ans":0,"exp":"The brace labelled 'ATP not required' covers filtration, simple (passive) diffusion and facilitated diffusion; only active transport needs ATP. (Book p2)"},{"id":"PHARM-C2-002","sec":"Absorption","page":2,"q":"The absorption mechanism illustrated in the diagram with the example 'insulin (subcutaneous)' is:","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":0,"exp":"Filtration is passage of drug through pores of the biological membrane; the example given is insulin administered subcutaneously. (Book p2)"},{"id":"PHARM-C2-003","sec":"Absorption","page":2,"q":"The commonest (m/c) mechanism of drug absorption shown in the diagram is:","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":1,"exp":"Simple/passive diffusion is marked m/c; it occurs along the concentration gradient and requires no ATP. (Book p2)"},{"id":"PHARM-C2-004","sec":"Absorption","page":2,"q":"Which mechanism of absorption is carrier-mediated but does NOT require ATP?","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":2,"exp":"Facilitated diffusion uses a carrier (e.g. GLUT receptors) but still follows the concentration gradient and needs no ATP, so it lies on the 'ATP not required' side of the diagram. (Book p2)"},{"id":"PHARM-C2-005","sec":"Absorption","page":2,"q":"In the absorption diagram, the example given for facilitated diffusion is:","opts":["GLUT receptors","SGLT-1 receptors","SGLT-2 receptors","MDR1 pump"],"ans":0,"exp":"GLUT receptors illustrate facilitated diffusion, and GLUT absorption is stated to be based on the concentration gradient. (Book p2)"},{"id":"PHARM-C2-006","sec":"Absorption","page":2,"q":"The diagram gives which example for ATP-requiring active transport?","opts":["GLUT receptors","SGLT receptors","Pores","MDR1 pump"],"ans":1,"exp":"Active transport (ATP required) is illustrated by SGLT receptors, with SGLT-1 on small intestine and SGLT-2 on renal tubules. (Book p2)"},{"id":"PHARM-C2-007","sec":"Absorption","page":2,"q":"SGLT-1 receptors are located on the:","opts":["Small intestine","Renal tubules","Hepatocytes","Placenta"],"ans":0,"exp":"SGLT-1 is on the small intestine; SGLT-2 is on renal tubules. (Book p2)"},{"id":"PHARM-C2-008","sec":"Absorption","page":2,"q":"SGLT-2 receptors are located on the:","opts":["Renal tubules","Small intestine","Blood brain barrier","Intestinal lumen"],"ans":0,"exp":"SGLT-2 is on renal tubules, whereas SGLT-1 is on the small intestine - the pair is given as the example of active transport. (Book p2)"},{"id":"PHARM-C2-009","sec":"Absorption","page":2,"q":"'Carrier mediated transport' in the absorption diagram includes:","opts":["Facilitated diffusion and active transport","Filtration and simple diffusion","Filtration, simple diffusion and facilitated diffusion","Active transport only"],"ans":0,"exp":"The carrier-mediated bracket spans facilitated diffusion and active transport; filtration and simple/passive diffusion need no carrier. (Book p2)"},{"id":"PHARM-C2-010","sec":"Absorption","page":2,"q":"Which mechanism of absorption is independent of the concentration gradient?","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":3,"exp":"Active transport is labelled 'independent of conc. gradient' and requires ATP; the other three proceed along the concentration gradient. (Book p2)"},{"id":"PHARM-C2-011","sec":"Absorption","page":2,"q":"Which statement about simple/passive diffusion is correct?","opts":["It occurs along the concentration gradient without ATP","It occurs against the concentration gradient with ATP","It requires a carrier but no ATP","It occurs only through pores"],"ans":0,"exp":"Simple/passive diffusion (the m/c mechanism) moves drug along the concentration gradient without a carrier and without ATP. (Book p2)"},{"id":"PHARM-C2-012","sec":"Absorption","page":2,"q":"In the diagram of the biological membrane, filtration of a drug occurs through:","opts":["Pores","Carrier proteins","The lipid bilayer only","Tight junctions"],"ans":0,"exp":"Filtration is drawn as drug crossing the membrane through pores, with subcutaneous insulin as the example. (Book p2)"},{"id":"PHARM-C2-013","sec":"Absorption","page":2,"q":"Which mechanism-example pair is correctly matched in the absorption diagram?","opts":["Filtration - insulin subcutaneous","Facilitated diffusion - SGLT-2","Active transport - GLUT receptors","Simple diffusion - SGLT-1"],"ans":0,"exp":"Filtration is matched to subcutaneous insulin, facilitated diffusion to GLUT receptors, and active transport to SGLT receptors (SGLT-1 gut, SGLT-2 renal tubule). (Book p2)"},{"id":"PHARM-C2-014","sec":"Absorption","page":2,"q":"The P-glycoprotein (pgp) pump is also known as:","opts":["MDR1 pump","SGLT-2 pump","GLUT-4 pump","MDR2 pump"],"ans":0,"exp":"The heading reads 'Active transport: P-glycoprotein pump (pgp)/MDR1 pump'. (Book p2)"},{"id":"PHARM-C2-015","sec":"Absorption","page":2,"q":"P-glycoprotein (MDR1) is the most common type of:","opts":["ABC pump","SGLT transporter","GLUT transporter","Na+/K+ ATPase"],"ans":0,"exp":"A note under the heading states pgp/MDR1 is the m/c type of ABC (ATP-binding cassette) pump - a primary active transporter. (Book p2)"},{"id":"PHARM-C2-016","sec":"Function","page":3,"q":"Efflux by the P-glycoprotein pump on the intestinal epithelial cell moves drug:","opts":["From within the cell back into the intestinal lumen","From the intestinal lumen into the blood vessel lumen","From blood into the intestinal lumen","From the intestinal lumen into the lymphatics"],"ans":0,"exp":"The pgp on the epithelial cell pumps absorbed drug back out into the intestinal lumen - drug efflux - opposite to absorption. (Book p3)"},{"id":"PHARM-C2-017","sec":"Function","page":3,"q":"Most drugs cross the gut epithelium along the concentration gradient, but some are effluxed back so that drug is excreted before reaching the systemic circulation. This is called:","opts":["First pass metabolism","Enterohepatic circulation","Redistribution","Second pass metabolism"],"ans":0,"exp":"The diagram writes 'Some drugs efflux: First pass metabolism - drug excreted before reaching systemic circulation'. (Book p3)"},{"id":"PHARM-C2-018","sec":"Function","page":3,"q":"Which drug's dosage is calculated based on the amount being lost due to drug efflux?","opts":["Digoxin","Loperamide","Verapamil","Rifampicin"],"ans":0,"exp":"The book's stated significance of P-gp efflux: digoxin dosage is calculated based on the amount being lost due to drug efflux. (Book p3)"},{"id":"PHARM-C2-019","sec":"Blood Brain Barrier (BBB)","page":3,"q":"Loperamide, an opioid used in the treatment of diarrhoea, is useful as an antidiarrhoeal because it acts on the:","opts":["GIT","Central nervous system","Blood brain barrier","Renal tubules"],"ans":0,"exp":"Loperamide is an opioid that acts on the GIT, which is why it controls diarrhoea without central opioid effects. (Book p3)"},{"id":"PHARM-C2-020","sec":"Blood Brain Barrier (BBB)","page":3,"q":"Loperamide cannot cross the blood brain barrier because:","opts":["MDR1 pumps are present in the BBB","It is highly lipid soluble","It is a large protein","It has no affinity for opioid receptors"],"ans":0,"exp":"MDR1 pumps are present in the BBB and efflux loperamide, so the opioid cannot reach the CNS; this is exactly why it can be used for diarrhoea. (Book p3)"},{"id":"PHARM-C2-021","sec":"Blood Brain Barrier (BBB)","page":3,"q":"Apart from efflux by MDR1 pumps, the other cause stated for drugs not crossing the BBB is:","opts":["Water solubility","High lipid solubility","Small molecular size","Absence of tight junctions"],"ans":0,"exp":"A note reads 'Another cause of drugs not crossing BBB - water solubility'; both efflux pumps and water solubility limit CNS entry. (Book p3)"},{"id":"PHARM-C2-022","sec":"Placenta","page":3,"q":"Certain drugs cannot cross from maternal circulation to fetal circulation because of MDR1 pumps present in the:","opts":["Placenta","Hepatocytes","Renal tubules","Intestinal epithelium"],"ans":0,"exp":"The book states that certain drugs cannot cross from maternal to fetal circulation due to the presence of MDR1 pumps in the placenta. (Book p3)"},{"id":"PHARM-C2-023","sec":"Bile acid excretion","page":3,"q":"Bile acid excretion occurs due to the presence of MDR1 pumps on:","opts":["Hepatocytes","Enterocytes","Placental trophoblasts","Renal tubular cells"],"ans":0,"exp":"Bile acid excretion is attributed to the presence of MDR1 pumps on hepatocytes. (Book p3)"},{"id":"PHARM-C2-024","sec":"MDR1 pump sites","page":3,"q":"Which site-MDR1 pump pair is correctly matched?","opts":["Placenta - prevents certain drugs crossing from mother to fetus","Hepatocytes - prevent drug crossing into bile","BBB - water-soluble drugs are pumped back into blood","Intestinal epithelial cell - pumps drug into the systemic circulation"],"ans":0,"exp":"MDR1 pumps in the placenta stop certain drugs reaching the fetus; on hepatocytes they mediate bile acid excretion; in the BBB they eject drugs like loperamide; in the gut epithelium they efflux drug back into the lumen. (Book p3)"},{"id":"PHARM-C2-025","sec":"In bacteria/tumour cell","page":3,"q":"In bacteria and tumour cells, drug resistance develops by which sequence?","opts":["Cell develops Pgp pump - drug efflux - resistance","Cell develops pores - drug influx - resistance","Cell develops SGLT receptor - active uptake - resistance","Cell develops GLUT receptor - facilitated diffusion - resistance"],"ans":0,"exp":"The flowchart reads: Cell - develops - Pgp pump - drug efflux - resistance. (Book p3)"},{"id":"PHARM-C2-026","sec":"In bacteria/tumour cell","page":3,"q":"The mechanism by which a Pgp-pump-expressing tumour cell resists chemotherapy is:","opts":["The pump actively effluxes the drug out of the cell, lowering the intracellular drug concentration","The pump metabolises the drug inside the cell","The cell stops taking up the drug through GLUT receptors","The cell develops pores that leak the drug out"],"ans":0,"exp":"The Pgp pump drives drug efflux, so less drug stays inside the cell - the same efflux mechanism produces resistance in bacteria and tumour cells. (Book p3)"},{"id":"PHARM-C2-027","sec":"Pharmacological significance","page":4,"q":"According to the pharmacological significance flowchart, P-gp inducers cause:","opts":["Increase in the number of pumps, producing drug failure","Decrease in the number of pumps, producing drug toxicity","Increase in the number of pumps, producing drug toxicity","Decrease in the number of pumps, producing drug failure"],"ans":0,"exp":"Inducers increase the number of pumps, and this causes drug failure because more drug is effluxed out. (Book p4)"},{"id":"PHARM-C2-028","sec":"Pharmacological significance","page":4,"q":"P-gp inducers are considered analogous to:","opts":["Enzyme inducers","Enzyme inhibitors","P-gp substrates","P-gp blockers"],"ans":0,"exp":"The flowchart marks P-gp inducers as 'approximately equal to enzyme inducers' - the same drugs that induce microsomal enzymes also induce the efflux pump. (Book p4)"},{"id":"PHARM-C2-029","sec":"Pharmacological significance","page":4,"q":"Which group lists only P-gp inducers?","opts":["Rifampicin, phenytoin, phenobarbital","Verapamil, amiodarone, quinidine","Loperamide, cyclosporine, digoxin","Itraconazole, neratinib, erythromycin"],"ans":0,"exp":"The inducer list is rifampicin, phenytoin and phenobarbital - the classic enzyme inducers. (Book p4)"},{"id":"PHARM-C2-030","sec":"Pharmacological significance","page":4,"q":"Which group lists only P-gp substrates (drugs that undergo efflux by the pump)?","opts":["Loperamide, cyclosporine, digoxin","Rifampicin, phenytoin, phenobarbital","Verapamil, amiodarone, quinidine","Itraconazole, neratinib, clarithromycin"],"ans":0,"exp":"The substrate column lists loperamide, cyclosporine and digoxin as drugs that undergo efflux by the pump. (Book p4)"},{"id":"PHARM-C2-031","sec":"Pharmacological significance","page":4,"q":"Which group lists only P-gp inhibitors?","opts":["Verapamil, amiodarone, quinidine","Rifampicin, phenytoin, phenobarbital","Loperamide, digoxin, phenobarbital","Insulin, digoxin, loperamide"],"ans":0,"exp":"The inhibitor list is verapamil, amiodarone, quinidine, cyclosporine, itraconazole, neratinib and erythromycin/clarithromycin. (Book p4)"},{"id":"PHARM-C2-032","sec":"Pharmacological significance","page":4,"q":"P-gp inhibitors decrease the number of pumps and therefore cause:","opts":["Drug toxicity","Drug failure","Drug resistance","Increased drug efflux"],"ans":0,"exp":"The flowchart states inhibitors decrease the number of pumps, which causes drug toxicity because less drug is effluxed and more stays in the body. (Book p4)"},{"id":"PHARM-C2-033","sec":"Pharmacological significance","page":4,"q":"Which drug appears in BOTH the substrate and the inhibitor lists of P-gp?","opts":["Cyclosporine","Digoxin","Rifampicin","Phenobarbital"],"ans":0,"exp":"Cyclosporine is listed both as a substrate (undergoes efflux) and as a P-gp inhibitor, so it can raise the levels of co-administered P-gp substrates. (Book p4)"},{"id":"PHARM-C2-034","sec":"Pharmacological significance","page":4,"q":"Which macrolide antibiotics are listed as P-gp inhibitors?","opts":["Erythromycin/clarithromycin","Azithromycin/roxithromycin","Clindamycin/lincomycin","Amikacin/gentamicin"],"ans":0,"exp":"Erythromycin/clarithromycin are given among the P-gp inhibitors. (Book p4)"},{"id":"PHARM-C2-035","sec":"Pharmacological significance","page":4,"q":"Neratinib is listed in the flowchart as a P-gp:","opts":["Inhibitor","Inducer","Substrate","Substrate and inducer"],"ans":0,"exp":"Neratinib appears in the inhibitor column, along with verapamil, amiodarone, quinidine, cyclosporine, itraconazole and erythromycin/clarithromycin. (Book p4)"},{"id":"PHARM-C2-036","sec":"Effects of blockade","page":4,"q":"As per the table of effects of blockade, rifampicin blocking P-gp results in:","opts":["Digoxin failure","Digoxin toxicity","Cholestatic jaundice","Reversal of drug resistance"],"ans":0,"exp":"The table pairs rifampicin (drug blocking Pgp) with digoxin failure - loss of digoxin effect. (Book p4)"},{"id":"PHARM-C2-037","sec":"Effects of blockade","page":4,"q":"Which drug blocking P-gp causes digoxin toxicity?","opts":["Clarithromycin","Rifampicin","Quinidine","Verapamil"],"ans":0,"exp":"The table pairs clarithromycin with digoxin toxicity, because blocking the efflux pump raises digoxin levels. (Book p4)"},{"id":"PHARM-C2-038","sec":"Effects of blockade","page":4,"q":"Blockade of P-gp by cyclosporine is associated with:","opts":["Cholestatic jaundice","Digoxin failure","Digoxin toxicity","Loperamide-induced central side effects"],"ans":0,"exp":"The table lists cyclosporine as a P-gp blocker producing cholestatic jaundice. (Book p4)"},{"id":"PHARM-C2-039","sec":"Effects of blockade","page":4,"q":"Which drug blocking P-gp is used in the reversal of drug resistance in cancer and bacteria?","opts":["Verapamil","Quinidine","Rifampicin","Clarithromycin"],"ans":0,"exp":"The table pairs verapamil with 'used in reversal of drug resistance (cancer, bacteria)'. (Book p4)"},{"id":"PHARM-C2-040","sec":"Effects of blockade","page":4,"q":"Quinidine blocks P-gp and thereby causes:","opts":["Loperamide-induced central side effects","Digoxin failure","Cholestatic jaundice","Reversal of drug resistance"],"ans":0,"exp":"The table pairs quinidine blockade of P-gp with loperamide-induced central side effects. (Book p4)"},{"id":"PHARM-C2-041","sec":"Effects of blockade","page":4,"q":"A patient on loperamide develops central opioid side effects after quinidine is added. The best explanation is:","opts":["Quinidine inhibits P-gp, so loperamide is no longer effluxed at the BBB and enters the CNS","Quinidine induces P-gp, increasing loperamide efflux into the brain","Quinidine displaces loperamide from plasma proteins","Quinidine increases gastric emptying of loperamide"],"ans":0,"exp":"Normally MDR1 pumps in the BBB keep loperamide out of the CNS; quinidine blocks P-gp, loperamide crosses into the brain and produces central side effects. (Book p4)"},{"id":"PHARM-C2-042","sec":"Passive Diffusion","page":4,"q":"In the passive diffusion diagram, the ovals drawn within the lipid bilayer are labelled:","opts":["Proteins charged","Pores","Carriers","Cholesterol"],"ans":0,"exp":"Both membrane ovals are labelled 'Proteins charged' - the charged proteins that repel charged drug molecules. (Book p4)"},{"id":"PHARM-C2-043","sec":"Passive Diffusion","page":4,"q":"A polar/ionised/charged drug reaching the intestinal lumen is:","opts":["Repelled and not absorbed, being water soluble and excreted","Absorbed because it is lipid soluble","Actively pumped into the blood","Absorbed through pores"],"ans":0,"exp":"Polar/ionised/charged drug is repelled by the charged proteins of the lipid membrane, is not absorbed (lipid insoluble/water soluble) and is excreted. (Book p4)"},{"id":"PHARM-C2-044","sec":"Passive Diffusion","page":4,"q":"Which drug characteristics favour passage by passive diffusion?","opts":["Non-polar, unionised, neutral (lipid soluble)","Polar and ionised (water soluble)","Charged and water soluble","Large and protein bound"],"ans":0,"exp":"Non-polar/unionised/neutral drug is lipid soluble and is therefore absorbed by passive diffusion. (Book p4)"},{"id":"PHARM-C2-045","sec":"Passive Diffusion","page":4,"q":"From the passive diffusion figure, absorption of a drug across a lipid membrane is determined mainly by:","opts":["Lipid solubility of the non-ionised form","Water solubility of the ionised form","Number of P-gp pumps in the membrane","Presence of SGLT-2 receptors"],"ans":0,"exp":"The figure contrasts non-polar/unionised/neutral (lipid soluble - absorbed) with polar/ionised/charged (water soluble - repelled and excreted), so lipid solubility governs passive diffusion. (Book p4)"},{"id":"PHARM-C2-046","sec":"Passive Diffusion","page":4,"q":"Which statement best summarises the passive diffusion figure?","opts":["Non-polar unionised drug is absorbed, while polar ionised drug is repelled by charged membrane proteins and excreted","Polar and non-polar drugs are absorbed equally","Polar drugs are absorbed by carriers and non-polar drugs by pores","Only charged membrane proteins are absorbed"],"ans":0,"exp":"The figure shows non-polar/unionised/neutral drug crossing to the blood vessel lumen (absorbed, lipid soluble), while polar/ionised/charged drug is repelled and is not absorbed (water soluble, excreted). (Book p4)"},{"id":"PHARM-C3-001","sec":"Ionization of drugs","page":5,"q":"As per the criteria table, drugs are best absorbed when their solubility is:","opts":["Lipid","Water","Lipid and water equally","Independent of solubility"],"ans":0,"exp":"The absorption column of the criteria table requires lipid solubility, whereas the excretion column requires water solubility. (Book p5)"},{"id":"PHARM-C3-002","sec":"Ionization of drugs","page":5,"q":"For a drug to be excreted, the criteria table requires it to be:","opts":["Water soluble and ionised","Lipid soluble and unionised","Non-polar and unionised","Lipid soluble and ionised"],"ans":0,"exp":"Excretion needs water solubility and ionization - the water-soluble ionised form cannot be reabsorbed and is excreted. (Book p5)"},{"id":"PHARM-C3-003","sec":"Ionization of drugs","page":5,"q":"According to the criteria table, absorption of a drug requires it to be:","opts":["Unionised with pH of medium equal to that of the drug","Ionised with pH of medium unequal to that of the drug","Polar and water soluble","Ionised and non-polar"],"ans":0,"exp":"Absorption: lipid soluble, unionised, pH of medium equal to that of drug (relation of pH 'equal') and non-polar. (Book p5)"},{"id":"PHARM-C3-004","sec":"Ionization of drugs","page":5,"q":"In the criteria table, the 'relation of pH of medium' for EXCRETION is:","opts":["Unequal","Equal","Equal for acidic drugs and unequal for basic drugs","Not applicable"],"ans":0,"exp":"Excretion occurs when the pH of the drug and the pH of the medium are unequal, so the drug is ionised and trapped in urine. (Book p5)"},{"id":"PHARM-C3-005","sec":"Ionization of drugs","page":5,"q":"Which polarity favours absorption of a drug?","opts":["Non polar","Polar","Polar and ionised","Polarity is irrelevant"],"ans":0,"exp":"Non-polar drugs are absorbed; polar (ionised) drugs are excreted. (Book p5)"},{"id":"PHARM-C3-006","sec":"Ionization of drugs","page":5,"q":"The mnemonic LUNA stands for the criteria of:","opts":["Absorption - Lipid, Unionised, pH relation equal, Non-polar","Excretion - Lipid, Unionised, Non-polar, Acidic","Absorption - Lipid, Unchanged, Neutral, Available","Excretion - Lipid, Unionised, Neutral, Acidic"],"ans":0,"exp":"LUNA summarises absorption: Lipid, Unionised, Non-polar with pH of medium equal to that of the drug; its counterpart WIPE summarises excretion. (Book p5)"},{"id":"PHARM-C3-007","sec":"Ionization of drugs","page":5,"q":"The mnemonic WIPE stands for the criteria of:","opts":["Excretion - Water soluble, Ionised, Polar, pH relation unequal","Absorption - Water soluble, Ionised, Polar, Absorption equal","Excretion - Water soluble, Ionised, Protein bound, Equal pH","Excretion - Water insoluble, Ionised, Polar, pH equal"],"ans":0,"exp":"WIPE denotes excretion: Water soluble, Ionised, Polar, with unequal pH of drug and medium. (Book p5)"},{"id":"PHARM-C3-008","sec":"Unionization","page":5,"q":"An acidic drug remains unionised in an acidic medium such as the:","opts":["Stomach","Small intestine","Renal tubule","Colon"],"ans":0,"exp":"Acidic drug in an acidic medium (stomach) stays unionised and lipid soluble, which is why aspirin is unionised in the stomach. (Book p5)"},{"id":"PHARM-C3-009","sec":"Unionization","page":5,"q":"A basic drug stays unionised in a basic medium such as the:","opts":["Small intestine","Stomach","Gastric juice","Oesophagus"],"ans":0,"exp":"Basic drug in a basic medium (small intestine) remains unionised; the pair is stated as 'acidic drug - acidic medium: stomach; basic drug - basic medium: small intestine'. (Book p5)"},{"id":"PHARM-C3-010","sec":"Unionization","page":5,"q":"Aspirin, an acidic drug, is unionised in the stomach. This follows the rule that:","opts":["An acidic drug stays unionised in an acidic medium","A basic drug stays unionised in an acidic medium","All drugs are unionised in the stomach","Unionisation is independent of pH"],"ans":0,"exp":"Aspirin (acidic) is unionised in the stomach because an acidic drug is unionised in an acidic medium - the same principle used for its absorption. (Book p5)"},{"id":"PHARM-C3-011","sec":"Unionization","page":5,"q":"Maximum absorption of unionised drug - whether acidic or basic - occurs in the:","opts":["Small intestine (duodenum) because of its large surface area","Stomach because of its acidic pH","Colon because of slow transit","Oesophagus because of rapid transit"],"ans":0,"exp":"Although both acidic and basic drugs can be unionised in their corresponding media, maximum absorption takes place in the small intestine (duodenum) because of its large surface area. (Book p5)"},{"id":"PHARM-C3-012","sec":"Unionization","page":5,"q":"The dominant reason maximum unionised drug absorption occurs in the duodenum rather than the stomach is:","opts":["There is a much larger surface area","The stomach contains more P-gp pumps","The stomach has a higher pH","Bile salts inactivate drug in the stomach"],"ans":0,"exp":"The book attributes maximum absorption of unionised drug in the small intestine/duodenum to its large surface area. (Book p5)"},{"id":"PHARM-C3-013","sec":"Unionization","page":5,"q":"Resection of the small intestine (short bowel syndrome) results in:","opts":["Decreased absorption of the drug, managed by increasing the dose or changing the route","Increased absorption of the drug, requiring dose reduction","Unchanged absorption but delayed onset","Increased first pass metabolism"],"ans":0,"exp":"Short bowel syndrome reduces drug absorption; management is to increase the dosage of the drug or change the route of administration. (Book p5)"},{"id":"PHARM-C3-014","sec":"Ionization (excretion)","page":5,"q":"For ionization to promote excretion of a drug, the pH of the drug and the pH of the medium must be:","opts":["Different (unequal)","Equal","Both acidic","Both neutral"],"ans":0,"exp":"Excretion depends on the pH of the drug and pH of the medium being different, which ionises the drug and prevents reabsorption. (Book p5)"},{"id":"PHARM-C3-015","sec":"Ionization (excretion)","page":5,"q":"Acidic drug toxicity is treated by making the urine:","opts":["Basic, using bicarbonate as a urine alkalinizer","Acidic, using ammonium chloride","Neutral, using water loading","Basic, using ammonium chloride"],"ans":0,"exp":"Alkalinizing the urine with bicarbonate ionises acidic drugs and traps them for excretion - the standard treatment of acidic drug toxicity. (Book p5)"},{"id":"PHARM-C3-016","sec":"Ionization (excretion)","page":5,"q":"Which drugs are listed as examples of acidic drug toxicity in which urine alkalinization is used?","opts":["Aspirin, phenobarbital, methotrexate","Amphetamine, ephedrine, nicotine","Digoxin, loperamide, verapamil","Morphine, codeine, caffeine"],"ans":0,"exp":"Aspirin, phenobarbital and methotrexate are the acidic drugs whose toxicity is managed by alkalinizing urine with bicarbonate. (Book p5)"},{"id":"PHARM-C3-017","sec":"Ionization (excretion)","page":5,"q":"Basic drug toxicity, as with amphetamine, is managed by:","opts":["Making the urine acidic with ammonium chloride","Making the urine basic with bicarbonate","Alkalinizing plasma with sodium lactate","Instituting haemodialysis"],"ans":0,"exp":"For basic drug toxicity the urine is made acidic with ammonium chloride (a urine acidifier), which ionises and traps the basic drug. (Book p5)"},{"id":"PHARM-C3-018","sec":"Ionization (excretion)","page":5,"q":"Ammonium chloride is used as a:","opts":["Urine acidifier","Urine alkalinizer","P-gp inhibitor","Gastric acid suppressant"],"ans":0,"exp":"Ammonium chloride is the urine acidifier used for basic drug toxicity such as amphetamine. (Book p5)"},{"id":"PHARM-C3-019","sec":"Ionization (excretion)","page":5,"q":"Which of the following are also given as examples of urine acidifiers?","opts":["Vitamin C and cranberry juice","Sodium bicarbonate and acetazolamide","Citrate and lactate","Magnesium hydroxide and aluminium hydroxide"],"ans":0,"exp":"A note states that other examples of urine acidifiers are vitamin C and cranberry juice. (Book p5)"},{"id":"PHARM-C3-020","sec":"Henderson-Hasselbalch Equation","page":6,"q":"The Henderson-Hasselbalch equation for an acidic drug is:","opts":["log [unionized]/[ionized] = pKa - pH of medium","log [ionized]/[unionized] = pKa - pH of medium","log [unionized]/[ionized] = pH - pKa of drug","log [ionized]/[unionized] = pH + pKa"],"ans":0,"exp":"For an acidic drug the equation is log [unionized]/[ionized] = pKa - pH of the medium. (Book p6)"},{"id":"PHARM-C3-021","sec":"Henderson-Hasselbalch Equation","page":6,"q":"The Henderson-Hasselbalch equation for a basic drug is:","opts":["log [ionized]/[unionized] = pKa - pH","log [unionized]/[ionized] = pKa - pH","log [ionized]/[unionized] = pH - pKa","log [unionized]/[ionized] = pH + pKa"],"ans":0,"exp":"For a basic drug the ratio is inverted - log [ionized]/[unionized] = pKa - pH. (Book p6)"},{"id":"PHARM-C3-022","sec":"Henderson-Hasselbalch Equation","page":6,"q":"An acidic drug with pKa = 4 is placed in the stomach at pH = 2. The unionized:ionized ratio will be:","opts":["100:1","1:100","10:1","1:10"],"ans":0,"exp":"log[U]/[I] = pKa - pH = 4 - 2 = 2, so [U]/[I] = 10^2 = 100, i.e. 100:1. (Book p6)"},{"id":"PHARM-C3-023","sec":"Henderson-Hasselbalch Equation","page":6,"q":"For an acidic drug with pKa = 4 in the stomach (pH 2), the percentage of drug in the unionized form is:","opts":["99%","1%","50%","91%"],"ans":0,"exp":"Unionized:ionized = 100:1 gives 99% unionized and only 1% ionized - which is why such drugs are absorbed from the stomach. (Book p6)"},{"id":"PHARM-C3-024","sec":"Henderson-Hasselbalch Equation","page":6,"q":"pKa is defined as the pH of the medium at which:","opts":["50% of the drug is ionized and 50% is unionized","100% of the drug is ionized","100% of the drug is unionized","The drug is maximally absorbed"],"ans":0,"exp":"pKa is the pH of the medium at which 50% of the drug is ionized and 50% is unionized. (Book p6)"},{"id":"PHARM-C3-025","sec":"Absorption of oral drugs","page":6,"q":"Immediate release (IR) oral formulations are characterised by:","opts":["Frequent dosing and decreased compliance","A prolonged plateau of plasma concentration","Zero order release kinetics","Better compliance than SR forms"],"ans":0,"exp":"The IR graph shows repeated peaks with each dose; the mechanism is frequent dosing, which decreases compliance - the example given is indomethacin TID. (Book p6)"},{"id":"PHARM-C3-026","sec":"Absorption of oral drugs","page":6,"q":"Which formulation is given as an example of immediate release dosing three times a day?","opts":["Indomethacin TID","Zolpidem OD","Sulfasalazine OD","Omeprazole OD"],"ans":0,"exp":"Indomethacin TID is the example of an IR formulation requiring frequent dosing. (Book p6)"},{"id":"PHARM-C3-027","sec":"Absorption of oral drugs","page":6,"q":"Compared with IR preparations, sustained release (SR) preparations show:","opts":["A shorter peak and an increased duration of action","A taller peak and a shorter duration of action","An identical concentration-time curve","A zero order plateau"],"ans":0,"exp":"The SR graph is labelled 'shorter peak' with increased duration of action, which is why compliance improves. (Book p6)"},{"id":"PHARM-C3-028","sec":"Absorption of oral drugs","page":6,"q":"Extended release (ER) oral formulations are sub-classified into:","opts":["Sustained release (SR) and controlled release (CR)","Immediate release and delayed release","Enteric coated and film coated","Buccal and sublingual"],"ans":0,"exp":"The flowchart shows tablet/capsule branching into IR, and 'ER: extended release' branching into SR (sustained release) and CR (controlled release). (Book p6)"},{"id":"PHARM-C3-029","sec":"Absorption of oral drugs","page":6,"q":"Controlled release (CR) preparations are also known as:","opts":["Zero order CR","First order CR","Immediate release","Delayed release"],"ans":0,"exp":"The book writes 'CR: controlled release AKA zero order CR' - a constant amount of drug is released per unit time, giving a flat plateau. (Book p6)"},{"id":"PHARM-C3-030","sec":"Absorption of oral drugs","page":6,"q":"The mechanism underlying controlled release formulations is:","opts":["Polymer coating of pores","Rapid disintegration of the tablet","Enteric coating sensitive to gastric acid","Simple compression with a disintegrant"],"ans":0,"exp":"CR tablets use polymer coating of pores so that drug is released slowly and steadily; the example is CR zolpidem. (Book p6)"},{"id":"PHARM-C3-031","sec":"Absorption of oral drugs","page":6,"q":"Which formulation is given as the example of a controlled release preparation?","opts":["CR zolpidem","SR indomethacin","Enteric coated PPI","Indomethacin TID"],"ans":0,"exp":"CR zolpidem is the stated example of a controlled release preparation. (Book p6)"},{"id":"PHARM-C3-032","sec":"Absorption of oral drugs","page":6,"q":"SR indomethacin is described as having:","opts":["Better compliance with polymer coating present","Worse compliance requiring frequent dosing","Immediate release with two peaks","Zero order release with pore coating"],"ans":0,"exp":"For SR the book lists better compliance, polymer coating present, and the example SR indomethacin. (Book p6)"},{"id":"PHARM-C3-033","sec":"Absorption of oral drugs","page":6,"q":"On a plasma concentration-time graph, a preparation showing two successive peaks is:","opts":["IR (immediate release) given twice","SR (sustained release)","CR (controlled release)","Enteric coated"],"ans":0,"exp":"The IR graph shows one peak per dose, so two doses produce two peaks; SR shows a flatter shorter peak and CR a plateau from a single dose. (Book p6)"},{"id":"PHARM-C3-034","sec":"Absorption of oral drugs","page":6,"q":"The plasma concentration-time curve of a controlled release preparation is distinctive because it:","opts":["Rises and then stays flat (zero order plateau)","Shows a single tall peak","Shows two separate peaks","Never reaches the therapeutic range"],"ans":0,"exp":"The CR graph rises and flattens into a plateau, reflecting zero order release; SR instead shows a shorter peak with prolonged duration. (Book p6)"},{"id":"PHARM-C3-035","sec":"Drugs bypassing the stomach","page":7,"q":"Delayed release preparations are designed to:","opts":["Release the drug in the small intestine instead of the stomach","Release the drug immediately in the stomach","Release the drug only in the colon","Bypass the liver completely"],"ans":0,"exp":"Delayed release means release of the drug in the small intestine instead of in the stomach - the example given is sulfasalazine. (Book p7)"},{"id":"PHARM-C3-036","sec":"Drugs bypassing the stomach","page":7,"q":"Sulfasalazine is given as an example of a delayed release drug used for:","opts":["Ulcerative colitis","Peptic ulcer","Rheumatoid arthritis","Crohn's disease of the ileum"],"ans":0,"exp":"Sulfasalazine is the delayed release drug released in the small intestine, used for ulcerative colitis. (Book p7)"},{"id":"PHARM-C3-037","sec":"Drugs bypassing the stomach","page":7,"q":"Enteric coated preparations, such as proton pump inhibitors, are used to:","opts":["Protect the drug from gastric HCl","Protect the stomach from the drug's irritant effect only","Delay gastric emptying","Increase gastric acid secretion"],"ans":0,"exp":"The book's example of enteric coating is a PPI, which is protected from gastric HCl so that it is released in the intestine. (Book p7)"},{"id":"PHARM-C3-038","sec":"Rate and Extent of Absorption","page":7,"q":"Bioavailability (f) is defined as the:","opts":["Fraction of drug that reaches the systemic circulation unchanged","Total amount of drug absorbed from the gut","Rate at which the drug is absorbed","Fraction of drug excreted unchanged in urine"],"ans":0,"exp":"Bioavailability = the fraction of drug that reaches the systemic circulation unchanged. (Book p7)"},{"id":"PHARM-C3-039","sec":"Rate and Extent of Absorption","page":7,"q":"In the flowchart of factors determining f, the fraction of absorbed drug that is lost on its first passage through the liver is called:","opts":["Fraction undergoing first pass metabolism","Fraction excreted unchanged","Fraction reaching systemic circulation","Fraction bound to plasma protein"],"ans":0,"exp":"The flowchart shows that of 100% drug given, after intestinal absorption (with excretion of a fraction) the liver leaves a fraction reaching systemic circulation while a fraction undergoes first pass metabolism. (Book p7)"},{"id":"PHARM-C3-040","sec":"Rate and Extent of Absorption","page":7,"q":"Bioavailability (f) is increased when:","opts":["The drug bypasses the liver and absorption is increased","The drug undergoes extensive first pass metabolism","A fraction of the drug is excreted in the gut","The drug is heavily protein bound"],"ans":0,"exp":"The book states f increases if the drug bypasses the liver and if absorption occurs to a greater extent. (Book p7)"},{"id":"PHARM-C3-041","sec":"Rate and Extent of Absorption","page":7,"q":"Bioavailability from a concentration-time curve is calculated as:","opts":["AUC oral / AUC IV x 100","AUC IV / AUC oral x 100","Cmax oral / Cmax IV x 100","Tmax oral / Tmax IV x 100"],"ans":0,"exp":"The boxed formula is Bioavailability = AUC oral / AUC IV x 100. (Book p7)"},{"id":"PHARM-C3-042","sec":"Rate and Extent of Absorption","page":7,"q":"Which route has 100% bioavailability?","opts":["Intravenous","Intramuscular","Subcutaneous","Oral"],"ans":0,"exp":"IV is the only route with 100% bioavailability because the entire dose enters the systemic circulation directly. (Book p7)"},{"id":"PHARM-C3-043","sec":"Rate and Extent of Absorption","page":7,"q":"The area under the concentration-time curve (AUC) of a drug reflects:","opts":["The extent of drug absorption","The rate of drug absorption","The rate of drug elimination only","The degree of protein binding"],"ans":0,"exp":"The book relates AUC to the extent of drug absorption, while Tmax reflects the rate of absorption. (Book p7)"},{"id":"PHARM-C3-044","sec":"Rate and Extent of Absorption","page":7,"q":"In the plasma concentration-time curve comparing routes, the hatched larger area under the curve belongs to the:","opts":["IV route (AUC IV)","Oral route (AUC oral)","IM route","Sublingual route"],"ans":0,"exp":"The graph shows AUC IV (hatched, larger) versus AUC oral (smaller); oral bioavailability is the ratio of the two. (Book p7)"},{"id":"PHARM-C3-045","sec":"Bioavailability by route","page":8,"q":"As per the table, the bioavailability of the intravenous route is:","opts":["1","0.75-1.0","0.05-1.0","0.5"],"ans":0,"exp":"The route-bioavailability table gives IV = 1, IM/SC = 0.75-1.0 and oral = 0.05-1.0. (Book p8)"},{"id":"PHARM-C3-046","sec":"Bioavailability by route","page":8,"q":"The bioavailability of intramuscular/subcutaneous administration is:","opts":["0.75-1.0","0.05-1.0","1.0 exactly","0.25-0.5"],"ans":0,"exp":"IM/SC bioavailability is 0.75-1.0, higher than oral (0.05-1.0) because these routes avoid first pass metabolism. (Book p8)"},{"id":"PHARM-C3-047","sec":"Bioavailability by route","page":8,"q":"The oral route shows a bioavailability of:","opts":["0.05-1.0","0.75-1.0","1.0","0.5-0.75"],"ans":0,"exp":"Oral bioavailability ranges widely, 0.05-1.0, because of variable absorption and first pass metabolism. (Book p8)"},{"id":"PHARM-C3-048","sec":"Bioavailability by route","page":8,"q":"Which statement about bioavailability (f) is correct?","opts":["f does not indicate the rate of drug absorption","f is the same as the rate of absorption","f equals Tmax of the drug","f is maximal for the oral route"],"ans":0,"exp":"The book notes that f does not indicate the rate of drug absorption - f is a measure of extent only. (Book p8)"},{"id":"PHARM-C3-049","sec":"Rate of drug absorption","page":8,"q":"Cmax is defined as the:","opts":["Maximum plasma concentration achieved by a drug","Time at which peak concentration occurs","Area under the concentration-time curve","Minimum effective concentration"],"ans":0,"exp":"Cmax is the maximum plasma concentration achieved by the drug, read off the peak of the concentration-time curve. (Book p8)"},{"id":"PHARM-C3-050","sec":"Rate of drug absorption","page":8,"q":"Tmax is a marker of the:","opts":["Rate of drug absorption","Extent of drug absorption","Rate of drug elimination","Volume of distribution"],"ans":0,"exp":"Tmax - the time to reach peak plasma concentration - is the marker of the rate of drug absorption; AUC indicates extent. (Book p8)"},{"id":"PHARM-C3-051","sec":"Bioequivalence","page":8,"q":"Which parameter pair tells you the RATE and the EXTENT of absorption respectively?","opts":["Tmax and AUC","AUC and Tmax","Cmax and Tmax","AUC and Cmax"],"ans":0,"exp":"Tmax is the marker of rate of absorption and AUC indicates the extent of absorption - the basis of bioequivalence assessment. (Book p8)"},{"id":"PHARM-C3-052","sec":"Bioequivalence","page":8,"q":"Two pharmaceutically equivalent compounds are said to be bioequivalent when they have similar:","opts":["Rate (Tmax) and extent (AUC) of absorption","Extent of absorption only","Rate of absorption only","Plasma protein binding"],"ans":0,"exp":"Bioequivalence means two pharmaceutically equivalent compounds with similar rate (Tmax) and extent (AUC) of absorption. (Book p8)"},{"id":"PHARM-C3-053","sec":"Bioequivalence","page":8,"q":"A branded drug is one which is:","opts":["Invented and patented for 20 years","A legal copy made after patent expiry","Always cheaper than the generic","Never subjected to bioavailability studies"],"ans":0,"exp":"The branded drug is the invented, patented molecule, protected for 20 years. (Book p8)"},{"id":"PHARM-C3-054","sec":"Bioequivalence","page":8,"q":"A generic drug is:","opts":["A legal copy of a new drug, made after the patent expires","A drug invented and patented for 20 years","A drug available only as an injectable","A drug with a different active moiety"],"ans":0,"exp":"The generic drug is a legal copy of a new drug prepared after the patent expires, and its benefit is that it is cheaper. (Book p8)"},{"id":"PHARM-C3-055","sec":"Bioequivalence","page":8,"q":"Generic drugs are approved through:","opts":["ANDA (Abbreviated New Drug Application)","NDA (New Drug Application)","IND (Investigational New Drug)","Orphan drug designation"],"ans":0,"exp":"The book states that for generic drug approval an ANDA - Abbreviated New Drug Application - is filed. (Book p8)"},{"id":"PHARM-C3-056","sec":"Bioequivalence","page":8,"q":"For a generic drug to be approved, it must be bioequivalent to the branded drug within:","opts":["+/- 20%","+/- 5%","+/- 50%","+/- 2%"],"ans":0,"exp":"The criterion for approval is that the generic drug is bioequivalent to the branded drug to within +/- 20%. (Book p8)"},{"id":"PHARM-C4-001","sec":"Apparent Volume of Distribution (AVd)","page":9,"q":"The apparent volume of distribution (AVd) is defined as the:","opts":["Hypothetical volume of plasma in litres necessary to account for the total amount of drug in the patient's body, intravascular and extravascular","True plasma volume measured by dye dilution","Volume of blood cleared of drug per unit time","Volume of drug solution administered"],"ans":0,"exp":"AVd is a hypothetical volume of plasma in litres necessary to account for the total amount of drug (intravascularly and extravascularly) in the patient's body - it is not a real anatomical space. (Book p9)"},{"id":"PHARM-C4-002","sec":"Apparent Volume of Distribution (AVd)","page":9,"q":"A drug with a HIGH apparent volume of distribution is distributed mostly in the:","opts":["Extravascular compartment/tissue","Intravascular compartment/systemic circulation","Plasma water","Blood cells"],"ans":0,"exp":"A drug with increased AVd is mostly in the extravascular compartment/tissue; one with a low AVd remains mostly intravascular/systemic. (Book p9)"},{"id":"PHARM-C4-003","sec":"Apparent Volume of Distribution (AVd)","page":9,"q":"A drug that is largely confined to the intravascular compartment has:","opts":["A low apparent volume of distribution","A high apparent volume of distribution","An AVd equal to total body water","An AVd independent of protein binding"],"ans":0,"exp":"Drug with low AVd - mostly in intravascular compartment/systemic; high AVd means extensive tissue distribution. (Book p9)"},{"id":"PHARM-C4-004","sec":"Calculation of AVd","page":9,"q":"The formula for apparent volume of distribution is:","opts":["AVd = Dose/C0 x f","AVd = C0/Dose x f","AVd = Dose x C0/f","AVd = Dose x f/C0"],"ans":0,"exp":"AVd = D(dose)/C0 x f, where C0 is the initial plasma concentration and f is bioavailability. (Book p9)"},{"id":"PHARM-C4-005","sec":"Calculation of AVd","page":9,"q":"In the AVd equation, C0 stands for:","opts":["Initial plasma concentration","Target plasma concentration","Steady state concentration","Maximum plasma concentration"],"ans":0,"exp":"C0 in the AVd formula is the initial plasma concentration measured after the dose; CT (used in the loading dose formula) is the target plasma concentration. (Book p9)"},{"id":"PHARM-C4-006","sec":"Calculation of AVd","page":9,"q":"For which route is bioavailability (f) equal to 1 while calculating AVd?","opts":["Intravenous","Intramuscular","Subcutaneous","Oral"],"ans":0,"exp":"f = 1 for the intravenous route, since the whole dose enters the systemic circulation - so AVd = dose/C0 for IV dosing. (Book p9)"},{"id":"PHARM-C4-007","sec":"Loading dose","page":9,"q":"The loading dose of a drug is calculated by the formula:","opts":["D = AVd x CT / f","D = AVd x f / CT","D = f x CT / AVd","D = AVd x CT x f"],"ans":0,"exp":"Loading dose D = AVd x CT / f, where CT is the target plasma concentration (a constant). (Book p9)"},{"id":"PHARM-C4-008","sec":"Loading dose","page":9,"q":"In the loading dose formula, CT denotes:","opts":["Target plasma concentration (constant)","Initial plasma concentration","Total dose administered","Clearance time"],"ans":0,"exp":"CT is the target plasma concentration and is treated as a constant, so the dose varies directly with AVd and inversely with f. (Book p9)"},{"id":"PHARM-C4-009","sec":"Loading dose","page":9,"q":"The relationship given for loading dose is:","opts":["D is directly proportional to AVd/f","D is directly proportional to f/AVd","D is directly proportional to AVd x f","D is independent of AVd"],"ans":0,"exp":"D is directly proportional to AVd/f, so a drug with a large AVd needs a larger loading dose to achieve the same target concentration. (Book p9)"},{"id":"PHARM-C4-010","sec":"Loading dose","page":9,"q":"If the apparent volume of distribution of a drug increases, then to maintain the target plasma concentration:","opts":["The dose must be increased","The dose must be decreased","The dose stays the same","The dose must be halved"],"ans":0,"exp":"Because D is proportional to AVd/f, if AVd increases the dose has to be increased to maintain the target concentration CT. (Book p9)"},{"id":"PHARM-C4-011","sec":"Factors determining AVd","page":9,"q":"How does obesity affect apparent volume of distribution?","opts":["Increases vd","Decreases vd","No effect on vd","Increases vd only for water-soluble drugs"],"ans":0,"exp":"Fat content determines vd: obesity increases vd, while athletes (with less fat) have a decreased vd. (Book p9)"},{"id":"PHARM-C4-012","sec":"Factors determining AVd","page":9,"q":"Athletes have a decreased volume of distribution because they have:","opts":["Lower fat content","Higher fat content","Higher plasma albumin","Greater tissue binding"],"ans":0,"exp":"Fat content is proportional to vd; athletes have a lower fat content and therefore a lower vd than an obese patient. (Book p9)"},{"id":"PHARM-C4-013","sec":"Factors determining AVd","page":9,"q":"Regarding sex differences in volume of distribution, the book states:","opts":["Females, having a higher fat content, have a greater vd","Males have a greater vd because of higher muscle mass","vd is identical in both sexes","vd is lower in females due to lower albumin"],"ans":0,"exp":"Sex affects vd through fat content: F (females) with higher fat content > M (males). (Book p9)"},{"id":"PHARM-C4-014","sec":"Factors determining AVd","page":9,"q":"Plasma protein binding (albumin binding) relates to apparent volume of distribution as:","opts":["Albumin binding is inversely proportional to vd","Albumin binding is directly proportional to vd","Albumin binding has no relation to vd","Albumin binding is proportional to vd squared"],"ans":0,"exp":"The book states albumin binding (plasma protein binding) is proportional to 1/vd - more binding keeps the drug intravascular and lowers vd. (Book p9)"},{"id":"PHARM-C4-015","sec":"Factors determining AVd","page":9,"q":"Which of the following is NOT listed among the factors determining apparent volume of distribution?","opts":["Renal clearance of the drug","Fat content of the body","Lipid solubility (pKa)","Tissue binding"],"ans":0,"exp":"The listed factors are fat content (obesity, athletes, sex), lipid solubility (pKa), albumin binding (inversely proportional) and tissue binding - renal clearance is not among them. (Book p9)"},{"id":"PHARM-C4-016","sec":"Factors determining AVd","page":9,"q":"Which property of a drug increases its apparent volume of distribution?","opts":["Lipid solubility","Extensive albumin binding","Small molecular size alone","Water solubility"],"ans":0,"exp":"Lipid solubility (pKa) favours tissue distribution and increases vd, whereas albumin binding holds drug intravascularly and decreases vd. (Book p9)"},{"id":"PHARM-C4-017","sec":"Factors determining AVd","page":9,"q":"Digoxin is distributed to skeletal muscle more than to the heart because:","opts":["Skeletal muscle has a greater mass","The heart lacks digoxin receptors","Skeletal muscle is more vascular","Digoxin is water soluble"],"ans":0,"exp":"Digoxin distributes to skeletal muscle > heart due to the greater mass of skeletal muscle - although the heart is the target organ. (Book p9)"},{"id":"PHARM-C4-018","sec":"Factors determining AVd","page":9,"q":"The loading dose of digoxin is determined by:","opts":["Lean body mass, not total body mass","Total body mass","Heart weight","Plasma albumin level"],"ans":0,"exp":"Because digoxin distributes to skeletal muscle by mass, its loading dose is calculated on lean body mass and not on total body mass - a practical point in obese patients. (Book p9)"},{"id":"PHARM-C4-019","sec":"Significance in toxicity","page":9,"q":"When a drug has a very high volume of distribution, dialysis is ineffective because:","opts":["Extravascular concentration is high and intravascular concentration is low","The drug is tightly bound to albumin","The drug is water soluble","The drug is not filtered by the glomerulus"],"ans":0,"exp":"A very high vd means most drug is extravascular with little in plasma, so dialysis cannot remove significant drug - dialysis is ineffective. (Book p9)"},{"id":"PHARM-C4-020","sec":"Significance in toxicity","page":9,"q":"In toxicity due to a drug with a very high volume of distribution, treatment relies on:","opts":["Antidotes","Haemodialysis","Forced alkaline diuresis","Plasmapheresis"],"ans":0,"exp":"Since dialysis is ineffective for drugs with a large vd, antidotes are given in toxicity. (Book p9)"},{"id":"PHARM-C4-021","sec":"Drugs with increased vd","page":10,"q":"The mnemonic BADDOC is used for:","opts":["Drugs with increased volume of distribution","Drugs undergoing zero order metabolism","Drugs with low bioavailability","Drugs bound to alpha-1 acid glycoprotein"],"ans":0,"exp":"BADDOC lists the drugs with increased vd - benzodiazepines, beta blockers, amphetamines, digoxin, opioids, organophosphates and calcium channel blockers. (Book p10)"},{"id":"PHARM-C4-022","sec":"Drugs with increased vd","page":10,"q":"Which mnemonic groups drugs that are NOT cleared by dialysis?","opts":["BADDOC","ORCHAD","LUNA","WIPE"],"ans":0,"exp":"BADDOC - benzodiazepines, beta blockers, amphetamines, digoxin, opioids, organophosphates, calcium channel blockers - are the drugs with a high vd, hence not cleared by dialysis. (Book p10)"},{"id":"PHARM-C4-023","sec":"Drugs with increased vd","page":10,"q":"The specific antidote for benzodiazepine poisoning is:","opts":["Flumazenil","Naloxone","Atropine","Glucagon"],"ans":0,"exp":"The table pairs benzodiazepines (not cleared by dialysis) with the antidote flumazenil. (Book p10)"},{"id":"PHARM-C4-024","sec":"Drugs with increased vd","page":10,"q":"Beta blocker overdose is treated with glucagon because glucagon:","opts":["Increases cAMP","Blocks beta receptors","Increases vagal tone","Chelates the beta blocker"],"ans":0,"exp":"The table pairs beta blockers (which block GPCR) with glucagon, whose antidotal action works by increasing cAMP. (Book p10)"},{"id":"PHARM-C4-025","sec":"Drugs with increased vd","page":10,"q":"The antidote for amphetamine poisoning is:","opts":["Ammonium chloride","Naloxone","Flumazenil","Calcium gluconate"],"ans":0,"exp":"Ammonium chloride is the antidote for amphetamines - it acidifies the urine and traps the basic drug for excretion. (Book p10)"},{"id":"PHARM-C4-026","sec":"Drugs with increased vd","page":10,"q":"The antidote for digoxin toxicity is:","opts":["Digibind","Naloxone","Atropine","Calcium gluconate"],"ans":0,"exp":"The book pairs digoxin (not cleared by dialysis) with the antidote Digibind (digoxin-specific antibody fragments). (Book p10)"},{"id":"PHARM-C4-027","sec":"Drugs with increased vd","page":10,"q":"The antidote for opioid poisoning is:","opts":["Naloxone","Flumazenil","Atropine","Glucagon"],"ans":0,"exp":"The table pairs opioids with naloxone as the antidote. (Book p10)"},{"id":"PHARM-C4-028","sec":"Drugs with increased vd","page":10,"q":"The antidote for organophosphate poisoning is:","opts":["Atropine","Naloxone","Flumazenil","Ammonium chloride"],"ans":0,"exp":"In the table organophosphates are paired with atropine as the antidote. (Book p10)"},{"id":"PHARM-C4-029","sec":"Drugs with increased vd","page":10,"q":"The antidote for calcium channel blocker poisoning is:","opts":["Calcium gluconate","Glucagon","Atropine","Flumazenil"],"ans":0,"exp":"Calcium channel blockers are paired with calcium gluconate as the antidote. (Book p10)"},{"id":"PHARM-C4-030","sec":"Drugs with increased vd","page":10,"q":"Which pair of poison and antidote is correctly matched as per the table?","opts":["Digoxin - Digibind","Amphetamine - naloxone","Opioids - ammonium chloride","Organophosphates - glucagon"],"ans":0,"exp":"Correct pairs are benzodiazepines-flumazenil, beta blockers-glucagon, amphetamines-ammonium chloride, digoxin-Digibind, opioids-naloxone, organophosphates-atropine and calcium channel blockers-calcium gluconate. (Book p10)"},{"id":"PHARM-C4-031","sec":"Plasma protein binding","page":10,"q":"Albumin binds predominantly to:","opts":["Acidic drugs (m/c)","Basic drugs","Neutral drugs only","Lipophilic drugs only"],"ans":0,"exp":"Albumin is the main plasma protein and binds acid drugs most commonly; basic drugs are bound by alpha-1 acid glycoprotein. (Book p10)"},{"id":"PHARM-C4-032","sec":"Plasma protein binding","page":10,"q":"Basic drugs are bound mainly to:","opts":["Alpha-1 acid glycoprotein","Albumin","Globulin","Fibrinogen"],"ans":0,"exp":"Alpha-1 acid glycoprotein is the plasma protein that binds basic drugs, whereas albumin binds acidic drugs. (Book p10)"},{"id":"PHARM-C4-033","sec":"Plasma protein binding","page":10,"q":"Which group of drugs is listed as bound to albumin?","opts":["Antipsychotics, antidepressants, antiepileptics","Tricyclic antidepressants, opioids, antiarrhythmics","Amphetamines, organophosphates, calcium channel blockers","Beta blockers, amiodarone, lidocaine"],"ans":0,"exp":"Albumin-bound drugs listed are antipsychotics, antidepressants, antiepileptics, sulfonamide antibiotics, warfarin and aspirin. (Book p10)"},{"id":"PHARM-C4-034","sec":"Plasma protein binding","page":10,"q":"Which group of drugs is listed as bound to alpha-1 acid glycoprotein?","opts":["Tricyclic antidepressants, opioids and antiarrhythmics (beta blockers, amiodarone, lidocaine)","Sulfonamides, warfarin, aspirin","Antipsychotics and antiepileptics","Amphetamines and organophosphates"],"ans":0,"exp":"Alpha-1 acid glycoprotein binds tricyclic antidepressants, opioids and antiarrhythmics - beta blockers, amiodarone and lidocaine. (Book p10)"},{"id":"PHARM-C4-035","sec":"Plasma protein binding","page":10,"q":"Warfarin and aspirin, both albumin bound, increase each other's plasma concentration when used together, leading to:","opts":["Increased bleeding","Decreased bleeding","Increased renal excretion","Reduced anticoagulant effect"],"ans":0,"exp":"The book notes that albumin-bound drugs increase each other's plasma concentration if used together, and with warfarin plus aspirin this raises the risk of bleeding. (Book p10)"},{"id":"PHARM-C4-036","sec":"Plasma protein binding","page":10,"q":"When albumin falls, the sequence of events for a bound drug is:","opts":["Decreased albumin - increased free drug - increased risk of toxicity","Decreased albumin - increased free drug - decreased effect","Increased albumin - increased free drug - increased toxicity","Decreased albumin - decreased free drug - decreased toxicity"],"ans":0,"exp":"Reduced albumin leaves more free (unbound) drug, and this raises the risk of toxicity - the classic example being phenytoin in nephrotic syndrome. (Book p10)"},{"id":"PHARM-C4-037","sec":"Plasma protein binding","page":10,"q":"When alpha-1 acid glycoprotein increases, the effect on drugs is:","opts":["Decreased free drug and decreased effect","Increased free drug and increased effect","No change in free drug","Decreased free drug but increased effect"],"ans":0,"exp":"An increase in alpha-1 glycoprotein binds more basic drug, so free drug falls and the effect falls. (Book p10)"},{"id":"PHARM-C4-038","sec":"Plasma protein binding","page":10,"q":"Which conditions are listed as causing a decreased albumin level?","opts":["Nephrotic syndrome, CKD, liver cirrhosis, diabetes mellitus","Rheumatoid arthritis, inflammatory bowel disease, myocardial infarction","Obesity, pregnancy, hyperthyroidism","Sepsis and trauma"],"ans":0,"exp":"The clinical application box lists decreased albumin in nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus. (Book p10)"},{"id":"PHARM-C4-039","sec":"Plasma protein binding","page":10,"q":"An increase in alpha-1 acid glycoprotein occurs in:","opts":["Inflammatory conditions (rheumatoid arthritis, inflammatory bowel disease) and myocardial infarction","Nephrotic syndrome and liver cirrhosis","Diabetes mellitus and CKD","Obesity and athlete states"],"ans":0,"exp":"Alpha-1 glycoprotein rises in inflammation - rheumatoid arthritis, inflammatory bowel disease - and after myocardial infarction. (Book p10)"},{"id":"PHARM-C4-040","sec":"Plasma protein binding","page":10,"q":"In a patient with nephrotic syndrome receiving a highly albumin-bound drug, you should expect:","opts":["A greater free fraction of drug and an increased risk of toxicity","A lower free fraction and a reduced effect","No change in free drug because binding is unchanged","Increased alpha-1 acid glycoprotein binding"],"ans":0,"exp":"Nephrotic syndrome lowers albumin, so more unbound acidic drug circulates and toxicity risk rises - the book's 'decreased albumin - increased free drug - increased risk of toxicity' chain. (Book p10)"},{"id":"PHARM-C4-041","sec":"Plasma protein binding","page":10,"q":"In a patient with rheumatoid arthritis on a basic drug, a rise in alpha-1 acid glycoprotein will produce:","opts":["A decreased free drug level and a decreased effect","An increased free drug level and an increased effect","An increased risk of toxicity","Unchanged free drug because albumin compensates"],"ans":0,"exp":"Inflammatory states raise alpha-1 acid glycoprotein, which binds more basic drug, lowering free drug and reducing the effect. (Book p10)"},{"id":"PHARM-C4-042","sec":"Plasma protein binding","page":10,"q":"Which two plasma protein-patient condition pairs are correctly matched?","opts":["Albumin - nephrotic syndrome (low); alpha-1 acid glycoprotein - myocardial infarction (high)","Albumin - rheumatoid arthritis (high); alpha-1 acid glycoprotein - cirrhosis (low)","Albumin - myocardial infarction (high); alpha-1 acid glycoprotein - CKD (low)","Albumin - diabetes mellitus (high); alpha-1 acid glycoprotein - nephrotic syndrome (high)"],"ans":0,"exp":"Albumin is reduced in nephrotic syndrome, CKD, cirrhosis and diabetes mellitus; alpha-1 acid glycoprotein is increased in inflammation and myocardial infarction. (Book p10)"},{"id":"PHARM-C5-001","sec":"Phase I","page":11,"q":"In the phase I flowchart, a prodrug that is inactive is converted to an:","opts":["Activated form after the drug is broken down","Inactivated form after conjugation","Ionized water-soluble form","Excretable conjugate"],"ans":0,"exp":"The phase I flow shows prodrug (inactive) - drug broken down - activated; the other limb shows most drugs (active) - inactivated. (Book p11)"},{"id":"PHARM-C5-002","sec":"Phase I","page":11,"q":"For MOST drugs, which are already active, phase I metabolism results in:","opts":["Inactivation of the drug, adding a functional group","Activation of the drug, removing a functional group","Direct conjugation without any functional group","Immediate renal excretion"],"ans":0,"exp":"Most drugs are active; phase I breaks them down into the inactivated form with a functional group, which is then handled by phase II. (Book p11)"},{"id":"PHARM-C5-003","sec":"Phase I","page":11,"q":"The product of phase I metabolism that enters phase II is:","opts":["Drug + functional group","Drug + conjugate","Drug + glucuronic acid","Ionized water-soluble drug"],"ans":0,"exp":"Phase I yields drug + functional group, which is the substrate for phase II conjugation. (Book p11)"}
