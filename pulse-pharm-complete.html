ose-dependent: low doses act on D1 for diuresis, intermediate doses on β1 for contractility, and high doses on α1 for vasoconstriction, but shock use raises mortality because of pro-arrhythmia."},{"id":"PHARM-U16-4","ch":16,"n":4,"title":"Exogenous Catecholamines","sec":"Exogenous Catecholamines · p57","qs":["PHARM-C16-040","PHARM-C16-041","PHARM-C16-042","PHARM-C16-043","PHARM-C16-044","PHARM-C16-045","PHARM-C16-046","PHARM-C16-047","PHARM-C16-048","PHARM-C16-049","PHARM-C16-050","PHARM-C16-051","PHARM-C16-052","PHARM-C16-053","PHARM-C16-054"],"guide":"Exogenous catecholamines are receptor-selective clinical tools. Dobutamine acts on myocardial β receptors, increases contraction without SA-node effect and is DOC in acute CHF; isoprenaline is a pure β1/β2 agonist with no α action. Fenoldopam and dopexamine combine D1 with α1 or β1 effects to lower BP, while droxidopa is a norepinephrine prodrug for neurogenic orthostatic hypotension from diabetic neuropathy."},{"id":"PHARM-U16-5","ch":16,"n":5,"title":"α1 and Mixed α Non-catecholamine Agonists","sec":"α1 and Mixed α Non-catecholamine Agonists · p57","qs":["PHARM-C16-055","PHARM-C16-056","PHARM-C16-057","PHARM-C16-058","PHARM-C16-059","PHARM-C16-060","PHARM-C16-061","PHARM-C16-062","PHARM-C16-063","PHARM-C16-064","PHARM-C16-065","PHARM-C16-066","PHARM-C16-067"],"guide":"α1 non-catecholamines produce vasoconstriction and are used for the mnemonic-like cluster PHEN: priapism, hypotension from spinal anaesthesia, mydriasis without cycloplegia and nasal decongestion. Midodrine is DOC for postural hypotension, while mephentermine, metaraminol and methoxamine treat hypotension. Apraclonidine has α1/α2 action, can cause mydriasis and lid retraction through raised calcium, and is used as an antiglaucoma drug in open-angle glaucoma."},{"id":"PHARM-U16-6","ch":16,"n":6,"title":"α2 Agonists","sec":"α2 Agonists · p57","qs":["PHARM-C16-068","PHARM-C16-069","PHARM-C16-070","PHARM-C16-071","PHARM-C16-072","PHARM-C16-073","PHARM-C16-074","PHARM-C16-075","PHARM-C16-076","PHARM-C16-077","PHARM-C16-078","PHARM-C16-079","PHARM-C16-080","PHARM-C16-081","PHARM-C16-082","PHARM-C16-083","PHARM-C16-084","PHARM-C16-085","PHARM-C16-086"],"guide":"α2 agonists reduce norepinephrine release to produce central sympatholysis and lower BP; if they cross the BBB they also cause sedation. Clonidine is the prototype and is used for Tourette-associated ADHD, withdrawal syndromes, postmenopausal hot flashes, hypertension and pre-anaesthetic medication, with rebound hypertension on withdrawal due to α2 down-regulation. Lofexidine treats opioid withdrawal, tizanidine is a muscle relaxant, α-methyldopa forms α-methyl-NE and is used in PIH, while guanfacine/guanabenz and brimonidine complete the list."},{"id":"PHARM-U17-1","ch":17,"n":1,"title":"β3 Agonists for Overactive Bladder","sec":"β3 Agonists for Overactive Bladder · p58","qs":["PHARM-C17-001","PHARM-C17-002","PHARM-C17-003","PHARM-C17-004","PHARM-C17-005","PHARM-C17-006","PHARM-C17-007","PHARM-C17-008","PHARM-C17-009","PHARM-C17-010","PHARM-C17-011","PHARM-C17-012"],"guide":"β3 agonists relax the urinary bladder and are the DOC drug class for overactive bladder or urge incontinence. The listed drugs are mirabegron and vibegron, with vibegron preferred. Mirabegron has more side effects than vibegron, including vascular headache, UTI from urine retention in a relaxed bladder, hypertension and nasopharyngitis; anticholinergic alternatives are darifenacin, solifenacin and trospium."},{"id":"PHARM-U17-2","ch":17,"n":2,"title":"β2 Agonists: Duration, Asthma/COPD Use and Side Effects","sec":"β2 Agonists: Duration, Asthma/COPD Use and Side Effects · p58","qs":["PHARM-C17-013","PHARM-C17-014","PHARM-C17-015","PHARM-C17-016","PHARM-C17-017","PHARM-C17-018","PHARM-C17-019","PHARM-C17-020","PHARM-C17-021","PHARM-C17-022","PHARM-C17-023","PHARM-C17-024","PHARM-C17-025","PHARM-C17-026","PHARM-C17-027","PHARM-C17-028","PHARM-C17-029","PHARM-C17-030","PHARM-C17-031","PHARM-C17-032","PHARM-C17-033","PHARM-C17-034","PHARM-C17-035","PHARM-C17-036"],"guide":"β2 agonists are grouped by duration: SABA lasts about 4 hours, LABA about 12 hours, and VLABA about 24 hours. Terbutaline is the only adrenergic given subcutaneously, salbutamol can be nebulised for asthma/COPD, formoterol and salmeterol are pMDI twice-daily LABAs used as add-ons with ICS, and olodaterol/vilanterol are once-daily COPD-only VLABAs. Fast-acting β agonists are relievers in intermittent asthma, with formoterol plus ICS as DOC and salbutamol followed by ICS if unaffordable; tremor is the most common side effect, with hypokalemia, hyperglycemia and palpitations also listed."},{"id":"PHARM-U17-3","ch":17,"n":3,"title":"Indirect Adrenergics, Cheese Reaction and Stimulants","sec":"Indirect Adrenergics, Cheese Reaction and Stimulants · p59","qs":["PHARM-C17-037","PHARM-C17-038","PHARM-C17-039","PHARM-C17-040","PHARM-C17-041","PHARM-C17-042","PHARM-C17-043","PHARM-C17-044","PHARM-C17-045","PHARM-C17-046","PHARM-C17-047","PHARM-C17-048","PHARM-C17-049","PHARM-C17-050","PHARM-C17-051","PHARM-C17-052","PHARM-C17-053","PHARM-C17-054","PHARM-C17-055","PHARM-C17-056","PHARM-C17-057","PHARM-C17-058","PHARM-C17-059","PHARM-C17-060"],"guide":"Indirect adrenergics are norepinephrine displacers: a drug similar to NE enters the neuron, displaces NE from vesicles into the synapse, and produces α/β sympathomimetic stimulation. Intermittent dosing works, but continuous dosing depletes NE and turns into drug failure with sympatholysis. The cheese reaction is tyramine plus MAO-inhibitor physiology, and stimulant examples include methylphenidate, amphetamine and methamphetamine."},{"id":"PHARM-U17-4","ch":17,"n":4,"title":"ADHD/Narcolepsy Notes and Mixed-Acting Sympathomimetics","sec":"ADHD/Narcolepsy Notes and Mixed-Acting Sympathomimetics · p60","qs":["PHARM-C17-061","PHARM-C17-062","PHARM-C17-063","PHARM-C17-064","PHARM-C17-065","PHARM-C17-066","PHARM-C17-067","PHARM-C17-068","PHARM-C17-069","PHARM-C17-070","PHARM-C17-071","PHARM-C17-072","PHARM-C17-073","PHARM-C17-074","PHARM-C17-075","PHARM-C17-076","PHARM-C17-077"],"guide":"The chapter adds that guanfacine and guanabenz can lower BP through sympatholysis but are contraindicated in pheochromocytoma. For ADHD with a family history of drug abuse, the preferred DOC group is selective NE reuptake inhibitors such as atomoxetine and viloxazine. Narcolepsy drugs include solriamfetol, pitolisant, amphetamine, methylphenidate and modafinil; mixed-acting sympathomimetics stimulate α/β receptors directly and also raise NE levels, with ephedrine, pseudoephedrine and banned norephedrine as the examples."},{"id":"PHARM-U17-5","ch":17,"n":5,"title":"Epinephrine Dilutions and Dale's Phenomenon","sec":"Epinephrine Dilutions and Dale's Phenomenon · p60","qs":["PHARM-C17-078","PHARM-C17-079","PHARM-C17-080","PHARM-C17-081","PHARM-C17-082","PHARM-C17-083","PHARM-C17-084","PHARM-C17-085","PHARM-C17-086","PHARM-C17-087","PHARM-C17-088","PHARM-C17-089","PHARM-C17-090","PHARM-C17-091","PHARM-C17-092","PHARM-C17-093","PHARM-C17-094","PHARM-C17-095","PHARM-C17-096","PHARM-C17-097"],"guide":"The details section turns epinephrine dilutions into route-based facts: 1:1000 for SC/IM/endotracheal, 1:10,000 for IV/intracardiac/intraosseous, 1:100,000 for local vasoconstriction and 1:100,000 or 1:200,000 with local anaesthetic. Dale's phenomenon is the biphasic BP response to epinephrine: high adrenaline reaches the higher-threshold α response to raise BP, while low adrenaline acts on lower-threshold β2 receptors to lower BP. With α blockade the pressor limb is reversed to a pure fall, and with β blockade the response is re-reversed to an unopposed α1 steep rise."},{"id":"PHARM-U17-6","ch":17,"n":6,"title":"Comparing Epinephrine, Norepinephrine and Isoprenaline on BP and HR","sec":"Comparing Epinephrine, Norepinephrine and Isoprenaline on BP and HR · p62","qs":["PHARM-C17-098","PHARM-C17-099","PHARM-C17-100","PHARM-C17-101","PHARM-C17-102","PHARM-C17-103","PHARM-C17-104","PHARM-C17-105","PHARM-C17-106","PHARM-C17-107","PHARM-C17-108","PHARM-C17-109","PHARM-C17-110","PHARM-C17-111","PHARM-C17-112","PHARM-C17-113","PHARM-C17-114","PHARM-C17-115","PHARM-C17-116","PHARM-C17-117","PHARM-C17-118","PHARM-C17-119","PHARM-C17-120","PHARM-C17-121","PHARM-C17-122","PHARM-C17-123","PHARM-C17-124","PHARM-C17-125","PHARM-C17-126","PHARM-C17-127"],"guide":"The final table compares α1/β1/β2 epinephrine, α1/β1 norepinephrine and β1/β2 isoprenaline. Norepinephrine gives the greatest mean BP rise but net bradycardia from reflex vagal tone, epinephrine raises mean BP with net tachycardia, and isoprenaline lowers diastolic/mean BP while driving the greatest HR rise with pro-arrhythmic action. Clinically, norepinephrine is preferred for most shock except anaphylaxis, where epinephrine is DOC because β2 bronchodilation matters; atropine blocks vagal reflex bradycardia and is paired with NE in neurogenic hypotension."}];

const QBYID = {}; QUESTIONS.forEach(q=>QBYID[q.id]=q);
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_xp')||0;}, set xp(v){store('pulse_xp',v);},
  get done(){return store('pulse_done')||[];}, set done(v){store('pulse_done',v);},
  get unlock(){return !!store('pulse_unlock');}, set unlock(v){store('pulse_unlock',v);},
  streak(){const t=store('pulse_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_streak',s);return s.n;}
};
const nav={stack:['home']};
function show(id){nav.stack.push(id);render();}
function goBack(){if(nav.stack.length>1)nav.stack.pop();render();}
function render(){
  const cur=nav.stack[nav.stack.length-1];
  ['home','chapters','path','guide','quiz','unitdone'].forEach(s=>$(s).classList.toggle('hidden',s!==cur));
  $('backBtn').classList.toggle('hidden',cur==='home');
  $('brand').textContent = cur==='home'?'PULSE':'PULSE';
  refreshStats();
  if(cur==='home')renderHome();
  if(cur==='chapters')renderChapters();
  if(cur==='path')renderPath();
}
function refreshStats(){
  $('hXP').textContent=S.xp; $('hStreak').textContent=S.streak().n;
  $('sXP').textContent=S.xp; $('sStreak').textContent=S.streak().n; $('sUnits').textContent=S.done.length;
}
function renderHome(){
  const live=CHAPTERS.filter(c=>c.live).length;
  $('heroSub').textContent=live+' of '+CHAPTERS.length+' chapters built so far — original questions, guides, and unit-by-unit mastery for each.';
}
function unitsOf(ch){return UNITS.filter(u=>u.ch===ch).sort((a,b)=>a.n-b.n);}
function renderChapters(){
  $('chSub').textContent=CHAPTERS.length+' chapters · Full chapter-by-chapter exam pass';
  const box=$('chList'); box.innerHTML='';
  CHAPTERS.forEach(c=>{
    const us=c.live?unitsOf(c.n):[];
    const dn=us.filter(u=>S.done.includes(u.id)).length;
    const d=document.createElement('div');
    d.className='chrow'+(c.live?'':' locked');
    d.innerHTML='<div class="chnum">'+c.n+'</div><div class="t">'+escapeHtml(c.t)+'</div><div class="u">'+(c.live?dn+'/'+us.length+' units':'Soon')+'</div>';
    if(c.live)d.onclick=()=>{curCh=c.n;show('path');};
    box.appendChild(d);
  });
}
let curCh=1, curUnit=null;
function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';
  const i=us.findIndex(x=>x.id===u.id);
  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}
function renderPath(){
  const c=CHAPTERS.find(x=>x.n===curCh), us=unitsOf(curCh);
  $('pathKick').textContent='CHAPTER '+c.n;
  $('pathTitle').textContent=c.t;
  $('pathSub').textContent=us.filter(u=>S.done.includes(u.id)).length+' of '+us.length+' units done · in book order';
  const box=$('nodes'); box.innerHTML='';
  let lastSec='';
  us.forEach(u=>{
    if(u.sec!==lastSec){lastSec=u.sec;
      const s=document.createElement('div');s.className='pathsec';s.textContent=u.sec;box.appendChild(s);}
    const st=unitState(u,us);
    const d=document.createElement('div');d.className='node';
    d.innerHTML='<div class="ball '+st+'">'+(st==='done'?'✓':st==='locked'?'🔒':u.n)+'</div><div class="ntitle">'+escapeHtml(u.title)+'</div><div class="ncount">'+u.qs.length+' questions</div>';
    if(st!=='locked')d.querySelector('.ball').onclick=()=>openGuide(u);
    box.appendChild(d);
  });
}
function openGuide(u){curUnit=u;
  $('gKick').textContent='CHAPTER '+u.ch+' · UNIT '+u.n+' · '+u.sec.toUpperCase();
  $('gTitle').textContent=u.title;
  $('gText').textContent=u.guide;
  $('gCount').textContent=u.qs.length+' questions · follows the book line-by-line';
  show('guide');
}
let order=[],idx=0,xpGain=0,streak=0,correct=0,wrongList=[],locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function beginUnit(){
  // FIXED book order — only options shuffle (anti-bias)
  order=curUnit.qs.map(id=>{const q=QBYID[id];return {q,opts:shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))};});
  idx=0;xpGain=0;streak=0;correct=0;wrongList=[];
  show('quiz');renderQ();
}
function renderQ(){
  locked=false;
  const cur=order[idx],q=cur.q;
  $('qbar').style.width=(idx/order.length*100)+'%';
  $('qcount').textContent='QUESTION '+(idx+1)+' OF '+order.length;
  $('qtag').textContent=q.sec+' · Book p'+q.page;
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  cur.opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(o,b);box.appendChild(b);
  });
  $('fb').className='fb';$('fb').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent=idx===order.length-1?'Finish ✓':'Continue →';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function answer(o,btn){
  if(locked)return;locked=true;
  const cur=order[idx],q=cur.q,btns=$('opts').children;
  const rightIdx=cur.opts.findIndex(x=>x.ok);
  [...btns].forEach(b=>b.disabled=true);
  btns[rightIdx].classList.add('correct');
  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
</body>
</html>
