":"The table lists IV → bioavailability '1', i.e., 100%. (Book p8)"},{"id":"PHARM-C3-075","sec":"Route & bioavailability","page":8,"q":"As per the table, the bioavailability of the IM/SC route is:","opts":["0.75–1.0","1","0.05–1.0","0.5"],"ans":0,"exp":"The table lists im/sc → 0.75–1.0, slightly less than the intravenous route but still high. (Book p8)"},{"id":"PHARM-C3-076","sec":"Route & bioavailability","page":8,"q":"As per the table, the bioavailability of the oral route is:","opts":["0.05–1.0","0.75–1.0","1","0.05–0.75"],"ans":0,"exp":"The table lists oral → 0.05–1.0, the widest range of all routes because first pass metabolism differs from drug to drug. (Book p8)"},{"id":"PHARM-C3-077","sec":"Route & bioavailability","page":8,"q":"Which route shows the widest range of bioavailability in the table?","opts":["Oral","IV","IM","SC"],"ans":0,"exp":"Oral spans 0.05–1.0, i.e., from 5% to complete bioavailability, whereas IV is fixed at 1 and im/sc at 0.75–1.0. (Book p8)"},{"id":"PHARM-C3-078","sec":"Route & bioavailability","page":8,"q":"The note following the route table states that bioavailability does NOT indicate:","opts":["Rate of drug absorption","Extent of drug absorption","Fraction reaching systemic circulation","Route of administration"],"ans":0,"exp":"'Note: F does not indicate rate of drug absorption' — F measures the extent (AUC), not the speed, of absorption. (Book p8)"},{"id":"PHARM-C3-079","sec":"Rate of absorption","page":8,"q":"Cmax is defined as the:","opts":["Maximum plasma concentration achieved by a drug","Time to reach the maximum concentration","Area under the curve","Rate constant of absorption"],"ans":0,"exp":"'Cmax: maximum plasma conc achieved by a drug' — it is the peak of the plasma concentration-time curve. (Book p8)"},{"id":"PHARM-C3-080","sec":"Rate of absorption","page":8,"q":"Tmax is a marker of the:","opts":["Rate of drug absorption","Extent of drug absorption","Bioavailability of the drug","Elimination half-life"],"ans":0,"exp":"'Tmax: marker of rate of drug absorption' — the sooner the peak occurs, the faster the absorption. (Book p8)"},{"id":"PHARM-C3-081","sec":"Rate of absorption","page":8,"q":"Two formulations of the same drug show Tmax of 1 hour and 4 hours respectively. This indicates a difference in:","opts":["Rate of absorption","Extent of absorption","Bioavailability","Volume of distribution"],"ans":0,"exp":"Tmax is the marker of the rate of drug absorption; extent would instead be compared using AUC. (Book p8)"},{"id":"PHARM-C3-082","sec":"Rate of absorption","page":8,"q":"Which parameter reflects the extent, and which reflects the rate, of drug absorption?","opts":["AUC = extent; Tmax = rate","Tmax = extent; AUC = rate","Cmax = extent; AUC = rate","AUC = rate; Cmax = extent"],"ans":0,"exp":"The AUC measures the extent of absorption (and hence bioavailability), while Tmax is the marker of the rate of absorption. (Book p8)"},{"id":"PHARM-C3-083","sec":"Rate of absorption","page":8,"q":"On the rate-of-absorption graph, the peak of the plasma concentration (PC) curve corresponds to:","opts":["Cmax at Tmax","Cmax at time zero","AUC at Tmax","Tmax at zero concentration"],"ans":0,"exp":"The graph marks Cmax at the top of the curve and Tmax on the time axis directly below it. (Book p8)"},{"id":"PHARM-C3-084","sec":"Bioequivalence","page":8,"q":"Bioequivalence is defined as two pharmaceutically equivalent compounds with similar:","opts":["Rate (Tmax) and extent (AUC) of absorption","Colour and shape","Protein binding and half-life","Cmax and volume of distribution"],"ans":0,"exp":"'Bioequivalence: Two pharmaceutically equivalent compound with similar rate (Tmax) and extent (AUC) of absorption.' (Book p8)"},{"id":"PHARM-C3-085","sec":"Bioequivalence","page":8,"q":"A branded drug is defined in the text as one which is:","opts":["Invented and patented for 20 years","A legal copy made after patent expiry","Cheaper than the generic","Approved by ANDA"],"ans":0,"exp":"'Branded drug: One which is invented, patented for 20 years' — during this period no generic copy can be marketed. (Book p8)"},{"id":"PHARM-C3-086","sec":"Bioequivalence","page":8,"q":"A generic drug is defined as:","opts":["A legal copy of a new drug made after the patent expires","A drug invented and patented for 20 years","A drug with a different active moiety","A controlled release formulation"],"ans":0,"exp":"'Generic drug: Legal copy of a new drug (Done after patent expires).' (Book p8)"},{"id":"PHARM-C3-087","sec":"Bioequivalence","page":8,"q":"The stated benefit of a generic drug is that it is:","opts":["Cheaper","More bioavailable","Longer acting","Free of side effects"],"ans":0,"exp":"'Benefit of a generic drug: Cheaper' — the generic contains the same drug but costs less. (Book p8)"},{"id":"PHARM-C3-088","sec":"Bioequivalence","page":8,"q":"For approval of a generic drug, the required application is:","opts":["ANDA (Abbreviated New Drug Application)","NDA (New Drug Application)","IND (Investigational New Drug)","BLA (Biologics License Application)"],"ans":0,"exp":"'For generic drug approval: ANDA (Abbreviated New Drug Application)' — the abbreviated filing relies on bioequivalence rather than full clinical data. (Book p8)"},{"id":"PHARM-C3-089","sec":"Bioequivalence","page":8,"q":"The criteria for approving a generic drug is that it is bioequivalent to the branded drug within:","opts":["±30%","±5%","±10%","±50%"],"ans":0,"exp":"'Generic drug = Bioequivalent to Branded drug ± 30%' — the generic must fall within ±30% of the branded product. (Book p8)"},{"id":"PHARM-C3-090","sec":"Bioequivalence","page":8,"q":"A generic formulation of a drug has an AUC 20% lower than the branded product, with a similar Tmax. It will be:","opts":["Approved, since it is within ±30%","Rejected, since any difference is unacceptable","Approved only if Tmax is identical","Rejected, because AUC must be equal"],"ans":0,"exp":"The approval criterion is bioequivalence to the branded drug within ±30%; a 20% difference in AUC with similar rate falls within this limit. (Book p8)"},{"id":"PHARM-C3-091","sec":"Bioequivalence","page":8,"q":"Two generic products of the same drug are compared. Bioequivalence between them is judged by similarity of:","opts":["Tmax and AUC","Cmax and volume of distribution","Half-life and clearance","Protein binding and pKa"],"ans":0,"exp":"Bioequivalence means similar rate (Tmax) and extent (AUC) of absorption; the approval limit against the branded drug is ±30%. (Book p8)"},{"id":"PHARM-C3-092","sec":"Bioequivalence","page":8,"q":"Which of the following is TRUE regarding F and Tmax?","opts":["F reflects the extent of absorption while Tmax reflects its rate","Both F and Tmax reflect the rate of absorption","Both F and Tmax reflect the extent of absorption","F reflects the rate of absorption while Tmax reflects its extent"],"ans":0,"exp":"F is derived from AUC and denotes the extent of absorption (and does not indicate rate), whereas Tmax is the marker of the rate of drug absorption. (Book p8)"}];
const UNITS = [{"id":"PHARM-U1-1","ch":1,"n":1,"title":"PK vs PD: The Two Definitions","sec":"INTRODUCTION TO PHARMACOKINETICS AND PHARMACODYNAMICS · p1","qs":["PHARM-C1-001","PHARM-C1-002","PHARM-C1-003","PHARM-C1-004"],"guide":"Pharmacokinetics is the study of a drug's movement through the body after intake by any route; pharmacodynamics is the change the drug induces in the body. The figure flags absorption, distribution, metabolism and excretion as the kinetic processes, and the drug, its binding to the target and the resulting effect as the dynamic events."},{"id":"PHARM-U1-2","ch":1,"n":2,"title":"Absorption → Distribution → Adipose","sec":"Course of drug through the body · p1","qs":["PHARM-C1-005","PHARM-C1-006","PHARM-C1-007","PHARM-C1-008","PHARM-C1-009","PHARM-C1-010","PHARM-C1-011","PHARM-C1-012","PHARM-C1-013"],"guide":"An oral drug is absorbed into the systemic circulation and may be distributed to adipose tissue — some drugs by redistribution. Adipose-seeking drugs are very short acting, highly lipid soluble and cross the BBB, like the anaesthetics propofol and thiopentone."},{"id":"PHARM-U1-3","ch":1,"n":3,"title":"Binding, Metabolism & Excretion","sec":"Course of drug through the body · p1","qs":["PHARM-C1-014","PHARM-C1-015","PHARM-C1-016","PHARM-C1-017","PHARM-C1-018","PHARM-C1-019","PHARM-C1-020","PHARM-C1-021","PHARM-C1-022"],"guide":"The circulating drug binds its target — most drugs bind reversibly — and the effect follows; breakdown of the bond frees the drug back into the circulation. The liver then breaks the remaining drug down to a water-soluble form, which is excreted mostly via the kidney and partly via the gut."},{"id":"PHARM-U2-1","ch":2,"n":1,"title":"Four Ways Across the Biological Membrane","sec":"Absorption · p2","qs":["PHARM-C2-001","PHARM-C2-002","PHARM-C2-003","PHARM-C2-004","PHARM-C2-005","PHARM-C2-006","PHARM-C2-007"],"guide":"A drug in the intestinal lumen must cross the biological membrane to reach blood. The diagram draws four mechanisms — filtration, simple/passive diffusion (the most common), facilitated diffusion and active transport — with the first three bracketed as ATP-independent and only active transport needing ATP. The legend uses a Y for carrier and a triangle for drug."},{"id":"PHARM-U2-2","ch":2,"n":2,"title":"Filtration & Simple Diffusion: The ATP-Free Routes","sec":"Absorption · p2","qs":["PHARM-C2-008","PHARM-C2-009","PHARM-C2-010","PHARM-C2-011","PHARM-C2-012","PHARM-C2-013","PHARM-C2-014"],"guide":"Filtration pushes the drug through membrane pores (example: subcutaneous insulin) with no ATP; simple/passive diffusion is the commonest mechanism of absorption and moves drug along its concentration gradient, straight through the lipid membrane rather than a pore. Neither uses a carrier and neither burns ATP."},{"id":"PHARM-U2-3","ch":2,"n":3,"title":"Facilitated Diffusion vs Active Transport","sec":"Absorption · p2","qs":["PHARM-C2-015","PHARM-C2-016","PHARM-C2-017","PHARM-C2-018","PHARM-C2-019","PHARM-C2-020","PHARM-C2-021","PHARM-C2-022","PHARM-C2-023","PHARM-C2-024","PHARM-C2-025","PHARM-C2-026"],"guide":"Facilitated diffusion (GLUT receptors) uses a carrier but still runs along the gradient with no ATP, and GLUT absorption is gradient-based. Active transport (SGLT receptors) needs ATP and is independent of the gradient — SGLT1 sits on the small intestine and SGLT2 on the renal tubules. Together these two form 'carrier mediated transport'."},{"id":"PHARM-U2-4","ch":2,"n":4,"title":"P-glycoprotein (MDR1) Pump & First-Pass Efflux","sec":"Active transport: P-glycoprotein pump · p2","qs":["PHARM-C2-027","PHARM-C2-028","PHARM-C2-029","PHARM-C2-030","PHARM-C2-031","PHARM-C2-032","PHARM-C2-033","PHARM-C2-034"],"guide":"P-glycoprotein — the most common ABC pump, also called MDR1 — is an ATP-driven efflux pump. In the small intestine/liver most drugs cross the epithelial cell along the concentration gradient, but some are pumped back into the intestinal lumen, producing first-pass metabolism: the drug is excreted before it ever reaches the systemic circulation."},{"id":"PHARM-U2-5","ch":2,"n":5,"title":"Digoxin Dosing, BBB, Placenta & Hepatocytes","sec":"Significance · p3","qs":["PHARM-C2-035","PHARM-C2-036","PHARM-C2-037","PHARM-C2-038","PHARM-C2-039","PHARM-C2-040","PHARM-C2-041","PHARM-C2-042","PHARM-C2-043","PHARM-C2-044","PHARM-C2-045","PHARM-C2-046"],"guide":"Efflux matters clinically: digoxin dosage is calculated on the amount lost to efflux. MDR1 pumps sit at the blood-brain barrier, so the opioid antidiarrhoeal loperamide acts on the GIT but cannot enter the brain; water solubility is another reason drugs stay out of the CNS. Placental MDR1 pumps protect the fetus, and hepatocyte MDR1 pumps drive bile acid excretion."},{"id":"PHARM-U2-6","ch":2,"n":6,"title":"Pgp-Driven Resistance in Bacteria & Tumour Cells","sec":"In bacteria/tumour cell · p3","qs":["PHARM-C2-047","PHARM-C2-048","PHARM-C2-049"],"guide":"The flowchart is short and ruthless: a bacterial or tumour cell develops a Pgp pump, the pump effluxes the drug, and the cell becomes resistant — the same pump that handles normal drugs becomes the engine of treatment failure."},{"id":"PHARM-U2-7","ch":2,"n":7,"title":"Substrates, Inducers & Inhibitors of Pgp","sec":"Pharmacological significance · p4","qs":["PHARM-C2-050","PHARM-C2-051","PHARM-C2-052","PHARM-C2-053","PHARM-C2-054","PHARM-C2-055","PHARM-C2-056","PHARM-C2-057","PHARM-C2-058","PHARM-C2-059","PHARM-C2-060","PHARM-C2-061"],"guide":"Three columns summarise Pgp pharmacology: substrates (loperamide, cyclosporine, digoxin) are pumped out; inducers (rifampicin, phenytoin, phenobarbital — like enzyme inducers) raise pump numbers and cause drug failure; inhibitors (verapamil, amiodarone, quinidine, cyclosporine, itraconazole, neratinib, erythromycin/clarithromycin) lower pump numbers and cause drug toxicity. Cyclosporine is both substrate and inhibitor."},{"id":"PHARM-U2-8","ch":2,"n":8,"title":"Effects of Pgp Blockade: The Interaction Table","sec":"Effects of blockade · p4","qs":["PHARM-C2-062","PHARM-C2-063","PHARM-C2-064","PHARM-C2-065","PHARM-C2-066","PHARM-C2-067","PHARM-C2-068","PHARM-C2-069","PHARM-C2-070"],"guide":"The blockade table is pure exam gold: rifampicin → digoxin failure, clarithromycin → digoxin toxicity, cyclosporine → cholestatic jaundice, verapamil → reversal of drug resistance in cancer and bacteria, and quinidine → loperamide-induced central side effects. Each entry is a clinical interaction driven by the efflux pump."},{"id":"PHARM-U2-9","ch":2,"n":9,"title":"Passive Diffusion: The Lipid-Solubility Rule","sec":"Passive Diffusion · p4","qs":["PHARM-C2-071","PHARM-C2-072","PHARM-C2-073","PHARM-C2-074","PHARM-C2-075","PHARM-C2-076","PHARM-C2-077","PHARM-C2-078"],"guide":"Passive diffusion obeys one rule: lipid-soluble wins. A non-polar, unionised, neutral drug diffuses across the lipid membrane and is absorbed; a polar, ionised or charged drug is repelled by the charged membrane proteins, is lipid insoluble/water soluble, is not absorbed and is finally excreted."},{"id":"PHARM-U3-1","ch":3,"n":1,"title":"The Criteria Table: LUNJA for Absorption, WIPE for Excretion","sec":"Ionization of drugs · p5","qs":["PHARM-C3-001","PHARM-C3-002","PHARM-C3-003","PHARM-C3-004","PHARM-C3-005","PHARM-C3-006","PHARM-C3-007","PHARM-C3-008","PHARM-C3-009","PHARM-C3-010"],"guide":"One table decides everything: to be absorbed a drug must be lipid soluble, unionised, non-polar with the medium's pH equal to the drug's, and to be excreted it must be water soluble, ionised, polar with the pH of drug and medium unequal. The mnemonics are LUNJA for absorption and WIPE for excretion."},{"id":"PHARM-U3-2","ch":3,"n":2,"title":"Acidic in Acid, Basic in Base — and the Duodenum Rule","sec":"Unionization · p5","qs":["PHARM-C3-011","PHARM-C3-012","PHARM-C3-013","PHARM-C3-014","PHARM-C3-015","PHARM-C3-016"],"guide":"An acidic drug (aspirin) is unionised in the acidic stomach and a basic drug in the basic small intestine. Yet the unionised drug is maximally absorbed in the small intestine — duodenum — simply because of its enormous surface area, which beats the stomach's favourable pH."},{"id":"PHARM-U3-3","ch":3,"n":3,"title":"Short Bowel Syndrome: Lose the Gut, Lose the Drug","sec":"Short bowel syndrome · p5","qs":["PHARM-C3-017","PHARM-C3-018","PHARM-C3-019"],"guide":"Resection of the small intestine reduces drug absorption, so an oral drug may fail. Management is to increase the dose or change the route — a direct clinical application of surface-area-driven absorption."},{"id":"PHARM-U3-4","ch":3,"n":4,"title":"Ion Trapping: Alkalinise for Acid, Acidify for Base","sec":"Ionization (excretion) · p5","qs":["PHARM-C3-020","PHARM-C3-021","PHARM-C3-022","PHARM-C3-023","PHARM-C3-024","PHARM-C3-025","PHARM-C3-026","PHARM-C3-027","PHARM-C3-028","PHARM-C3-029","PHARM-C3-030"],"guide":"Excretion needs the drug ionised, hence the pH of drug and medium must differ. Acidic drug toxicity (aspirin, phenobarbital, methotrexate) is treated by alkalinising urine with bicarbonate; basic drug toxicity (amphetamine) by acidifying urine with ammonium chloride — vitamin C and cranberry juice are other urine acidifiers. Ionised drug is trapped and excreted."},{"id":"PHARM-U3-5","ch":3,"n":5,"title":"Henderson-Hasselbalch: Quantifying Ionization","sec":"Henderson - Hasselbach Equation · p6","qs":["PHARM-C3-031","PHARM-C3-032","PHARM-C3-033","PHARM-C3-034","PHARM-C3-035","PHARM-C3-036","PHARM-C3-037","PHARM-C3-038","PHARM-C3-039","PHARM-C3-040"],"guide":"For an acidic drug log [U]/[I] = pKa − pH; for a basic drug the ratio is inverted as log [I]/[U] = pKa − pH. pKa is the pH at which half the drug is ionised. An acidic drug of pKa 4 in gastric pH 2 gives a ratio of 100 — 99% unionised and 1% ionised, which is why absorption can occur."},{"id":"PHARM-U3-6","ch":3,"n":6,"title":"IR, SR and CR: Three Shapes of a Release Curve","sec":"Absorption of oral drugs · p6","qs":["PHARM-C3-041","PHARM-C3-042","PHARM-C3-043","PHARM-C3-044","PHARM-C3-045","PHARM-C3-046","PHARM-C3-047","PHARM-C3-048","PHARM-C3-049","PHARM-C3-050","PHARM-C3-051","PHARM-C3-052","PHARM-C3-053","PHARM-C3-054","PHARM-C3-055","PHARM-C3-056","PHARM-C3-057"],"guide":"A tablet is either immediate release (IR) or extended release (ER), and ER splits into sustained release (SR) and controlled release (CR), the latter also called zero order CR. IR gives repeated sharp peaks with frequent dosing (indomethacin TID) and poor compliance; SR uses a polymer coating for a shorter peak and longer duration; CR coats the pores to give a flat plateau."},{"id":"PHARM-U3-7","ch":3,"n":7,"title":"Bypassing the Stomach: Delayed Release & Enteric Coating","sec":"a. Drugs bypassing the stomach · p7","qs":["PHARM-C3-058","PHARM-C3-059","PHARM-C3-060","PHARM-C3-061","PHARM-C3-062","PHARM-C3-063","PHARM-C3-064"],"guide":"Two tricks avoid the stomach: delayed release, which delivers the drug to the small intestine (sulfasalazine for ulcerative colitis), and enteric coating, which shields an acid-labile drug from gastric HCl (PPIs). One moves the release site, the other protects the drug."},{"id":"PHARM-U3-8","ch":3,"n":8,"title":"Bioavailability: Definition, Factors and the AUC Formula","sec":"BIOAVAILABILITY (F) · p7","qs":["PHARM-C3-065","PHARM-C3-066","PHARM-C3-067","PHARM-C3-068","PHARM-C3-069","PHARM-C3-070","PHARM-C3-071","PHARM-C3-072","PHARM-C3-073"],"guide":"Bioavailability is the fraction of drug reaching the systemic circulation unchanged. From 100% intestinal absorption, a fraction is excreted and a fraction undergoes hepatic first pass metabolism, leaving only the rest in circulation. F = AUCoral/AUCiv × 100; AUC is the extent of absorption, and IV is the only route with 100% bioavailability."},{"id":"PHARM-U3-9","ch":3,"n":9,"title":"Route by Route: Bioavailability Table","sec":"Route of administration · p8","qs":["PHARM-C3-074","PHARM-C3-075","PHARM-C3-076","PHARM-C3-077","PHARM-C3-078"],"guide":"IV bioavailability is 1, im/sc 0.75–1.0, and oral the widest range of 0.05–1.0 because first pass metabolism varies by drug. Remember the note: F tells you the extent, never the rate, of absorption."},{"id":"PHARM-U3-10","ch":3,"n":10,"title":"Cmax & Tmax: Rate Versus Extent","sec":"RATE OF DRUG ABSORPTION · p8","qs":["PHARM-C3-079","PHARM-C3-080","PHARM-C3-081","PHARM-C3-082","PHARM-C3-083"],"guide":"On a plasma concentration-time curve, Cmax is the highest concentration achieved and Tmax is the time at which it occurs. Tmax is the marker of the rate of absorption, while AUC gives the extent — two different questions answered by two different parameters."},{"id":"PHARM-U3-11","ch":3,"n":11,"title":"Bioequivalence: Branded, Generic, ANDA & the ±30% Rule","sec":"Bioequivalence in drug industry · p8","qs":["PHARM-C3-084","PHARM-C3-085","PHARM-C3-086","PHARM-C3-087","PHARM-C3-088","PHARM-C3-089","PHARM-C3-090","PHARM-C3-091","PHARM-C3-092"],"guide":"Bioequivalence means two pharmaceutically equivalent products with similar rate (Tmax) and extent (AUC) of absorption. The branded drug is invented and patented for 20 years; the generic is a legal copy marketed after patent expiry, cheaper, approved through ANDA provided it is bioequivalent to the branded drug within ±30%."}];

const QBYID = {}; QUESTIONS.forEach(q=>QBYID[q.id]=q);
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_xp')||0;}, set xp(v){store('pulse_xp',v);},
  get done(){return store('pulse_done')||[];}, set done(v){store('pulse_done',v);},
  get unlock(){return !!store('pulse_unlock');}, set unlock(v){store('pulse_unlock',v);},
  streak(){const t=store('pulse_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_streak',s);return s.n;}
};
const nav={stack:['home']};
function show(id){nav.stack.push(id);render();}
function goBack(){if(nav.stack.length>1)nav.stack.pop();render();}
function render(){
  const cur=nav.stack[nav.stack.length-1];
  ['home','chapters','path','guide','quiz','unitdone'].forEach(s=>$(s).classList.toggle('hidden',s!==cur));
  $('backBtn').classList.toggle('hidden',cur==='home');
  $('brand').textContent = cur==='home'?'PULSE':'PULSE';
  refreshStats();
  if(cur==='home')renderHome();
  if(cur==='chapters')renderChapters();
  if(cur==='path')renderPath();
}
function refreshStats(){
  $('hXP').textContent=S.xp; $('hStreak').textContent=S.streak().n;
  $('sXP').textContent=S.xp; $('sStreak').textContent=S.streak().n; $('sUnits').textContent=S.done.length;
}
function renderHome(){
  const live=CHAPTERS.filter(c=>c.live).length;
  $('heroSub').textContent=live+' of '+CHAPTERS.length+' chapters built so far — original questions, guides, and unit-by-unit mastery for each.';
}
function unitsOf(ch){return UNITS.filter(u=>u.ch===ch).sort((a,b)=>a.n-b.n);}
function renderChapters(){
  $('chSub').textContent=CHAPTERS.length+' chapters · Full chapter-by-chapter exam pass';
  const box=$('chList'); box.innerHTML='';
  CHAPTERS.forEach(c=>{
    const us=c.live?unitsOf(c.n):[];
    const dn=us.filter(u=>S.done.includes(u.id)).length;
    const d=document.createElement('div');
    d.className='chrow'+(c.live?'':' locked');
    d.innerHTML='<div class="chnum">'+c.n+'</div><div class="t">'+escapeHtml(c.t)+'</div><div class="u">'+(c.live?dn+'/'+us.length+' units':'Soon')+'</div>';
    if(c.live)d.onclick=()=>{curCh=c.n;show('path');};
    box.appendChild(d);
  });
}
let curCh=1, curUnit=null;
function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';
  const i=us.findIndex(x=>x.id===u.id);
  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}
function renderPath(){
  const c=CHAPTERS.find(x=>x.n===curCh), us=unitsOf(curCh);
  $('pathKick').textContent='CHAPTER '+c.n;
  $('pathTitle').textContent=c.t;
  $('pathSub').textContent=us.filter(u=>S.done.includes(u.id)).length+' of '+us.length+' units done · in book order';
  const box=$('nodes'); box.innerHTML='';
  let lastSec='';
  us.forEach(u=>{
    if(u.sec!==lastSec){lastSec=u.sec;
      const s=document.createElement('div');s.className='pathsec';s.textContent=u.sec;box.appendChild(s);}
    const st=unitState(u,us);
    const d=document.createElement('div');d.className='node';
    d.innerHTML='<div class="ball '+st+'">'+(st==='done'?'✓':st==='locked'?'🔒':u.n)+'</div><div class="ntitle">'+escapeHtml(u.title)+'</div><div class="ncount">'+u.qs.length+' questions</div>';
    if(st!=='locked')d.querySelector('.ball').onclick=()=>openGuide(u);
    box.appendChild(d);
  });
}
function openGuide(u){curUnit=u;
  $('gKick').textContent='CHAPTER '+u.ch+' · UNIT '+u.n+' · '+u.sec.toUpperCase();
  $('gTitle').textContent=u.title;
  $('gText').textContent=u.guide;
  $('gCount').textContent=u.qs.length+' questions · follows the book line-by-line';
  show('guide');
}
let order=[],idx=0,xpGain=0,streak=0,correct=0,wrongList=[],locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function beginUnit(){
  // FIXED book order — only options shuffle (anti-bias)
  order=curUnit.qs.map(id=>{const q=QBYID[id];return {q,opts:shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))};});
  idx=0;xpGain=0;streak=0;correct=0;wrongList=[];
  show('quiz');renderQ();
}
function renderQ(){
  locked=false;
  const cur=order[idx],q=cur.q;
  $('qbar').style.width=(idx/order.length*100)+'%';
  $('qcount').textContent='QUESTION '+(idx+1)+' OF '+order.length;
  $('qtag').textContent=q.sec+' · Book p'+q.page;
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  cur.opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(o,b);box.appendChild(b);
  });
  $('fb').className='fb';$('fb').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent=idx===order.length-1?'Finish ✓':'Continue →';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function answer(o,btn){
  if(locked)return;locked=true;
  const cur=order[idx],q=cur.q,btns=$('opts').children;
  const rightIdx=cur.opts.findIndex(x=>x.ok);
  [...btns].forEach(b=>b.disabled=true);
  btns[rightIdx].classList.add('correct');
  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
