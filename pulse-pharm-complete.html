,{"id":"PHARM-C5-004","sec":"Phase II","page":11,"q":"In phase II, the drug with its functional group is combined with a conjugate which is:","opts":["Negatively charged","Positively charged","Neutral","Lipid soluble"],"ans":0,"exp":"The flowchart labels the conjugate as -ve charged, which makes the drug ionized and water soluble. (Book p11)"},{"id":"PHARM-C5-005","sec":"Phase II","page":11,"q":"The end product of phase II metabolism is:","opts":["Ionized and water soluble, hence easily excreted","Lipid soluble, hence reabsorbed","A prodrug awaiting activation","A protein-bound complex"],"ans":0,"exp":"Drug + functional group + conjugate becomes ionized and water soluble and is easily excreted - the object of phase II. (Book p11)"},{"id":"PHARM-C5-006","sec":"Phase II","page":11,"q":"The purpose of conjugation in phase II metabolism is to:","opts":["Make the drug water soluble and easily excretable","Make the drug more lipid soluble for absorption","Activate the drug at its receptor","Reduce the drug's molecular weight"],"ans":0,"exp":"Conjugation with a negatively charged group makes the metabolite ionized and water soluble, so it is easily excreted. (Book p11)"},{"id":"PHARM-C5-007","sec":"Phase II","page":11,"q":"According to the note on this page, a placebo:","opts":["Does not contain any drug","Contains an inactive prodrug","Contains a conjugate of the active drug","Contains the drug in subtherapeutic dose"],"ans":0,"exp":"The note plainly states that placebo does not contain any drug - it is used for its psychological effect. (Book p11)"},{"id":"PHARM-C5-008","sec":"Phase I vs II","page":11,"q":"Which sequence correctly describes drug metabolism?","opts":["Active drug - phase I inactivates it and adds a functional group - phase II conjugates it - water-soluble metabolite excreted","Active drug - phase II conjugates it - phase I inactivates it - lipid-soluble metabolite reabsorbed","Prodrug - phase II conjugation - activation - excretion","Active drug - conjugation - renal tubular reabsorption - excretion"],"ans":0,"exp":"Phase I (CYP450) breaks the drug down and adds a functional group; phase II attaches a charged conjugate to give an ionized water-soluble product that is easily excreted. (Book p11)"},{"id":"PHARM-C5-009","sec":"Prodrugs","page":11,"q":"Which of the following is a prodrug among the antimalarials?","opts":["Proguanil","Chloroquine","Primaquine","Artemether"],"ans":0,"exp":"Proguanil heads the list of prodrugs - it requires metabolic activation to exert its antimalarial action. (Book p11)"},{"id":"PHARM-C5-010","sec":"Prodrugs","page":11,"q":"Which angiotensin converting enzyme inhibitors are NOT prodrugs?","opts":["Captopril and lisinopril","Ramipril and enalapril","Perindopril and quinapril","Fosinopril and trandolapril"],"ans":0,"exp":"Ramipril and other ACE inhibitors are prodrugs EXCEPT captopril and lisinopril, which are active as such. (Book p11)"},{"id":"PHARM-C5-011","sec":"Prodrugs","page":11,"q":"Which of the following pairs are all prodrugs?","opts":["Oxcarbazepine and omeprazole","Phenytoin and warfarin","Atenolol and metoprolol","Diazepam and lorazepam"],"ans":0,"exp":"Oxcarbazepine and omeprazole appear in the prodrug list, along with proguanil, ramipril, dipivefrine, levodopa, racecadotril, 5-fluorouracil and gemcitabine. (Book p11)"},{"id":"PHARM-C5-012","sec":"Prodrugs","page":11,"q":"Dipivefrine, used in ophthalmology, is listed as a:","opts":["Prodrug","Active metabolite","Conjugate","Enzyme inhibitor"],"ans":0,"exp":"Dipivefrine appears in the list of prodrugs given on the page. (Book p11)"},{"id":"PHARM-C5-013","sec":"Prodrugs","page":11,"q":"Which of the following anticancer drugs are listed as prodrugs?","opts":["5-Fluorouracil and gemcitabine","Cisplatin and carboplatin","Doxorubicin and daunorubicin","Vincristine and vinblastine"],"ans":0,"exp":"5-Fluorouracil and gemcitabine are included in the prodrug list. (Book p11)"},{"id":"PHARM-C5-014","sec":"Prodrugs","page":11,"q":"Levodopa is grouped with the prodrugs because it:","opts":["Must be converted to the active moiety in the body","Blocks dopamine receptors directly","Is excreted unchanged in urine","Is a prodrug that never becomes active"],"ans":0,"exp":"Levodopa is listed among prodrugs - it is inactive as such and is decarboxylated to the active dopamine. (Book p11)"},{"id":"PHARM-C5-015","sec":"Prodrugs","page":11,"q":"Racecadotril and dipivefrine share which property in this list?","opts":["Both are prodrugs","Both are enzyme inducers","Both are metabolised by acetylation","Both are CYP2E1 substrates"],"ans":0,"exp":"Racecadotril and dipivefrine both appear in the prodrug list along with proguanil, ramipril, oxcarbazepine, omeprazole, levodopa, 5-fluorouracil and gemcitabine. (Book p11)"},{"id":"PHARM-C5-016","sec":"Phase I reactions","page":11,"q":"The mnemonic ORCHAD stands for:","opts":["Phase I reactions","Phase II reactions","Enzyme inducers","CYP450 families"],"ans":0,"exp":"ORCHAD lists phase I reactions: Oxidation, Reduction, Cyclization, Hydrolysis, Aliphatic hydroxylation, Aromatic hydroxylation and Deamination. (Book p11)"},{"id":"PHARM-C5-017","sec":"Phase I reactions","page":11,"q":"The commonest phase I reaction is:","opts":["Oxidation","Reduction","Hydrolysis","Deamination"],"ans":0,"exp":"Oxidation is marked m/c in the ORCHAD list of phase I reactions. (Book p11)"},{"id":"PHARM-C5-018","sec":"Phase I reactions","page":11,"q":"Phase I reactions are enabled by:","opts":["Microsomal CYP450 enzymes","Gut bacterial glucuronidase","Cytosolic acetyl transferases","Plasma esterases alone"],"ans":0,"exp":"The page states that phase I reactions are enabled by microsomal CYP450 enzymes - the mixed function oxidases. (Book p11)"},{"id":"PHARM-C5-019","sec":"Phase I reactions","page":11,"q":"Which of these is NOT a phase I reaction in the ORCHAD list?","opts":["Glucuronidation","Cyclization","Aromatic hydroxylation","Deamination"],"ans":0,"exp":"Glucuronidation is a phase II conjugation, not a phase I reaction; phase I comprises oxidation, reduction, cyclization, hydrolysis, aliphatic and aromatic hydroxylation and deamination. (Book p11)"},{"id":"PHARM-C5-020","sec":"Phase II reactions","page":11,"q":"Phase II reactions are named after:","opts":["The conjugate","The enzyme","The substrate","The functional group"],"ans":0,"exp":"The page notes phase II reactions are named after the conjugate, e.g. glucuronidation, glycination, glutathionation. (Book p11)"},{"id":"PHARM-C5-021","sec":"Phase II reactions","page":11,"q":"The commonest phase II reaction is:","opts":["Glucuronidation","Sulfation","Acetylation","Methylation"],"ans":0,"exp":"Glucuronidation is marked m/c among phase II reactions, and it is microsomal. (Book p11)"},{"id":"PHARM-C5-022","sec":"Phase II reactions","page":11,"q":"Which phase II reaction is a MICROSOMAL reaction?","opts":["Glucuronidation","Glycination","Acetylation","Sulfation"],"ans":0,"exp":"Glucuronidation (m/c) is grouped as microsomal; glycination, glutathionation, acetylation, methylation and sulfation are listed as non-microsomal. (Book p11)"},{"id":"PHARM-C5-023","sec":"Phase II reactions","page":11,"q":"Which set of phase II reactions is NON-microsomal?","opts":["Glycination, glutathionation, acetylation, methylation, sulfation","Glucuronidation and glycination","Glucuronidation, sulfation and acetylation","Oxidation, reduction and hydrolysis"],"ans":0,"exp":"The brace marks glycination, glutathionation, acetylation, methylation and sulfation as non-microsomal reactions, leaving glucuronidation as the microsomal one. (Book p11)"},{"id":"PHARM-C5-024","sec":"CYP450 enzyme group","page":12,"q":"In 'CYP', the CY stands for cytochrome, which is described as a:","opts":["Heme protein that binds oxygen and facilitates metabolism","Zinc-containing metalloenzyme","Non-heme iron-sulfur protein","Plant pigment with no metal"],"ans":0,"exp":"CY (cytochrome) is a heme protein that binds oxygen and thereby facilitates metabolism. (Book p12)"},{"id":"PHARM-C5-025","sec":"CYP450 enzyme group","page":12,"q":"The 'P450' designation was given because these enzymes:","opts":["Were discovered in plant pigment and absorb light of 450 nm wavelength","Weigh 450 kDa","Have 450 amino acids","Require a pH of 4.50 to work"],"ans":0,"exp":"P450: enzymes discovered in plant pigment, absorbing light of 450 nm wavelength. (Book p12)"},{"id":"PHARM-C5-026","sec":"CYP450 enzyme group","page":12,"q":"In the nomenclature CYP1A2, the number 1 denotes the:","opts":["Family","Subfamily","Gene/isoform number","Enzyme subtype"],"ans":0,"exp":"In CYP1A2: 1 = family, A = subfamily, 2 = gene/isoform number. (Book p12)"},{"id":"PHARM-C5-027","sec":"CYP450 enzyme group","page":12,"q":"In the nomenclature CYP1A2, the letter A denotes the:","opts":["Subfamily","Family","Gene/isoform number","Species of origin"],"ans":0,"exp":"The letter A stands for subfamily, while the numeral after it is the gene/isoform number. (Book p12)"},{"id":"PHARM-C5-028","sec":"CYP1A2","page":12,"q":"Which drugs are metabolised by CYP1A2?","opts":["Paracetamol, tacrine and theophylline","Phenytoin and warfarin","6-mercaptopurine and methyldopa","Mifepristone and tamoxifen"],"ans":0,"exp":"CYP1A2 metabolises paracetamol, tacrine and theophylline. (Book p12)"},{"id":"PHARM-C5-029","sec":"CYP2B6","page":12,"q":"Which drugs are metabolised by CYP2B6?","opts":["6-mercaptopurine and methyldopa","Phenytoin and warfarin","Paracetamol and theophylline","Omeprazole and clopidogrel"],"ans":0,"exp":"CYP2B6 metabolises 6-mercaptopurine and methyldopa. (Book p12)"},{"id":"PHARM-C5-030","sec":"CYP2C9","page":12,"q":"Phenytoin and warfarin are metabolised by:","opts":["CYP2C9","CYP1A2","CYP2D6","CYP3A4"],"ans":0,"exp":"CYP2C9 is listed with phenytoin and warfarin as its substrates. (Book p12)"},{"id":"PHARM-C5-031","sec":"CYP2C19","page":12,"q":"CYP2C19 metabolises omeprazole and:","opts":["Activates clopidogrel","Inactivates clopidogrel","Activates tamoxifen","Metabolises mifepristone"],"ans":0,"exp":"CYP2C19 metabolises omeprazole and activates clopidogrel, converting the prodrug to its active form. (Book p12)"},{"id":"PHARM-C5-032","sec":"CYP2C19","page":12,"q":"Omeprazole decreases the effect of clopidogrel because:","opts":["Both are substrates of CYP2C19, so omeprazole acts as a competitive inhibitor of the enzyme","Omeprazole induces CYP2C19 and destroys clopidogrel","Omeprazole increases gastric pH and prevents clopidogrel absorption","Omeprazole binds clopidogrel directly in plasma"],"ans":0,"exp":"The book marks them as competitive inhibitors (substrates, decreased enzyme): omeprazole decreases the effect of clopidogrel. (Book p12)"},{"id":"PHARM-C5-033","sec":"CYP2C19","page":12,"q":"Clopidogrel requires activation by CYP2C19. A patient with an acute coronary syndrome started on both omeprazole and clopidogrel will have:","opts":["A reduced antiplatelet effect of clopidogrel","Enhanced antiplatelet effect with bleeding risk","No interaction because they act on different enzymes","Increased clopidogrel toxicity with rhabdomyolysis"],"ans":0,"exp":"Since omeprazole and clopidogrel compete for the same enzyme, omeprazole decreases the effect of clopidogrel - a loss of antiplatelet protection. (Book p12)"},{"id":"PHARM-C5-034","sec":"CYP2D6","page":12,"q":"CYP2D6 metabolises all of the following EXCEPT:","opts":["Mifepristone","Psychiatric drugs (antidepressants, antipsychotics)","Opioids","Beta blockers"],"ans":0,"exp":"CYP2D6 metabolises psychiatric drugs (antidepressants and antipsychotics), opioids and beta blockers; mifepristone is the example given for CYP3A4. (Book p12)"},{"id":"PHARM-C5-035","sec":"CYP2D6","page":12,"q":"CYP2D6 ACTIVATES which of the following?","opts":["Tamoxifen","Clopidogrel","Omeprazole","Warfarin"],"ans":0,"exp":"CYP2D6 activates tamoxifen, converting the prodrug to its active metabolite. (Book p12)"},{"id":"PHARM-C5-036","sec":"CYP2D6","page":12,"q":"A patient on tamoxifen started on a potent CYP2D6 inhibitor is at risk of:","opts":["Reduced activation of tamoxifen and loss of efficacy","Tamoxifen toxicity with marrow suppression","No interaction, since tamoxifen is excreted unchanged","Increased activation of tamoxifen with toxicity"],"ans":0,"exp":"Tamoxifen is activated by CYP2D6; inhibiting the enzyme reduces formation of the active metabolite and lowers efficacy. (Book p12)"},{"id":"PHARM-C5-037","sec":"CYP2E1","page":12,"q":"Chronic consumption of ethanol causes:","opts":["Upregulation of CYP2E1","Downregulation of CYP2E1","Inhibition of CYP2E1","No change in CYP2E1"],"ans":0,"exp":"The flowchart runs ethanol - chronic consumption - CYP2E1 upregulation. (Book p12)"},{"id":"PHARM-C5-038","sec":"CYP2E1","page":12,"q":"In a chronic alcoholic, paracetamol produces hepatotoxicity because CYP2E1 upregulation leads to:","opts":["Increased NAPQI formation","Decreased NAPQI formation","Increased glucuronidation of paracetamol","Reduced glutathione depletion"],"ans":0,"exp":"The flow reads: paracetamol - increased NAPQI - hepatotoxicity, following CYP2E1 upregulation by chronic alcohol. (Book p12)"},{"id":"PHARM-C5-039","sec":"CYP2E1","page":12,"q":"Paracetamol is metabolised predominantly by:","opts":["CYP2E1, much more than CYP1A2","CYP1A2, much more than CYP2E1","CYP3A4, much more than CYP2D6","CYP2C19, much more than CYP2C9"],"ans":0,"exp":"The book notes paracetamol is metabolised by CYP2E1 >> CYP1A2 - which is why alcohol-induced CYP2E1 upregulation is so dangerous. (Book p12)"},{"id":"PHARM-C5-040","sec":"CYP2E1","page":12,"q":"NAPQI is best described as:","opts":["The toxic metabolite of paracetamol whose rise causes hepatotoxicity","The active analgesic metabolite of paracetamol","A glutathione conjugate excreted in bile","An enzyme inducer present in alcohol"],"ans":0,"exp":"The flowchart links paracetamol to increased NAPQI and thence hepatotoxicity - NAPQI is the hepatotoxic metabolite. (Book p12)"},{"id":"PHARM-C5-041","sec":"CYP3A4","page":12,"q":"Which CYP enzyme is the commonest (m/c) and metabolises more than 50% of drugs?","opts":["CYP3A4","CYP2D6","CYP2C9","CYP1A2"],"ans":0,"exp":"CYP3A4 is marked m/c and metabolises >50% of drugs, with mifepristone given as an example. (Book p12)"},{"id":"PHARM-C5-042","sec":"CYP3A4","page":12,"q":"Mifepristone is given as the example of a drug metabolised by:","opts":["CYP3A4","CYP2C19","CYP2E1","CYP2B6"],"ans":0,"exp":"The example quoted for CYP3A4, which metabolises more than half of all drugs, is mifepristone. (Book p12)"},{"id":"PHARM-C5-043","sec":"CYP summary","page":12,"q":"Which CYP drug-substrate pair is correctly matched?","opts":["CYP2C9 - warfarin","CYP1A2 - methyldopa","CYP2B6 - theophylline","CYP2D6 - mifepristone"],"ans":0,"exp":"CYP2C9 handles phenytoin and warfarin; methyldopa is a CYP2B6 substrate, theophylline a CYP1A2 substrate and mifepristone a CYP3A4 example. (Book p12)"},{"id":"PHARM-C5-044","sec":"Glucuronidation","page":13,"q":"Which antiviral drug causes Steven Johnson syndrome through glucuronidation issues?","opts":["Atazanavir","Acyclovir","Zidovudine","Oseltamivir"],"ans":0,"exp":"The glucuronidation section lists atazanavir (antiviral) causing Steven Johnson syndrome. (Book p13)"},{"id":"PHARM-C5-045","sec":"Glucuronidation","page":13,"q":"Irinotecan, an anticancer drug, is associated with toxicity because of:","opts":["Glucuronidation","Acetylation","Sulfation","Methylation"],"ans":0,"exp":"The page pairs irinotecan (anticancer) with toxicity under the heading glucuronidation. (Book p13)"},{"id":"PHARM-C5-046","sec":"Glucuronidation","page":13,"q":"Atazanavir and irinotecan are contraindicated in:","opts":["Crigler Najjar syndrome","Gilbert syndrome","Dubin-Johnson syndrome","Rotor syndrome"],"ans":0,"exp":"Both atazanavir and irinotecan are contraindicated in Crigler Najjar syndrome, where glucuronidation is defective. (Book p13)"},{"id":"PHARM-C5-047","sec":"Glucuronidation","page":13,"q":"Atazanavir and irinotecan share which single contraindication in the book?","opts":["Crigler Najjar syndrome","Chronic kidney disease","Cirrhosis of the liver","Glucose-6-phosphate dehydrogenase deficiency"],"ans":0,"exp":"The brace on the page ties atazanavir-induced Steven Johnson syndrome and irinotecan toxicity to one contraindication - Crigler Najjar syndrome. (Book p13)"},{"id":"PHARM-C5-048","sec":"Estrogen metabolism","page":13,"q":"Estrogen is metabolised in the liver by:","opts":["Phase I with CYP3A4 followed by phase II glucuronidation","Phase I with CYP2E1 followed by acetylation","Phase II sulfation alone","Phase II acetylation followed by hydrolysis"],"ans":0,"exp":"The estrogen flowchart shows liver phase I with CYP3A4 and phase II glucuronidation. (Book p13)"},{"id":"PHARM-C5-049","sec":"Estrogen metabolism","page":13,"q":"In the liver, estrogen is converted to estrogen + glucuronic acid, which is:","opts":["Water soluble","Lipid soluble","Negatively charged and lipid soluble","Protein bound"],"ans":0,"exp":"Estrogen + glucuronic acid is labelled water soluble, allowing it to be carried to the small intestine. (Book p13)"},{"id":"PHARM-C5-050","sec":"Estrogen metabolism","page":13,"q":"Enterohepatic circulation of estrogen begins when gut bacteria act on estrogen glucuronide by:","opts":["Glucuronidase action","Sulfatase action","Acetyl transferase action","Beta lactamase action"],"ans":0,"exp":"In the small intestine, glucuronidase action by gut bacteria breaks down the conjugate; estrogen is then broken down to a lipid-soluble form that is reabsorbed. (Book p13)"},{"id":"PHARM-C5-051","sec":"Estrogen metabolism","page":13,"q":"Enterohepatic circulation of a drug results in:","opts":["Extension of the normal half-life (T1/2)","Shortening of the normal half-life","Immediate renal excretion","Loss of drug in faeces"],"ans":0,"exp":"The boxed point states enterohepatic circulation is an extension of the normal T1/2, because drug is reabsorbed repeatedly instead of being excreted. (Book p13)"},{"id":"PHARM-C5-052","sec":"Estrogen metabolism","page":13,"q":"Antibiotics cause oral contraceptive pill failure by:","opts":["Decreasing the enterohepatic circulation of estrogen, so its T1/2 falls","Increasing the enterohepatic circulation of estrogen","Inducing CYP3A4 to activate estrogen","Blocking estrogen receptors in the uterus"],"ans":0,"exp":"Antibiotics kill gut bacteria, so less glucuronidase deconjugates estrogen; enterohepatic circulation falls, T1/2 falls and OCP failure results. (Book p13)"},{"id":"PHARM-C5-053","sec":"Estrogen metabolism","page":13,"q":"The sequence leading to oral contraceptive failure with antibiotics is:","opts":["Antibiotics - decreased enterohepatic circulation of estrogen - decreased T1/2 - OCP failure","Antibiotics - increased enterohepatic circulation - increased T1/2 - OCP failure","Antibiotics - increased CYP3A4 - decreased estrogen - OCP failure","Antibiotics - decreased gut glucuronidase - increased estrogen - OCP failure"],"ans":0,"exp":"The flowchart reads antibiotics - down enterohepatic circulation of estrogen - down T1/2 - OCP failure. (Book p13)"},{"id":"PHARM-C5-054","sec":"Estrogen metabolism","page":13,"q":"For estrogen to re-enter the enterohepatic circulation after bacterial deconjugation, it must become:","opts":["Lipid soluble","Water soluble","Ionized","Protein bound"],"ans":0,"exp":"After glucuronidase action the estrogen is 'broken down + lipid soluble', which allows reabsorption and re-entry into the circulation. (Book p13)"},{"id":"PHARM-C5-055","sec":"Acetylation","page":13,"q":"The mnemonic HIPS Dance stands for drugs undergoing:","opts":["Acetylation, and capable of causing drug-induced SLE","Glucuronidation, and capable of causing Steven Johnson syndrome","Sulfation, and capable of causing cholestasis","Oxidation, and capable of causing hepatotoxicity"],"ans":0,"exp":"HIPS Dance lists acetylated drugs - Hydralazine, Isoniazid, Procainamide, Sulfonamide, Dapsone - which can cause drug-induced SLE. (Book p13)"},{"id":"PHARM-C5-056","sec":"Acetylation","page":13,"q":"Which group of drugs can cause drug-induced SLE?","opts":["Hydralazine, isoniazid, procainamide, sulfonamide, dapsone","Rifampicin, phenytoin, phenobarbital, carbamazepine","Atazanavir, irinotecan, omeprazole, clopidogrel","Paracetamol, theophylline, tacrine, methyldopa"],"ans":0,"exp":"The brace groups all five HIPS Dance drugs as capable of causing drug-induced SLE. (Book p13)"},{"id":"PHARM-C5-057","sec":"Acetylation","page":13,"q":"In the HIPS Dance mnemonic, the letters stand for:","opts":["Hydralazine, Isoniazid, Procainamide, Sulfonamide, Dapsone","Hydralazine, Indomethacin, Penicillamine, Streptomycin, Danazol","Heparin, Insulin, Phenytoin, Salicylate, Digoxin","Haloperidol, Ibuprofen, Paracetamol, Statin, Diazepam"],"ans":0,"exp":"HIPS Dance: Hydralazine, Isoniazid, Procainamide, Sulfonamide and Dapsone - all acetylated, all capable of drug-induced SLE. (Book p13)"},{"id":"PHARM-C5-058","sec":"Acetylation","page":13,"q":"A patient on isoniazid for tuberculosis develops fever, arthralgia and a positive ANA. The likely cause is:","opts":["Drug-induced SLE from an acetylated drug","Isoniazid hepatotoxicity","CYP2E1 induction","Enterohepatic circulation of isoniazid"],"ans":0,"exp":"Isoniazid belongs to the HIPS Dance group of acetylated drugs that can cause drug-induced SLE. (Book p13)"},{"id":"PHARM-C5-059","sec":"Drug Interactions","page":14,"q":"Microsomal enzyme inducers increase metabolism and thereby cause plasma concentration to fall, resulting in:","opts":["Drug failure","Drug toxicity","Drug allergy","Drug resistance"],"ans":0,"exp":"The inducer column reads: increased enzyme - increased metabolism - plasma concentration falls - drug failure. (Book p14)"},{"id":"PHARM-C5-060","sec":"Drug Interactions","page":14,"q":"Microsomal enzyme inhibitors decrease metabolism, so plasma concentration rises and produces:","opts":["Drug toxicity","Drug failure","Reduced half-life","Increased first pass metabolism"],"ans":0,"exp":"The inhibitor column reads: decreased enzyme - decreased metabolism - increased plasma concentration - drug toxicity. (Book p14)"},{"id":"PHARM-C5-061","sec":"Drug Interactions","page":14,"q":"Enzyme induction causes drug failure because:","opts":["More enzyme means faster metabolism and a lower plasma concentration","More enzyme means slower metabolism and a higher plasma concentration","Enzyme induction blocks the drug at its receptor","Enzyme induction increases renal reabsorption"],"ans":0,"exp":"Induction increases the amount of enzyme, speeds metabolism, lowers plasma concentration and thereby causes failure of therapy. (Book p14)"},{"id":"PHARM-C5-062","sec":"Drug Interactions","page":14,"q":"Enzyme inhibition causes drug toxicity because:","opts":["Less enzyme means slower metabolism and a higher plasma concentration","Less enzyme means faster metabolism and a lower plasma concentration","Inhibitors increase the number of receptors","Inhibitors displace drug from albumin"],"ans":0,"exp":"Enzyme inhibition reduces metabolism, so the drug accumulates, plasma concentration rises and toxicity follows. (Book p14)"},{"id":"PHARM-C5-063","sec":"Enzyme inducers","page":14,"q":"Which of the following are enzyme inducers?","opts":["Griseofulvin, rifampicin, chronic alcohol, phenobarbital, carbamazepine","Cimetidine, ciprofloxacin, ketoconazole, valproate","Erythromycin, clarithromycin, quinidine, isoniazid","Grapefruit juice, acute alcohol, diethylcarbamazine, neratinib"],"ans":0,"exp":"The inducer list is griseofulvin, rifampicin, alcohol (chronic), benzopyrene, phenobarbital, carbamazepine and St. John's wort. (Book p14)"},{"id":"PHARM-C5-064","sec":"Enzyme inducers","page":14,"q":"St. John's wort, listed as an enzyme inducer, is a plant used to treat:","opts":["Depression","Malaria","Hypertension","Epilepsy"],"ans":0,"exp":"The book annotates St. John's wort as 'plant used to treat depression', and lists it among enzyme inducers. (Book p14)"},{"id":"PHARM-C5-065","sec":"Enzyme inducers","page":14,"q":"Benzopyrene, listed among enzyme inducers, is encountered in:","opts":["Cigarette smoke","Grapefruit juice","St. John's wort","Dairy products"],"ans":0,"exp":"Benzopyrene appears in the inducer list - it is a polycyclic aromatic hydrocarbon of cigarette smoke that induces CYP1A2. (Book p14)"},{"id":"PHARM-C5-066","sec":"Enzyme inducers","page":14,"q":"Which of these is NOT an enzyme inducer as listed in the table?","opts":["Ketoconazole","Griseofulvin","Carbamazepine","Phenobarbital"],"ans":0,"exp":"Ketoconazole is an enzyme INHIBITOR; inducers are griseofulvin, rifampicin, chronic alcohol, benzopyrene, phenobarbital, carbamazepine and St. John's wort. (Book p14)"},{"id":"PHARM-C5-067","sec":"Enzyme inhibitors","page":14,"q":"Which of the following are enzyme inhibitors?","opts":["Cimetidine, ciprofloxacin, ketoconazole, valproate, quinidine","Rifampicin, phenobarbital, carbamazepine, griseofulvin","St. John's wort and benzopyrene","Chronic alcohol and phenytoin"],"ans":0,"exp":"The inhibitor list is acute alcohol consumption, quinidine, isoniazid, cimetidine, ciprofloxacin, ketoconazole, valproate, erythromycin/clarithromycin, grapefruit juice and diethylcarbamazine. (Book p14)"},{"id":"PHARM-C5-068","sec":"Enzyme inhibitors","page":14,"q":"Regarding alcohol, the table specifies that:","opts":["Acute alcohol consumption is an inhibitor while chronic alcohol is an inducer","Both acute and chronic alcohol are inducers","Both acute and chronic alcohol are inhibitors","Alcohol does not affect microsomal enzymes"],"ans":0,"exp":"Chronic alcohol appears in the inducer column and acute alcohol consumption in the inhibitor column - the same agent with opposite effects by duration of intake. (Book p14)"},{"id":"PHARM-C5-069","sec":"Enzyme inhibitors","page":14,"q":"Grapefruit juice is listed as an:","opts":["Enzyme inhibitor","Enzyme inducer","Enzyme substrate only","Prodrug"],"ans":0,"exp":"Grapefruit juice appears in the inhibitor column, with cimetidine, ciprofloxacin, ketoconazole, valproate and others. (Book p14)"},{"id":"PHARM-C5-070","sec":"Enzyme inhibitors","page":14,"q":"Diethylcarbamazine is listed as an enzyme:","opts":["Inhibitor","Inducer","Substrate","Prodrug"],"ans":0,"exp":"Diethylcarbamazine appears at the end of the enzyme inhibitor list. (Book p14)"},{"id":"PHARM-C5-071","sec":"Enzyme inhibitors","page":14,"q":"Isoniazid appears in the table as an enzyme:","opts":["Inhibitor","Inducer","Substrate","Cofactor"],"ans":0,"exp":"Isoniazid is listed among enzyme inhibitors, along with quinidine, cimetidine, ciprofloxacin, ketoconazole and valproate. (Book p14)"},{"id":"PHARM-C5-072","sec":"Clinical significance","page":14,"q":"In oral contraceptive failure due to rifampicin, the book's options include all EXCEPT:","opts":["Continuing the same regimen unchanged","Changing the method of contraception (IUD or condoms)","Avoiding enzyme inducers","Increasing the dose of drugs such as phenytoin and retigabine"],"ans":0,"exp":"The three options given are to change the method of contraception (IUD or condoms), avoid enzyme inducers, or increase the dose of drugs like phenytoin and retigabine. (Book p14)"},{"id":"PHARM-C5-073","sec":"Clinical significance","page":14,"q":"Which two drugs are named as examples whose dose may be increased when an enzyme inducer is unavoidable?","opts":["Phenytoin and retigabine","Warfarin and digoxin","Rifampicin and isoniazid","Omeprazole and clopidogrel"],"ans":0,"exp":"The page gives phenytoin and retigabine as examples of drugs whose dose can be increased in the face of enzyme induction. (Book p14)"},{"id":"PHARM-C5-074","sec":"Clinical significance","page":14,"q":"A woman on rifampicin for tuberculosis on combined oral contraceptives experiences OCP failure because rifampicin:","opts":["Induces microsomal enzymes, accelerating estrogen metabolism","Inhibits microsomal enzymes, delaying estrogen metabolism","Kills gut bacteria and reduces enterohepatic circulation","Competes with estrogen at the receptor"],"ans":0,"exp":"Rifampicin is a classic enzyme inducer: it increases metabolism of the contraceptive steroids, reduces their plasma concentration and causes OCP failure. (Book p14)"},{"id":"PHARM-C5-075","sec":"Clinical significance","page":14,"q":"Erythromycin inhibits microsomal enzymes and therefore causes:","opts":["Theophylline toxicity, with ventricular arrhythmia and ventricular fibrillation","Theophylline failure","Digoxin failure","Reduced warfarin effect"],"ans":0,"exp":"The clinical significance box states erythromycin leads to theophylline toxicity presenting as ventricular arrhythmia and ventricular fibrillation. (Book p14)"},{"id":"PHARM-C5-076","sec":"Clinical significance","page":14,"q":"Clarithromycin, by enzyme inhibition, causes:","opts":["Statin toxicity","Statin failure","Theophylline failure","Reduced clopidogrel effect"],"ans":0,"exp":"The page pairs clarithromycin with statin toxicity - inhibition of statin metabolism raises levels and causes myopathy. (Book p14)"},{"id":"PHARM-C5-077","sec":"Clinical significance","page":14,"q":"A patient on a statin develops muscle pain after being prescribed clarithromycin. The mechanism is:","opts":["Enzyme inhibition raising statin plasma concentration","Enzyme induction lowering statin concentration","Reduced statin absorption from the gut","Displacement of statin from albumin"],"ans":0,"exp":"Clarithromycin inhibits microsomal enzymes, so the statin accumulates and toxicity (myopathy) follows - the stated clarithromycin-statin toxicity. (Book p14)"},{"id":"PHARM-C5-078","sec":"Clinical significance","page":14,"q":"A patient with asthma on theophylline presents with ventricular arrhythmia after starting erythromycin. The best explanation is:","opts":["Erythromycin inhibits theophylline metabolism, causing theophylline toxicity","Erythromycin induces theophylline metabolism, causing theophylline failure","Erythromycin displaces theophylline from albumin","Theophylline induces erythromycin metabolism"],"ans":0,"exp":"Erythromycin is an enzyme inhibitor; theophylline levels rise and toxicity manifests as ventricular arrhythmia and ventricular fibrillation. (Book p14)"},{"id":"PHARM-C5-079","sec":"Drug Interactions","page":14,"q":"Rifampicin and cimetidine differ in that rifampicin is an ______ while cimetidine is an ______.","opts":["Enzyme inducer; enzyme inhibitor","Enzyme inhibitor; enzyme inducer","Enzyme substrate; prodrug","Prodrug; enzyme substrate"],"ans":0,"exp":"Rifampicin appears in the inducer column and cimetidine in the inhibitor column of the drug interaction table. (Book p14)"},{"id":"PHARM-C5-080","sec":"Drug Interactions","page":14,"q":"Which statement about chronic versus acute alcohol is correct?","opts":["Chronic consumption induces enzymes causing drug failure, acute consumption inhibits enzymes causing drug toxicity","Chronic consumption inhibits enzymes while acute consumption induces them","Both chronic and acute consumption cause identical effects","Only acute consumption affects microsomal enzymes"],"ans":0,"exp":"Chronic alcohol is listed as an inducer (drug failure) and acute alcohol consumption as an inhibitor (drug toxicity). (Book p14)"},{"id":"PHARM-C6-001","sec":"Excretion","page":15,"q":"For a drug to be excreted it must be:","opts":["Ionised, water soluble and polar","Unionised, lipid soluble and non-polar","Protein bound and lipid soluble","Non-polar and unionised"],"ans":0,"exp":"The page opens by stating that the drug excreted is ionised/water soluble/polar - the opposite of the requirements for absorption. (Book p15)"},{"id":"PHARM-C6-002","sec":"Excretion","page":15,"q":"The major organ of excretion is the ______, while the major organ involved in metabolism is the ______.","opts":["Kidney; liver","Liver; kidney","Kidney; kidney","Lung; liver"],"ans":0,"exp":"Kidneys are marked m/c organ for excretion and the note on the right says the liver is the m/c organ involved in metabolism. (Book p15)"},{"id":"PHARM-C6-003","sec":"Excretion","page":15,"q":"Of the drug excreted by the kidney, filtration accounts for _____ while tubular secretion accounts for _____.","opts":["20%; 80%","80%; 20%","50%; 50%","10%; 90%"],"ans":0,"exp":"The table headings give filtration 20% and tubular secretion 80% - secretion is the larger renal route. (Book p15)"},{"id":"PHARM-C6-004","sec":"Renal excretion table","page":15,"q":"Unbound drug is excreted by:","opts":["Filtration (+); it is not handled by tubular secretion (-)","Tubular secretion (+); it is not filtered (-)","Both filtration and tubular secretion equally","Neither filtration nor secretion"],"ans":0,"exp":"In the table's unbound drug row, filtration is marked + and tubular secretion marked -. (Book p15)"},{"id":"PHARM-C6-005","sec":"Renal excretion table","page":15,"q":"Plasma protein bound drug is NOT filtered because of the:","opts":["Negative charge of the basement membrane","Positive charge of the basement membrane","Large size of the drug molecule","Presence of P-glycoprotein in the glomerulus"],"ans":0,"exp":"Filtration is marked negative for plasma protein (negatively charged) bound drug, explained in the table as due to the -ve charge of the basement membrane which repels it. (Book p15)"},{"id":"PHARM-C6-006","sec":"Renal excretion table","page":15,"q":"Plasma protein bound drug is excreted by:","opts":["Tubular secretion (+), while filtration is negative (-)","Filtration (+), while tubular secretion is negative (-)","Neither filtration nor tubular secretion","Only by saliva and sweat"],"ans":0,"exp":"For plasma protein bound drug the table marks tubular secretion + and filtration -, so secretion is the route that clears protein-bound drug. (Book p15)"},{"id":"PHARM-C6-007","sec":"Renal excretion table","page":15,"q":"Which statement summarising the renal excretion table is correct?","opts":["Unbound drug is filtered; protein-bound drug is secreted","Unbound drug is secreted; protein-bound drug is filtered","Both unbound and protein-bound drug are filtered","Neither unbound nor protein-bound drug is secreted"],"ans":0,"exp":"The table splits the two: filtration handles unbound drug (+, secretion -), while protein-bound drug is handled by tubular secretion (+, filtration -). (Book p15)"},{"id":"PHARM-C6-008","sec":"Excretion","page":15,"q":"Apart from the kidneys and liver, some drugs are excreted through:","opts":["Saliva and sweat","Bile only","Tears and cerebrospinal fluid","Lymph and synovial fluid"],"ans":0,"exp":"The page notes that some drugs are excreted through saliva and sweat. (Book p15)"},{"id":"PHARM-C6-009","sec":"Excretion","page":15,"q":"Filtration, being dependent on GFR, results in:","opts":["A constant rate of excretion","A rate proportional to plasma concentration","A decreasing rate of excretion","An exponential rate of excretion"],"ans":0,"exp":"The note states filtration is dependent on GFR and therefore gives a constant rate of excretion - the basis of zero-order elimination. (Book p15)"},{"id":"PHARM-C6-010","sec":"Rate of drug elimination","page":15,"q":"The rate of drug elimination (RDE) is defined as the:","opts":["Amount of drug eliminated per hour from the body","Fraction of drug removed per half-life","Amount of plasma cleared of drug per hour","Total drug excreted in 24 hours"],"ans":0,"exp":"RDE = amount of drug eliminated per hour from the body - a rate, not a fraction. (Book p15)"},{"id":"PHARM-C6-011","sec":"Rate of drug elimination","page":15,"q":"Rate of drug elimination is calculated as:","opts":["Plasma concentration x Clearance","Plasma concentration / Clearance","Clearance / Plasma concentration","Volume of distribution x Clearance"],"ans":0,"exp":"RDE = plasma concentration x clearance, so the rate of elimination rises with either higher plasma levels or higher clearance. (Book p15)"},{"id":"PHARM-C6-012","sec":"Rate of drug elimination","page":15,"q":"In the units given for the RDE equation, plasma concentration is expressed as mg/ml and clearance as ml/hr, so RDE is expressed in:","opts":["mg/hr","mg/ml","ml/hr","mg"],"ans":0,"exp":"The page spells out the units: RDE (mg/hr) = plasma concentration (mg/ml) x clearance (ml/hr). (Book p15)"},{"id":"PHARM-C6-013","sec":"Rate of drug elimination","page":15,"q":"Plasma concentration, as described here, is:","opts":["Concentration of drug present in each ml of plasma, i.e. mg/ml","Total amount of drug in the body in mg","Amount of plasma cleared per hour","Amount of drug eliminated per hour"],"ans":0,"exp":"Plasma conc = conc of drug present in each ml of plasma, i.e. mg/ml. (Book p15)"},{"id":"PHARM-C6-014","sec":"Rate of drug elimination","page":15,"q":"Drug clearance is defined as the:","opts":["Amount of plasma being cleared of the drug per hour","Amount of drug eliminated per hour","Volume of distribution divided by half-life","Concentration of drug in each ml of plasma"],"ans":0,"exp":"Drug clearance = amount of plasma being cleared of the drugs per hour, expressed in ml/hr. (Book p15)"},{"id":"PHARM-C6-015","sec":"Drug dosing","page":15,"q":"The two modes of drug dosing described are:","opts":["Continuous IV infusion and intermittent dosing","Oral and intravenous dosing","Loading dose and maintenance dose","Bolus and depot injection"],"ans":0,"exp":"Under drug dosing the page lists a. continuous IV infusion and b. intermittent dosing. (Book p15)"},{"id":"PHARM-C6-016","sec":"Continuous IV infusion","page":16,"q":"On the concentration-time curve of a continuous IV infusion, phase I is:","opts":["The slowly rising state (infusion), when absorption exceeds excretion","Steady state, when infusion rate equals elimination rate","The declining state, when excretion exceeds absorption","The phase of zero drug in plasma"],"ans":0,"exp":"Phase I is the slowly rising state of infusion; during it absorption exceeds excretion. (Book p16)"},{"id":"PHARM-C6-017","sec":"Continuous IV infusion","page":16,"q":"On the infusion concentration-time curve, phase II is the steady state at which:","opts":["Infusion rate equals the rate of drug elimination","Absorption exceeds excretion","Excretion exceeds absorption","Plasma concentration is falling exponentially"],"ans":0,"exp":"Phase II is labelled steady state plasma concentration with 'infusion rate = rate of drug elimination'. (Book p16)"},{"id":"PHARM-C6-018","sec":"Continuous IV infusion","page":16,"q":"Phase III of the concentration-time curve of an infusion is characterised by:","opts":["A declining state (elimination) in which excretion exceeds absorption","A slowly rising state with absorption exceeding excretion","A steady state with equal infusion and elimination","A second absorption peak"],"ans":0,"exp":"Phase III is the declining state (elimination), during which excretion exceeds absorption. (Book p16)"},{"id":"PHARM-C6-019","sec":"Continuous IV infusion","page":16,"q":"The infusion rate (dosing rate) is calculated as:","opts":["Plasma concentration x Clearance","Plasma concentration / Clearance","Clearance / Plasma concentration","Volume of distribution x Plasma concentration"],"ans":0,"exp":"Infusion rate = plasma concentration x clearance - simply the RDE equation applied at steady state. (Book p16)"},{"id":"PHARM-C6-020","sec":"Continuous IV infusion","page":16,"q":"How many half-lives are required to attain the steady state plasma concentration during an infusion?","opts":["4-5","1-2","2-3","10"],"ans":0,"exp":"The page states that 4-5 T1/2 are required to attain steady state plasma concentration. (Book p16)"},{"id":"PHARM-C6-021","sec":"Continuous IV infusion","page":16,"q":"According to the page, attainment of steady state depends on:","opts":["Volume of distribution","Bioavailability alone","The infusion volume","Protein binding"],"ans":0,"exp":"For continuous IV infusion the page states that steady state depends on volume of distribution. (Book p16)"},{"id":"PHARM-C6-022","sec":"Continuous IV infusion","page":16,"q":"At steady state during a constant infusion, if clearance rises while the infusion rate is unchanged, the plasma concentration will:","opts":["Fall, because infusion rate = PC x CL","Rise, because clearance adds drug to plasma","Remain identical because steady state is fixed","First rise and then stay constant"],"ans":0,"exp":"Rearranging infusion rate = PC x CL gives PC = infusion rate/CL, so for a fixed infusion rate a higher clearance yields a lower steady state concentration. (Book p16)"},{"id":"PHARM-C6-023","sec":"Intermittent dosing","page":16,"q":"Intermittent dosing is also known as:","opts":["Maintenance dose","Loading dose","Infusion rate","Steady state dose"],"ans":0,"exp":"Under intermittent dosing the page writes 'AKA maintenance dose'. (Book p16)"},{"id":"PHARM-C6-024","sec":"Intermittent dosing","page":16,"q":"The purpose of intermittent (maintenance) dosing is to:","opts":["Give the dose after a certain period of time to maintain the plasma concentration in a steady state","Rapidly achieve the target plasma concentration at the outset","Avoid the need for any loading dose","Eliminate the influence of clearance on therapy"],"ans":0,"exp":"Dose is given after a certain period of time to maintain plasma concentration in steady state - that is the maintenance dose. (Book p16)"},{"id":"PHARM-C6-025","sec":"Intermittent dosing","page":16,"q":"The maintenance dose is calculated as:","opts":["PC x CL x Time / f","PC x CL / f x Time","PC x f x Time / CL","CL x f x Time / PC"],"ans":0,"exp":"Maintenance dose = PC x CL x Time / f, with f the bioavailability. (Book p16)"},{"id":"PHARM-C6-026","sec":"Intermittent dosing","page":16,"q":"Unlike the loading dose, the maintenance dose depends on:","opts":["Clearance","Volume of distribution","Lean body mass","Protein binding"],"ans":0,"exp":"The page states intermittent (maintenance) dosing depends on clearance, whereas the loading dose was determined by volume of distribution. (Book p16)"},{"id":"PHARM-C6-027","sec":"Intermittent dosing","page":16,"q":"In the maintenance dose formula, f stands for bioavailability and its value for IV routes is:","opts":["1","0.75","0.5","0.05"],"ans":0,"exp":"The page notes f = bioavailability and f = 1 in IV routes, so no correction is needed for intravenous dosing. (Book p16)"},{"id":"PHARM-C6-028","sec":"Half life (T1/2)","page":16,"q":"Half life (T1/2) is defined as the time taken by a drug to:","opts":["Decrease by 50% in plasma","Be completely eliminated from the body","Reach its peak plasma concentration","Reach steady state during an infusion"],"ans":0,"exp":"T1/2 = time taken by a drug to decrease by 50% in plasma. (Book p16)"},{"id":"PHARM-C6-029","sec":"Half life (T1/2)","page":16,"q":"Half life is calculated as:","opts":["0.693 x vd / CL","0.693 x CL / vd","CL x vd / 0.693","vd / (0.693 x CL)"],"ans":0,"exp":"T1/2 = 0.693 x vd/CL; equivalently T1/2 = 0.693/Kel. (Book p16)"},{"id":"PHARM-C6-030","sec":"Half life (T1/2)","page":16,"q":"Half life is proportional to:","opts":["Volume of distribution divided by clearance","Clearance divided by volume of distribution","Volume of distribution multiplied by clearance","Clearance alone"],"ans":0,"exp":"T1/2 is proportional to vd/CL - a drug with a large vd or a low clearance has a long half-life. (Book p16)"},{"id":"PHARM-C6-031","sec":"Half life (T1/2)","page":16,"q":"The elimination constant (Kel) is given by:","opts":["CL / vd","vd / CL","CL x vd","0.693 x vd / CL"],"ans":0,"exp":"Elimination constant (Kel) = CL/vd - the reciprocal of the relationship used for T1/2. (Book p16)"},{"id":"PHARM-C6-032","sec":"Half life (T1/2)","page":16,"q":"If the volume of distribution of a drug increases while clearance remains unchanged, the half-life will:","opts":["Increase, because T1/2 = 0.693 x vd/CL","Decrease, because more drug leaves the plasma","Remain unchanged, since T1/2 depends only on clearance","Become equal to the elimination constant"],"ans":0,"exp":"Since T1/2 = 0.693 x vd/CL, a larger volume of distribution with the same clearance lengthens the half-life. (Book p16)"},{"id":"PHARM-C6-033","sec":"Kinetics of drug elimination","page":17,"q":"Zero order kinetics means elimination of:","opts":["A constant amount of drug per hour","A constant proportion of drug per hour","An exponentially increasing amount per hour","An amount proportional to plasma concentration"],"ans":0,"exp":"Zero order kinetics = constant amount of drug eliminated per hour; first order = constant proportion of drug per hour. (Book p17)"},{"id":"PHARM-C6-034","sec":"Kinetics of drug elimination","page":17,"q":"In the equation RDE = (PC)^n x CL, the value of n for zero order and first order kinetics respectively is:","opts":["0 and 1","1 and 0","0 and 0","1 and 1"],"ans":0,"exp":"The table gives n = 0 for zero order kinetics and n = 1 for first order kinetics. (Book p17)"},{"id":"PHARM-C6-035","sec":"Kinetics of drug elimination","page":17,"q":"When the dose and clearance are constant, the rate of drug elimination is:","opts":["Constant in zero order kinetics and proportional to plasma concentration in first order kinetics","Proportional to plasma concentration in zero order and constant in first order","Constant in both zero and first order kinetics","Proportional to plasma concentration in both orders of kinetics"],"ans":0,"exp":"With a constant dose the table gives RDE = constant for zero order, while in first order RDE is proportional to plasma concentration. (Book p17)"},{"id":"PHARM-C6-036","sec":"Kinetics of drug elimination","page":17,"q":"If the dose is increased, the half-life in zero order kinetics and first order kinetics respectively:","opts":["Increases in zero order; remains constant in first order","Remains constant in zero order; increases in first order","Increases in both zero and first order kinetics","Decreases in zero order; remains constant in first order"],"ans":0,"exp":"The 'if dose increases' row shows T1/2 rising (upward arrow) for zero order but remaining constant in first order; clearance stays constant in both. (Book p17)"},{"id":"PHARM-C6-037","sec":"Kinetics of drug elimination","page":17,"q":"With increasing dose, the rise in plasma concentration is disproportionate with a risk of toxicity in zero order kinetics, whereas in first order kinetics the rise is:","opts":["Proportionate","Also disproportionate","Absent","Greater than in zero order"],"ans":0,"exp":"In zero order, an increase in plasma concentration is disproportionate (risk of toxicity); in first order it is proportionate. (Book p17)"},{"id":"PHARM-C6-038","sec":"Kinetics of drug elimination","page":17,"q":"Zero and first order kinetics are seen in drugs showing:","opts":["Early saturation of elimination and late saturation of elimination respectively","Late saturation of elimination and early saturation of elimination respectively","No saturation of elimination at all","Saturation of absorption only"],"ans":0,"exp":"The table links zero order kinetics to early saturation of elimination and first order kinetics to late saturation of elimination. (Book p17)"},{"id":"PHARM-C6-039","sec":"Kinetics of drug elimination","page":17,"q":"Zero order drugs at LOWER doses follow first order kinetics until saturation. This behaviour is therefore also called:","opts":["Pseudozero order","Pseudo-first order","Mixed order elimination","Zero order saturation"],"ans":0,"exp":"The exception row reads: at lower doses such drugs follow first order kinetics until saturation - hence aka pseudozero order. (Book p17)"},{"id":"PHARM-C6-040","sec":"Kinetics of drug elimination","page":17,"q":"Drugs that follow first order kinetics at HIGHER doses:","opts":["Follow zero order after saturation","Become pseudozero order at low doses","Show a disproportionate rise in plasma concentration","Show a rising half-life with increasing dose"],"ans":0,"exp":"The table's exception row for first order kinetics states that at higher doses the drug follows zero order after saturation. (Book p17)"},{"id":"PHARM-C6-041","sec":"Zero order drugs","page":17,"q":"Which of the following drugs are given as examples of zero order kinetics?","opts":["Alcohol, theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin","Paracetamol, digoxin, amoxicillin and metformin","Atropine, adrenaline, dopamine and dobutamine","Aspirin, ibuprofen, naproxen and diclofenac"],"ans":0,"exp":"The zero order example list is alcohol (true zero order), theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin. (Book p17)"},{"id":"PHARM-C6-042","sec":"First order drugs","page":17,"q":"Most drugs follow which kinetics?","opts":["First order","Zero order","Pseudozero order","Mixed order"],"ans":0,"exp":"The examples column for first order kinetics says simply 'most drugs'. (Book p17)"},{"id":"PHARM-C6-043","sec":"Zero order drugs","page":17,"q":"A patient on phenytoin has the dose increased slightly and develops toxicity with a very high plasma level. This is because phenytoin follows:","opts":["Zero order kinetics, so elimination is already saturated and plasma concentration rises disproportionately","First order kinetics, so plasma concentration rises proportionately","First order kinetics with a shortened half-life","Renal excretion dependent on GFR"],"ans":0,"exp":"Phenytoin is listed among zero order drugs (early saturation of elimination), so a small dose increment produces a disproportionate rise in plasma concentration with risk of toxicity. (Book p17)"},{"id":"PHARM-C6-044","sec":"Zero order drugs","page":17,"q":"Which drug is specifically labelled as 'true zero order' in the examples list?","opts":["Alcohol","Phenytoin","Warfarin","Heparin"],"ans":0,"exp":"The example list annotates alcohol as true zero order; phenytoin, theophylline, tolbutamide, heparin, methanol and warfarin are also in the zero order list. (Book p17)"},{"id":"PHARM-C6-045","sec":"Zero order drugs","page":17,"q":"Which anticoagulants appear in the zero order kinetics list?","opts":["Heparin and warfarin","Heparin and enoxaparin","Warfarin and dabigatran","Only heparin"],"ans":0,"exp":"Both heparin and warfarin are listed among zero order drugs, unlike most drugs which follow first order kinetics. (Book p17)"},{"id":"PHARM-C7-001","sec":"Affinity, Efficacy and Potency","page":18,"q":"Affinity of a drug refers to its:","opts":["Tendency to bind to the target","Maximum effect produced at the target","Relative dose required for a given effect","Duration of action at the receptor"],"ans":0,"exp":"In the flowchart, 'drug binds to target' corresponds to tendency to bind = affinity. (Book p18)"},{"id":"PHARM-C7-002","sec":"Affinity, Efficacy and Potency","page":18,"q":"Efficacy of a drug is defined as the:","opts":["Maximum effect produced","Tendency of the drug to bind its target","Relative dose needed to produce an effect","Safety of the drug in a population"],"ans":0,"exp":"The flowchart links 'produces effect' to the maximum effect produced, i.e. efficacy - which the book marks as clinically most important. (Book p18)"},{"id":"PHARM-C7-003","sec":"Affinity, Efficacy and Potency","page":18,"q":"Of affinity, efficacy and potency, which is described as clinically most important?","opts":["Efficacy","Affinity","Potency","All three are equally important"],"ans":0,"exp":"The page marks efficacy with the note 'clinically most important', because it decides the maximum benefit a drug can give. (Book p18)"},{"id":"PHARM-C7-004","sec":"Affinity, Efficacy and Potency","page":18,"q":"Potency of a drug refers to the:","opts":["Relative dose of a drug required to produce a particular effect","Maximum effect the drug can produce","Tendency to bind to its receptor","Therapeutic index of the drug"],"ans":0,"exp":"Potency = relative dose of a drug required to produce a particular effect. (Book p18)"},{"id":"PHARM-C7-005","sec":"Affinity, Efficacy and Potency","page":18,"q":"A drug that produces the same effect at a LOWER dose is said to have:","opts":["Higher potency","Higher efficacy","Higher affinity but lower potency","A higher therapeutic index"],"ans":0,"exp":"The lesser the dose needed to bring about the effect, the greater the potency - potency and dose requirement are inversely related. (Book p18)"},{"id":"PHARM-C7-006","sec":"Affinity, Efficacy and Potency","page":18,"q":"Which statement about potency and efficacy is correct?","opts":["Potency is a matter of dose, efficacy is a matter of the maximum response attainable","Potency is the maximum response and efficacy is the dose required","Both describe the same property of a drug","Both are independent of dose and response"],"ans":0,"exp":"Potency concerns the dose needed for a given effect, while efficacy is the maximum effect produced - two separate properties. (Book p18)"},{"id":"PHARM-C7-007","sec":"Quantal DRC","page":18,"q":"A quantal dose response curve records a response which is:","opts":["Binary (present/absent)","Graded and quantified","Continuous with dose","Inversely related to dose"],"ans":0,"exp":"Quantal DRC: response is binary (present/absent), e.g. sedatives and fertility drugs, and is studied in a population. (Book p18)"},{"id":"PHARM-C7-008","sec":"Quantal DRC","page":18,"q":"Which drugs are given as examples for a quantal response?","opts":["Sedatives and fertility drugs","Drugs modifying blood pressure and heart rate","Drugs lowering blood glucose","Diuretics and antihypertensives"],"ans":0,"exp":"The examples given under quantal DRC are sedatives and fertility drugs, where the effect either occurs or does not. (Book p18)"},{"id":"PHARM-C7-009","sec":"Quantal DRC","page":18,"q":"The quantal dose response curve is studied in:","opts":["A population","An individual","An isolated tissue only","A single receptor preparation"],"ans":0,"exp":"The quantal DRC is studied in a population, in contrast to the graded DRC which is studied in an individual. (Book p18)"},{"id":"PHARM-C7-010","sec":"Quantal DRC","page":18,"q":"ED50 is the dose at which 50% of the population experiences:","opts":["Therapeutic effects","Toxic effects","Lethal effects","No effect at all"],"ans":0,"exp":"ED50 is the dose at which 50% of the population experiences therapeutic effects. (Book p18)"},{"id":"PHARM-C7-011","sec":"Quantal DRC","page":18,"q":"TD50 is the dose at which 50% of the population experiences:","opts":["Toxic effects","Therapeutic effects","Lethal effects on animals","Submaximal effects"],"ans":0,"exp":"TD50 is the dose at which 50% of the population experiences toxic effects. (Book p18)"},{"id":"PHARM-C7-012","sec":"Quantal DRC","page":18,"q":"LD50 is the dose at which 50% experience:","opts":["Lethal effects on animals","Toxic effects in humans","Therapeutic effects","Receptor blockade"],"ans":0,"exp":"LD50 is the dose at which 50% of animals experience lethal effects. (Book p18)"},{"id":"PHARM-C7-013","sec":"Quantal DRC","page":18,"q":"In the quantal DRC table, ED50 is used as a marker of:","opts":["Potency","Toxicity","Efficacy","Affinity"],"ans":0,"exp":"The table marks ED50 as the marker of potency; TD50 and LD50 are markers of toxicity. (Book p18)"},{"id":"PHARM-C7-014","sec":"Quantal DRC","page":18,"q":"Which parameters are used as markers of toxicity in the quantal DRC?","opts":["TD50 and LD50","ED50 and TD50","ED50 only","LD50 only, since TD50 is not used"],"ans":0,"exp":"The marker column shows potency opposite ED50 and toxicity opposite both TD50 and LD50. (Book p18)"},{"id":"PHARM-C7-015","sec":"Quantal DRC","page":18,"q":"On the quantal dose response graph, response in % of population is plotted against:","opts":["Log dose","Plasma concentration","Time","Receptor occupancy"],"ans":0,"exp":"The graph plots response in % population on the y-axis against log dose on the x-axis, with therapeutic, toxic and lethal curves and the ED50, TD50 and LD50 marked at the 50% line. (Book p18)"},{"id":"PHARM-C7-016","sec":"Quantal DRC","page":18,"q":"On the quantal graph, the curve lying to the LEFT is that of:","opts":["Therapeutic effects","Toxicity","Lethal effects","Inverse agonist effect"],"ans":0,"exp":"The therapeutic effects curve is leftmost since lower doses produce benefit, with toxicity and then lethal effects appearing further to the right. (Book p18)"},{"id":"PHARM-C7-017","sec":"Quantal DRC","page":18,"q":"The lethal effects curve on the quantal graph is:","opts":["Furthest to the right, because animals die only at the highest doses","Leftmost, because death occurs at low doses","Identical to the therapeutic curve","Absent, because lethality is not studied"],"ans":0,"exp":"With log dose on the x-axis, lethal effects (in animals) appear furthest right, after the toxic effects curve. (Book p18)"},{"id":"PHARM-C7-018","sec":"Therapeutic Index","page":18,"q":"Therapeutic index (TI) is a measurement of:","opts":["The safety of a drug","The potency of a drug","The efficacy of a drug","The affinity of a drug"],"ans":0,"exp":"The page describes TI as measurement of the safety of a drug. (Book p18)"},{"id":"PHARM-C7-019","sec":"Therapeutic Index","page":18,"q":"In HUMANS the therapeutic index is calculated as:","opts":["TD50/ED50","LD50/ED50","ED50/TD50","TD50 x ED50"],"ans":0,"exp":"The book gives humans: TD50/ED50 and animals: LD50/ED50 for the therapeutic index. (Book p18)"},{"id":"PHARM-C7-020","sec":"Therapeutic Index","page":18,"q":"In ANIMALS the therapeutic index is calculated as:","opts":["LD50/ED50","TD50/ED50","ED50/LD50","LD50 x ED50"],"ans":0,"exp":"For animals the therapeutic index is LD50/ED50, whereas in humans it is TD50/ED50. (Book p18)"},{"id":"PHARM-C7-021","sec":"Therapeutic Index","page":18,"q":"A drug with a LOW therapeutic index:","opts":["Is safe only in a narrow dosage range and has an increased chance of toxicity","Is safe over a wide dosage range","Has high efficacy but low potency","Cannot produce toxicity at any dose"],"ans":0,"exp":"Low TI means the drug is safe only in a narrow dosage range, with an increased chance of toxicity - lithium is the example given. (Book p18)"},{"id":"PHARM-C7-022","sec":"Therapeutic Index","page":18,"q":"A drug with a HIGH therapeutic index is:","opts":["Safe in a wide dosage range","Safe only in a narrow dosage range","Associated with frequent toxicity","Shown by lithium"],"ans":0,"exp":"High TI means the drug is safe in a wide dosage range; low TI (lithium) means safety only in a narrow range. (Book p18)"},{"id":"PHARM-C7-023","sec":"Therapeutic Index","page":18,"q":"Which drug is quoted as the example of a low therapeutic index?","opts":["Lithium","Paracetamol","Penicillin","Atenolol"],"ans":0,"exp":"Lithium is the example given for a low TI, which is why its plasma levels must be monitored. (Book p18)"},{"id":"PHARM-C7-024","sec":"Therapeutic window","page":18,"q":"In the lithium concentration-time curve, the therapeutic window lies between:","opts":["0.6 meq/L and 1.5 meq/L","0.6 meq/L and 3.0 meq/L","1.5 meq/L and 3.0 meq/L","0.1 meq/L and 0.6 meq/L"],"ans":0,"exp":"The figure marks lithium's therapeutic window from 0.6 meq/L (minimum effective concentration) up to 1.5 meq/L (minimum toxic concentration). (Book p18)"},{"id":"PHARM-C7-025","sec":"Therapeutic window","page":18,"q":"The lower boundary of the therapeutic window is the:","opts":["Minimum effective concentration","Minimum toxic concentration","Maximum effective concentration","Steady state concentration"],"ans":0,"exp":"The lower dashed line is the minimum effective concentration - below it there is no effect. (Book p18)"},{"id":"PHARM-C7-026","sec":"Therapeutic window","page":18,"q":"The upper boundary of the therapeutic window is the:","opts":["Minimum toxic concentration","Minimum effective concentration","Maximum safe dose","Peak plasma concentration"],"ans":0,"exp":"The upper dashed line is the minimum toxic concentration; above it, toxicity occurs. (Book p18)"},{"id":"PHARM-C7-027","sec":"Therapeutic window","page":18,"q":"In the therapeutic window figure, the zone below the minimum effective concentration of lithium is labelled:","opts":["No effect","Toxicity","Therapeutic window","Steady state"],"ans":0,"exp":"The grey zone below 0.6 meq/L is labelled 'no effect', the green zone is the therapeutic window and the red zone above 1.5 meq/L is toxicity. (Book p18)"},{"id":"PHARM-C7-028","sec":"Therapeutic window","page":18,"q":"What is the plasma concentration range of lithium that is toxic?","opts":["Above 1.5 meq/L","Below 0.6 meq/L","Between 0.6 and 1.5 meq/L","Above 0.6 meq/L"],"ans":0,"exp":"Plasma lithium above the minimum toxic concentration of 1.5 meq/L lies in the toxicity band of the figure. (Book p18)"},{"id":"PHARM-C7-029","sec":"Therapeutic window","page":18,"q":"The therapeutic window is best defined as the:","opts":["Range of plasma concentration between the minimum effective and minimum toxic concentrations","Ratio of TD50 to ED50","Dose at which 50% of a population responds","Range of doses with no effect"],"ans":0,"exp":"The figure shows the therapeutic window as the band of plasma concentration between the minimum effective concentration and the minimum toxic concentration. (Book p18)"},{"id":"PHARM-C7-030","sec":"Graded DRC","page":19,"q":"A graded (quantified) response is seen with drugs modifying:","opts":["Blood pressure, heart rate and blood glucose levels","Sedation in a population","Fertility in a population","Lethality in animals"],"ans":0,"exp":"Graded response = quantified response, e.g. drugs modifying BP, HR and blood glucose levels, and it is studied in an individual. (Book p19)"},{"id":"PHARM-C7-031","sec":"Graded DRC","page":19,"q":"The graded dose response curve is studied in:","opts":["An individual","A population","An isolated receptor only","Animals only"],"ans":0,"exp":"The graded DRC is studied in an individual, whereas the quantal DRC is studied in a population. (Book p19)"},{"id":"PHARM-C7-032","sec":"Graded DRC","page":19,"q":"On the graded DRC, the response is plotted on the y-axis and ______ on the x-axis.","opts":["Log dose","Log time","Percentage of population","Plasma clearance"],"ans":0,"exp":"The graded DRC graph plots response (0-100) against log dose, with the three sigmoid curves of drugs A, B and C. (Book p19)"},{"id":"PHARM-C7-033","sec":"Graded DRC","page":19,"q":"In the graded DRC table, efficacy is described as:","opts":["Determined by response, the more the height the greater the efficacy","Determined by the dose, the further left the greater the efficacy","Comparable only between parallel lines","More to the right meaning greater potency"],"ans":0,"exp":"Efficacy is read off the height of the curve: more the height, greater the efficacy, giving the comparative order B > A > C. (Book p19)"},{"id":"PHARM-C7-034","sec":"Graded DRC","page":19,"q":"According to the graded DRC table, the comparative order of efficacy is:","opts":["B > A > C","A > B > C","PA > PB > PC","C > A > B"],"ans":0,"exp":"The table's comparative column for efficacy reads B > A > C, following the heights of the three curves. (Book p19)"},{"id":"PHARM-C7-035","sec":"Graded DRC","page":19,"q":"In the graded DRC table, potency is determined by:","opts":["A lesser dose producing the same effect - the more to the left, the greater the potency","The maximum height of the curve","The slope of the curve","Comparison between non-parallel lines"],"ans":0,"exp":"Potency: lesser dose for the same effect means greater potency, and graphically 'more to the left = higher potency'. (Book p19)"},{"id":"PHARM-C7-036","sec":"Graded DRC","page":19,"q":"The comparative order of potency in the graded DRC table is:","opts":["PA > PB > PC","PB > PA > PC","PC > PB > PA","A > B > C"],"ans":0,"exp":"The comparative column for potency reads PA > PB > PC, i.e. drug A is the most potent because its curve lies furthest left. (Book p19)"},{"id":"PHARM-C7-037","sec":"Graded DRC","page":19,"q":"On the graded DRC, drug A is:","opts":["The most potent (leftmost) but not the most efficacious","The most efficacious (highest) but not the most potent","Both the most potent and the most efficacious","The least potent and the least efficacious"],"ans":0,"exp":"Drug A lies furthest left (highest potency, PA > PB > PC) while drug B gives the greatest height (highest efficacy, B > A > C). (Book p19)"},{"id":"PHARM-C7-038","sec":"Graded DRC","page":19,"q":"On the graded DRC, drug B has:","opts":["The greatest efficacy","The greatest potency","The greatest affinity","The lowest efficacy"],"ans":0,"exp":"Efficacy follows the height of the curve, and B has the greatest height, giving the order B > A > C for efficacy. (Book p19)"},{"id":"PHARM-C7-039","sec":"Graded DRC","page":19,"q":"In the graded DRC table, affinity is described as:","opts":["Comparable between drugs of the same mechanism of action","Comparable between drugs of different mechanisms of action","Determined by the height of the curve","Independent of the position of the curve"],"ans":0,"exp":"Affinity is comparable between drugs of the same MOA, and only between parallel lines; more to the left means higher affinity. (Book p19)"},{"id":"PHARM-C7-040","sec":"Graded DRC","page":19,"q":"As per the affinity column, affinity can be compared only between:","opts":["Parallel lines","Non-parallel lines","The highest curves","The leftmost curves"],"ans":0,"exp":"The table notes affinity is comparable between drugs of the same MOA - determined graphically 'only comparable between parallel lines'. (Book p19)"},{"id":"PHARM-C7-041","sec":"Graded DRC","page":19,"q":"In the graded DRC table, the comparative order of affinity is:","opts":["A > B, because drug C is not parallel","B > A > C","PA > PB > PC","C > A > B"],"ans":0,"exp":"With C not parallel to the others, affinity can only be compared between A and B - the table gives A > B. (Book p19)"},{"id":"PHARM-C7-042","sec":"Graded DRC","page":19,"q":"Drug C in the graded DRC is excluded from the affinity comparison because:","opts":["C is not parallel to the other curves","C has the lowest efficacy","C is the least potent","C is an antagonist"],"ans":0,"exp":"The affinity column states the comparison holds only between parallel lines, and the table records 'A > B (C is not parallel)'. (Book p19)"},{"id":"PHARM-C7-043","sec":"Graded DRC","page":19,"q":"Which statement correctly distinguishes efficacy from potency on a graded DRC?","opts":["Efficacy is judged by the height of the curve and potency by its position on the x-axis","Efficacy is judged by the position and potency by the height","Both are judged by the height of the curve","Both are judged by the slope of the curve"],"ans":0,"exp":"Height of the curve gives efficacy, while position along the log dose axis gives potency - the further left, the more potent. (Book p19)"},{"id":"PHARM-C7-044","sec":"Drug Receptor Interactions","page":19,"q":"The effect of a full agonist upon binding to its receptor is:","opts":["Maximum effect","Submaximal effect","No effect","Opposite to the nature of the receptor"],"ans":0,"exp":"The drug receptor interaction table gives full agonists a maximum effect (curve A). (Book p19)"},{"id":"PHARM-C7-045","sec":"Drug Receptor Interactions","page":19,"q":"The effect of a partial agonist upon binding to its receptor is:","opts":["Submaximal effect","Maximum effect","No effect","Opposite effect"],"ans":0,"exp":"Partial agonists produce a submaximal effect (curve B), less than a full agonist whatever the dose. (Book p19)"},{"id":"PHARM-C7-046","sec":"Drug Receptor Interactions","page":19,"q":"An antagonist, upon binding to its receptor, produces:","opts":["No effect","Maximum effect","Submaximal effect","An effect opposite to the receptor's nature"],"ans":0,"exp":"Antagonists have no effect of their own upon binding (curve C) - their action is seen only in the presence of an agonist. (Book p19)"},{"id":"PHARM-C7-047","sec":"Drug Receptor Interactions","page":19,"q":"An inverse agonist, upon binding to its receptor, produces:","opts":["An effect opposite to the nature of the receptor","No effect","A submaximal effect","A maximal effect"],"ans":0,"exp":"The inverse agonist produces an effect opposite to the nature of the receptors (curve D), falling below the baseline of no effect. (Book p19)"},{"id":"PHARM-C7-048","sec":"Drug Receptor Interactions","page":19,"q":"In terms of net effect in the body when endogenous full agonists are present, a partial agonist produces:","opts":["Mild antagonism (opposite effect)","Moderate antagonism","Severe antagonism","No antagonism at all"],"ans":0,"exp":"With endogenous full agonists present, partial agonists give mild antagonism, antagonists moderate antagonism and inverse agonists severe antagonism. (Book p19)"},{"id":"PHARM-C7-049","sec":"Drug Receptor Interactions","page":19,"q":"Which agent produces moderate antagonism of endogenous full agonists?","opts":["Antagonist","Partial agonist","Inverse agonist","Full agonist"],"ans":0,"exp":"The table's net effect row reads: partial agonist - mild antagonism, antagonist - moderate antagonism, inverse agonist - severe antagonism. (Book p19)"},{"id":"PHARM-C7-050","sec":"Drug Receptor Interactions","page":19,"q":"Which agent produces severe antagonism of endogenous full agonists?","opts":["Inverse agonist","Antagonist","Partial agonist","Full agonist"],"ans":0,"exp":"Inverse agonists produce an effect opposite to the receptor's nature, which in the presence of endogenous full agonists amounts to severe antagonism. (Book p19)"},{"id":"PHARM-C7-051","sec":"Drug Receptor Interactions","page":19,"q":"Intrinsic efficacy, the mathematical representation of efficacy, for a FULL agonist is:","opts":["+1","0","Between 1 and 0","-1"],"ans":0,"exp":"The table assigns intrinsic efficacy +1 to full agonists, between 1 and 0 to partial agonists, 0 to antagonists and -1 to inverse agonists. (Book p19)"},{"id":"PHARM-C7-052","sec":"Drug Receptor Interactions","page":19,"q":"The intrinsic efficacy of a partial agonist lies:","opts":["Between 1 and 0","Exactly 1","Exactly 0","Exactly -1"],"ans":0,"exp":"Partial agonists have an intrinsic efficacy between 1 and 0 - more than an antagonist but less than a full agonist. (Book p19)"},{"id":"PHARM-C7-053","sec":"Drug Receptor Interactions","page":19,"q":"The intrinsic efficacy of an antagonist is:","opts":["0","+1","-1","Between 1 and 0"],"ans":0,"exp":"Antagonists have an intrinsic efficacy of 0, which corresponds to producing no effect upon binding. (Book p19)"},{"id":"PHARM-C7-054","sec":"Drug Receptor Interactions","page":19,"q":"The intrinsic efficacy of an inverse agonist is:","opts":["-1","0","+1","Between 1 and 0"],"ans":0,"exp":"Inverse agonists are given an intrinsic efficacy of -1, matching their effect opposite to the nature of the receptor. (Book p19)"},{"id":"PHARM-C7-055","sec":"Drug Receptor Interactions","page":19,"q":"On the dose-response figure of drug receptor interactions, the curve that dips below the baseline of no effect represents:","opts":["Inverse agonist (D)","Full agonist (A)","Partial agonist (B)","Antagonist (C)"],"ans":0,"exp":"Curve A is maximal (full agonist), B submaximal (partial agonist), C flat at no effect (antagonist) and D falls to the opposite effect (inverse agonist). (Book p19)"},{"id":"PHARM-C7-056","sec":"Drug Receptor Interactions","page":19,"q":"On the drug receptor interaction graph, the flat line at the level of no effect represents:","opts":["Antagonist (C)","Partial agonist (B)","Inverse agonist (D)","Full agonist (A)"],"ans":0,"exp":"Curve C stays at 'no effect' across the dose range - the antagonist, which produces no action of its own. (Book p19)"},{"id":"PHARM-C7-057","sec":"Drug Receptor Interactions","page":19,"q":"According to the note on this page, the type of drug most commonly used among these is:","opts":["Antagonists","Full agonists","Partial agonists","Inverse agonists"],"ans":0,"exp":"The note box states that antagonists are the m/c used, even though they produce no effect of their own. (Book p19)"},{"id":"PHARM-C7-058","sec":"Drug Receptor Interactions","page":19,"q":"Which pair of agents and intrinsic efficacy is correctly matched?","opts":["Partial agonist - between 1 and 0","Full agonist - 0","Antagonist - -1","Inverse agonist - +1"],"ans":0,"exp":"Correct values are +1 for full agonists, between 1 and 0 for partial agonists, 0 for antagonists and -1 for inverse agonists. (Book p19)"},{"id":"PHARM-C7-059","sec":"Drug Receptor Interactions","page":19,"q":"A patient on a full agonist for asthma is given a partial agonist at the same receptor. Which effect is expected?","opts":["Mild antagonism, because the partial agonist produces only a submaximal effect","Severe antagonism with complete loss of effect","No change, because both are agonists","An effect opposite to the receptor's nature"],"ans":0,"exp":"With an endogenous full agonist present, a partial agonist produces only a submaximal effect and therefore mild antagonism. (Book p19)"},{"id":"PHARM-C7-060","sec":"Drug Receptor Interactions","page":19,"q":"Comparing curves, which statement about a full versus a partial agonist is correct?","opts":["A full agonist reaches a maximal effect while a partial agonist plateaus at a submaximal effect","A partial agonist reaches a maximal effect while a full agonist is submaximal","Both reach the same maximal effect at different doses","Neither can be compared on a graded dose response curve"],"ans":0,"exp":"In the figure, A (full agonist) rises to maximal, B (partial agonist) plateaus at submaximal, C (antagonist) stays at no effect and D (inverse agonist) moves to the opposite effect. (Book p19)"}];
const UNITS = [{"id":"PHARM-U1-1","ch":1,"n":1,"title":"PK vs PD: The Two Definitions","sec":"INTRODUCTION TO PHARMACOKINETICS AND PHARMACODYNAMICS · p1","qs":["PHARM-C1-001","PHARM-C1-002","PHARM-C1-003","PHARM-C1-004"],"guide":"Pharmacokinetics is the study of a drug's movement through the body after intake by any route; pharmacodynamics is the change the drug induces in the body. The figure flags absorption, distribution, metabolism and excretion as the kinetic processes, and the drug, its binding to the target and the resulting effect as the dynamic events."},{"id":"PHARM-U1-2","ch":1,"n":2,"title":"Absorption → Distribution → Adipose","sec":"Course of drug through the body · p1","qs":["PHARM-C1-005","PHARM-C1-006","PHARM-C1-007","PHARM-C1-008","PHARM-C1-009","PHARM-C1-010","PHARM-C1-011","PHARM-C1-012","PHARM-C1-013"],"guide":"An oral drug is absorbed into the systemic circulation and may be distributed to adipose tissue — some drugs by redistribution. Adipose-seeking drugs are very short acting, highly lipid soluble and cross the BBB, like the anaesthetics propofol and thiopentone."},{"id":"PHARM-U1-3","ch":1,"n":3,"title":"Binding, Metabolism & Excretion","sec":"Course of drug through the body · p1","qs":["PHARM-C1-014","PHARM-C1-015","PHARM-C1-016","PHARM-C1-017","PHARM-C1-018","PHARM-C1-019","PHARM-C1-020","PHARM-C1-021","PHARM-C1-022"],"guide":"The circulating drug binds its target — most drugs bind reversibly — and the effect follows; breakdown of the bond frees the drug back into the circulation. The liver then breaks the remaining drug down to a water-soluble form, which is excreted mostly via the kidney and partly via the gut."},{"id":"PHARM-U2-1","ch":2,"n":1,"title":"Absorption: Four Transport Mechanisms","sec":"Absorption · p2","qs":["PHARM-C2-001","PHARM-C2-002","PHARM-C2-003","PHARM-C2-004","PHARM-C2-005","PHARM-C2-006","PHARM-C2-007","PHARM-C2-008","PHARM-C2-009","PHARM-C2-010","PHARM-C2-011","PHARM-C2-012","PHARM-C2-013","PHARM-C2-014","PHARM-C2-015"],"guide":"Drugs cross the biological membrane by four routes: filtration through pores (subcutaneous insulin), simple/passive diffusion (the commonest, along the concentration gradient), facilitated diffusion via carriers such as GLUT receptors, and ATP-dependent active transport via SGLT receptors - SGLT-1 in the small intestine and SGLT-2 in renal tubules. Filtration, simple diffusion and facilitated diffusion need no ATP; only active transport is independent of the concentration gradient, and the P-glycoprotein (MDR1) pump, the commonest ABC pump, is the prototype efflux transporter."},{"id":"PHARM-U2-2","ch":2,"n":2,"title":"P-gp in Gut and Liver: Efflux and First Pass","sec":"Function · p3","qs":["PHARM-C2-016","PHARM-C2-017","PHARM-C2-018"],"guide":"In the small intestine and liver the P-glycoprotein pump sits on the epithelial cell and pushes absorbed drug back into the lumen - efflux. Some drugs are thereby excreted before ever reaching the systemic circulation, which is why this is labelled first pass metabolism, and digoxin dosage is calculated from the amount lost this way."},{"id":"PHARM-U2-3","ch":2,"n":3,"title":"Crossing Barriers: BBB, Placenta, Hepatocytes","sec":"Blood Brain Barrier (BBB) · p3","qs":["PHARM-C2-019","PHARM-C2-020","PHARM-C2-021","PHARM-C2-022","PHARM-C2-023","PHARM-C2-024"],"guide":"MDR1 pumps are placed at every barrier of the body. Loperamide, an opioid acting on the GIT for diarrhoea, cannot enter the brain because BBB MDR1 pumps eject it - and water solubility is another reason drugs fail to cross the BBB. Placental MDR1 pumps keep certain drugs away from the fetus, and hepatocyte MDR1 pumps mediate bile acid excretion."},{"id":"PHARM-U2-4","ch":2,"n":4,"title":"P-gp and Drug Resistance","sec":"In bacteria/tumour cell · p3","qs":["PHARM-C2-025","PHARM-C2-026"],"guide":"A bacterial or tumour cell that develops a Pgp pump effluxes the drug out of the cell, lowering the intracellular concentration, and so becomes resistant. This single flowchart explains multidrug resistance in infections and in cancer chemotherapy."},{"id":"PHARM-U2-5","ch":2,"n":5,"title":"P-gp Substrates, Inducers and Inhibitors","sec":"Pharmacological significance · p4","qs":["PHARM-C2-027","PHARM-C2-028","PHARM-C2-029","PHARM-C2-030","PHARM-C2-031","PHARM-C2-032","PHARM-C2-033","PHARM-C2-034","PHARM-C2-035"],"guide":"Three groups matter clinically: substrates that are effluxed (loperamide, cyclosporine, digoxin), inducers that increase the number of pumps and cause drug failure - rifampicin, phenytoin, phenobarbital, mirroring enzyme inducers - and inhibitors that decrease the number of pumps and cause drug toxicity (verapamil, amiodarone, quinidine, cyclosporine, itraconazole, neratinib, erythromycin/clarithromycin). Cyclosporine appears in both the substrate and the inhibitor lists."},{"id":"PHARM-U2-6","ch":2,"n":6,"title":"Effects of P-gp Blockade","sec":"Effects of blockade · p4","qs":["PHARM-C2-036","PHARM-C2-037","PHARM-C2-038","PHARM-C2-039","PHARM-C2-040","PHARM-C2-041"],"guide":"The blockade table gives drug-specific outcomes: rifampicin leads to digoxin failure, clarithromycin to digoxin toxicity, cyclosporine to cholestatic jaundice, verapamil is used to reverse drug resistance in cancer and bacteria, and quinidine unmasks loperamide-induced central side effects by opening the BBB to this normally excluded opioid."},{"id":"PHARM-U2-7","ch":2,"n":7,"title":"Passive Diffusion and Lipid Solubility","sec":"Passive Diffusion · p4","qs":["PHARM-C2-042","PHARM-C2-043","PHARM-C2-044","PHARM-C2-045","PHARM-C2-046"],"guide":"The passive diffusion figure carries charged proteins within the lipid bilayer. Polar, ionised or charged drug is repelled, remains lipid insoluble/water soluble and is excreted, whereas a non-polar, unionised, neutral drug is lipid soluble and is absorbed. Lipid solubility of the unionised fraction is therefore the key determinant of passive diffusion."},{"id":"PHARM-U3-1","ch":3,"n":1,"title
