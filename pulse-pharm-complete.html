rotect the drug from gastric HCl (e.g., PPI). (Book p7)"},{"id":"PHARM-C3-066","sec":"Bioavailability","page":7,"q":"Bioavailability (F) is defined as the fraction of drug that:","opts":["Reaches the systemic circulation unchanged","Is absorbed from the small intestine","Escape first pass metabolism in the gut","Binds to plasma proteins"],"ans":0,"exp":"'BIOAVAILABILITY (F): Fraction of drug reaches systemic circulation unchanged.' (Book p7)"},{"id":"PHARM-C3-067","sec":"Bioavailability","page":7,"q":"According to the flowchart for factors determining F, the drug reaching the liver after 100% intestinal absorption may undergo:","opts":["First pass metabolism","Redistribution","Renal tubular secretion","Zero order release"],"ans":0,"exp":"The flowchart traces: 100% of drug → intestinal absorption → liver → fraction that reaches systemic circulation, while a fraction undergoes first pass metabolism (and a fraction is excreted). (Book p7)"},{"id":"PHARM-C3-068","sec":"Bioavailability","page":7,"q":"Which two situations increase bioavailability (F), as listed in the text?","opts":["The drug bypasses the liver, and absorption increases","The drug undergoes first pass metabolism, and absorption decreases","The drug is ionised, and urine is acidified","The drug is water soluble, and Pgp efflux increases"],"ans":0,"exp":"'↑F if → Drug bypasses liver; ↑Absorption occurs' — both raise the fraction reaching the systemic circulation. (Book p7)"},{"id":"PHARM-C3-069","sec":"Bioavailability","page":7,"q":"In the flowchart of factors determining F, the fraction of drug lost on its way to the systemic circulation includes:","opts":["Excretion of a fraction and first pass metabolism of a fraction","Only renal excretion","Only biliary excretion","Redistribution into fat"],"ans":0,"exp":"The flowchart shows that after absorption a fraction is excreted and a fraction undergoes hepatic first pass metabolism, so only the remainder reaches the systemic circulation. (Book p7)"},{"id":"PHARM-C3-070","sec":"Bioavailability","page":7,"q":"The formula for bioavailability given in the box is:","opts":["AUCoral / AUCiv × 100","AUCiv / AUCoral × 100","Cmax / Tmax × 100","Tmaxoral / Tmaxiv × 100"],"ans":0,"exp":"The box reads 'Bioavailability: AUCoral / AUCiv × 100'. (Book p7)"},{"id":"PHARM-C3-071","sec":"Bioavailability","page":7,"q":"In the concentration-time curve, the area under the curve (AUC) represents the:","opts":["Extent of drug absorption","Rate of drug absorption","Peak plasma concentration","Time to peak concentration"],"ans":0,"exp":"The text links the AUC to the 'Extent of Drug Absorption' — extent is measured by AUC, whereas rate is measured by Tmax. (Book p7)"},{"id":"PHARM-C3-072","sec":"Bioavailability","page":7,"q":"The only route of administration with 100% bioavailability is:","opts":["IV","Oral","IM","SC"],"ans":0,"exp":"'Only route with 100% B.V: I/V' — intravenous administration bypasses absorption and first pass metabolism. (Book p7)"},{"id":"PHARM-C3-073","sec":"Bioavailability","page":7,"q":"On the concentration-time curve, which route gives the immediately maximal plasma concentration at time zero?","opts":["IV","Oral","IM","SC"],"ans":0,"exp":"The curve is labelled 'IV max' at the highest point at zero time, while the oral curve rises later and shows a smaller AUC. (Book p7)"},{"id":"PHARM-C3-074","sec":"Bioavailability","page":7,"q":"The oral curve in the concentration-time graph lies below the IV curve because of:","opts":["First pass metabolism and incomplete absorption","Zero order release","Enteric coating","Pgp inhibition"],"ans":0,"exp":"The smaller (oral) AUC compared with IV reflects the fractions lost to excretion and first pass metabolism before the drug reaches the systemic circulation, giving F < 1. (Book p7)"},{"id":"PHARM-C3-075","sec":"Route & bioavailability","page":8,"q":"As per the table, the bioavailability of the IV route is:","opts":["1","0.75–1.0","0.05–1.0","0.3"],"ans":0,"exp":"The table lists IV → bioavailability '1', i.e., 100%. (Book p8)"},{"id":"PHARM-C3-076","sec":"Route & bioavailability","page":8,"q":"As per the table, the bioavailability of the IM/SC route is:","opts":["0.75–1.0","1","0.05–1.0","0.5"],"ans":0,"exp":"The table lists im/sc → 0.75–1.0, slightly less than the intravenous route but still high. (Book p8)"},{"id":"PHARM-C3-077","sec":"Route & bioavailability","page":8,"q":"As per the table, the bioavailability of the oral route is:","opts":["0.05–1.0","0.75–1.0","1","0.05–0.75"],"ans":0,"exp":"The table lists oral → 0.05–1.0, the widest range of all routes because first pass metabolism differs from drug to drug. (Book p8)"},{"id":"PHARM-C3-078","sec":"Route & bioavailability","page":8,"q":"Which route shows the widest range of bioavailability in the table?","opts":["Oral","IV","IM","SC"],"ans":0,"exp":"Oral spans 0.05–1.0, i.e., from 5% to complete bioavailability, whereas IV is fixed at 1 and im/sc at 0.75–1.0. (Book p8)"},{"id":"PHARM-C3-079","sec":"Route & bioavailability","page":8,"q":"The note following the route table states that bioavailability does NOT indicate:","opts":["Rate of drug absorption","Extent of drug absorption","Fraction reaching systemic circulation","Route of administration"],"ans":0,"exp":"'Note: F does not indicate rate of drug absorption' — F measures the extent (AUC), not the speed, of absorption. (Book p8)"},{"id":"PHARM-C3-080","sec":"Rate of absorption","page":8,"q":"Cmax is defined as the:","opts":["Maximum plasma concentration achieved by a drug","Time to reach the maximum concentration","Area under the curve","Rate constant of absorption"],"ans":0,"exp":"'Cmax: maximum plasma conc achieved by a drug' — it is the peak of the plasma concentration-time curve. (Book p8)"},{"id":"PHARM-C3-081","sec":"Rate of absorption","page":8,"q":"Tmax is a marker of the:","opts":["Rate of drug absorption","Extent of drug absorption","Bioavailability of the drug","Elimination half-life"],"ans":0,"exp":"'Tmax: marker of rate of drug absorption' — the sooner the peak occurs, the faster the absorption. (Book p8)"},{"id":"PHARM-C3-082","sec":"Rate of absorption","page":8,"q":"Two formulations of the same drug show Tmax of 1 hour and 4 hours respectively. This indicates a difference in:","opts":["Rate of absorption","Extent of absorption","Bioavailability","Volume of distribution"],"ans":0,"exp":"Tmax is the marker of the rate of drug absorption; extent would instead be compared using AUC. (Book p8)"},{"id":"PHARM-C3-083","sec":"Rate of absorption","page":8,"q":"Which parameter reflects the extent, and which reflects the rate, of drug absorption?","opts":["AUC = extent; Tmax = rate","Tmax = extent; AUC = rate","Cmax = extent; AUC = rate","AUC = rate; Cmax = extent"],"ans":0,"exp":"The AUC measures the extent of absorption (and hence bioavailability), while Tmax is the marker of the rate of absorption. (Book p8)"},{"id":"PHARM-C3-084","sec":"Rate of absorption","page":8,"q":"On the rate-of-absorption graph, the peak of the plasma concentration (PC) curve corresponds to:","opts":["Cmax at Tmax","Cmax at time zero","AUC at Tmax","Tmax at zero concentration"],"ans":0,"exp":"The graph marks Cmax at the top of the curve and Tmax on the time axis directly below it. (Book p8)"},{"id":"PHARM-C3-085","sec":"Bioequivalence","page":8,"q":"Bioequivalence is defined as two pharmaceutically equivalent compounds with similar:","opts":["Rate (Tmax) and extent (AUC) of absorption","Colour and shape","Protein binding and half-life","Cmax and volume of distribution"],"ans":0,"exp":"'Bioequivalence: Two pharmaceutically equivalent compound with similar rate (Tmax) and extent (AUC) of absorption.' (Book p8)"},{"id":"PHARM-C3-086","sec":"Bioequivalence","page":8,"q":"A branded drug is defined in the text as one which is:","opts":["Invented and patented for 20 years","A legal copy made after patent expiry","Cheaper than the generic","Approved by ANDA"],"ans":0,"exp":"'Branded drug: One which is invented, patented for 20 years' — during this period no generic copy can be marketed. (Book p8)"},{"id":"PHARM-C3-087","sec":"Bioequivalence","page":8,"q":"A generic drug is defined as:","opts":["A legal copy of a new drug made after the patent expires","A drug invented and patented for 20 years","A drug with a different active moiety","A controlled release formulation"],"ans":0,"exp":"'Generic drug: Legal copy of a new drug (Done after patent expires).' (Book p8)"},{"id":"PHARM-C3-088","sec":"Bioequivalence","page":8,"q":"The stated benefit of a generic drug is that it is:","opts":["Cheaper","More bioavailable","Longer acting","Free of side effects"],"ans":0,"exp":"'Benefit of a generic drug: Cheaper' — the generic contains the same drug but costs less. (Book p8)"},{"id":"PHARM-C3-089","sec":"Bioequivalence","page":8,"q":"For approval of a generic drug, the required application is:","opts":["ANDA (Abbreviated New Drug Application)","NDA (New Drug Application)","IND (Investigational New Drug)","BLA (Biologics License Application)"],"ans":0,"exp":"'For generic drug approval: ANDA (Abbreviated New Drug Application)' — the abbreviated filing relies on bioequivalence rather than full clinical data. (Book p8)"},{"id":"PHARM-C3-090","sec":"Bioequivalence","page":8,"q":"The criteria for approving a generic drug is that it is bioequivalent to the branded drug within:","opts":["±20%","±5%","±10%","±50%"],"ans":0,"exp":"'Generic drug = Bioequivalent to Branded drug ±20%' — the generic must fall within ±20% of the branded product. (Book p8)"},{"id":"PHARM-C3-091","sec":"Bioequivalence","page":8,"q":"A generic formulation of a drug has an AUC 20% lower than the branded product, with a similar Tmax. It will be:","opts":["Approved, since it is within ±20%","Rejected, since any difference is unacceptable","Approved only if Tmax is identical","Rejected, because AUC must be equal"],"ans":0,"exp":"The approval criterion is bioequivalence to the branded drug within ±20%; a 20% difference in AUC with similar rate falls within this limit. (Book p8)"},{"id":"PHARM-C3-092","sec":"Bioequivalence","page":8,"q":"Two generic products of the same drug are compared. Bioequivalence between them is judged by similarity of:","opts":["Tmax and AUC","Cmax and volume of distribution","Half-life and clearance","Protein binding and pKa"],"ans":0,"exp":"Bioequivalence means similar rate (Tmax) and extent (AUC) of absorption; the approval limit against the branded drug is ±20%. (Book p8)"},{"id":"PHARM-C3-093","sec":"Bioequivalence","page":8,"q":"Which of the following is TRUE regarding F and Tmax?","opts":["F reflects the extent of absorption while Tmax reflects its rate","Both F and Tmax reflect the rate of absorption","Both F and Tmax reflect the extent of absorption","F reflects the rate of absorption while Tmax reflects its extent"],"ans":0,"exp":"F is derived from AUC and denotes the extent of absorption (and does not indicate rate), whereas Tmax is the marker of the rate of drug absorption. (Book p8)"},{"id":"PHARM-C4-001","sec":"AVD definition","page":9,"q":"Apparent volume of distribution (AVD) is defined as the:","opts":["Hypothetical volume of plasma in litres necessary to account for the total amount of drug in the patient's body","Actual volume of plasma in litres measured by dilution","Volume of drug solution administered intravenously","Volume of drug distributed to adipose tissue"],"ans":0,"exp":"'Hypothetical volume of plasma in litres necessary to account for the total amount of drug (intravascularly and extravascularly) in the patient's body.' (Book p9)"},{"id":"PHARM-C4-002","sec":"AVD definition","page":9,"q":"In the definition of AVD, the 'total amount of drug' refers to drug present:","opts":["Intravascularly and extravascularly","In plasma only","In the extravascular compartment only","In the urine"],"ans":0,"exp":"The definition specifies the total amount of drug, both intravascularly and extravascularly, in the patient's body. (Book p9)"},{"id":"PHARM-C4-003","sec":"AVD definition","page":9,"q":"A drug with a high AVD is located mostly in the:","opts":["Extravascular compartment/tissue","Intravascular compartment","Plasma water","Systemic circulation"],"ans":0,"exp":"'Drug with ↑AVD → mostly in Extravascular compartment/Tissue.' (Book p9)"},{"id":"PHARM-C4-004","sec":"AVD definition","page":9,"q":"A drug with a low AVD is located mostly in the:","opts":["Intravascular compartment/systemic circulation","Extravascular compartment","Adipose tissue","Skeletal muscle"],"ans":0,"exp":"'Drug with ↓AVD → mostly in Intravascular compartment/Systemic.' (Book p9)"},{"id":"PHARM-C4-005","sec":"AVD definition","page":9,"q":"AVD is called 'apparent' because:","opts":["It is a hypothetical volume, not a real anatomical space","It is measured directly in plasma","It equals the plasma volume","It is calculated only for IV drugs"],"ans":0,"exp":"AVD is defined as a hypothetical volume of plasma in litres needed to account for the total drug in the body, not a real measured compartment. (Book p9)"},{"id":"PHARM-C4-006","sec":"AVD calculation","page":9,"q":"The formula given for apparent volume of distribution is:","opts":["AVD = D(dose)/C0 × f","AVD = C0 × f/D","AVD = D × C0/f","AVD = D × C0 × f"],"ans":0,"exp":"AVD = D(dose)/C0 × f, where C0 is the initial plasma concentration and f is bioavailability. (Book p9)"},{"id":"PHARM-C4-007","sec":"AVD calculation","page":9,"q":"In the AVD formula, C0 represents the:","opts":["Initial plasma concentration","Target plasma concentration","Clearance","Concentration at time of elimination"],"ans":0,"exp":"The arrow under the formula labels C0 as 'Initial plasma concentration' — the concentration extrapolated to zero time after IV dosing. (Book p9)"},{"id":"PHARM-C4-008","sec":"AVD calculation","page":9,"q":"In the AVD formula, f stands for:","opts":["Bioavailability","Fraction unbound","Frequency of dosing","Free drug concentration"],"ans":0,"exp":"'f: Bioavailability' — and the text notes 'f = 1 in intravenous route'. (Book p9)"},{"id":"PHARM-C4-009","sec":"AVD calculation","page":9,"q":"In which route is the value of f taken as 1?","opts":["Intravenous","Oral","Intramuscular","Subcutaneous"],"ans":0,"exp":"'f = 1 in intravenous route' — the IV route has 100% bioavailability, so f = 1. (Book p9)"},{"id":"PHARM-C4-010","sec":"Loading dose","page":9,"q":"The formula given for loading dose is:","opts":["D = AVD × CT/f","D = AVD/f × CT × 100","D = CT × f/AVD","D = AVD × f/CT"],"ans":0,"exp":"Loading dose: D = AVD × CT/f, where CT is the target plasma concentration. (Book p9)"},{"id":"PHARM-C4-011","sec":"Loading dose","page":9,"q":"In the loading dose formula, CT is the:","opts":["Target plasma concentration (constant)","Initial plasma concentration","Total clearance","Trough concentration"],"ans":0,"exp":"CT is labelled 'Target plasma concentration (constant)' — the concentration we wish to achieve and maintain. (Book p9)"},{"id":"PHARM-C4-012","sec":"Loading dose","page":9,"q":"As shown in the box, the loading dose is:","opts":["Directly proportional to AVD/f","Inversely proportional to AVD/f","Independent of AVD","Proportional to f only"],"ans":0,"exp":"The text states 'D ∝ AVD/f': loading dose rises with a larger volume of distribution and falls with higher bioavailability. (Book p9)"},{"id":"PHARM-C4-013","sec":"Loading dose","page":9,"q":"If the AVD of a drug is increased, the loading dose must be:","opts":["Increased to maintain CT","Decreased to maintain CT","Unchanged","Given by a different route"],"ans":0,"exp":"'If AVD of a drug is ↑, Dose is increased to maintain CT' — a bigger apparent volume needs a bigger loading dose. (Book p9)"},{"id":"PHARM-C4-014","sec":"Loading dose","page":9,"q":"A drug has a large AVD and low bioavailability. Its loading dose will be:","opts":["Large, because D ∝ AVD/f","Small, because D ∝ AVD/f","Unrelated to AVD and f","Equal to the maintenance dose"],"ans":0,"exp":"Since D ∝ AVD/f, a big volume of distribution and a low f both increase the required loading dose to achieve the target concentration. (Book p9)"},{"id":"PHARM-C4-015","sec":"AVD factors","page":9,"q":"Which of the following is a factor determining apparent volume of distribution?","opts":["Fat content","Gastric pH","Urine pH","Intestinal surface area"],"ans":0,"exp":"The factors listed are fat content, lipid solubility (pKa), albumin/plasma protein binding and tissue binding — gastric/urinary pH relate to ionisation, not distribution. (Book p9)"},{"id":"PHARM-C4-016","sec":"AVD factors","page":9,"q":"In obese individuals, the volume of distribution of a drug:","opts":["Increases","Decreases","Remains unchanged","Becomes equal to plasma volume"],"ans":0,"exp":"'Obesity: ↑ volume of distribution (vd)' — excess fat increases the compartment available to lipid-soluble drug. (Book p9)"},{"id":"PHARM-C4-017","sec":"AVD factors","page":9,"q":"In athletes, the volume of distribution of a drug:","opts":["Decreases","Increases","Is equal to that in obesity","Is unrelated to body composition"],"ans":0,"exp":"'Athletes: ↓ vd' — athletes have less fat and more lean tissue, lowering the apparent volume of distribution for fat-soluble drugs. (Book p9)"},{"id":"PHARM-C4-018","sec":"AVD factors","page":9,"q":"Regarding sex, the volume of distribution is greater in:","opts":["Females, because of higher fat content","Males, because of higher fat content","Females, because of higher muscle mass","Males, because of higher muscle mass"],"ans":0,"exp":"'Sex: F(↑ Fat content) > M' — women have more fat, hence a higher volume of distribution. (Book p9)"},{"id":"PHARM-C4-019","sec":"AVD factors","page":9,"q":"Which drug property is listed as a determinant of AVD?","opts":["Lipid solubility (pKa)","Renal clearance","Gastric emptying rate","Intestinal Pgp efflux"],"ans":0,"exp":"'Lipid Soluble (pKa)' is listed among the factors determining AVD — a more lipid-soluble drug partitions into tissues and has a larger volume of distribution. (Book p9)"},{"id":"PHARM-C4-020","sec":"AVD factors","page":9,"q":"Plasma protein (albumin) binding is related to the volume of distribution as:","opts":["Binding ∝ 1/vd","Binding ∝ vd","Binding is independent of vd","Binding ∝ vd²"],"ans":0,"exp":"'Albumin binding (Plasma protein binding) ∝ 1/vd' — the more a drug is bound to plasma protein, the more it is retained intravascularly and the smaller its volume of distribution. (Book p9)"},{"id":"PHARM-C4-021","sec":"AVD factors","page":9,"q":"Which factor tends to hold drug outside the plasma and thereby raise the AVD?","opts":["Tissue binding","Albumin binding","Low lipid solubility","Small molecular size"],"ans":0,"exp":"Tissue binding is listed as a factor; drug bound in tissues is not in plasma, so the apparent volume of distribution is large. (Book p9)"},{"id":"PHARM-C4-022","sec":"AVD factors","page":9,"q":"A 20-year-old athlete and an obese diabetic man receive the same lipid-soluble drug. Compared with the obese man, the athlete will have:","opts":["A lower volume of distribution","A higher volume of distribution","The same volume of distribution","A volume of distribution equal to plasma volume"],"ans":0,"exp":"Obesity increases vd while athletes have a lower vd; the higher fat content of an obese individual expands the drug's apparent distribution volume. (Book p9)"},{"id":"PHARM-C4-023","sec":"AVD factors","page":9,"q":"Which of the following factors would DECREASE the apparent volume of distribution of a drug?","opts":["High plasma albumin binding","High tissue binding","Increasing obesity","High lipid solubility"],"ans":0,"exp":"Albumin binding is inversely related to vd (binding ∝ 1/vd), whereas tissue binding, obesity and lipid solubility all raise vd. (Book p9)"},{"id":"PHARM-C4-024","sec":"Digoxin distribution","page":9,"q":"The example given for pattern of distribution is that digoxin distributes to:","opts":["Skeletal muscle > heart","Heart > skeletal muscle","Adipose tissue > heart","Liver > skeletal muscle"],"ans":0,"exp":"'Distribution of Digoxin → Skeletal muscle > Heart' — the mass of skeletal muscle exceeds that of the heart. (Book p9)"},{"id":"PHARM-C4-025","sec":"Digoxin distribution","page":9,"q":"Digoxin distributes to skeletal muscle more than to the heart because of the:","opts":["Greater mass of skeletal muscle","Greater affinity of skeletal muscle receptors","Higher blood flow to muscle","Higher lipid content of muscle"],"ans":0,"exp":"The diary attributes it to the greater mass ('d/t ↑ mass') of skeletal muscle compared with the heart, which is the target organ. (Book p9)"},{"id":"PHARM-C4-026","sec":"Digoxin distribution","page":9,"q":"In the digoxin example, the heart is described as the:","opts":["Target organ","Main storage site","Excretory organ","Site of metabolism"],"ans":0,"exp":"The heart is labelled '(Target organ)' while skeletal muscle, being greater in mass, becomes the main distribution site. (Book p9)"},{"id":"PHARM-C4-027","sec":"Digoxin distribution","page":9,"q":"The loading dose of digoxin is determined by:","opts":["Lean body mass and not total body mass","Total body mass and not lean body mass","Body surface area only","Plasma albumin level"],"ans":0,"exp":"'Hence loading dose is determined by lean body mass (not total body mass)' — fat contributes little to digoxin's distribution. (Book p9)"},{"id":"PHARM-C4-028","sec":"Digoxin distribution","page":9,"q":"A morbidly obese patient requires a digoxin loading dose. Basing the dose on total body weight would:","opts":["Overdose the patient, because digoxin distributes to lean mass","Underdose the patient, because fat stores digoxin","Be correct, because fat binds digoxin","Have no effect on the dose"],"ans":0,"exp":"Because digoxin's loading dose is set by lean body mass and not total body mass, dosing a very obese patient on total weight would exceed the requirement. (Book p9)"},{"id":"PHARM-C4-029","sec":"AVD & toxicity","page":9,"q":"A very high AVD leads to which pair of concentration changes?","opts":["↑ Extravascular concentration and ↓ intravascular concentration","↓ Extravascular concentration and ↑ intravascular concentration","↑ Both extravascular and intravascular concentration","↓ Both extravascular and intravascular concentration"],"ans":0,"exp":"'↑↑vd → ↑extravascular concentration; ↓intravascular concentration' — the drug is mostly outside the plasma. (Book p9)"},{"id":"PHARM-C4-030","sec":"AVD & toxicity","page":9,"q":"Dialysis is ineffective in toxicity of drugs with a high AVD because:","opts":["The drug is largely outside the vascular compartment","The drug is too large to be dialysed","The drug is bound to dialyser membranes","The drug is metabolised during dialysis"],"ans":0,"exp":"With a high vd the extravascular concentration is high and the intravascular concentration low, so dialysis can remove only a negligible intravascular fraction — hence the note 'Dialysis is ineffective'. (Book p9)"},{"id":"PHARM-C4-031","sec":"AVD & toxicity","page":9,"q":"In toxicity due to drugs that are not cleared by dialysis, treatment is with:","opts":["Antidotes","Repeated dialysis","Forced alkaline diuresis only","Plasmapheresis"],"ans":0,"exp":"The text states 'Antidotes are given in toxicity' — for high-vd drugs the antidote, not dialysis, is the treatment. (Book p9)"},{"id":"PHARM-C4-032","sec":"AVD & toxicity","page":9,"q":"A patient with organophosphate poisoning has a drug with a very high vd. The appropriate management per the text is:","opts":["Give the antidote atropine, as dialysis is ineffective","Start immediate haemodialysis","Perform plasmapheresis","Give activated charcoal only"],"ans":0,"exp":"For high-vd drugs, dialysis is ineffective (low intravascular concentration) and antidotes are given — the table pairs organophosphates with atropine. (Book p9)"},{"id":"PHARM-C4-033","sec":"BADDOC","page":10,"q":"The mnemonic BADDOC lists drugs with:","opts":["↑ Volume of distribution","↓ Volume of distribution","Zero bioavailability","High plasma protein binding only"],"ans":0,"exp":"The page is headed 'Drugs with ↑ vd: mnemonic: BADDOC.' — these are the drugs that are not cleared by dialysis. (Book p10)"},{"id":"PHARM-C4-034","sec":"BADDOC","page":10,"q":"In the mnemonic BADDOC, the letter 'O' stands for:","opts":["Opioids","Organophosphates","Oral hypoglycaemics","Organic nitrates"],"ans":0,"exp":"BADDOC = Benzodiazepines, Beta blockers, Amphetamines, Digoxin, opiOids, Calcium channel blockers; organophosphates are also listed in the table but O stands for opioids. (Book p10)"},{"id":"PHARM-C4-035","sec":"BADDOC","page":10,"q":"In the mnemonic BADDOC, the letter 'C' stands for:","opts":["Calcium channel blockers","Cephalosporins","Corticosteroids","Clonidine"],"ans":0,"exp":"BADDOC ends with Calcium channel blockers, which are treated with calcium gluconate. (Book p10)"},{"id":"PHARM-C4-036","sec":"BADDOC","page":10,"q":"In BADDOC, the two groups beginning with the letter 'B' are:","opts":["Benzodiazepines and beta blockers","Beta blockers and barbiturates","Benzodiazepines and butyrophenones","Barbiturates and benzodiazepines"],"ans":0,"exp":"BADDOC = Benzodiazepines, Beta blockers, Amphetamines, Digoxin, Opioids, Calcium channel blockers. (Book p10)"},{"id":"PHARM-C4-037","sec":"BADDOC","page":10,"q":"The table of drugs with ↑vd is titled 'Drugs not cleared by dialysis', and the second column lists their:","opts":["Antidotes","Metabolites","Elimination half-lives","Volume of distribution values"],"ans":0,"exp":"The two columns are 'Drugs not cleared by dialysis' and 'Antidotes' — for each high-vd drug the specific antidote is given. (Book p10)"},{"id":"PHARM-C4-038","sec":"Antidotes","page":10,"q":"As per the table, the antidote for benzodiazepine toxicity is:","opts":["Flumazenil","Naloxone","Glucagon","Atropine"],"ans":0,"exp":"Benzodiazepines → Flumazenil in the antidote table. (Book p10)"},{"id":"PHARM-C4-039","sec":"Antidotes","page":10,"q":"As per the table, the antidote for beta blocker toxicity is:","opts":["Glucagon, which increases cAMP","Flumazenil","Calcium gluconate","Digibind"],"ans":0,"exp":"Beta blockers (blocks GPCR) → Glucagon (↑cAMP): glucagon raises cAMP by a non-β-receptor route, bypassing the blocked receptor. (Book p10)"},{"id":"PHARM-C4-040","sec":"Antidotes","page":10,"q":"As per the table, the antidote for amphetamine toxicity is:","opts":["Ammonium chloride","Atropine","Naloxone","Flumazenil"],"ans":0,"exp":"Amphetamines → Ammonium chloride, the urine acidifier that traps the basic drug for excretion. (Book p10)"},{"id":"PHARM-C4-041","sec":"Antidotes","page":10,"q":"As per the table, the antidote for digoxin toxicity is:","opts":["Digibind","Digoxin immune Fab only by dialysis","Calcium gluconate","Naloxone"],"ans":0,"exp":"Digoxin → Digibind in the antidote table; because digoxin has a high vd, dialysis would not clear it. (Book p10)"},{"id":"PHARM-C4-042","sec":"Antidotes","page":10,"q":"As per the table, the antidote for opioid toxicity is:","opts":["Naloxone","Flumazenil","Atropine","Glucagon"],"ans":0,"exp":"Opioids → Naloxone, the opioid receptor antagonist. (Book p10)"},{"id":"PHARM-C4-043","sec":"Antidotes","page":10,"q":"As per the table, the antidote for organophosphate toxicity is:","opts":["Atropine","Naloxone","Calcium gluconate","Ammonium chloride"],"ans":0,"exp":"Organophosphates → Atropine, which reverses the muscarinic effects of the accumulated acetylcholine. (Book p10)"},{"id":"PHARM-C4-044","sec":"Antidotes","page":10,"q":"As per the table, the antidote for calcium channel blocker toxicity is:","opts":["Calcium gluconate","Glucagon","Atropine","Flumazenil"],"ans":0,"exp":"Calcium channel blockers → Calcium gluconate, which supplies calcium to overcome the channel blockade. (Book p10)"},{"id":"PHARM-C4-045","sec":"Antidotes","page":10,"q":"Which drug-antidote pair is INCORRECTLY matched?","opts":["Benzodiazepines — Flumazenil","Beta blockers — Glucagon","Digoxin — Digibind","Calcium channel blockers — Naloxone"],"ans":3,"exp":"Calcium channel blockers are treated with calcium gluconate; naloxone is the antidote for opioids. (Book p10)"},{"id":"PHARM-C4-046","sec":"Antidotes","page":10,"q":"A patient with beta blocker overdose is unresponsive to atropine. Which agent from the antidote table should be given?","opts":["Glucagon","Flumazenil","Calcium gluconate","Digibind"],"ans":0,"exp":"The table lists beta blockers → glucagon (↑cAMP); glucagon bypasses the blocked β receptor by increasing cAMP directly. (Book p10)"},{"id":"PHARM-C4-047","sec":"Antidotes","page":10,"q":"Why is haemodialysis NOT the treatment of choice in opioid overdose per this page?","opts":["Opioids have a high volume of distribution and are not cleared by dialysis","Opioids are too tightly protein bound","Naloxone is cheaper than dialysis","Opioids are cleared by the lungs"],"ans":0,"exp":"The table places opioids in the 'drugs not cleared by dialysis' group (BADDOC, high vd), so the antidote naloxone is used instead. (Book p10)"},{"id":"PHARM-C4-048","sec":"AVD & dialysis","page":10,"q":"Which drug from BADDOC has a specific antibody fragment as its antidote?","opts":["Digoxin (Digibind)","Amphetamine","Organophosphate","Beta blocker"],"ans":0,"exp":"The table pairs digoxin with Digibind; digoxin's large volume of distribution is why dialysis cannot clear it. (Book p10)"},{"id":"PHARM-C4-049","sec":"AVD & dialysis","page":10,"q":"A patient with benzodiazepine overdose and a high AVD is given flumazenil rather than dialysis because:","opts":["Drugs in BADDOC are not cleared by dialysis","Flumazenil is cheaper","Benzodiazepines are water soluble","Dialysis removes protein-bound drug only"],"ans":0,"exp":"The table's very heading is 'Drugs not cleared by dialysis', listing benzodiazepines with flumazenil as the antidote — a direct consequence of their high volume of distribution. (Book p10)"},{"id":"PHARM-C4-050","sec":"BADDOC","page":10,"q":"Which of the following is NOT a member of the BADDOC group?","opts":["Phenytoin","Benzodiazepines","Digoxin","Opioids"],"ans":0,"exp":"BADDOC = Benzodiazepines, Beta blockers, Amphetamines, Digoxin, Opioids, Calcium channel blockers; phenytoin is not part of this high-vd group. (Book p10)"},{"id":"PHARM-C4-051","sec":"Plasma proteins","page":10,"q":"The most important plasma protein binding acidic drugs, and the most common binding protein, is:","opts":["Albumin","α1 acid glycoprotein","Globulin","Fibrinogen"],"ans":0,"exp":"'Albumin → Binds to Acidic drugs (m/c)' — albumin is the commonest plasma protein that binds acidic drugs. (Book p10)"},{"id":"PHARM-C4-052","sec":"Plasma proteins","page":10,"q":"α1 acid glycoprotein binds:","opts":["Basic drugs","Acidic drugs","Only neutral drugs","Only water-soluble drugs"],"ans":0,"exp":"'α1 acid glycoprotein: Basic drugs' — basic drugs such as lidocaine and opioids bind α1 acid glycoprotein. (Book p10)"},{"id":"PHARM-C4-053","sec":"Drugs bound to albumin","page":10,"q":"Which of the following is listed as a drug bound to albumin?","opts":["Lidocaine","Antipsychotics","Tricyclic antidepressants","Amiodarone"],"ans":1,"exp":"Antipsychotics are in the albumin column; lidocaine, tricyclic antidepressants and amiodarone bind α1 acid glycoprotein. (Book p10)"},{"id":"PHARM-C4-054","sec":"Drugs bound to albumin","page":10,"q":"The antibiotics listed in the albumin column are:","opts":["Sulfonamides","Macrolides","Aminoglycosides","Penicillins"],"ans":0,"exp":"The albumin list includes 'Antibiotics: sulfonamides'. (Book p10)"},{"id":"PHARM-C4-055","sec":"Drugs bound to albumin","page":10,"q":"The anticoagulant listed as an albumin-bound drug is:","opts":["Warfarin","Heparin","Rivaroxaban","Enoxaparin"],"ans":0,"exp":"'Anticoagulant: warfarin' appears in the albumin column, together with aspirin. (Book p10)"},{"id":"PHARM-C4-056","sec":"Drugs bound to albumin","page":10,"q":"Which set lists drugs bound to albumin as per the table?","opts":["Antipsychotics, antidepressants, antiepileptics, sulfonamides, warfarin and aspirin","Tricyclic antidepressants, opioids and antiarrhythmics","Amiodarone, lidocaine and beta blockers","Digoxin, opioids and amphetamines"],"ans":0,"exp":"The albumin column lists antipsychotics, antidepressants, antiepileptics, antibiotics (sulfonamides), warfarin and aspirin. (Book p10)"},{"id":"PHARM-C4-057","sec":"Drugs bound to α1 AGP","page":10,"q":"Which set lists drugs bound to α1 acid glycoprotein?","opts":["Tricyclic antidepressants, opioids and antiarrhythmics (beta blocker, amiodarone, lidocaine)","Antipsychotics, antidepressants and antiepileptics","Warfarin, aspirin and sulfonamides","Digoxin, amphetamines and opioids"],"ans":0,"exp":"The α1 acid glycoprotein column lists tricyclic antidepressants, opioids and antiarrhythmics — beta blockers, amiodarone and lidocaine. (Book p10)"},{"id":"PHARM-C4-058","sec":"Drugs bound to α1 AGP","page":10,"q":"Lidocaine, amiodarone and beta blockers are bound to:","opts":["α1 acid glycoprotein","Albumin","Both equally","Neither protein"],"ans":0,"exp":"These three antiarrhythmics are listed under α1 acid glycoprotein, the binding protein for basic drugs. (Book p10)"},{"id":"PHARM-C4-059","sec":"Plasma proteins","page":10,"q":"A basic drug such as an opioid will bind mainly to:","opts":["α1 acid glycoprotein","Albumin","Globulin","Transferrin"],"ans":0,"exp":"α1 acid glycoprotein binds basic drugs such as opioids, tricyclic antidepressants and antiarrhythmics; albumin binds acidic drugs. (Book p10)"},{"id":"PHARM-C4-060","sec":"Plasma proteins","page":10,"q":"Which pairing of drug and binding protein is correct?","opts":["Aspirin — albumin; lidocaine — α1 acid glycoprotein","Aspirin — α1 acid glycoprotein; lidocaine — albumin","Warfarin — α1 acid glycoprotein; opioids — albumin","Sulfonamides — α1 acid glycoprotein; amiodarone — albumin"],"ans":0,"exp":"Aspirin, warfarin, sulfonamides and antiepileptics are albumin bound (acidic drugs), while lidocaine, opioids, tricyclics and amiodarone bind α1 acid glycoprotein (basic drugs). (Book p10)"},{"id":"PHARM-C4-061","sec":"Warfarin-aspirin interaction","page":10,"q":"Warfarin and aspirin used together increase each other's plasma concentration, leading to:","opts":["Increased bleeding","Decreased bleeding","Cholestatic jaundice","Renal failure"],"ans":0,"exp":"The bracket linking warfarin and aspirin reads 'Increase each others plasma conc. if used together ↓ ↑Bleeding'. (Book p10)"},{"id":"PHARM-C4-062","sec":"Warfarin-aspirin interaction","page":10,"q":"Both warfarin and aspirin are bound to the same plasma protein. When given together, the result is:","opts":["Displacement increasing free drug concentration","Reduced free drug concentration","No change in free drug","Increased renal excretion of the free drug"],"ans":0,"exp":"Because both are albumin-bound, they compete for and displace each other, raising the free (unbound) concentration — hence the increased bleeding shown in the table. (Book p10)"},{"id":"PHARM-C4-063","sec":"Effect on drugs","page":10,"q":"As per the table, a fall in albumin produces:","opts":["↑ Free drug and ↑ risk of toxicity","↓ Free drug and ↓ effect","↑ Free drug and ↓ risk of toxicity","No change in free drug"],"ans":0,"exp":"The albumin column reads: ↓Albumin → ↑Free drug → ↑Risk of toxicity. (Book p10)"},{"id":"PHARM-C4-064","sec":"Effect on drugs","page":10,"q":"As per the table, an increase in α1 glycoprotein produces:","opts":["↓ Free drug and ↓ effect","↑ Free drug and ↑ toxicity","↓ Free drug and ↑ toxicity","No change in free drug"],"ans":0,"exp":"The α1 acid glycoprotein column reads: ↑α1 glycoprotein → ↓Free drug → ↓Effect. (Book p10)"},{"id":"PHARM-C4-065","sec":"Effect on drugs","page":10,"q":"The two plasma-protein changes have opposite clinical consequences, which are:","opts":["↓Albumin → toxicity; ↑α1 glycoprotein → reduced effect","↓Albumin → reduced effect; ↑α1 glycoprotein → toxicity","Both produce toxicity","Both reduce drug effect"],"ans":0,"exp":"Less albumin leaves more free drug and risk of toxicity, whereas more α1 acid glycoprotein binds more drug, lowering free drug and effect. (Book p10)"},{"id":"PHARM-C4-066","sec":"Effect on drugs","page":10,"q":"A drug is 90% bound to albumin. In a patient with hypoalbuminaemia, the fraction of free drug:","opts":["Increases, raising the risk of toxicity","Decreases, reducing the effect","Remains unchanged","Becomes fully protein bound"],"ans":0,"exp":"The table states that a fall in albumin raises the free drug concentration and therefore the risk of toxicity. (Book p10)"},{"id":"PHARM-C4-067","sec":"AVD & plasma binding","page":9,"q":"The inverse relationship between albumin binding and volume of distribution explains why drugs that are highly albumin bound:","opts":["Have a low AVD as they stay intravascular","Have a high AVD as they enter tissue","Are not metabolised","Are cleared by dialysis"],"ans":0,"exp":"Albumin binding ∝ 1/vd, so a heavily albumin-bound drug remains largely in the intravascular compartment and has a low apparent volume of distribution. (Book p9)"},{"id":"PHARM-C4-068","sec":"Effect on drugs","page":10,"q":"Which statement about plasma protein binding and drug effect is correct?","opts":["Only the free (unbound) drug is active, so ↓albumin raises toxicity while ↑α1 gp lowers effect","Bound drug is the active form, so more binding means more effect","Protein binding has no relation to drug effect","↓Albumin and ↑α1 gp have the same clinical consequence"],"ans":0,"exp":"The table's 'effect on drugs' row shows ↓albumin → ↑free drug → ↑toxicity, and ↑α1 gp → ↓free drug → ↓effect: free drug, not bound drug, produces the effect. (Book p10)"},{"id":"PHARM-C4-069","sec":"Clinical application","page":10,"q":"Which condition is listed as a cause of decreased albumin?","opts":["Nephrotic syndrome","Rheumatoid arthritis","Myocardial infarction","Inflammatory bowel disease"],"ans":0,"exp":"Under ↓Albumin the text lists nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus; the inflammatory states and MI belong to the ↑α1 gp list. (Book p10)"},{"id":"PHARM-C4-070","sec":"Clinical application","page":10,"q":"Which set lists the causes of decreased albumin given in the table?","opts":["Nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus","Nephrotic syndrome only","Rheumatoid arthritis, IBD and myocardial infarction","Cirrhosis and myocardial infarction"],"ans":0,"exp":"Nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus are listed as conditions with ↓Albumin. (Book p10)"},{"id":"PHARM-C4-071","sec":"Clinical application","page":10,"q":"As per the table, α1 glycoprotein is increased in:","opts":["Inflammatory conditions and myocardial infarction","Nephrotic syndrome and CKD","Liver cirrhosis and diabetes mellitus","Obesity and pregnancy"],"ans":0,"exp":"'↑α1 gp: Inflammatory — rheumatoid arthritis, inflammatory bowel disease; myocardial infarction'. (Book p10)"},{"id":"PHARM-C4-072","sec":"Clinical application","page":10,"q":"Which of the following is listed under inflammatory causes of increased α1 glycoprotein?","opts":["Rheumatoid arthritis and inflammatory bowel disease","Nephrotic syndrome and cirrhosis","Diabetes mellitus and CKD","Asthma and COPD"],"ans":0,"exp":"Rheumatoid arthritis and inflammatory bowel disease are listed, along with myocardial infarction, as conditions that raise α1 glycoprotein. (Book p10)"},{"id":"PHARM-C4-073","sec":"Clinical application","page":10,"q":"A patient with nephrotic syndrome is prescribed an albumin-bound drug. Compared with a healthy adult, you should expect:","opts":["A higher free drug level and greater toxicity risk","A lower free drug level and reduced effect","No change in free drug level","Increased protein binding of the drug"],"ans":0,"exp":"Nephrotic syndrome causes ↓albumin; the table shows ↓Albumin → ↑Free drug → ↑Risk of toxicity. (Book p10)"},{"id":"PHARM-C4-074","sec":"Clinical application","page":10,"q":"A patient with myocardial infarction receives lidocaine. Because α1 glycoprotein is raised in MI:","opts":["Free lidocaine falls and its effect is reduced","Free lidocaine rises and toxicity occurs","Lidocaine binds to albumin instead","Lidocaine is excreted unchanged faster"],"ans":0,"exp":"α1 acid glycoprotein (which binds lidocaine, a basic drug) rises in MI, so free drug falls and the effect is reduced. (Book p10)"},{"id":"PHARM-C4-075","sec":"Clinical application","page":10,"q":"In a patient with rheumatoid arthritis, drugs bound to α1 acid glycoprotein will show:","opts":["Reduced free concentration and reduced effect","Increased free concentration and toxicity","Unchanged binding","Complete displacement from albumin"],"ans":0,"exp":"Rheumatoid arthritis raises α1 glycoprotein; the table shows ↑α1 gp → ↓free drug → ↓effect. (Book p10)"},{"id":"PHARM-C4-076","sec":"Clinical application","page":10,"q":"Which condition is NOT associated with a fall in albumin as per the table?","opts":["Myocardial infarction","Nephrotic syndrome","Chronic kidney disease","Liver cirrhosis"],"ans":0,"exp":"Myocardial infarction belongs to the ↑α1 glycoprotein group, not the ↓albumin group, which comprises nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus. (Book p10)"},{"id":"PHARM-C4-077","sec":"Clinical application","page":10,"q":"A patient with diabetes mellitus on a highly albumin-bound antiepileptic drug develops features of toxicity. The explanation is:","opts":["Low albumin raises the free drug fraction","High α1 glycoprotein raises the free drug fraction","Reduced hepatic metabolism only","Reduced renal excretion only"],"ans":0,"exp":"Diabetes mellitus is listed among the causes of ↓albumin; with less binding protein there is more free drug and hence a risk of toxicity. (Book p10)"},{"id":"PHARM-C4-078","sec":"Clinical application","page":10,"q":"An elderly woman with liver cirrhosis is prescribed a warfarin-like albumin-bound drug. Which risk is increased?","opts":["Free drug toxicity due to low albumin","Reduced effect due to high albumin","Loss of the drug in urine","Increased α1 glycoprotein binding"],"ans":0,"exp":"Liver cirrhosis lowers albumin; the table shows ↓Albumin → ↑Free drug → ↑Risk of toxicity. (Book p10)"},{"id":"PHARM-C5-001","sec":"Phase I reactions","page":11,"q":"Phase I metabolism of most drugs converts the active drug into:","opts":["An inactive, broken-down drug","An ionised and water-soluble conjugate","A prodrug requiring further activation","A drug-protein conjugate"],"ans":0,"exp":"The Phase I flowchart reads: most drugs (active) → drug broken down → inactivated, generating a functional group. (Book p11)"},{"id":"PHARM-C5-002","sec":"Phase I reactions","page":11,"q":"In Phase I metabolism, a prodrug (inactive) is:","opts":["Inactivated by conjugation with glucuronic acid","Broken down to a functional group and activated","Excreted unchanged in bile","Converted into a more lipid-soluble compound"],"ans":1,"exp":"The Phase I flowchart shows 'Pro drug (inactive) → drug broken down → Activated', with a functional group generated — this is how prodrugs are switched on. (Book p11)"},{"id":"PHARM-C5-003","sec":"Phase I reactions","page":11,"q":"The product of Phase I metabolism, common to both prodrug activation and drug inactivation, is:","opts":["Drug + functional group","Drug + glucuronic acid","Drug + glutathione","Drug conjugated to a -ve charged moiety"],"ans":0,"exp":"Both arms of the Phase I flowchart converge on 'Drug + Functional group', which is then handed over to Phase II for conjugation. (Book p11)"},{"id":"PHARM-C5-004","sec":"Phase II reactions","page":11,"q":"Phase II metabolism consists of:","opts":["Conjugation of the drug with a functional group","Oxidation of the drug by CYP450","Hydrolysis of the drug by esterases","Reduction of the drug by microsomal enzymes"],"ans":0,"exp":"The heading reads 'Phase II: Drug + Functional group', with an arrow labelled 'conjugate (-ve charged)' showing that Phase II attaches a conjugate to the Phase I product. (Book p11)"},{"id":"PHARM-C5-005","sec":"Phase II reactions","page":11,"q":"The conjugate added in Phase II metabolism carries which charge?","opts":["Positive charge","Negative charge","Neutral, with no charge","Variable charge depending on the drug"],"ans":1,"exp":"The Phase II diagram labels the conjugate '(-ve charged)'; this charged conjugate is what makes the metabolite water soluble. (Book p11)"},{"id":"PHARM-C5-006","sec":"Phase II reactions","page":11,"q":"Conjugation in Phase II renders the drug:","opts":["Lipid soluble and easily reabsorbed","Ionised and water soluble, easily excreted","Protein bound and inactive","Volatile and excreted by the lungs"],"ans":1,"exp":"Phase II output: drug + functional group + conjugate → ionized and water soluble → easily excreted. (Book p11)"},{"id":"PHARM-C5-007","sec":"Phase I vs Phase II","page":11,"q":"Which sequence correctly describes the two phases of drug metabolism?","opts":["Phase I conjugates; Phase II oxidises","Phase I generates a functional group; Phase II conjugates it","Both phases perform conjugation reactions","Both phases are performed only by gut bacteria"],"ans":1,"exp":"Phase I reactions create a functional group on the drug (oxidation being the most common), and Phase II then conjugates that group, making the drug ionised, water soluble and easily excreted. (Book p11)"},{"id":"PHARM-C5-008","sec":"Placebo","page":11,"q":"The note about placebo states that placebo:","opts":["Does not contain any drug","Contains an inactive prodrug","Contains a subtherapeutic dose of drug","Contains only Phase II metabolites"],"ans":0,"exp":"Note: placebo does not contain any drug — it is used purely for the psychological (expectation) effect in trials. (Book p11)"},{"id":"PHARM-C5-009","sec":"Prodrugs","page":11,"q":"Which antimalarial drug is listed as a prodrug?","opts":["Chloroquine","Proguanil","Primaquine","Quinine"],"ans":1,"exp":"The prodrug list begins with proguanil — an inactive compound activated by metabolism into its antimalarial form. (Book p11)"},{"id":"PHARM-C5-010","sec":"Prodrugs","page":11,"q":"Regarding ACE inhibitors as prodrugs, the book states:","opts":["All ACE inhibitors are prodrugs","Ramipril and other ACE inhibitors are prodrugs, except captopril and lisinopril","Only captopril and lisinopril are prodrugs","No ACE inhibitor is a prodrug"],"ans":1,"exp":"'Ramipril & other ACE inhibitors (except Captopril, Lisinopril)' — captopril and lisinopril are already active, so they are the two exceptions to the prodrug rule. (Book p11)"},{"id":"PHARM-C5-011","sec":"Prodrugs","page":11,"q":"Which pair of drugs from the prodrug list is used for Parkinson's disease or its related movement disorders?","opts":["Dipivefrine and levodopa","Ganciclovir and gemcitabine","Proguanil and racecadotril","Sulfasalazine and omeprazole"],"ans":0,"exp":"The list includes 'Dipivefrine, Levodopa' — levodopa is the classic prodrug converted to dopamine in the brain. (Book p11)"},{"id":"PHARM-C5-012","sec":"Prodrugs","page":11,"q":"Which antisecretory (antidiarrhoeal) drug is listed as a prodrug?","opts":["Racecadotril","Loperamide","Bismuth subsalicylate","Octreotide"],"ans":0,"exp":"Racecadotril appears in the prodrug list; it is hydrolysed to its active enkephalinase-inhibiting metabolite. (Book p11)"},{"id":"PHARM-C5-013","sec":"Prodrugs","page":11,"q":"Which two anticancer drugs are listed as prodrugs?","opts":["Doxorubicin and cisplatin","5-fluorouracil and gemcitabine","Tamoxifen and raloxifene","Cyclophosphamide and busulfan"],"ans":1,"exp":"The list ends with 5-fluorouracil and gemcitabine — both require intracellular metabolic activation to their cytotoxic nucleotides. (Book p11)"},{"id":"PHARM-C5-014","sec":"Prodrugs","page":11,"q":"Which of the following pairs from the prodrug list are both used in acid-related disorders (ulcer disease)?","opts":["Omeprazole and oxcarbazepine","Oxcarbazepine and gemcitabine","Omeprazole and proguanil","Dipivefrine and racecadotril"],"ans":0,"exp":"The third prodrug line lists 'Oxcarbazepine, Omeprazole'; omeprazole is activated in acid-secreting gastric parietal cells, and oxcarbazepine is reduced to its active metabolite. (Book p11)"},{"id":"PHARM-C5-015","sec":"Prodrugs","page":11,"q":"Which of the following is NOT a prodrug as listed in the book?","opts":["Proguanil","Racecadotril","Gemcitabine","Lisinopril"],"ans":3,"exp":"Lisinopril (along with captopril) is specifically named as the exception — it is not a prodrug, unlike ramipril and the other ACE inhibitors. (Book p11)"},{"id":"PHARM-C5-016","sec":"Prodrugs","page":11,"q":"A 60-year-old man on ramipril for hypertension has poor blood-pressure control. The reason ramipril needs metabolic activation is that it is a:","opts":["Substrate of P-glycoprotein","Prodrug requiring conversion to its active form","Drug with a very short half-life","Competitive inhibitor of its own metabolism"],"ans":1,"exp":"Ramipril is a prodrug (ramipril is converted to the active ramiprilat); prodrugs are inactive as given and must be metabolised before they act. (Book p11)"},{"id":"PHARM-C5-017","sec":"Phase I reactions","page":11,"q":"The mnemonic for Phase I reactions is:","opts":["ORCHAD","HIPS Dance","LUNJA","WIPE"],"ans":0,"exp":"ORCHAD stands for Oxidation, Reduction, Cyclization, Hydrolysis, Aliphatic hydroxylation, Aromatic hydroxylation and Deamination — the Phase I reactions. HIPS Dance, LUNJA and WIPE belong to other topics. (Book p11)"},{"id":"PHARM-C5-018","sec":"Phase I reactions","page":11,"q":"The most common (m/c) Phase I reaction is:","opts":["Oxidation","Reduction","Hydrolysis","Cyclization"],"ans":0,"exp":"The list marks 'Oxidation (m/c)' — oxidation, catalysed chiefly by the CYP450 enzymes, is the commonest Phase I reaction. (Book p11)"},{"id":"PHARM-C5-019","sec":"Phase I reactions","page":11,"q":"Which of the following belongs to the Phase I reaction list?","opts":["Sulfation","Glucuronidation","Hydrolysis","Methylation"],"ans":2,"exp":"Hydrolysis is one of the ORCHAD Phase I reactions; sulfation, glucuronidation and methylation are Phase II conjugation reactions. (Book p11)"},{"id":"PHARM-C5-020","sec":"Phase I reactions","page":11,"q":"Aliphatic hydroxylation and aromatic hydroxylation are classified as:","opts":["Phase II conjugation reactions","Phase I reactions","Renal excretion mechanisms","Gut bacterial reactions only"],"ans":1,"exp":"Both appear in the ORCHAD Phase I list (A = aliphatic hydroxylation, A = aromatic hydroxylation) and are carried out by microsomal CYP450 enzymes. (Book p11)"},{"id":"PHARM-C5-021","sec":"Phase I reactions","page":11,"q":"Phase I reactions are carried out by:","opts":["Microsomal CYP450 enzymes","Gut bacterial glucuronidase","Cytosolic acetyltransferases","Plasma cholinesterases"],"ans":0,"exp":"'Phase I reactions are enabled by microsomal CYP450 enzymes' — the cytochrome P450 system is the principal Phase I machinery. (Book p11)"},{"id":"PHARM-C5-022","sec":"Phase II reactions","page":11,"q":"Phase II reactions are named after:","opts":["The enzyme that catalyses them","The conjugate that is added","The organ in which they occur","The Phase I reaction that preceded them"],"ans":1,"exp":"The heading states 'Phase II Reaction: Named after the conjugate' — e.g. glucuronidation is named after glucuronic acid added as the conjugate. (Book p11)"},{"id":"PHARM-C5-023","sec":"Phase II reactions","page":11,"q":"The most common (m/c) Phase II reaction, and the only microsomal one, is:","opts":["Glucuronidation","Acetylation","Sulfation","Methylation"],"ans":0,"exp":"'Glucuronidation (m/c): microsomal' — glucuronidation is the commonest Phase II reaction and the exception that takes place in the microsomes. (Book p11)"},{"id":"PHARM-C5-024","sec":"Phase II reactions","page":11,"q":"Which group of Phase II reactions are non-microsomal?","opts":["Glycination, glutathionation, acetylation, methylation and sulfation","Glucuronidation, oxidation and hydrolysis","Oxidation, reduction and cyclization","Only sulfation and acetylation"],"ans":0,"exp":"The brace labelled 'Non microsomal reactions' brackets glycination, glutathionation, acetylation, methylation and sulfation — glucuronidation is left outside because it is microsomal. (Book p11)"},{"id":"PHARM-C5-025","sec":"Phase II reactions","page":11,"q":"Which Phase II reaction is listed as microsomal?","opts":["Acetylation","Glucuronidation","Glutathionation","Sulfation"],"ans":1,"exp":"Glucuronidation is annotated 'microsomal', while acetylation, glutathionation, glycination, methylation and sulfation are grouped as non-microsomal. (Book p11)"},{"id":"PHARM-C5-026","sec":"CYP450 enzyme group","page":12,"q":"CY (cytochrome) is best described as a:","opts":["Heme protein that binds oxygen and facilitates metabolism","Conjugate added in Phase II metabolism","Pump that effluxes drugs from cells","Plasma protein that binds acidic drugs"],"ans":0,"exp":"'CY (cytochrome): Heme protein that binds oxygen → facilitates metabolism' — the haem iron is what allows CYP450 to oxidise drugs. (Book p12)"},{"id":"PHARM-C5-027","sec":"CYP450 enzyme group","page":12,"q":"The '450' in cytochrome P450 refers to:","opts":["Enzymes discovered in plant pigment, absorbing light of 450 nm wavelength","The molecular weight of the enzyme in kilodaltons","The number of substrate families known","A pH optimum of 4.50"],"ans":0,"exp":"'P450: enzymes discovered in plant pigment, absorbs light of 450 nm wavelength' — the name comes from the spectral absorption peak of the reduced CO-bound pigment. (Book p12)"},{"id":"PHARM-C5-028","sec":"CYP450 enzyme group","page":12,"q":"In the nomenclature CYP1A2, the numeral '1' denotes the:","opts":["Family","Subfamily","Geneisoform number","Chromosome number"],"ans":0,"exp":"'1 → denotes the family. A → subfamily. 2 → geneisoform number' — so CYP1A2 = family 1, subfamily A, isoform 2. (Book p12)"},{"id":"PHARM-C5-029","sec":"CYP450 enzyme group","page":12,"q":"In the nomenclature CYP1A2, the letter 'A' denotes the:","opts":["Subfamily","Family","Geneisoform number","Type of reaction catalysed"],"ans":0,"exp":"The letter is the subfamily (A in CYP1A2); the first number is the family and the last number the geneisoform. (Book p12)"},{"id":"PHARM-C5-030","sec":"CYP450 enzyme group","page":12,"q":"CYP1A2 is the example given in the book to illustrate which aspect of CYP nomenclature?","opts":["The full naming pattern family-subfamily-geneisoform","The microsomal location of CYP enzymes","The 450 nm absorption peak","The induction of CYP by rifampicin"],"ans":0,"exp":"Eg CYP1A2 is used to explain that the numeral denotes family, the letter the subfamily and the final numeral the geneisoform number. (Book p12)"},{"id":"PHARM-C5-031","sec":"CYP1A2","page":12,"q":"Which drugs are metabolised by CYP1A2?","opts":["Paracetamol, tacrine and theophylline","Phenytoin and warfarin","Omeprazole and clopidogrel","Rifampicin and phenobarbital"],"ans":0,"exp":"CYP1A2: paracetamol, tacrine and theophylline. (Book p12)"},{"id":"PHARM-C5-032","sec":"CYP2B6","page":12,"q":"Which two drugs are metabolised by CYP2B6?","opts":["6-mercaptopurine and methyldopa","Paracetamol and theophylline","Phenytoin and warfarin","Omeprazole and clopidogrel"],"ans":0,"exp":"CYP2B6: 6-mercaptopurine and methyldopa. (Book p12)"},{"id":"PHARM-C5-033","sec":"CYP2C9","page":12,"q":"CYP2C9 metabolises which two drugs?","opts":["Phenytoin and warfarin","Omeprazole and clopidogrel","Tamoxifen and codeine","Paracetamol and theophylline"],"ans":0,"exp":"CYP2C9: phenytoin and warfarin — the basis of the classic warfarin-phenytoin interaction. (Book p12)"},{"id":"PHARM-C5-034","sec":"CYP2C19","page":12,"q":"CYP2C19 performs which two opposite functions on its substrates?","opts":["It metabolises omeprazole and activates clopidogrel","It metabolises clopidogrel and activates omeprazole","It activates both omeprazole and clopidogrel","It metabolises both omeprazole and clopidogrel"],"ans":0,"exp":"CYP2C19 metabolises omeprazole but activates clopidogrel — one enzyme, opposite clinical consequences for its two substrates. (Book p12)"},{"id":"PHARM-C5-035","sec":"CYP2C19","page":12,"q":"In the CYP2C19 note, omeprazole and clopidogrel are described as:","opts":["Competitive inhibitors (substrates of the same enzyme)","Two drugs metabolised by different enzymes","Inducers of CYP2C19","Drugs with no interaction"],"ans":0,"exp":"They are bracketed as 'Competitive inhibitors (substrates of the same enzyme)' — both compete for CYP2C19. (Book p12)"},{"id":"PHARM-C5-036","sec":"CYP2C19","page":12,"q":"A patient on clopidogrel after stenting is prescribed omeprazole for dyspepsia. The expected consequence is:","opts":["Omeprazole decreases the effect of clopidogrel","Omeprazole increases the effect of clopidogrel","No interaction, as they act on different enzymes","Omeprazole increases clopidogrel levels causing bleeding"],"ans":0,"exp":"As stated: 'Omeprazole decreases the effect of clopidogrel' — it competes with clopidogrel for CYP2C19, so less clopidogrel is activated to its active metabolite. (Book p12)"},{"id":"PHARM-C5-037","sec":"CYP2D6","page":12,"q":"CYP2D6 metabolises which group of drugs?","opts":["Psychiatric drugs (antidepressants, antipsychotics), opioids and β-blockers","Anticoagulants and antiepileptics only","Anticancer drugs only","Antibiotics and antifungals"],"ans":0,"exp":"CYP2D6 metabolizes psychiatric drugs (antidepressants, antipsychotics), opioids and β-blockers. (Book p12)"},{"id":"PHARM-C5-038","sec":"CYP2D6","page":12,"q":"Besides metabolising drugs, CYP2D6 is stated to activate:","opts":["Tamoxifen","Clopidogrel","Omeprazole","Paracetamol"],"ans":0,"exp":"Under CYP2D6: 'Activates: Tamoxifen' — CYP2D6 converts tamoxifen into its active metabolite endoxifen. (Book p12)"},{"id":"PHARM-C5-039","sec":"CYP2E1","page":12,"q":"Chronic consumption of ethanol leads to:","opts":["CYP2E1 upregulation","CYP2E1 inhibition","CYP3A4 upregulation","No change in CYP2E1"],"ans":0,"exp":"The flowchart reads: ethanol — chronic consumption → CYP2E1 upregulation. (Book p12)"},{"id":"PHARM-C5-040","sec":"CYP2E1","page":12,"q":"Following chronic ethanol consumption, paracetamol is metabolised to increased amounts of NAPQI, resulting in:","opts":["Hepatotoxicity","Nephrolithiasis","Bone marrow aplasia","Ototoxicity"],"ans":0,"exp":"Chronic ethanol → CYP2E1 upregulation → paracetamol → ↑NAPQI → hepatotoxicity; CYP2E1-generated NAPQI is the toxic metabolite of paracetamol. (Book p12)"},{"id":"PHARM-C5-041","sec":"CYP2E1","page":12,"q":"Paracetamol is metabolised predominantly by which enzyme, as noted in the flowchart?","opts":["CYP2E1, much more than CYP1A2","CYP1A2, much more than CYP2E1","CYP3A4 only","CYP2D6 only"],"ans":0,"exp":"'(Paracetamol metabolised by CYP2E1 >> CYP1A2)' — CYP2E1 accounts for the greater part, which is why alcohol-induced CYP2E1 upregulation predisposes to paracetamol hepatotoxicity. (Book p12)"},{"id":"PHARM-C5-042","sec":"CYP2E1","page":12,"q":"An alcoholic with chronic liver disease takes an overdose of paracetamol. The risk of hepatotoxicity is high because:","opts":["CYP2E1 is upregulated, generating more NAPQI","CYP2E1 is inhibited, so paracetamol accumulates unchanged","Glucuronidation is increased","Renal excretion of paracetamol is enhanced"],"ans":0,"exp":"Chronic alcohol upregulates CYP2E1, shifting more paracetamol to the toxic NAPQI pathway and causing hepatotoxicity. (Book p12)"},{"id":"PHARM-C5-043","sec":"CYP3A4","page":12,"q":"The most common (m/c) CYP450 enzyme is:","opts":["CYP3A4","CYP2D6","CYP2C9","CYP1A2"],"ans":0,"exp":"'CYP3A4 (m/c): metabolises >50% of drugs' — it is the most common isoform, handling more than half of all drugs. (Book p12)"},{"id":"PHARM-C5-044","sec":"CYP3A4","page":12,"q":"CYP3A4 metabolises:","opts":["More than 50% of drugs","About 10% of drugs","Only anticancer drugs","Only prodrugs"],"ans":0,"exp":"CYP3A4 metabolises >50% of drugs, and mifepristone is the example given. (Book p12)"},{"id":"PHARM-C5-045","sec":"CYP3A4","page":12,"q":"The example of a drug metabolised by CYP3A4 given in the book is:","opts":["Mifepristone","Warfarin","Theophylline","Methyldopa"],"ans":0,"exp":"'metabolises >50% of drugs (eg: mifepristone)' — mifepristone is quoted as a CYP3A4 substrate. (Book p12)"},{"id":"PHARM-C5-046","sec":"Glucuronidation","page":13,"q":"Atazanavir causes which adverse effect through glucuronidation-related metabolism?","opts":["Steven Johnson syndrome","Cholestatic jaundice","Nephrotoxicity","Ototoxicity"],"ans":0,"exp":"Under glucuronidation: 'Atazanavir (antiviral) — Cause → Steven Johnson syndrome'. (Book p13)"},{"id":"PHARM-C5-047","sec":"Glucuronidation","page":13,"q":"Irinotecan, an anticancer drug, causes:","opts":["Toxicity","Steven Johnson syndrome","Drug-induced SLE","OCP failure"],"ans":0,"exp":"Under glucuronidation: irinotecan (anticancer) → toxicity (its glucuronidation by UGT determines the severity of diarrhoea and neutropenia). (Book p13)"},{"id":"PHARM-C5-048","sec":"Crigler Najjar syndrome","page":13,"q":"Atazanavir and irinotecan are both contraindicated in:","opts":["Crigler Najjar syndrome","Gilbert syndrome","G6PD deficiency","Porphyria cutanea tarda"],"ans":0,"exp":"The brace states 'Both drugs are c/i in Crigler Najjar syndrome' — glucuronidation is already defective there, so these glucuronidated drugs are contraindicated. (Book p13)"},{"id":"PHARM-C5-049","sec":"Estrogen enterohepatic circulation","page":13,"q":"Estrogen is metabolised in the liver by:","opts":["Phase I with CYP3A4, then Phase II glucuronidation","Phase I with CYP2D6, then sulfation","Acetylation followed by methylation","Glutathionation followed by hydrolysis"],"ans":0,"exp":"In the flowchart, liver metabolism of estrogen = Phase I with CYP3A4 and Phase II glucuronidation, forming estrogen + glucuronic acid. (Book p13)"},{"id":"PHARM-C5-050","sec":"Estrogen enterohepatic circulation","page":13,"q":"The liver converts estrogen into:","opts":["Estrogen + glucuronic acid, which is water soluble","Estrogen + sulfate, which is lipid soluble","Free estrogen, which is water soluble","Estrogen + glutathione, which is lipid soluble"],"ans":0,"exp":"Phase II glucuronidation yields 'estrogen + glucuronic acid (water soluble)', which is then excreted in bile into the small intestine. (Book p13)"},{"id":"PHARM-C5-051","sec":"Estrogen enterohepatic circulation","page":13,"q":"In the small intestine, estrogen glucuronide undergoes:","opts":["Glucuronidase action by gut bacteria","Further glucuronidation by enterocytes","Active transport into the portal vein","Conversion to NAPQI"],"ans":0,"exp":"Small intestine: glucuronidase action by gut bacteria splits the conjugate, releasing 'estrogen broken down + lipid soluble'. (Book p13)"},{"id":"PHARM-C5-052","sec":"Estrogen enterohepatic circulation","page":13,"q":"After gut bacterial glucuronidase acts on estrogen glucuronide, the estrogen becomes:","opts":["Lipid soluble and reabsorbed","Water soluble and excreted","Ionised and not absorbed","Bound to plasma proteins"],"ans":0,"exp":"The deconjugated 'estrogen broken down + lipid soluble' is reabsorbed (returning to the liver along the arrow) — the basis of enterohepatic circulation. (Book p13)"},{"id":"PHARM-C5-053","sec":"Estrogen enterohepatic circulation","page":13,"q":"Enterohepatic circulation of estrogen is described as producing:","opts":["Extension of normal T½","Shortening of normal T½","No change in T½","Zero-order elimination"],"ans":0,"exp":"The boxed label reads 'Enterohepatic Circulation: Extension of normal T½' — recycling through gut and liver keeps estrogen in the body longer. (Book p13)"},{"id":"PHARM-C5-054","sec":"Estrogen enterohepatic circulation","page":13,"q":"Antibiotics interfere with estrogen recycling by:","opts":["Killing gut bacteria, reducing enterohepatic circulation of estrogen","Increasing bacterial glucuronidase activity","Blocking hepatic CYP3A4","Increasing biliary excretion of estrogen"],"ans":0,"exp":"The flowchart shows antibiotics (with a 'kill' symbol) → ↓enterohepatic circulation of estrogen — by removing the gut bacteria that deconjugate it. (Book p13)"},{"id":"PHARM-C5-055","sec":"Estrogen enterohepatic circulation","page":13,"q":"The clinical consequence of antibiotics reducing enterohepatic circulation of estrogen is:","opts":["↓T½ of estrogen → OCP failure","↑T½ of estrogen → toxicity","No effect on contraceptive efficacy","↑Biliary excretion and jaundice"],"ans":0,"exp":"Antibiotics → ↓enterohepatic circulation → ↓T½ → OCP failure; the estrogen is cleared faster and contraceptive cover is lost. (Book p13)"},{"id":"PHARM-C5-056","sec":"Estrogen enterohepatic circulation","page":13,"q":"A woman on oral contraceptive pills develops diarrhoea and is given antibiotics. Loss of contraceptive efficacy occurs because:","opts":["Gut bacteria are reduced, so estrogen is not deconjugated and recycled","The antibiotic induces CYP3A4 and destroys estrogen","The antibiotic binds estrogen in plasma","The antibiotic increases renal excretion of estrogen"],"ans":0,"exp":"Antibiotics lower gut bacteria and thus reduce enterohepatic circulation of estrogen, shortening its T½ and causing OCP failure. (Book p13)"},{"id":"PHARM-C5-057","sec":"Acetylation","page":13,"q":"The mnemonic for the drugs undergoing acetylation is:","opts":["HIPS Dance","ORCHAD","LUNJA","WIPE"],"ans":0,"exp":"HIPS Dance = Hydralazine, Isoniazid, Procainamide, Sulfonamide and Dapsone — the acetylation substrates. (Book p13)"},{"id":"PHARM-C5-058","sec":"Acetylation","page":13,"q":"Which of the following drugs undergo acetylation?","opts":["Hydralazine, isoniazid, procainamide, sulfonamide and dapsone","Rifampicin, phenytoin, phenobarbital and carbamazepine","Verapamil, amiodarone, quinidine and digoxin","Paracetamol, tacrine and theophylline"],"ans":0,"exp":"The HIPS Dance list: Hydralazine, Isoniazid, Procainamide, Sulfonamide, Dapsone. (Book p13)"},{"id":"PHARM-C5-059","sec":"Acetylation","page":13,"q":"Which important adverse effect is bracketed against the acetylated drugs?","opts":["Drug induced SLE","Steven Johnson syndrome","Cholestatic jaundice","Aplastic anaemia"],"ans":0,"exp":"The brace against the HIPS list reads 'Can cause drug induced SLE' — hydralazine and procainamide are the classic culprits. (Book p13)"},{"id":"PHARM-C5-060","sec":"Acetylation","page":13,"q":"A patient on hydralazine for hypertension develops arthralgia, rash and a positive ANA. The likely diagnosis is:","opts":["Drug-induced SLE","Steven Johnson syndrome","Serum sickness","Crigler Najjar syndrome"],"ans":0,"exp":"Hydralazine belongs to the acetylated HIPS drugs (Hydralazine, Isoniazid, Procainamide, Sulfonamide, Dapsone) which can cause drug induced SLE. (Book p13)"},{"id":"PHARM-C5-061","sec":"Enzyme induction","page":14,"q":"Drug interactions in this chapter occur due to:","opts":["Microsomal enzyme induction or inhibition","Changes in plasma protein binding only","Competition for renal tubular secretion only","Changes in gastric pH only"],"ans":0,"exp":"'D/t microsomal enzymes induction or inhibition' — the drug interaction table is built entirely around CYP450 microsomal induction and inhibition. (Book p14)"},{"id":"PHARM-C5-062","sec":"Enzyme induction","page":14,"q":"Enzyme inducers act by:","opts":["↑ enzyme → ↑ metabolism → ↓ plasma concentration → drug failure","↓ enzyme → ↓ metabolism → ↑ plasma concentration → toxicity","↑ enzyme → ↓ metabolism → ↑ plasma concentration → toxicity","↓ enzyme → ↑ metabolism → ↓ plasma concentration → failure"],"ans":0,"exp":"Inducers increase enzyme amount, so metabolism increases, plasma concentration falls and the drug fails to act. (Book p14)"},{"id":"PHARM-C5-063","sec":"Enzyme inhibition","page":14,"q":"Enzyme inhibitors act by:","opts":["↓ enzyme → ↓ metabolism → ↑ plasma concentration → drug toxicity","↑ enzyme → ↑ metabolism → ↓ plasma concentration → drug failure","↓ enzyme → ↑ metabolism → ↓ plasma concentration → failure","↑ enzyme → ↓ metabolism → ↑ plasma concentration → toxicity"],"ans":0,"exp":"Inhibitors reduce the enzyme, metabolism falls, plasma concentration rises and the drug becomes toxic. (Book p14)"},{"id":"PHARM-C5-064","sec":"Enzyme inducers","page":14,"q":"Which group lists the enzyme inducers from the table?","opts":["Griseofulvin, rifampicin, chronic alcohol, benzopyrene, phenobarbital, carbamazepine and St. John's wort","Quinidine, isoniazid, cimetidine, ciprofloxacin and valproate","Paracetamol, theophylline, tacrine and warfarin","Omeprazole, clopidogrel and tamoxifen"],"ans":0,"exp":"Examples of inducers: griseofulvin, rifampicin, alcohol (chronic), benzopyrene, phenobarbital, carbamazepine and St. John's wort. (Book p14)"},{"id":"PHARM-C5-065","sec":"Enzyme inducers","page":14,"q":"St. John's wort is described in the table as:","opts":["A plant used to treat depression, and an enzyme inducer","An antifungal enzyme inhibitor","A herbal diuretic with no interactions","An enzyme inducer used for epilepsy"],"ans":0,"exp":"'St. John's wart (Plant used to treat depression)' is listed among the inducers — a herbal antidepressant that induces microsomal enzymes and can cause contraceptive failure. (Book p14)"},{"id":"PHARM-C5-066","sec":"Enzyme inducers","page":14,"q":"Benzopyrene, an enzyme inducer in the table, is best known as:","opts":["A constituent of tobacco smoke","An antifungal antibiotic","A barbiturate anticonvulsant","A macrolide antibiotic"],"ans":0,"exp":"Benzopyrene, a polycyclic aromatic hydrocarbon of tobacco smoke, is listed among enzyme inducers (as it induces CYP1A1/1A2). (Book p14)"},{"id":"PHARM-C5-067","sec":"Enzyme inhibitors","page":14,"q":"Which of the following are listed as enzyme inhibitors?","opts":["Acute alcohol consumption, quinidine, isoniazid, cimetidine, ciprofloxacin, ketoconazole, valproate, erythromycin/clarithromycin, grapefruit juice and diethylcarbamazine","Griseofulvin, rifampicin, phenobarbital, carbamazepine and St. John's wort","Hydralazine, procainamide, dapsone and sulfonamide","Insulin, glucose and sodium bicarbonate"],"ans":0,"exp":"The inhibitor column lists acute alcohol consumption, quinidine, isoniazid, cimetidine, ciprofloxacin, ketoconazole, valproate, erythromycin/clarithromycin, grapefruit juice and diethylcarbamazine. (Book p14)"},{"id":"PHARM-C5-068","sec":"Enzyme inhibitors","page":14,"q":"Alcohol appears in the table as both inducer and inhibitor. The correct distinction is:","opts":["Acute consumption inhibits; chronic consumption induces","Acute consumption induces; chronic consumption inhibits","Both acute and chronic consumption inhibit","Alcohol is not an enzyme inducer"],"ans":0,"exp":"The table lists 'Alcohol (Chronic)' among inducers and 'Acute alcohol consumption' among inhibitors — the classic acute-inhibition, chronic-induction pattern. (Book p14)"},{"id":"PHARM-C5-069","sec":"Enzyme inhibitors","page":14,"q":"Grapefruit juice is included in the table because it is:","opts":["An enzyme inhibitor","An enzyme inducer","An inactive placebo","A P-glycoprotein inducer"],"ans":0,"exp":"Grapefruit juice appears in the inhibitor list — it inhibits CYP3A4 in the gut wall, raising levels of co-administered CYP3A4 substrates. (Book p14)"},{"id":"PHARM-C5-070","sec":"Enzyme inhibitors","page":14,"q":"Diethylcarbamazine, listed as an enzyme inhibitor, is clinically used as:","opts":["An antifilarial drug","An antifungal drug","An antitubercular drug","An anticonvulsant"],"ans":0,"exp":"Diethylcarbamazine (DEC) is the antifilarial agent listed among enzyme inhibitors. (Book p14)"},{"id":"PHARM-C5-071","sec":"Enzyme inducers","page":14,"q":"Which of the following is an enzyme inducer?","opts":["Rifampicin","Cimetidine","Ketoconazole","Valproate"],"ans":0,"exp":"Rifampicin is a classic microsomal enzyme inducer; cimetidine, ketoconazole and valproate are enzyme inhibitors. (Book p14)"},{"id":"PHARM-C5-072","sec":"Enzyme inhibitors","page":14,"q":"Which one of the following is NOT an enzyme inhibitor?","opts":["Carbamazepine","Cimetidine","Ciprofloxacin","Ketoconazole"],"ans":0,"exp":"Carbamazepine is an enzyme inducer; cimetidine, ciprofloxacin and ketoconazole are all listed inhibitors. (Book p14)"},{"id":"PHARM-C5-073","sec":"Enzyme induction/inhibition","page":14,"q":"In the interaction table, the effect of an inducer on metabolism and plasma concentration respectively is:","opts":["↑ metabolism, ↓ plasma concentration","↓ metabolism, ↑ plasma concentration","↑ metabolism, ↑ plasma concentration","↓ metabolism, ↓ plasma concentration"],"ans":0,"exp":"For inducers the cascade is ↑enzyme → ↑metabolism → ↓plasma concentration → drug failure. (Book p14)"},{"id":"PHARM-C5-074","sec":"Enzyme induction/inhibition","page":14,"q":"Which statement about microsomal enzyme interactions is TRUE?","opts":["Inducers cause drug failure, while inhibitors cause drug toxicity","Inducers cause toxicity, while inhibitors cause failure","Both inducers and inhibitors cause failure","Neither alters drug plasma concentration"],"ans":0,"exp":"The summary of the table: inducers increase metabolism and lower plasma concentration, leading to drug failure; inhibitors reduce metabolism and raise plasma concentration, leading to toxicity. (Book p14)"},{"id":"PHARM-C5-075","sec":"Clinical significance","page":14,"q":"In the case of OCP failure due to rifampicin, the clinical significance column advises:","opts":["Change the method of contraception (IUD or condoms), or avoid enzyme inducers, or ↑ the dose of drugs","Stop rifampicin immediately in all patients","Double the OCP dose and continue rifampicin","Add an enzyme inhibitor to the regimen"],"ans":0,"exp":"For OCP failure due to rifampicin the actions given are: change the method of contraception (IUD or condoms), or avoid enzyme inducers, or ↑ the dose of drugs (eg phenytoin & retigabine). (Book p14)"},{"id":"PHARM-C5-076","sec":"Clinical significance","page":14,"q":"Which examples are given for increasing the dose of a drug when an enzyme inducer cannot be avoided?","opts":["Phenytoin and retigabine","Warfarin and omeprazole","Clopidogrel and tamoxifen","Cimetidine and ketoconazole"],"ans":0,"exp":"The table cites '(Eg. Phenytoin & Retigabine)' as drugs whose dose is increased when an inducer has to be continued. (Book p14)"},{"id":"PHARM-C5-077","sec":"Clinical significance","page":14,"q":"Erythromycin, an enzyme inhibitor, leads to theophylline toxicity causing:","opts":["Arrhythmia and fibrillation","Cholestatic jaundice and hepatitis","Nephritis and renal failure","Optic neuritis and blindness"],"ans":0,"exp":"Clinical significance of inhibitors: 1. Erythromycin → theophylline toxicity (↓ arrhythmia, ↓ fibrillation) — the arrows indicate the toxic manifestations. (Book p14)"},{"id":"PHARM-C5-078","sec":"Clinical significance","page":14,"q":"Clarithromycin, an enzyme inhibitor, can precipitate:","opts":["Statin toxicity","Theophylline failure","Digoxin failure","OCP failure"],"ans":0,"exp":"'2. Clarithromycin → Statin toxicity' — by inhibiting CYP3A4 metabolism of statins, clarithromycin can cause myopathy/rhabdomyolysis. (Book p14)"},{"id":"PHARM-C5-079","sec":"Clinical significance","page":14,"q":"A patient on theophylline develops arrhythmia after being started on erythromycin. The mechanism is:","opts":["Enzyme inhibition raising theophylline levels","Enzyme induction lowering theophylline levels","Displacement from plasma protein binding","Reduced renal tubular secretion of theophylline"],"ans":0,"exp":"Erythromycin inhibits the microsomal enzyme metabolising theophylline, so theophylline levels rise and arrhythmia/fibrillation result. (Book p14)"},{"id":"PHARM-C5-080","sec":"Clinical significance","page":14,"q":"A patient on simvastatin develops muscle pain and raised CK after a course of clarithromycin. This is because clarithromycin:","opts":["Inhibits statin metabolism, causing statin toxicity","Induces statin metabolism, causing statin failure","Increases renal statin clearance","Blocks statin absorption"],"ans":0,"exp":"Clarithromycin is a microsomal enzyme inhibitor → statin toxicity; less statin is metabolised, so levels rise and myopathy occurs. (Book p14)"},{"id":"PHARM-C6-001","sec":"Excretion basics","page":15,"q":"Which type of drug is excreted from the body?","opts":["Ionised / water soluble / polar drug","Non-polar / lipid soluble drug","Plasma protein bound drug","Unionised neutral drug"],"ans":0,"exp":"The chapter opens with 'Ionised / water soluble / polar drug' — only the water-soluble, polar form of a drug is available for excretion. (Book p15)"},{"id":"PHARM-C6-002","sec":"Excretion basics","page":15,"q":"The two major organs of excretion are:","opts":["Kidney and liver","Lung and skin","Spleen and gut","Salivary gland and sweat gland"],"ans":0,"exp":"The major organs of excretion are kidneys and liver; minor routes (saliva, sweat) are mentioned separately. (Book p15)"},{"id":"PHARM-C6-003","sec":"Excretion basics","page":15,"q":"The most common (m/c) organ for excretion is the kidney; the most common organ involved in metabolism is the:","opts":["Liver","Kidney","Lung","Intestine"],"ans":0,"exp":"The flowchart marks kidneys as the m/c organ for excretion, and the note states 'm/c organ involved in metabolism → Liver'. (Book p15)"},{"id":"PHARM-C6-004","sec":"Excretion basics","page":15,"q":"Besides the major organs of excretion, some drugs are excreted through:","opts":["Saliva and sweat","Bone and cartilage","CSF and vitreous","Lymph and synovial fluid"],"ans":0,"exp":"'Some drugs are excreted through saliva & sweat' — minor routes that can matter for drug detection and for side effects. (Book p15)"},{"id":"PHARM-C6-005","sec":"Filtration vs tubular secretion","page":15,"q":"According to the table of excretory mechanisms, filtration accounts for what percentage of drug excretion?","opts":["20%","50%","80%","100%"],"ans":0,"exp":"The table columns are headed 'Filtration (20%)' and 'Tubular secretion (80%)'. (Book p15)"},{"id":"PHARM-C6-006","sec":"Filtration vs tubular secretion","page":15,"q":"Which mechanism accounts for the majority (80%) of drug excretion?","opts":["Tubular secretion","Glomerular filtration","Biliary excretion","Salivary excretion"],"ans":0,"exp":"Tubular secretion is labelled 80% while filtration is 20% — active tubular secretion is the dominant renal excretory mechanism. (Book p15)"},{"id":"PHARM-C6-007","sec":"Filtration vs tubular secretion","page":15,"q":"Unbound drug is excreted by:","opts":["Filtration but not tubular secretion","Tubular secretion but not filtration","Both filtration and tubular secretion","Neither filtration nor tubular secretion"],"ans":0,"exp":"Table row 'unbound drug': filtration (+) but tubular secretion (−); only the free, unbound fraction is filtered at the glomerulus. (Book p15)"},{"id":"PHARM-C6-008","sec":"Filtration vs tubular secretion","page":15,"q":"Plasma protein (negative charge) bound drug is excreted by:","opts":["Tubular secretion but not filtration","Filtration but not tubular secretion","Both filtration and tubular secretion","Neither filtration nor tubular secretion"],"ans":0,"exp":"Table row 'Plasma protein (negative charge) bound drug': filtration (−) but tubular secretion (+); tubular secretion is the route by which protein-bound drug is still excreted. (Book p15)"},{"id":"PHARM-C6-009","sec":"Filtration vs tubular secretion","page":15,"q":"Protein-bound drug is not filtered because of the:","opts":["Negative charge of the basement membrane","Positive charge of the basement membrane","Large size of the drug molecule alone","Absence of porins in the glomerulus"],"ans":0,"exp":"The table annotates filtration (−) for protein-bound drug as 'd/t −ve charge of basement membrane' — the negatively charged glomerular barrier repels the anionic protein-drug complex. (Book p15)"},{"id":"PHARM-C6-010","sec":"Filtration vs tubular secretion
