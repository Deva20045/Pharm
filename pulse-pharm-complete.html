":6,"title":"IR, SR and CR: Three Shapes of a Release Curve","sec":"Absorption of oral drugs · p6","qs":["PHARM-C3-042","PHARM-C3-043","PHARM-C3-044","PHARM-C3-045","PHARM-C3-046","PHARM-C3-047","PHARM-C3-048","PHARM-C3-049","PHARM-C3-050","PHARM-C3-051","PHARM-C3-052","PHARM-C3-053","PHARM-C3-054","PHARM-C3-055","PHARM-C3-056","PHARM-C3-057","PHARM-C3-058"],"guide":"A tablet is either immediate release (IR) or extended release (ER), and ER splits into sustained release (SR) and controlled release (CR), the latter also called zero order CR. IR gives repeated sharp peaks with frequent dosing (indomethacin TID) and poor compliance; SR uses a polymer coating for a shorter peak and longer duration; CR coats the pores to give a flat plateau."},{"id":"PHARM-U3-7","ch":3,"n":7,"title":"Bypassing the Stomach: Delayed Release & Enteric Coating","sec":"a. Drugs bypassing the stomach · p7","qs":["PHARM-C3-059","PHARM-C3-060","PHARM-C3-061","PHARM-C3-062","PHARM-C3-063","PHARM-C3-064","PHARM-C3-065"],"guide":"Two tricks avoid the stomach: delayed release, which delivers the drug to the small intestine (sulfasalazine for ulcerative colitis), and enteric coating, which shields an acid-labile drug from gastric HCl (PPIs). One moves the release site, the other protects the drug."},{"id":"PHARM-U3-8","ch":3,"n":8,"title":"Bioavailability: Definition, Factors and the AUC Formula","sec":"BIOAVAILABILITY (F) · p7","qs":["PHARM-C3-066","PHARM-C3-067","PHARM-C3-068","PHARM-C3-069","PHARM-C3-070","PHARM-C3-071","PHARM-C3-072","PHARM-C3-073","PHARM-C3-074"],"guide":"Bioavailability is the fraction of drug reaching the systemic circulation unchanged. From 100% intestinal absorption, a fraction is excreted and a fraction undergoes hepatic first pass metabolism, leaving only the rest in circulation. F = AUCoral/AUCiv × 100; AUC is the extent of absorption, and IV is the only route with 100% bioavailability."},{"id":"PHARM-U3-9","ch":3,"n":9,"title":"Route by Route: Bioavailability Table","sec":"Route of administration · p8","qs":["PHARM-C3-075","PHARM-C3-076","PHARM-C3-077","PHARM-C3-078","PHARM-C3-079"],"guide":"IV bioavailability is 1, im/sc 0.75–1.0, and oral the widest range of 0.05–1.0 because first pass metabolism varies by drug. Remember the note: F tells you the extent, never the rate, of absorption."},{"id":"PHARM-U3-10","ch":3,"n":10,"title":"Cmax & Tmax: Rate Versus Extent","sec":"RATE OF DRUG ABSORPTION · p8","qs":["PHARM-C3-080","PHARM-C3-081","PHARM-C3-082","PHARM-C3-083","PHARM-C3-084"],"guide":"On a plasma concentration-time curve, Cmax is the highest concentration achieved and Tmax is the time at which it occurs. Tmax is the marker of the rate of absorption, while AUC gives the extent — two different questions answered by two different parameters."},{"id":"PHARM-U3-11","ch":3,"n":11,"title":"Bioequivalence: Branded, Generic, ANDA & the ±20% Rule","sec":"Bioequivalence in drug industry · p8","qs":["PHARM-C3-085","PHARM-C3-086","PHARM-C3-087","PHARM-C3-088","PHARM-C3-089","PHARM-C3-090","PHARM-C3-091","PHARM-C3-092","PHARM-C3-093"],"guide":"Bioequivalence means two pharmaceutically equivalent products with similar rate (Tmax) and extent (AUC) of absorption. The branded drug is invented and patented for 20 years; the generic is a legal copy marketed after patent expiry, cheaper, approved through ANDA provided it is bioequivalent to the branded drug within ±20%."},{"id":"PHARM-U4-1","ch":4,"n":1,"title":"Apparent Volume of Distribution: Definition","sec":"Apparent Volume of Distribution (AVd) · p9","qs":["PHARM-C4-001","PHARM-C4-002","PHARM-C4-003","PHARM-C4-004","PHARM-C4-005"],"guide":"AVD is the hypothetical volume of plasma in litres needed to account for all the drug in the body, intravascular and extravascular. A drug with a high AVD sits mainly in tissue; one with a low AVD stays in the systemic circulation. That is why it is only an 'apparent' volume."},{"id":"PHARM-U4-2","ch":4,"n":2,"title":"AVD and the Loading Dose Formulas","sec":"Calculation · p9","qs":["PHARM-C4-006","PHARM-C4-007","PHARM-C4-008","PHARM-C4-009","PHARM-C4-010","PHARM-C4-011","PHARM-C4-012","PHARM-C4-013","PHARM-C4-014"],"guide":"AVD = D/C0 × f, where C0 is the initial plasma concentration and f is bioavailability (f = 1 for the IV route). Rearranged for practice, loading dose D = AVD × CT/f, so D ∝ AVD/f: a larger volume of distribution or lower bioavailability demands a bigger loading dose to hit the target concentration."},{"id":"PHARM-U4-3","ch":4,"n":3,"title":"What Determines the Volume of Distribution?","sec":"Factors determining AVd · p9","qs":["PHARM-C4-015","PHARM-C4-016","PHARM-C4-017","PHARM-C4-018","PHARM-C4-019","PHARM-C4-020","PHARM-C4-021","PHARM-C4-022","PHARM-C4-023"],"guide":"Fat content drives vd: obesity raises it, athletes lower it, and women have more than men because of higher fat content. Lipid solubility raises vd, albumin binding lowers it (binding ∝ 1/vd) and tissue binding raises it. The drug's own chemistry and the patient's body composition both matter."},{"id":"PHARM-U4-4","ch":4,"n":4,"title":"Digoxin: Distributed to Muscle, Dosed on Lean Mass","sec":"AVd — eg: Digoxin · p9","qs":["PHARM-C4-024","PHARM-C4-025","PHARM-C4-026","PHARM-C4-027","PHARM-C4-028"],"guide":"Digoxin leaves plasma for skeletal muscle, which outweighs the heart even though the heart is the target organ. Consequently digoxin's loading dose is calculated from lean body mass, not total body mass — dosing an obese patient on total weight overshoots."},{"id":"PHARM-U4-5","ch":4,"n":5,"title":"High AVD = Dialysis Is a Waste of Time","sec":"Significance in toxicity · p9","qs":["PHARM-C4-029","PHARM-C4-030","PHARM-C4-031","PHARM-C4-032"],"guide":"With a very high vd the extravascular concentration is high and intravascular concentration is low, so dialysis can clear almost none of the drug — it is ineffective. Antidotes, not dialysis, are the treatment of poisoning by such drugs."},{"id":"PHARM-U4-6","ch":4,"n":6,"title":"BADDOC: Drugs With High vd, and Their Antidotes","sec":"Drugs with ↑ vd · p10","qs":["PHARM-C4-033","PHARM-C4-034","PHARM-C4-035","PHARM-C4-036","PHARM-C4-037","PHARM-C4-038","PHARM-C4-039","PHARM-C4-040","PHARM-C4-041","PHARM-C4-042","PHARM-C4-043","PHARM-C4-044","PHARM-C4-045","PHARM-C4-046","PHARM-C4-047","PHARM-C4-048","PHARM-C4-049","PHARM-C4-050"],"guide":"Remember BADDOC — Benzodiazepines, Beta blockers, Amphetamines, Digoxin, Opioids, Calcium channel blockers (with organophosphates alongside). These are not cleared by dialysis, so each has a specific antidote: flumazenil, glucagon (raises cAMP), ammonium chloride, digibind, naloxone, calcium gluconate and atropine."},{"id":"PHARM-U4-7","ch":4,"n":7,"title":"Albumin vs α1 Acid Glycoprotein: Who Binds What","sec":"Plasma protein binding · p10","qs":["PHARM-C4-051","PHARM-C4-052","PHARM-C4-053","PHARM-C4-054","PHARM-C4-055","PHARM-C4-056","PHARM-C4-057","PHARM-C4-058","PHARM-C4-059","PHARM-C4-060"],"guide":"Albumin is the commonest plasma protein and binds acidic drugs — antipsychotics, antidepressants, antiepileptics, sulfonamides, warfarin and aspirin. α1 acid glycoprotein binds basic drugs — tricyclic antidepressants, opioids and antiarrhythmics such as beta blockers, amiodarone and lidocaine."},{"id":"PHARM-U4-8","ch":4,"n":8,"title":"Displacement: Why Warfarin Plus Aspirin Bleeds","sec":"Plasma protein binding · p10","qs":["PHARM-C4-061","PHARM-C4-062"],"guide":"Warfarin and aspirin are both albumin bound. Given together they displace each other, each raising the other's plasma concentration of free drug — and the clinical result written in the margin is increased bleeding."},{"id":"PHARM-U4-9","ch":4,"n":9,"title":"Low Albumin Causes Toxicity, High AGP Causes Failure","sec":"Effect on drugs · p10","qs":["PHARM-C4-063","PHARM-C4-064","PHARM-C4-065","PHARM-C4-066","PHARM-C4-067","PHARM-C4-068"],"guide":"A fall in albumin leaves more free drug and so more toxicity; a rise in α1 acid glycoprotein binds more drug and so lowers free drug and effect. The same principle explains why heavily albumin-bound drugs have a low volume of distribution — they stay in the plasma."},{"id":"PHARM-U4-10","ch":4,"n":10,"title":"Clinical Applications: Nephrotic, Cirrhotic, Inflamed, Infarcted","sec":"Clinical Application · p10","qs":["PHARM-C4-069","PHARM-C4-070","PHARM-C4-071","PHARM-C4-072","PHARM-C4-073","PHARM-C4-074","PHARM-C4-075","PHARM-C4-076","PHARM-C4-077","PHARM-C4-078"],"guide":"Albumin falls in nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus — predict toxicity of albumin-bound drugs. α1 glycoprotein rises in inflammation (rheumatoid arthritis, inflammatory bowel disease) and myocardial infarction — predict reduced free drug and reduced effect, as with lidocaine in MI."},{"id":"PHARM-U5-1","ch":5,"n":1,"title":"Phase I and Phase II Metabolism: Two Steps to Excretion","sec":"PHARMACOKINETICS: METABOLISM · p11","qs":["PHARM-C5-001","PHARM-C5-002","PHARM-C5-003","PHARM-C5-004","PHARM-C5-005","PHARM-C5-006","PHARM-C5-007","PHARM-C5-008"],"guide":"Phase I breaks the drug down to yield a functional group, activating a prodrug or inactivating an active drug; Phase II then conjugates that group with a negatively charged moiety, making the drug ionized, water soluble and easily excreted. Placebo, by contrast, contains no drug at all."},{"id":"PHARM-U5-2","ch":5,"n":2,"title":"Prodrugs: The Full List","sec":"Prodrugs · p11","qs":["PHARM-C5-009","PHARM-C5-010","PHARM-C5-011","PHARM-C5-012","PHARM-C5-013","PHARM-C5-014","PHARM-C5-015","PHARM-C5-016"],"guide":"Prodrugs are inactive as given and require metabolism for activation: proguanil, ramipril and other ACE inhibitors (except captopril and lisinopril), oxcarbazepine, omeprazole, dipivefrine, levodopa, racecadotril, 5-fluorouracil and gemcitabine. Knowing the exceptions and the drug classes is what makes this list clinically usable."},{"id":"PHARM-U5-3","ch":5,"n":3,"title":"Phase I Reactions (ORCHAD) and Phase II Conjugations","sec":"Reactions of drugs in the phases · p11","qs":["PHARM-C5-017","PHARM-C5-018","PHARM-C5-019","PHARM-C5-020","PHARM-C5-021","PHARM-C5-022","PHARM-C5-023","PHARM-C5-024","PHARM-C5-025"],"guide":"Phase I reactions follow ORCHAD — Oxidation (m/c), Reduction, Cyclization, Hydrolysis, Aliphatic and Aromatic hydroxylation, Deamination — all enabled by microsomal CYP450 enzymes. Phase II reactions are named after the conjugate added; glucuronidation is the most common and the only microsomal one, while glycination, glutathionation, acetylation, methylation and sulfation are non-microsomal."},{"id":"PHARM-U5-4","ch":5,"n":4,"title":"CYP450 Nomenclature and the Enzyme Group","sec":"CYP450 enzyme group · p12","qs":["PHARM-C5-026","PHARM-C5-027","PHARM-C5-028","PHARM-C5-029","PHARM-C5-030"],"guide":"Cytochrome is a haem protein that binds oxygen and facilitates metabolism; the 450 refers to the 450 nm light absorbed by these enzymes first found in plant pigment. In CYP1A2 the number denotes the family, the letter the subfamily and the final number the geneisoform."},{"id":"PHARM-U5-5","ch":5,"n":5,"title":"Substrate Map of the CYP Isoforms","sec":"Drugs metabolised in phase I (by CYP450 types) · p12","qs":["PHARM-C5-031","PHARM-C5-032","PHARM-C5-033","PHARM-C5-034","PHARM-C5-035","PHARM-C5-036","PHARM-C5-037","PHARM-C5-038"],"guide":"CYP1A2 handles paracetamol, tacrine and theophylline; CYP2B6 handles 6-mercaptopurine and methyldopa; CYP2C9 handles phenytoin and warfarin. CYP2C19 metabolises omeprazole but activates clopidogrel, and the two compete, so omeprazole decreases the effect of clopidogrel; CYP2D6 metabolises psychiatric drugs, opioids and β-blockers and activates tamoxifen."},{"id":"PHARM-U5-6","ch":5,"n":6,"title":"Ethanol, Paracetamol and the CYP3A4 Rule","sec":"CYP2E1 and CYP3A4 · p12","qs":["PHARM-C5-039","PHARM-C5-040","PHARM-C5-041","PHARM-C5-042","PHARM-C5-043","PHARM-C5-044","PHARM-C5-045"],"guide":"Chronic ethanol consumption upregulates CYP2E1, which metabolises paracetamol far more than CYP1A2 does, so more NAPQI is generated and hepatotoxicity follows. CYP3A4 is the most common isoform, metabolising more than 50% of drugs — mifepristone being the quoted example."},{"id":"PHARM-U5-7","ch":5,"n":7,"title":"Glucuronidation and Crigler Najjar Syndrome","sec":"Drugs metabolised in phase II: Glucuronidation · p13","qs":["PHARM-C5-046","PHARM-C5-047","PHARM-C5-048"],"guide":"Glucuronidation handles atazanavir, which can cause Steven Johnson syndrome, and irinotecan, which causes toxicity. Because the pathway itself is deficient in Crigler Najjar syndrome, both drugs are contraindicated in that condition."},{"id":"PHARM-U5-8","ch":5,"n":8,"title":"Estrogen, Enterohepatic Circulation and OCP Failure","sec":"Estrogen enterohepatic circulation · p13","qs":["PHARM-C5-049","PHARM-C5-050","PHARM-C5-051","PHARM-C5-052","PHARM-C5-053","PHARM-C5-054","PHARM-C5-055","PHARM-C5-056"],"guide":"Estrogen is metabolised in the liver by Phase I (CYP3A4) and Phase II glucuronidation to a water-soluble conjugate that enters the small intestine. There gut bacterial glucuronidase releases lipid-soluble estrogen, which is reabsorbed — enterohepatic circulation extending its normal T½. Antibiotics kill these bacteria, shorten the T½ and cause OCP failure."},{"id":"PHARM-U5-9","ch":5,"n":9,"title":"Acetylation and Drug-Induced SLE (HIPS Dance)","sec":"Acetylation · p13","qs":["PHARM-C5-057","PHARM-C5-058","PHARM-C5-059","PHARM-C5-060"],"guide":"Acetylation substrates follow the mnemonic HIPS Dance — Hydralazine, Isoniazid, Procainamide, Sulfonamide and Dapsone — and all of them can cause drug induced SLE, often with arthralgia, rash and a positive ANA."},{"id":"PHARM-U5-10","ch":5,"n":10,"title":"Enzyme Inducers vs Inhibitors: The Interaction Table","sec":"Drug interactions · p14","qs":["PHARM-C5-061","PHARM-C5-062","PHARM-C5-063","PHARM-C5-064","PHARM-C5-065","PHARM-C5-066","PHARM-C5-067","PHARM-C5-068","PHARM-C5-069","PHARM-C5-070","PHARM-C5-071","PHARM-C5-072","PHARM-C5-073","PHARM-C5-074"],"guide":"Inducers raise enzyme amount, increase metabolism and lower plasma concentration producing drug failure; inhibitors do the reverse and produce toxicity. Inducers: griseofulvin, rifampicin, chronic alcohol, benzopyrene, phenobarbital, carbamazepine, St. John's wort. Inhibitors: acute alcohol, quinidine, isoniazid, cimetidine, ciprofloxacin, ketoconazole, valproate, erythromycin/clarithromycin, grapefruit juice, diethylcarbamazine."},{"id":"PHARM-U5-11","ch":5,"n":11,"title":"Clinical Significance: OCP Failure, Theophylline and Statin Toxicity","sec":"Clinical significance · p14","qs":["PHARM-C5-075","PHARM-C5-076","PHARM-C5-077","PHARM-C5-078","PHARM-C5-079","PHARM-C5-080"],"guide":"When rifampicin causes OCP failure the options are to change the contraceptive method (IUD or condoms), avoid enzyme inducers, or increase the dose of the interacting drug as with phenytoin and retigabine. Inhibitor toxicity is shown by erythromycin causing theophylline toxicity with arrhythmia and fibrillation, and clarithromycin causing statin toxicity."},{"id":"PHARM-U6-1","ch":6,"n":1,"title":"Excretion: The Drug That Leaves the Body","sec":"PHARMACOKINETICS: EXCRETION · p15","qs":["PHARM-C6-001","PHARM-C6-002","PHARM-C6-003","PHARM-C6-004"],"guide":"Only the ionised, water-soluble, polar drug is excreted. The major organs are the kidneys — the most common organ of excretion — and the liver, which is the most common organ of metabolism, while saliva and sweat handle small amounts."},{"id":"PHARM-U6-2","ch":6,"n":2,"title":"Filtration (20%) vs Tubular Secretion (80%)","sec":"Filtration vs tubular secretion · p15","qs":["PHARM-C6-005","PHARM-C6-006","PHARM-C6-007","PHARM-C6-008","PHARM-C6-009","PHARM-C6-010","PHARM-C6-011","PHARM-C6-012","PHARM-C6-013"],"guide":"Tubular secretion (80%) dominates over filtration (20%). Only unbound drug is filtered; protein-bound drug, because of the negative charge of the basement membrane, is not filtered but is still secreted. Filtration depends on GFR and therefore gives a constant rate of excretion, so kidney disease directly reduces it."},{"id":"PHARM-U6-3","ch":6,"n":3,"title":"Rate of Drug Elimination and Clearance","sec":"Rate of drug elimination · p15","qs":["PHARM-C6-014","PHARM-C6-015","PHARM-C6-016","PHARM-C6-017","PHARM-C6-018"],"guide":"Rate of drug elimination is the amount of drug eliminated per hour (mg/hr) and equals plasma concentration (mg/ml) × clearance (ml/hr). Clearance is the volume of plasma cleared of drug per hour, not an amount of drug."},{"id":"PHARM-U6-4","ch":6,"n":4,"title":"Two Ways to Dose: Infusion and Intermittent","sec":"Drug dosing · p15","qs":["PHARM-C6-019","PHARM-C6-020"],"guide":"Drugs are dosed either by continuous IV infusion or intermittently. The infusion (dosing) rate is also called the loading dose, while the repeated intermittent dose is the maintenance dose."},{"id":"PHARM-U6-5","ch":6,"n":5,"title":"The Concentration-Time Curve of an Infusion","sec":"Concentration-time curve · p16","qs":["PHARM-C6-021","PHARM-C6-022","PHARM-C6-023","PHARM-C6-024","PHARM-C6-025","PHARM-C6-026","PHARM-C6-027","PHARM-C6-028"],"guide":"The curve has three phases: I the slowly rising state where absorption exceeds excretion, II the steady state plateau where infusion rate equals the rate of drug elimination, and III the declining state where excretion exceeds absorption. Infusion rate = plasma concentration × clearance, 4–5 half-lives are needed to reach steady state, and the dose depends on volume of distribution."},{"id":"PHARM-U6-6","ch":6,"n":6,"title":"Maintenance Dose and the Bioavailability Factor","sec":"Intermittent dosing · p16","qs":["PHARM-C6-029","PHARM-C6-030","PHARM-C6-031","PHARM-C6-032","PHARM-C6-033","PHARM-C6-034","PHARM-C6-035"],"guide":"The intermittent dose, a.k.a. maintenance dose, is given at intervals to hold plasma concentration in steady state and depends on clearance. Maintenance dose = PC × CL × Time / f, where f is bioavailability (f = 1 for IV routes), so oral doses must be larger when bioavailability is incomplete."},{"id":"PHARM-U6-7","ch":6,"n":7,"title":"Half-Life, Volume of Distribution and Clearance","sec":"Half-life · p16","qs":["PHARM-C6-036","PHARM-C6-037","PHARM-C6-038","PHARM-C6-039","PHARM-C6-040","PHARM-C6-041","PHARM-C6-042"],"guide":"Half-life is the time taken for the plasma level to fall by 50% and is proportional to volume of distribution ÷ clearance: T1/2 = 0.693 × vd/Cl = 0.693/kel, while kel = Cl/vd. Rising vd or falling clearance (as in renal failure) prolongs the half-life."},{"id":"PHARM-U6-8","ch":6,"n":8,"title":"Zero Order vs First Order Kinetics (Table)","sec":"Kinetics of drug elimination · p17","qs":["PHARM-C6-043","PHARM-C6-044","PHARM-C6-045","PHARM-C6-046","PHARM-C6-047","PHARM-C6-048","PHARM-C6-049"],"guide":"Zero order eliminates a constant amount of drug per hour (n = 0, RDE = constant); first order eliminates a constant proportion per hour (n = 1, RDE ∝ PC) as expressed in RDE = (PC)^n × Cl. Most drugs follow first order."},{"id":"PHARM-U6-9","ch":6,"n":9,"title":"What Happens When the Dose Is Increased","sec":"Effect of increasing dose · p17","qs":["PHARM-C6-050","PHARM-C6-051","PHARM-C6-052","PHARM-C6-053","PHARM-C6-054","PHARM-C6-055","PHARM-C6-056","PHARM-C6-057"],"guide":"With increasing dose, zero order shows rising T1/2, falling clearance and a disproportionate rise in plasma concentration with risk of toxicity; first order keeps T1/2 and clearance constant and the plasma concentration rises proportionately."},{"id":"PHARM-U6-10","ch":6,"n":10,"title":"Saturation of Elimination and Pseudozero Order","sec":"Saturation of elimination · p17","qs":["PHARM-C6-058","PHARM-C6-059","PHARM-C6-060","PHARM-C6-061","PHARM-C6-062","PHARM-C6-063"],"guide":"Zero order kinetics reflects early saturation of elimination, first order reflects late saturation. The exceptions are the key exam points: zero order drugs follow first order at lower doses until saturation and are hence called pseudozero order, while first order drugs switch to zero order at higher doses after saturation."},{"id":"PHARM-U6-11","ch":6,"n":11,"title":"The Example List: Alcohol, Phenytoin and the Rest","sec":"Examples of elimination kinetics · p17","qs":["PHARM-C6-064","PHARM-C6-065","PHARM-C6-066","PHARM-C6-067","PHARM-C6-068","PHARM-C6-069"],"guide":"Zero order drugs are alcohol (true zero order), theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin; first order kinetics applies to most drugs. This is why a small phenytoin increment can cause toxicity and why alcohol levels fall linearly at a fixed amount per hour."},{"id":"PHARM-U7-1","ch":7,"n":1,"title":"Affinity, Efficacy and Potency","sec":"Affinity, Efficacy and Potency · p18","qs":["PHARM-C7-001","PHARM-C7-002","PHARM-C7-003","PHARM-C7-004","PHARM-C7-005","PHARM-C7-006"],"guide":"A drug's tendency to bind its target is affinity; the maximum effect it produces is efficacy, and efficacy is the clinically most important property because it fixes the ceiling of benefit. Potency is a different matter - the relative dose needed for a given effect, so the lesser the dose, the greater the potency. A graded (quantified) response, such as a change in BP, HR or blood glucose, is studied in an individual."},{"id":"PHARM-U7-2","ch":7,"n":2,"title":"Quantal DRC: ED50, TD50 and LD50","sec":"Quantal DRC · p18","qs":["PHARM-C7-007","PHARM-C7-008","PHARM-C7-009","PHARM-C7-010","PHARM-C7-011","PHARM-C7-012","PHARM-C7-013","PHARM-C7-014","PHARM-C7-015","PHARM-C7-016","PHARM-C7-017"],"guide":"The quantal DRC records a binary, all-or-none response (sedation, fertility) in a population, plotting the percentage of responders against log dose. ED50 is the dose at which half the population gets a therapeutic effect and marks potency, while TD50 (toxic) and LD50 (lethal, in animals) mark toxicity; on the graph the therapeutic curve sits leftmost and the lethal curve furthest right."},{"id":"PHARM-U7-3","ch":7,"n":3,"title":"Therapeutic Index and Therapeutic Window","sec":"Therapeutic Index · p18","qs":["PHARM-C7-018","PHARM-C7-019","PHARM-C7-020","PHARM-C7-021","PHARM-C7-022","PHARM-C7-023","PHARM-C7-024","PHARM-C7-025","PHARM-C7-026","PHARM-C7-027","PHARM-C7-028","PHARM-C7-029"],"guide":"The therapeutic index measures safety: TD50/ED50 in humans and LD50/ED50 in animals. A low index, as with lithium, means safety only within a narrow dosage range and a high chance of toxicity, whereas a high index allows a wide range. The therapeutic window is the corridor between the minimum effective concentration (0.6 meq/L for lithium) and the minimum toxic concentration (1.5 meq/L) - below it there is no effect and above it toxicity."},{"id":"PHARM-U7-4","ch":7,"n":4,"title":"Graded DRC: Height, Position and Parallel Lines","sec":"Graded DRC · p19","qs":["PHARM-C7-030","PHARM-C7-031","PHARM-C7-032","PHARM-C7-033","PHARM-C7-034","PHARM-C7-035","PHARM-C7-036","PHARM-C7-037","PHARM-C7-038","PHARM-C7-039","PHARM-C7-040","PHARM-C7-041","PHARM-C7-042","PHARM-C7-043"],"guide":"On the graded DRC (response versus log dose in an individual) efficacy is read from the height of the curve and potency from its position - more to the left means more potent. In the figure, efficacy runs B > A > C and potency PA > PB > PC, so drug A is the most potent yet B the most efficacious. Affinity is comparable only between drugs of the same MOA and only between parallel lines, which is why C is excluded and the order is A > B."},{"id":"PHARM-U7-5","ch":7,"n":5,"title":"Full, Partial, Antagonist, Inverse: The Table","sec":"Drug Receptor Interactions · p19","qs":["PHARM-C7-044","PHARM-C7-045","PHARM-C7-046","PHARM-C7-047","PHARM-C7-048","PHARM-C7-049","PHARM-C7-050","PHARM-C7-051","PHARM-C7-052","PHARM-C7-053","PHARM-C7-054","PHARM-C7-055","PHARM-C7-056","PHARM-C7-057"],"guide":"The interaction table grades four behaviours: a full agonist gives a maximum effect (+1 intrinsic efficacy), a partial agonist a submaximal effect (between 1 and 0), an antagonist no effect (0) and an inverse agonist an effect opposite to the receptor's nature (-1). Against endogenous full agonists these translate into mild, moderate and severe antagonism respectively. On the figure, A rises to maximal, B plateaus submaximally, C stays flat and D dips below the no-effect line."},{"id":"PHARM-U7-6","ch":7,"n":6,"title":"Clinical Reading of Agonists and Antagonists","sec":"Drug Receptor Interactions · p19","qs":["PHARM-C7-058","PHARM-C7-059","PHARM-C7-060"],"guide":"The single most useful clinical fact from this table is its footnote: antagonists are the most commonly used drugs, even though they exert no effect of their own. Adding a partial agonist to a patient already on a full agonist yields only mild antagonism, because a partial agonist can never match a full agonist's maximal response."},{"id":"PHARM-U8-1","ch":8,"n":1,"title":"Types of Antagonism","sec":"Types of Antagonism · p20","qs":["PHARM-C8-001","PHARM-C8-002","PHARM-C8-003","PHARM-C8-004","PHARM-C8-005","PHARM-C8-006","PHARM-C8-007","PHARM-C8-008","PHARM-C8-009","PHARM-C8-010","PHARM-C8-011","PHARM-C8-012","PHARM-C8-013","PHARM-C8-014","PHARM-C8-015","PHARM-C8-016","PHARM-C8-017"],"guide":"Antagonism is classified by mechanism, not by receptor: physical antagonism binds the substance (charcoal adsorbs alcohol from the intestine), chemical antagonism binds and neutralises it (heparin, an acid/-ve, is neutralised by protamine sulphate, a base/+ve; iron is chelated by dexrazoxane or deferiprone), and physiological antagonism uses opposite receptors - histamine via H1 constricts bronchi while adrenaline/salbutamol via β2 dilate them. Salbutamol is the best bronchodilator in asthma, but in COPD ipratropium or tiotropium is preferred instead because of cholinergic effects."},{"id":"PHARM-U8-2","ch":8,"n":2,"title":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism · p20","qs":["PHARM-C8-018","PHARM-C8-019","PHARM-C8-020","PHARM-C8-021","PHARM-C8-022","PHARM-C8-023","PHARM-C8-024","PHARM-C8-025","PHARM-C8-026","PHARM-C8-027","PHARM-C8-028","PHARM-C8-029","PHARM-C8-030","PHARM-C8-031","PHARM-C8-032","PHARM-C8-033","PHARM-C8-034","PHARM-C8-035","PHARM-C8-036","PHARM-C8-037"],"guide":"The table follows drug (A) through three rows: its normal effect, the addition of antagonist (B), and the effect of raising (A). In competitive reversible antagonism (A) and (B) compete for the same (enzymatic) site, so raising (A) restores the effect, Km rises, potency falls and Vmax/efficacy is unchanged. In competitive irreversible and non-competitive antagonism (B) occupies the allosteric part, raising (A) gives 'no reversal of antagonism', Vmax falls while Km and potency show no change."},{"id":"PHARM-U8-3","ch":8,"n":3,"title":"Michaelis-Menten Note: Vmax and Km","sec":"Michaelis-Menten Note: Vmax and Km · p21","qs":["PHARM-C8-038","PHARM-C8-039","PHARM-C8-040","PHARM-C8-041","PHARM-C8-042","PHARM-C8-043"],"guide":"The Michaelis-Menten equation is used to read the same table numerically: Vmax is the maximum velocity of the reaction between enzyme and drug (substrate) and stands for maximum effect, i.e. efficacy; Km is the concentration of drug at which the reaction velocity is half of Vmax and is proportional to 1/potency. So a competitive antagonist raises Km (potency falls) with Vmax untouched, while a non-competitive antagonist lowers Vmax with Km unchanged."},{"id":"PHARM-U8-4","ch":8,"n":4,"title":"Receptors: Ligand Gated Ion Channel Receptors","sec":"Receptors: Ligand Gated Ion Channel Receptors · p21","qs":["PHARM-C8-044","PHARM-C8-045","PHARM-C8-046","PHARM-C8-047","PHARM-C8-048","PHARM-C8-049","PHARM-C8-050"],"guide":"Receptors begin with the fastest acting type, the ligand gated ion channel receptors (LGICR). Their examples are tabulated by substrate: GABA-A conducts chloride, glutamate has the NMDA, AMPA and kainate subtypes, while the nicotinic receptor and 5-HT3 are listed with a dash. The note to remember is that GABA-B is a GPCR, not an ion channel."},{"id":"PHARM-U8-5","ch":8,"n":5,"title":"Nicotinic Receptor Structure","sec":"Nicotinic Receptor Structure · p21","qs":["PHARM-C8-051","PHARM-C8-052","PHARM-C8-053","PHARM-C8-054","PHARM-C8-055","PHARM-C8-056","PHARM-C8-057"],"guide":"The nicotinic receptor is a pentamer of α, α, β, δ and ε subunits surrounding a lumen through which Na+ enters. Acetylcholine acts on the α subunit to open the channel, which is why the α subunit is marked most important in a receptor. Functionally, the same receptor gives contraction on muscle and depolarisation on a ganglion."},{"id":"PHARM-U8-6","ch":8,"n":6,"title":"Enzymatic Receptor","sec":"Enzymatic Receptor · p22","qs":["PHARM-C8-058","PHARM-C8-059","PHARM-C8-060","PHARM-C8-061","PHARM-C8-062","PHARM-C8-063","PHARM-C8-064","PHARM-C8-065","PHARM-C8-066","PHARM-C8-067","PHARM-C8-068"],"guide":"An enzymatic receptor carries an intracellular enzymatic domain; the ligand binds the receptor and the enzyme acts, the classic example being tyrosine kinase, where phosphorylation of tyrosine leads to cell proliferation. The four tabulated types are tyrosine kinase receptors (EGFR, VEGF-R, Her-2/neu R, insulin/IGF R), Janus kinase receptors (leptin/cytokine, prolactin, growth hormone), STKR (TGFR) and the guanylate cyclase receptor (ANP, BNP → ↑ cGMP → vasodilation)."},{"id":"PHARM-U8-7","ch":8,"n":7,"title":"Nuclear Receptor (NRT)","sec":"Nuclear Receptor (NRT) · p22","qs":["PHARM-C8-069","PHARM-C8-070","PHARM-C8-071","PHARM-C8-072","PHARM-C8-073","PHARM-C8-074","PHARM-C8-075","PHARM-C8-076","PHARM-C8-077"],"guide":"Nuclear receptors are the slowest acting receptors because they work on gene transcription. Some already sit in the nucleus - estrogen, progesterone, vitamin A, T3/T4 and PPAR (α, δ, γ) receptors - while others (androgen, mineralocorticoid, glucocorticoid and vitamin D receptors) wait in the cytoplasm and translocate to the nucleus only upon ligand binding."},{"id":"PHARM-U8-8","ch":8,"n":8,"title":"G Protein Coupled Receptor (GPCR)","sec":"G Protein Coupled Receptor (GPCR) · p22","qs":["PHARM-C8-078","PHARM-C8-079","PHARM-C8-080","PHARM-C8-081","PHARM-C8-082","PHARM-C8-083","PHARM-C8-084","PHARM-C8-085","PHARM-C8-086","PHARM-C8-087","PHARM-C8-088"],"guide":"GPCRs - also called serpentine, 7 transmembrane or heptahelical receptors - are the most common target for drugs. The α subunit is the most important and carries intrinsic GTPase activity; activation exchanges GDP for GTP and hydrolysis of GTP switches the signal off. GPCRs are classified by their α subtypes: s → Gs, q → Gq and i → Gi."},{"id":"PHARM-U8-9","ch":8,"n":9,"title":"Gs Subtype","sec":"Gs Subtype · p23","qs":["PHARM-C8-089","PHARM-C8-090","PHARM-C8-091","PHARM-C8-092","PHARM-C8-093","PHARM-C8-094","PHARM-C8-095","PHARM-C8-096","PHARM-C8-097","PHARM-C8-098","PHARM-C8-099","PHARM-C8-100","PHARM-C8-101","PHARM-C8-102","PHARM-C8-103","PHARM-C8-104","PHARM-C8-105","PHARM-C8-106","PHARM-C8-107","PHARM-C8-108"],"guide":"Gs signals through αs-GTP to activate adenylate cyclase, raising cyclic AMP, which phosphodiesterase then metabolises. In cardiac and skeletal muscle cAMP causes contraction through calcium channel phosphorylation, while in smooth muscle it causes relaxation (myosin light chain phosphorylase activation and myosin light chain kinase inhibition) giving bronchodilation, vasodilation and uterine relaxation - the basis for ritodrine in labor, dobutamine in CHF and salbutamol in asthma (palpitations and tremors). Theophylline blocks phosphodiesterase 3, 4 in bronchi and milrinone blocks phosphodiesterase 3 in the heart, both used when β-blockers have already been given."},{"id":"PHARM-U8-10","ch":8,"n":10,"title":"Gq Subtype","sec":"Gq Subtype · p23","qs":["PHARM-C8-109","PHARM-C8-110","PHARM-C8-111","PHARM-C8-112","PHARM-C8-113","PHARM-C8-114","PHARM-C8-115","PHARM-C8-116","PHARM-C8-117","PHARM-C8-118","PHARM-C8-119"],"guide":"Gq works through αq-GTP to activate phospholipase C, which raises PIP2 and splits it into IP3 (a secondary messenger) and DAG. IP3 binds a receptor on the sarcoplasmic reticulum, releasing Ca2+ and causing smooth muscle constriction - the pathway behind oxytocin, angiotensin and vasopressin 1 receptor effects, with α1, M1 and M2 as the feeding receptors. A separate note records that phospholipase A2 is responsible for the synthesis of prostaglandins."},{"id":"PHARM-U8-11","ch":8,"n":11,"title":"Gi Subtype","sec":"Gi Subtype · p24","qs":["PHARM-C8-120","PHARM-C8-121","PHARM-C8-122","PHARM-C8-123","PHARM-C8-124","PHARM-C8-125","PHARM-C8-126","PHARM-C8-127"],"guide":"Gi is present in the heart, where it lowers heart rate. Its receptors - M2, α2, H3 and 5HT1 - are autoreceptors. The αi-GTP limb lowers cyclic AMP while the Go limb (β, γ) lowers Ca2+; both converge on opening K+ channels and so produce relaxation."},{"id":"PHARM-U8-12","ch":8,"n":12,"title":"G12/13 Subtype","sec":"G12/13 Subtype · p24","qs":["PHARM-C8-128","PHARM-C8-129","PHARM-C8-130","PHARM-C8-131","PHARM-C8-132","PHARM-C8-133","PHARM-C8-134","PHARM-C8-135","PHARM-C8-136","PHARM-C8-137"],"guide":"G12/13 signals through Rho-GTP, which activates Rho-kinase and produces smooth muscle contraction, vasoconstriction and trabecular meshwork contraction. Three Rho-kinase inhibitors are shown: belumosudil, a new drug for graft versus host disease (RHO kinase is involved in leukocytosis), fasudil for vasodilation in angina, and netarsudil, which increases trabecular outflow and is used in open-angle glaucoma."},{"id":"PHARM-U9-1","ch":9,"n":1,"title":"Drug Schedules in India","sec":"Drug Schedules in India · p25","qs":["PHARM-C9-001","PHARM-C9-002","PHARM-C9-003","PHARM-C9-004","PHARM-C9-005","PHARM-C9-006","PHARM-C9-007","PHARM-C9-008","PHARM-C9-009","PHARM-C9-010","PHARM-C9-011","PHARM-C9-012","PHARM-C9-013","PHARM-C9-014","PHARM-C9-015","PHARM-C9-016","PHARM-C9-017","PHARM-C9-018"],"guide":"Indian drug schedules are read off the label: Schedule G carries the caution that the preparation is dangerous except under medical supervision and covers majority drugs such as antihypertensives and antidiabetics; Schedule H needs a registered practitioner's prescription, with Rx (in black) reusable on the same prescription and NRx (in red) for narcotics like codeine and benzodiazepines, issued once to avoid abuse potential; Schedule H1 (introduced in 2013) shows Rx in red and covers antibiotics against resistance; Schedule X shows XRx in red for narcotic/psychotropic drugs (amphetamine, methylphenidate, ketamine, pentobarbital) needing special licence and a register with prescription copy kept 2 years. Schedule P concerns expiry period, Schedule W generic-name marketing and Schedule Y clinical trials, import and manufacture of new drugs."},{"id":"PHARM-U9-2","ch":9,"n":2,"title":"Pregnancy Drug Categories","sec":"Pregnancy Drug Categories · p25","qs":["PHARM-C9-019","PHARM-C9-020","PHARM-C9-021","PHARM-C9-022","PHARM-C9-023","PHARM-C9-024","PHARM-C9-025","PHARM-C9-026","PHARM-C9-027"],"guide":"Pregnancy categories are ranked by safety A > B > C. Category A has risk absent to the fetus with maximum safety; B lacks human studies but is absent in animals and is safely prescribed; C has no human data with positive teratogenicity in animals; D and X are positive teratogenic in humans, D being used if benefit > risk (valproate in JME) and X being absolutely contraindicated (thalidomide)."},{"id":"PHARM-U9-3","ch":9,"n":3,"title":"Types of Drugs","sec":"Types of Drugs · p26","qs":["PHARM-C9-028","PHARM-C9-029","PHARM-C9-030","PHARM-C9-031","PHARM-C9-032","PHARM-C9-033","PHARM-C9-034","PHARM-C9-035","PHARM-C9-036","PHARM-C9-037","PHARM-C9-038","PHARM-C9-039"],"guide":"Nine drug types are listed: prescription/legend (schedule H), OTC (anything other than schedule G, H, X), orphan drugs for rare diseases with low availability, street/illicit drugs of abuse (cocaine, heroin, methamphetamine), spurious drugs (imitating another drug's name or failing the intended purpose), misbranded drugs (false label information), adulterated drugs (unwanted substance), prototype drugs - the parental/most used drug of a group, e.g. morphine for opioids - and P (personal) drugs chosen on STEP criteria: safety, tolerability, efficacy and price. An orphan receptor is a receptor without a known ligand."},{"id":"PHARM-U9-4","ch":9,"n":4,"title":"Drug Development and Preclinical Trials","sec":"Drug Development and Preclinical Trials · p26","qs":["PHARM-C9-040","PHARM-C9-041","PHARM-C9-042","PHARM-C9-043","PHARM-C9-044","PHARM-C9-045","PHARM-C9-046","PHARM-C9-047","PHARM-C9-048","PHARM-C9-049"],"guide":"Development starts with non-mandatory preclinical trials in animals, which must be completed before the mandatory human phases I-IV. Preclinical steps are: draft a protocol describing the expectation of the drug and information on animals, submit it to the Animal Ethical Committee (AEC), get permission approved, then conduct the PCT under CPCSEA guidelines. The flow chart then enters clinical trials in humans, phase I being done in normal healthy individuals and later phases in patients."},{"id":"PHARM-U9-5","ch":9,"n":5,"title":"Clinical Trials: Prerequisite and Phase 0","sec":"Clinical Trials: Prerequisite and Phase 0 · p27","qs":["PHARM-C9-050","PHARM-C9-051","PHARM-C9-052","PHARM-C9-053","PHARM-C9-054","PHARM-C9-055","PHARM-C9-056","PHARM-C9-057","PHARM-C9-058"],"guide":"A clinical trial opens with prerequisites: draft a protocol, submit it to the Human Ethical Committee, obtain approval, then conduct it under GCP (Good Clinical Practice) guidelines. Phase 0 is microdosing with 100 mcg or 1/100th of the normal dose as a radioligand-bound drug in normal healthy volunteers to determine pharmacokinetics and pharmacodynamics; if normal the trial moves to phase I, if abnormal (toxicity/efficacy) the trial is aborted."},{"id":"PHARM-U9-6","ch":9,"n":6,"title":"Mandatory Phases of Clinical Trials","sec":"Mandatory Phases of Clinical Trials · p27","qs":["PHARM-C9-059","PHARM-C9-060","PHARM-C9-061","PHARM-C9-062","PHARM-C9-063","PHARM-C9-064","PHARM-C9-065","PHARM-C9-066","PHARM-C9-067","PHARM-C9-068","PHARM-C9-069","PHARM-C9-070","PHARM-C9-071","PHARM-C9-072","PHARM-C9-073","PHARM-C9-074","PHARM-C9-075","PHARM-C9-076","PHARM-C9-077","PHARM-C9-078","PHARM-C9-079","PHARM-C9-080","PHARM-C9-081","PHARM-C9-082","PHARM-C9-083","PHARM-C9-084","PHARM-C9-085","PHARM-C9-086","PHARM-C9-087","PHARM-C9-088","PHARM-C9-089","PHARM-C9-090"],"guide":"The mandatory phases table compares the four phases: phase I (human pharmacology and toxicity study) determines toxicity, maximum tolerable dose, pharmacokinetics and pharmacodynamics in 30-100 normal healthy volunteers over 1-2 years in an open design; phase II (therapeutic exploratory trial) determines efficacy in 100-500 patients over 2-3 years by randomized control trial at a unicentric centre, and carries the maximum failure rate; phase III (therapeutic confirmatory trial) confirms efficacy in 500-3000 patients over 3-5 years by RCT/RUCT at multicentric centres; phase IV (postmarketing surveillance) looks for long term/rare ADRs in many thousands of patients in an open design. For toxic drugs such as anti-HIV and anticancer agents phases I and II are done simultaneously in patients, blinded designs are preferred over open in phases II-III, and all multicentric studies are phase III irrespective of population size."},{"id":"PHARM-U9-7","ch":9,"n":7,"title":"Approval in Phase III and Phase V","sec":"Approval in Phase III and Phase V · p28","qs":["PHARM-C9-091","PHARM-C9-092","PHARM-C9-093","PHARM-C9-094","PHARM-C9-095","PHARM-C9-096","PHARM-C9-097","PHARM-C9-098","PHARM-C9-099"],"guide":"The approval pathway runs from IND (Investigational New Drug) through confirming efficacy and safety for use, to a New Drug Application (NDA) submitted to CDSCO - Central Drugs Standard Control Organisation - in New Delhi, and ends with approval of the drug. Phase V is pharmacoepidemiology: its aim is to validate the toxicity claimed in phase IV using epidemiological studies, namely case control or cohort studies."},{"id":"PHARM-U10-1","ch":10,"n":1,"title":"Adverse Drug Reaction (ADR)","sec":"Adverse Drug Reaction (ADR) · p29","qs":["PHARM-C10-001","PHARM-C10-002","PHARM-C10-003","PHARM-C10-004","PHARM-C10-005","PHARM-C10-006","PHARM-C10-007","PHARM-C10-008","PHARM-C10-009","PHARM-C10-010","PHARM-C10-011","PHARM-C10-012"],"guide":"An ADR is an appreciably harmful reaction to a drug used for treatment or prophylaxis; management is treatment of the reaction plus prevention of future exposure, and an idiosyncratic ADR is genetic in origin. The types are remembered by ABCDEFG - Augmented (dose-dependent, e.g. captopril hypotension), Bizarre (dose-independent, e.g. hypersensitivity), Chronic (dose and duration dependent, e.g. steroid-induced hypothalamo-pituitary suppression), Delayed (seen after cessation, e.g. teratogenicity), End of use (withdrawal, e.g. opioid/clonidine) and Failure (e.g. rifampicin causing OCP failure)."},{"id":"PHARM-U10-2","ch":10,"n":2,"title":"Drug-Induced Hypersensitivity","sec":"Drug-Induced Hypersensitivity · p29","qs":["PHARM-C10-013","PHARM-C10-014","PHARM-C10-015","PHARM-C10-016","PHARM-C10-017","PHARM-C10-018","PHARM-C10-019","PHARM-C10-020","PHARM-C10-021"],"guide":"Four hypersensitivity types are shown: type I anaphylaxis, type II hemolysis, type III drug-induced SLE (from drugs metabolised by acetylation such as isoniazid and procainamide) and type IV Steven-Johnson syndrome (carbamazepine, lamotrigine). The closing note maps lepra reactions: type 1 lepra reaction is type IV and type 2 is type III hypersensitivity."},{"id":"PHARM-U10-3","ch":10,"n":3,"title":"Pharmacovigilance","sec":"Pharmacovigilance · p30","qs":["PHARM-C10-022","PHARM-C10-023","PHARM-C10-024","PHARM-C10-025","PHARM-C10-026","PHARM-C10-027","PHARM-C10-028","PHARM-C10-029","PHARM-C10-030","PHARM-C10-031","PHARM-C10-032","PHARM-C10-033"],"guide":"Pharmacovigilance aims to maintain drug safety and runs under the Pharmacovigilance Program of India (PvPI), co-ordinated by the NCC at the Indian Pharmacopoeia Commission, Ghaziabad (UP); it is similar to phase 4 clinical trials by pharmaceutical companies. VigiFlow is the software used at hospitals and medical colleges to report ADRs; the NCC processes them into a conclusive ADR report, sent to CDSCO, which may ban the drug and inform doctors and patients and also informs the international pharmacovigilance centre - the Uppsala Monitoring Centre (UMC) in Uppsala, Sweden - whose Vigibase, the largest pharmacovigilance database, informs countries worldwide."},{"id":"PHARM-U10-4","ch":10,"n":4,"title":"Therapeutic Drug Monitoring (TDM)","sec":"Therapeutic Drug Monitoring (TDM) · p30","qs":["PHARM-C10-034","PHARM-C10-035","PHARM-C10-036","PHARM-C10-037","PHARM-C10-038","PHARM-C10-039","PHARM-C10-040","PHARM-C10-041","PHARM-C10-042","PHARM-C10-043","PHARM-C10-044","PHARM-C10-045","PHARM-C10-046","PHARM-C10-047","PHARM-C10-048","PHARM-C10-049"],"guide":"TDM rests on the principle that plasma concentration of a drug correlates well with its effect and side-effects. Indications are: non-quantifiable clinical effect (drugs with quantifiable effects like oral hypoglycemics and β blockers are excluded), low therapeutic index (aminoglycosides, anti-epileptics, tacrolimus, digoxin, anti-psychotics, lithium, theophylline), variable metabolism such as acetylation, checking compliance (anti-psychotics) and preventing damage to organ or fetus - e.g. an aminoglycoside for pseudomonas in renal failure, or valproate in pregnancy with folic acid 400 mcg/day without a history of NTD and 4000 mcg/day with it. TDM is determined only after steady state concentration is reached."},{"id":"PHARM-U10-5","ch":10,"n":5,"title":"Pharmacogenetics and Pharmacogenomics","sec":"Pharmacogenetics and Pharmacogenomics · p31","qs":["PHARM-C10-050","PHARM-C10-051","PHARM-C10-052","PHARM-C10-053","PHARM-C10-054","PHARM-C10-055","PHARM-C10-056","PHARM-C10-057","PHARM-C10-058","PHARM-C10-059","PHARM-C10-060","PHARM-C10-061","PHARM-C10-062"],"guide":"Pharmacogenetics/pharmacogenomics studies the effect of genetics or genome on drug action - genetics being based on DNA polymorphism and genomics on chromosomal changes. Genes code for enzymes and receptors, and the strength of these genes decides whether the response is toxic, strong, normal, weak or a failure. The acetylation example shows NAT1 individuals are fast acetylators and NAT2 individuals slow acetylators: high INH in slow acetylators causes hepatotoxicity while high INHA in fast acetylators causes neuropathy."},{"id":"PHARM-U10-6","ch":10,"n":6,"title":"Malignant Hyperthermia","sec":"Malignant Hyperthermia · p31","qs":["PHARM-C10-063","PHARM-C10-064","PHARM-C10-065","PHARM-C10-066","PHARM-C10-067","PHARM-C10-068","PHARM-C10-069"],"guide":"Malignant hyperthermia is due to RyR (ryanodine receptor) gene polymorphism and is triggered by succinylcholine, lidocaine and halothane, with dantrolene used for treatment. Increased expression of the gene raises RyR stimulation, releasing Ca2+ from the sarcoplasmic reticulum; ATP is then used for calcium reuptake and heat is released - the hyperthermia."},{"id":"PHARM-U10-7","ch":10,"n":7,"title":"G-6-PD Deficiency and Haemolysis","sec":"G-6-PD Deficiency and Haemolysis · p32","qs":["PHARM-C10-070","PHARM-C10-071","PHARM-C10-072","PHARM-C10-073","PHARM-C10-074","PHARM-C10-075","PHARM-C10-076","PHARM-C10-077"],"guide":"G-6-PD deficiency leads to hemolysis through the HMP shunt. The drugs to remember are glyburide, glibenclamide, sulfonamides, primaquine and tafenoquine (anti-malarials), dapsone, dabrafenib, menadione (vitamin K), methylene blue, anti-gout medication (pegloticase, rasburicase), nalidixic acid and nitrofurantoin."},{"id":"PHARM-U10-8","ch":10,"n":8,"title":"CYP450 Enzyme Polymorphism","sec":"CYP450 Enzyme Polymorphism · p32","qs":["PHARM-C10-078","PHARM-C10-079","PHARM-C10-080","PHARM-C10-081","PHARM-C10-082","PHARM-C10-083","PHARM-C10-084","PHARM-C10-085","PHARM-C10-086"],"guide":"CYP polymorphism explains several therapeutic failures: low action of CYP2C19 reduces activation of clopidogrel so MI develops despite medication; CYP2C9 with VKORC1 polymorphism gives a variable warfarin effect; and CYP2D6 polymorphism reduces drug effect - the reduced metabolism of psychiatric drugs causes toxicity, while reduced activation of tamoxifen lowers endoxifen levels and the drug fails."},{"id":"PHARM-U10-9","ch":10,"n":9,"title":"Other Pharmacogenetic Examples","sec":"Other Pharmacogenetic Examples · p32","qs":["PHARM-C10-087","PHARM-C10-088","PHARM-C10-089","PHARM-C10-090","PHARM-C10-091"],"guide":"Two further examples complete the page. Succinylcholine given with atypical pseudocholinesterase causes prolonged apnoea. A reduced effect of thiopurine methyl-transferase decreases metabolism of 6-mercaptopurine and azathioprine, leading to increased toxicity."},{"id":"PHARM-U11-1","ch":11,"n":1,"title":"Definitions","sec":"Definitions · p33","qs":["PHARM-C11-001","PHARM-C11-002","PHARM-C11-003","PHARM-C11-004","PHARM-C11-005","PHARM-C11-006","PHARM-C11-007","PHARM-C11-008"],"guide":"The chapter opens with definitions. Pharmacology is the study of structure, effect (MOA), side effects and contraindications of drugs; pharmacotherapeutics is the study of a drug in service of disease (dose, route and response); pharmacognosy is the study of drugs derived from plants; chemotherapy is the use of drugs in cancer and infection; and pharmacy deals with compounding - mixing of drugs, now obsolete - and dispensing of drugs, with barcoding used to dispense the right drug and avoid errors. A drug is a chemical with a known structure that alters the pathophysiology for therapeutic gain."},{"id":"PHARM-U11-2","ch":11,"n":2,"title":"Drug Sources","sec":"Drug Sources · p33","qs":["PHARM-C11-009","PHARM-C11-010","PHARM-C11-011","PHARM-C11-012","PHARM-C11-013","PHARM-C11-014","PHARM-C11-015","PHARM-C11-016","PHARM-C11-017"],"guide":"Drugs come from four sources: natural (plants - quinine, digoxin, morphine from the poppy plant; animal peptides - insulin and heparin from porcine mucosa; microorganisms - antibiotics), semisynthetic or modified natural chemicals (apomorphine, a dopamine agonist used in parkinsonism), synthetic drugs made by rational drug designing - designed complementary to a receptor, binding and inhibiting, resulting in modification of the disease - and genetic engineering, the process of introducing a gene in a cell line to obtain a product, e.g. human insulin (gene) giving regular insulin (peptide)."},{"id":"PHARM-U11-3","ch":11,"n":3,"title":"Drug Nomenclature and Compendia","sec":"Drug Nomenclature and Compendia · p34","qs":["PHARM-C11-018","PHARM-C11-019","PHARM-C11-020","PHARM-C11-021","PHARM-C11-022","PHARM-C11-023","PHARM-C11-024","PHARM-C11-025","PHARM-C11-026","PHARM-C11-027","PHARM-C11-028","PHARM-C11-029","PHARM-C11-030","PHARM-C11-031","PHARM-C11-032"],"guide":"Drugs carry a chemical name (long, based on structure), a generic/non proprietary name (abbreviated, e.g. propranolol, with tell-tale suffixes: -lol for β blockers, -pril for ACE inhibitors, -prazole for PPIs) and a branded/proprietary name given by the manufacturer. A compendium is a book of comprehensive organised drug information: the Indian Pharmacopoeia is made by pharmacists, covers structure, storage and purity, and is used by drug manufacturers and regulatory authorities, whereas the drug formulary is made by doctors, covers usage, mechanism of action, side effects and contraindications, and is used by doctors for prescribing. The note to remember is that a prescription must contain generic names."},{"id":"PHARM-U11-4","ch":11,"n":4,"title":"Routes of Drug Administration: Local Drugs","sec":"Routes of Drug Administration: Local Drugs · p34","qs":["PHARM-C11-033","PHARM-C11-034","PHARM-C11-035","PHARM-C11-036","PHARM-C11-037"],"guide":"Local drugs act at the site of application, increasing the effect of the drug while decreasing systemic side effects. Topically they are applied to skin (steroid antibiotics), mucous membrane (bladder cancer drugs) and eye (drugs used in glaucoma)."},{"id":"PHARM-U11-5","ch":11,"n":5,"title":"Intrathecal, Intra-articular and Intra-arterial Routes","sec":"Intrathecal, Intra-articular and Intra-arterial Routes · p35","qs":["PHARM-C11-038","PHARM-C11-039","PHARM-C11-040","PHARM-C11-041","PHARM-C11-042","PHARM-C11-043","PHARM-C11-044","PHARM-C11-045","PHARM-C11-046"],"guide":"Intrathecal injection puts the drug into CSF by injection into the subarachnoid space by lumbar puncture; its uses are to bypass the blood-brain barrier (aminoglycosides in meningitis), and to give a local effect on brain/spinal cord with lidocaine and bupivacaine for lumbosacral anesthesia, methotrexate in CNS leukemia, and baclofen in amyotrophic lateral sclerosis - planted in the subarachnoid space, it releases muscle relaxant periodically. Intraarticular injection is exemplified by steroids in rheumatoid arthritis, while the intraarterial route goes directly into the artery supplying the organ, avoiding systemic circulation, and is used for head & neck cancer and hepatocellular cancer."},{"id":"PHARM-U11-6","ch":11,"n":6,"title":"Enteral Routes: Oral, Rectal and Sublingual","sec":"Enteral Routes: Oral, Rectal and Sublingual · p35","qs":["PHARM-C11-047","PHARM-C11-048","PHARM-C11-049","PHARM-C11-050","PHARM-C11-051","PHARM-C11-052","PHARM-C11-053","PHARM-C11-054","PHARM-C11-055","PHARM-C11-056","PHARM-C11-057","PHARM-C11-058","PHARM-C11-059","PHARM-C11-060","PHARM-C11-061","PHARM-C11-062","PHARM-C11-063","PHARM-C11-064"],"guide":"Among enteral routes the oral route is the most common, being cost effective, convenient and safest, but it has maximum first pass metabolism (100% to the portal vein), the most variable absorption (difference in lipid solubility, food, intake, HCl) and poor absorption of large molecules like proteins; lipid soluble and small molecule drugs are used orally. The rectal route acts faster with 50% less first pass metabolism (50% portal vein, 50% IVC) but is inconvenient - diazepam is given rectally in children for febrile seizures, with midazolam preferred. Sublingual drugs are absorbed under the tongue into the SVC and then the heart, giving no first pass metabolism and fast cardiac effects (NTG is spat out after the desired result, since further absorption causes postural hypotension); disadvantages are cardiac side effects and teeth discolouration, and the drugs used are nitroglycerin, ergotamine, nifedipine (rapidly lowers BP compared with oral) and buprenorphine. Proteins are recognised by names ending in 'tide', 'mab' or 'ase'."},{"id":"PHARM-U11-7","ch":11,"n":7,"title":"Parenteral Routes","sec":"Parenteral Routes · p36","qs":["PHARM-C11-065","PHARM-C11-066","PHARM-C11-067","PHARM-C11-068","PHARM-C11-069","PHARM-C11-070","PHARM-C11-071","PHARM-C11-072","PHARM-C11-073","PHARM-C11-074","PHARM-C11-075","PHARM-C11-076","PHARM-C11-077","PHARM-C11-078","PHARM-C11-079","PHARM-C11-080","PHARM-C11-081","PHARM-C11-082","PHARM-C11-083","PHARM-C11-084","PHARM-C11-085","PHARM-C11-086"],"guide":"Parenteral routes: intravenous is the fastest, used in emergency, allows large volume and gives 100% bioavailability, but oily medium causes hemolysis and epinephrine is better intramuscular (IV causes ventricular tachycardia and cardiac arrest) - nicardipine is used in hypertensive emergency and furosemide in pulmonary edema. Intramuscular is self injectable with right expertise, risks infection through unsanitary or faulty techniques, and suits peptides, irritants and oily drugs (pain). Subcutaneous gives long duration of action from slow absorption from S.C. fat and is self injectable, but irritants cause skin necrosis; long acting insulin is given this way. Intranasal spray gives rapid effect and bypasses the BBB but only a limited dose of potent drugs can be given (GnRH agonist, sumatriptan, nicotine). The inhalational route has the fastest effect because the lung is highly vascularized; irritants cause cough. Afrezza is the fastest and shortest acting insulin, and inhalational gases have 100% bioavailability, while salbutamol, ipratropium and tobramycin (pseudomonas pneumonia) are given for a local effect."},{"id":"PHARM-U12-1","ch":12,"n":1,"title":"Introduction to ANS: Components and Anatomy","sec":"Introduction to ANS: Components and Anatomy · p37","qs":["PHARM-C12-001","PHARM-C12-002","PHARM-C12-003","PHARM-C12-004","PHARM-C12-005","PHARM-C12-006","PHARM-C12-007","PHARM-C12-008"],"guide":"The ANS has two components, parasympathetic and sympathetic, and is located in the neuraxis (brain + spinal cord). The parasympathetic is the cranio-sacral part - cranial nerves III, VII, IX and X from the brain stem plus the sacral outflow - while the sympathetic is the thoraco-lumbar part. Both use a two-neuron pathway: action potential travels along the 1st neuron to a ganglion (a collection of neuronal bodies) and then along the 2nd neuron to the organ, such as the pupil or the CVS (blood vessel, heart)."},{"id":"PHARM-U12-2","ch":12,"n":2,"title":"Physiology of Action Potential: Propagation Across a Neuronal Synapse","sec":"Physiology of Action Potential: Propagation Across a Neuronal Synapse · p38","qs":["PHARM-C12-009","PHARM-C12-010","PHARM-C12-011","PHARM-C12-012","PHARM-C12-013","PHARM-C12-014"],"guide":"An action potential depolarises the presynaptic neuron, opening voltage gated Ca2+ channels; the resulting Ca2+ influx causes fusion of the vesicular and presynaptic membranes with exocytosis of neurotransmitter, which binds the post synaptic receptor. This opens Na+ channels, Na+ influx follows, and the post synaptic neuron depolarises to generate its own action potential. Neurotransmitter is stored in vesicles in the presynaptic terminal."},{"id":"PHARM-U12-3","ch":12,"n":3,"title":"Parasympathetic vs Sympathetic Innervation","sec":"Parasympathetic vs Sympathetic Innervation · p38","qs":["PHARM-C12-015","PHARM-C12-016","PHARM-C12-017","PHARM-C12-018","PHARM-C12-019","PHARM-C12-020","PHARM-C12-021","PHARM-C12-022","PHARM-C12-023","PHARM-C12-024","PHARM-C12-025","PHARM-C12-026","PHARM-C12-027","PHARM-C12-028","PHARM-C12-029","PHARM-C12-030"],"guide":"Parasympathetic outflow is cranio-sacral with ganglia near the site of action; sympathetic outflow is thoraco-lumbar with ganglia away from the site of action (pre/para vertebral). Both use nicotinic (Nn) ganglionic receptors that are sodium ion channels. Post-ganglionic parasympathetic receptors are muscarinic/nicotinic with acetylcholine as the transmitter throughout; sympathetic post-ganglionic receptors are α/β with norepinephrine, plus dopamine on renal blood vessels (D1 → vasodilatation → diuresis) and Ach at adrenals and sweat glands. Note: parasympatholytics (atropine, datura) block m3 on sweat glands causing absent sweating and hyperthermia, whereas sympatholytics have no action there. Drugs may act directly (binding the receptor) or indirectly (acting on the neurotransmitter)."},{"id":"PHARM-U12-4","ch":12,"n":4,"title":"Parasympathetic Nervous System: Acetylcholine Mechanism","sec":"Parasympathetic Nervous System: Acetylcholine Mechanism · p39","qs":["PHARM-C12-031","PHARM-C12-032","PHARM-C12-033","PHARM-C12-034","PHARM-C12-035","PHARM-C12-036","PHARM-C12-037","PHARM-C12-038","PHARM-C12-039","PHARM-C12-040","PHARM-C12-041","PHARM-C12-042"],"guide":"ACh is synthesised from acetyl Co-A and choline by choline acetyl transferase, with choline reuptake as the rate limiting step and food as a minor source of choline. It enters the vesicle and is released; β-bungarotoxin blocks entry into the vesicle, botulinum toxin blocks vesicle release and aminoglycosides block Ca2+ influx. Released ACh acts on muscarinic and nicotinic receptors and is metabolised rapidly by acetylcholinesterase (AChE), which breaks ACh into acetate and choline. AChE has an esteratic site (breaks ester bonds) and a negatively charged anionic site, and the choline released is positively charged and reuptaken."},{"id":"PHARM-U12-5","ch":12,"n":5,"title":"Clinical Significance: Nm Receptor Action and Uses of Botulinum","sec":"Clinical Significance: Nm Receptor Action and Uses of Botulinum · p39","qs":["PHARM-C12-043","PHARM-C12-044","PHARM-C12-045","PHARM-C12-046","PHARM-C12-047","PHARM-C12-048","PHARM-C12-049","PHARM-C12-050","PHARM-C12-051","PHARM-C12-052","PHARM-C12-053","PHARM-C12-054","PHARM-C12-055"],"guide":"At the Nm receptor, aminoglycosides reduce muscular contraction by lowering ACh and cause neuromuscular toxicity treated with Ca2+ as DOC. Respiratory failure is the common end point of krait bite (β-bungarotoxin), myasthenia crisis, cobra toxin and food poisoning with botulism (which also causes floppy infant syndrome), and its management is ventilation. Botulinum toxin is used in tardive dyskinesia (torticollis/cervical dystonia, injected into the SCM), urge incontinence/overactive bladder, cosmetically for glabellar lines, for unrelaxed lower esophageal sphincter causing achalasia, and for migraine prophylaxis by reducing CGRP release."},{"id":"PHARM-U12-6","ch":12,"n":6,"title":"Receptors: Nicotinic Receptors","sec":"Receptors: Nicotinic Receptors · p40","qs":["PHARM-C12-056","PHARM-C12-057","PHARM-C12-058","PHARM-C12-059","PHARM-C12-060","PHARM-C12-061","PHARM-C12-062","PHARM-C12-063","PHARM-C12-064","PHARM-C12-065"],"guide":"Cholinergic receptors are of two types: muscarinic (m), which are GPCRs, and nicotinic (N), which are Na+ ion channels. Nicotinic muscular (Nm) receptors at the neuromuscular junction produce muscle contraction; nicotinic neuronal (Nn) receptors at adrenal glands raise medullary norepinephrine, then cortisol from the cortex and finally epinephrine released into plasma, at ganglia generate action potential, and in the CNS cause stimulation. In myasthenia gravis anti-ACh antibodies block Nm and decrease muscle contraction, giving fatigue, ptosis and respiratory failure (crisis)."},{"id":"PHARM-U12-7","ch":12,"n":7,"title":"Muscarinic Receptors","sec":"Muscarinic Receptors · p40","qs":["PHARM-C12-066","PHARM-C12-067","PHARM-C12-068","PHARM-C12-069","PHARM-C12-070","PHARM-C12-071","PHARM-C12-072","PHARM-C12-073","PHARM-C12-074","PHARM-C12-075","PHARM-C12-076","PHARM-C12-077","PHARM-C12-078","PHARM-C12-079"],"guide":"Muscarinic receptors split by G protein: m1 and m3 work through Gq → ↑ Ca2+, while m2/m4 work through Gi/o → relaxation. m1 in the CNS raises cognition and in the GIT raises HCl secretion. m3 causes GIT contraction, detrusor contraction in the bladder, bronchoconstriction, ↑ salivation, miosis (pupil contraction) in the circular muscle of the iris, accommodation spasm in the ciliary muscle, and in blood vessels vasodilation > vasoconstriction by activating eNOS in the endothelium. m5/m4 (CNS) are shown with a dash, and m2 blockade in the heart slows the SA node (↓ heart rate) and AV node (↓ conduction)."},{"id":"PHARM-U12-8","ch":12,"n":8,"title":"Clinical Significance: Alzheimer's Disease","sec":"Clinical Significance: Alzheimer's Disease · p41","qs":["PHARM-C12-080","PHARM-C12-081","PHARM-C12-082"],"guide":"In Alzheimer's disease there is ↓ ACh, so ↓ m1 stimulation and ↓ cognition. Treatment is with tacilifensin, an m1 agonist."},{"id":"PHARM-U12-9","ch":12,"n":9,"title":"Cholinergic and Anticholinergic Poisoning","sec":"Cholinergic and Anticholinergic Poisoning · p41","qs":["PHARM-C12-083","PHARM-C12-084","PHARM-C12-085","PHARM-C12-086","PHARM-C12-087","PHARM-C12-088","PHARM-C12-089","PHARM-C12-090","PHARM-C12-091","PHARM-C12-092","PHARM-C12-093","PHARM-C12-094","PHARM-C12-095","PHARM-C12-096","PHARM-C12-097","PHARM-C12-098","PHARM-C12-099"],"guide":"Cholinergic poisoning from organophosphates/carbamates gives miosis (pinpoint pupil) with lacrimation, ↑ salivation, bronchoconstriction with dyspnea, involuntary defecation, involuntary urination and ↑ sweating - the drug of choice being atropine. Anticholinergic poisoning from atropine and datura gives exactly the opposite picture: mydriasis, dry mouth, bronchodilation, constipation, urine retention and ↓ sweating - the drug of choice being physostigmine."},{"id":"PHARM-U13-1","ch":13,"n":1,"title":"Cholinergic Drugs: Classification","sec":"Cholinergic Drugs: Classification · p42","qs":["PHARM-C13-001","PHARM-C13-002","PHARM-C13-003","PHARM-C13-004","PHARM-C13-005","PHARM-C13-006","PHARM-C13-007","PHARM-C13-008","PHARM-C13-009","PHARM-C13-010","PHARM-C13-011","PHARM-C13-012","PHARM-C13-013","PHARM-C13-014","PHARM-C13-015"],"guide":"Cholinergic drugs are parasympathomimetics. Direct drugs stimulate muscarinic or nicotinic receptors themselves, while indirect drugs block acetylcholinesterase, raise acetylcholine and then stimulate m/n receptors. Direct agents are organised by structure into amides and choline esters; indirect agents are split into irreversible organophosphates and reversible tertiary or quaternary amines."},{"id":"PHARM-U13-2","ch":13,"n":2,"title":"Direct Cholinergic Drugs: Amides, Pilocarpine and Cevimeline","sec":"Direct Cholinergic Drugs: Amides, Pilocarpine and Cevimeline · p42","qs":["PHARM-C13-016","PHARM-C13-017","PHARM-C13-018","PHARM-C13-019","PHARM-C13-020","PHARM-C13-021","PHARM-C13-022","PHARM-C13-023","PHARM-C13-024","PHARM-C13-025","PHARM-C13-026","PHARM-C13-027","PHARM-C13-028","PHARM-C13-029","PHARM-C13-030","PHARM-C13-031","PHARM-C13-032"],"guide":"Amides are lipid soluble, cross the BBB and therefore have central as well as peripheral effects, while choline esters are insoluble, do not cross the BBB and act peripherally on bladder, GIT and muscle. Pilocarpine and cevimeline are the amides, both useful for xerostomia; pilocarpine also contracts the pupil to increase trabecular outflow in glaucoma. The same contraction of accommodation muscles explains brow ache, accommodation spasm and tractional retinal detachment."},{"id":"PHARM-U13-3","ch":13,"n":3,"title":"Choline Esters and Derivatives of ACh","sec":"Choline Esters and Derivatives of ACh · p43","qs":["PHARM-C13-033","PHARM-C13-034","PHARM-C13-035","PHARM-C13-036","PHARM-C13-037","PHARM-C13-038","PHARM-C13-039","PHARM-C13-040","PHARM-C13-041","PHARM-C13-042","PHARM-C13-043","PHARM-C13-044","PHARM-C13-045","PHARM-C13-046","PHARM-C13-047","PHARM-C13-048","PHARM-C13-049","PHARM-C13-050","PHARM-C13-051","PHARM-C13-052","PHARM-C13-053","PHARM-C13-054","PHARM-C13-055","PHARM-C13-056","PHARM-C13-057","PHARM-C13-058","PHARM-C13-059","PHARM-C13-060","PHARM-C13-061","PHARM-C13-062","PHARM-C13-063"],"guide":"Acetylcholine is destroyed in plasma by plasma, pseudo or butyryl cholinesterase, so it is systemically very short acting and is mainly remembered as a topical miotic in ocular surgery. Bethanechol, carbachol and methacholine differ by esterase resistance, receptor affinity, nicotinic side effects and uses. Bethanechol treats bladder and GIT atony, carbachol is topical because systemic use is limited by side effects, and methacholine provokes m3 bronchospasm in bronchial challenge testing."},{"id":"PHARM-U13-4","ch":13,"n":4,"title":"Irreversible AChE Blockers and Organophosphate Poisoning","sec":"Irreversible AChE Blockers and Organophosphate Poisoning · p44","qs":["PHARM-C13-064","PHARM-C13-065","PHARM-C13-066","PHARM-C13-067","PHARM-C13-068","PHARM-C13-069","PHARM-C13-070","PHARM-C13-071","PHARM-C13-072","PHARM-C13-073","PHARM-C13-074","PHARM-C13-075","PHARM-C13-076","PHARM-C13-077","PHARM-C13-078","PHARM-C13-079","PHARM-C13-080","PHARM-C13-081","PHARM-C13-082","PHARM-C13-083","PHARM-C13-084","PHARM-C13-085"],"guide":"Organophosphates bind AChE and first produce a reversible phase with raised ACh, but ageing replaces phosphate bonds with stronger bonds and makes inhibition irreversible. Oximes can break the organophosphate-AChE link before ageing but become ineffective after ageing. Organophosphate poisoning is a cholinergic syndrome; atropine treats muscarinic features, while oximes reactivate AChE for nicotinic toxicity."},{"id":"PHARM-U13-5","ch":13,"n":5,"title":"Reversible AChE Blockers: Mechanism and Tertiary Amines","sec":"Reversible AChE Blockers: Mechanism and Tertiary Amines · p45","qs":["PHARM-C13-086","PHARM-C13-087","PHARM-C13-088","PHARM-C13-089","PHARM-C13-090","PHARM-C13-091","PHARM-C13-092","PHARM-C13-093","PHARM-C13-094","PHARM-C13-095","PHARM-C13-096"],"guide":"Carbamates and non-carbamates are called pseudo-irreversible because they are long acting, yet they bind AChE with weak ionic bonds rather than aged organophosphate bonds. Edrophonium is the short-acting exception that only binds the anionic site, and oximes are not used for carbamate/non-carbamate poisoning. Tertiary amines cross the BBB, so physostigmine treats anticholinergic poisoning and synthetic agents are used for Alzheimer's disease."},{"id":"PHARM-U13-6","ch":13,"n":6,"title":"Quaternary AChE Inhibitors and Myasthenia Gravis","sec":"Quaternary AChE Inhibitors and Myasthenia Gravis · p46","qs":["PHARM-C13-097","PHARM-C13-098","PHARM-C13-099","PHARM-C13-100","PHARM-C13-101","PHARM-C13-102","PHARM-C13-103","PHARM-C13-104","PHARM-C13-105","PHARM-C13-106","PHARM-C13-107","PHARM-C13-108","PHARM-C13-109","PHARM-C13-110","PHARM-C13-111","PHARM-C13-112","PHARM-C13-113","PHARM-C13-114","PHARM-C13-115","PHARM-C13-116","PHARM-C13-117"],"guide":"Quaternary amines do not cross the BBB, so their action is peripheral. Edrophonium is a short-acting diagnostic drug for myasthenia gravis and separates myasthenic from cholinergic crisis by improvement versus worsening. Neostigmine is long acting for Nm and peripheral bladder/GIT uses, while pyridostigmine is the DOC for chronic myasthenia gravis; severe myasthenic crisis uses IVIG and newer chronic therapies lower antibodies."},{"id":"PHARM-U13-7","ch":13,"n":7,"title":"Blood Pressure Responses to Acetylcholine","sec":"Blood Pressure Responses to Acetylcholine · p47","qs":["PHARM-C13-118","PHARM-C13-119","PHARM-C13-120","PHARM-C13-121","PHARM-C13-122","PHARM-C13-123","PHARM-C13-124","PHARM-C13-125","PHARM-C13-126"],"guide":"Low-dose ACh lowers BP through m3-mediated vasodilation, and a larger dose gives a larger fall. If atropine blocks m3, ordinary ACh produces no BP effect. With high-dose ACh in the presence of atropine, ganglionic Nn stimulation releases norepinephrine, producing vasoconstriction and a pressor response."},{"id":"PHARM-U14-1","ch":14,"n":1,"title":"Anticholinergic Drugs: Classification and Nicotinic Blockers","sec":"Anticholinergic Drugs: Classification and Nicotinic Blockers · p48","qs":["PHARM-C14-001","PHARM-C14-002","PHARM-C14-003","PHARM-C14-004","PHARM-C14-005","PHARM-C14-006","PHARM-C14-007","PHARM-C14-008","PHARM-C14-009","PHARM-C14-010","PHARM-C14-011","PHARM-C14-012","PHARM-C14-013","PHARM-C14-014","PHARM-C14-015","PHARM-C14-016","PHARM-C14-017","PHARM-C14-018","PHARM-C14-019","PHARM-C14-020","PHARM-C14-021"],"guide":"Anticholinergic drugs are parasympatholytics and are direct acting. They include muscarinic blockers and nicotinic blockers; nicotinic blockers are further separated into Nm muscular blockers and Nn neuronal or ganglionic blockers. Nm blockers relax skeletal muscle at the NMJ, whereas ganglionic blockers reduce sympathetic post-ganglionic norepinephrine release, producing vasodilation, antihypertensive action and postural hypotension."},{"id":"PHARM-U14-2","ch":14,"n":2,"title":"Muscarinic Blockers: CNS, Eyes and Oropharynx","sec":"Muscarinic Blockers: CNS, Eyes and Oropharynx · p49","qs":["PHARM-C14-022","PHARM-C14-023","PHARM-C14-024","PHARM-C14-025","PHARM-C14-026","PHARM-C14-027","PHARM-C14-028","PHARM-C14-029","PHARM-C14-030","PHARM-C14-031","PHARM-C14-032","PHARM-C14-033","PHARM-C14-034","PHARM-C14-035","PHARM-C14-036","PHARM-C14-037","PHARM-C14-038","PHARM-C14-039","PHARM-C14-040","PHARM-C14-041","PHARM-C14-042","PHARM-C14-043","PHARM-C14-044","PHARM-C14-045"],"guide":"Muscarinic blockade in the CNS decreases cognition; scopolamine is remembered as a truth serum, an alternate narcoanalysis drug and the DOC for motion sickness as a transdermal patch. In the eye, muscarinic blockers cause passive mydriasis and cycloplegia; short-acting drops are used in adults, whereas potent atropine ointment is used in children and for uveitis-related indications. Glycopyrrolate decreases oropharyngeal secretions as a quaternary amine that does not cross the BBB, making it useful before anaesthesia to prevent aspiration."},{"id":"PHARM-U14-3","ch":14,"n":3,"title":"Pulmonary Antimuscarinics, Inhalation Devices and Paradoxical Bronchoconstriction","sec":"Pulmonary Antimuscarinics, Inhalation Devices and Paradoxical Bronchoconstriction · p49","qs":["PHARM-C14-046","PHARM-C14-047","PHARM-C14-048","PHARM-C14-049","PHARM-C14-050","PHARM-C14-051","PHARM-C14-052","PHARM-C14-053","PHARM-C14-054","PHARM-C14-055","PHARM-C14-056","PHARM-C14-057","PHARM-C14-058","PHARM-C14-059","PHARM-C14-060","PHARM-C14-061","PHARM-C14-062","PHARM-C14-063","PHARM-C14-064","PHARM-C14-065","PHARM-C14-066","PHARM-C14-067","PHARM-C14-068","PHARM-C14-069","PHARM-C14-070"],"guide":"Antimuscarinics in the lung cause bronchodilation and are classified by duration into SAMA, IAMA and LAMA. Ipratropium is the short-acting QID drug, tiotropium is DOC in COPD, and long-acting agents are add-on drugs in asthma or COPD. They are delivered by inhalation through pMDI or nebuliser, but paradoxical bronchoconstriction can occur from hypotonic solution, bromide or presynaptic m2 blockade that increases ACh and stimulates postsynaptic m3."},{"id":"PHARM-U14-4","ch":14,"n":4,"title":"Muscarinic Blockers: Heart and GIT","sec":"Muscarinic Blockers: Heart and GIT · p50","qs":["PHARM-C14-071","PHARM-C14-072","PHARM-C14-073","PHARM-C14-074","PHARM-C14-075","PHARM-C14-076","PHARM-C14-077","PHARM-C14-078","PHARM-C14-079","PHARM-C14-080","PHARM-C14-081","PHARM-C14-082","PHARM-C14-083","PHARM-C14-084","PHARM-C14-085","PHARM-C14-086","PHARM-C14-087"],"guide":"Atropine increases heart rate and AV conduction and is the DOC for conduction blocks such as digoxin toxicity and for bradycardia when the dose is at least 0.5 mg. Very low IV doses can paradoxically slow the heart through presynaptic muscarinic blockade. In the GIT, m1 blockers such as pirenzepine and telenzepine are obsolete anti-secretory drugs, while antispasmodics such as glycopyrrolate, dicyclomine and hyoscine reduce contraction and relieve abdominal pain or motion sickness."},{"id":"PHARM-U14-5","ch":14,"n":5,"title":"Muscarinic Blockers Acting on Bladder","sec":"Muscarinic Blockers Acting on Bladder · p51","qs":["PHARM-C14-088","PHARM-C14-089","PHARM-C14-090","PHARM-C14-091","PHARM-C14-092","PHARM-C14-093","PHARM-C14-094","PHARM-C14-095","PHARM-C14-096","PHARM-C14-097","PHARM-C14-098","PHARM-C14-099"],"guide":"Bladder antimuscarinics reduce detrusor contraction and treat urge incontinence. Selective m3 blockers such as darifenacin and solifenacin are contrasted with trospium, a quaternary amine useful when Alzheimer's disease is present because it does not cross the BBB. Non-selective drugs such as oxybutynin, tolterodine, flavoxate and fesoterodine can block brain m1 receptors and cause dementia on long-term use."},{"id":"PHARM-U15-1","ch":15,"n":1,"title":"Physiology of Norepinephrine: Synthesis, Storage, Release and Metabolism","sec":"Physiology of Norepinephrine: Synthesis, Storage, Release and Metabolism · p52","qs":["PHARM-C15-001","PHARM-C15-002","PHARM-C15-003","PHARM-C15-004","PHARM-C15-005","PHARM-C15-006","PHARM-C15-007","PHARM-C15-008","PHARM-C15-009","PHARM-C15-010","PHARM-C15-011","PHARM-C15-012","PHARM-C15-013","PHARM-C15-014","PHARM-C15-015","PHARM-C15-016","PHARM-C15-017","PHARM-C15-018"],"guide":"Norepinephrine synthesis begins with tyrosine and the rate-limiting enzyme tyrosine hydroxylase, then proceeds through DOPA and dopamine before dopamine enters the vesicle through VMAT2 and is converted to norepinephrine by dopamine-β-hydroxylase. Released norepinephrine acts on α and β receptors, is metabolised by MAO and COMT, and is cleared by reuptake. Several drugs map exactly onto this diagram: metyrosine blocks tyrosine hydroxylase, reserpine/tetrabenazine derivatives block VMAT2, and cocaine, TCAs and SNRIs block reuptake."},{"id":"PHARM-U15-2","ch":15,"n":2,"title":"Drugs Modifying NE/DA and Cocaine Dependence","sec":"Drugs Modifying NE/DA and Cocaine Dependence · p52","qs":["PHARM-C15-019","PHARM-C15-020","PHARM-C15-021","PHARM-C15-022","PHARM-C15-023","PHARM-C15-024","PHARM-C15-025","PHARM-C15-026","PHARM-C15-027","PHARM-C15-028","PHARM-C15-029","PHARM-C15-030","PHARM-C15-031","PHARM-C15-032","PHARM-C15-033","PHARM-C15-034","PHARM-C15-035","PHARM-C15-036","PHARM-C15-037","PHARM-C15-038","PHARM-C15-039","PHARM-C15-040","PHARM-C15-041"],"guide":"Metyrosine lowers catecholamines by competitively inhibiting tyrosine hydroxylase and is used in malignant pheochromocytoma. VMAT2 blockers lower norepinephrine and dopamine: reserpine is now uncommon, tetrabenazine is DOC for Huntington chorea and Tourette-associated tics, and deutetrabenazine/valbenazine are long-acting derivatives used for tardive dyskinesia. Cocaine blocks NA and DA reuptake, raising DA and addiction potential; dependence is managed by keeping dopamine receptors engaged with bromocriptine and tapering."},{"id":"PHARM-U15-3","ch":15,"n":3,"title":"Sympathetic α Receptors","sec":"Sympathetic α Receptors · p53","qs":["PHARM-C15-042","PHARM-C15-043","PHARM-C15-044","PHARM-C15-045","PHARM-C15-046","PHARM-C15-047","PHARM-C15-048","PHARM-C15-049","PHARM-C15-050","PHARM-C15-051","PHARM-C15-052","PHARM-C15-053","PHARM-C15-054","PHARM-C15-055","PHARM-C15-056","PHARM-C15-057","PHARM-C15-058","PHARM-C15-059","PHARM-C15-060","PHARM-C15-061","PHARM-C15-062","PHARM-C15-063","PHARM-C15-064"],"guide":"Sympathetic receptors are GPCRs divided into α and β. α1 is mainly postsynaptic, centrally placed on the membrane and Gq-coupled; it contracts vascular, prostatic, bladder sphincter and radial iris smooth muscle but relaxes GIT through Ca2+-dependent K+ opening and hyperpolarisation. α2 is predominantly presynaptic and Gi-coupled; late stimulation reduces further NE release, causing central sympatholysis, but postsynaptic vascular α2 can vasoconstrict and pancreatic β-islet α2 reduces insulin to raise glucose."},{"id":"PHARM-U15-4","ch":15,"n":4,"title":"Catecholamines, Blood Glucose and β Receptors","sec":"Catecholamines, Blood Glucose and β Receptors · p54","qs":["PHARM-C15-065","PHARM-C15-066","PHARM-C15-067","PHARM-C15-068","PHARM-C15-069","PHARM-C15-070","PHARM-C15-071","PHARM-C15-072","PHARM-C15-073","PHARM-C15-074","PHARM-C15-075","PHARM-C15-076","PHARM-C15-077","PHARM-C15-078","PHARM-C15-079","PHARM-C15-080","PHARM-C15-081","PHARM-C15-082","PHARM-C15-083","PHARM-C15-084","PHARM-C15-085","PHARM-C15-086","PHARM-C15-087","PHARM-C15-088","PHARM-C15-089","PHARM-C15-090","PHARM-C15-091","PHARM-C15-092","PHARM-C15-093","PHARM-C15-094","PHARM-C15-095","PHARM-C15-096","PHARM-C15-097","PHARM-C15-098","PHARM-C15-099"],"guide":"The notes compare m3 and α/β signalling and explain why catecholamines produce hyperglycemia: α1/α2/β2 stimulation is released during hypoglycemia, and the β2 liver/skeletal-muscle rise in glucose outweighs pancreatic insulin release. β receptors are Gs-coupled: β1 acts in heart and kidney to raise contraction, rate, conduction and renin, β2 relaxes smooth muscle but also causes tremor, palpitations, hyperglycemia and hypokalemia, and β3 relaxes bladder while stimulating adipocyte lipolysis."},{"id":"PHARM-U16-1","ch":16,"n":1,"title":"Adrenergic Drugs: Classification","sec":"Adrenergic Drugs: Classification · p56","qs":["PHARM-C16-001","PHARM-C16-002","PHARM-C16-003","PHARM-C16-004","PHARM-C16-005","PHARM-C16-006"],"guide":"Adrenergic drugs are sympathomimetics. They can act directly on α and β receptors or indirectly by increasing norepinephrine, which then stimulates α and β receptors. Direct agents are divided into catecholamines and non-catecholamines; catecholamines may be endogenous or exogenous, while non-catecholamines include α-agonists and β-agonists."},{"id":"PHARM-U16-2","ch":16,"n":2,"title":"Endogenous Catecholamines: Epinephrine","sec":"Endogenous Catecholamines: Epinephrine · p56","qs":["PHARM-C16-007","PHARM-C16-008","PHARM-C16-009","PHARM-C16-010","PHARM-C16-011","PHARM-C16-012","PHARM-C16-013","PHARM-C16-014","PHARM-C16-015","PHARM-C16-016","PHARM-C16-017","PHARM-C16-018","PHARM-C16-019"],"guide":"Epinephrine is the endogenous catecholamine that acts on α, β1 and β2 receptors and is a stronger cardiac stimulant than norepinephrine. It is DOC in cardiac arrest, anaphylactic shock and brittle asthma, with different dilutions/routes for cardiac arrest versus anaphylaxis. Other uses are prolonging local anaesthesia through vasoconstriction and glaucoma therapy with dipivefrine preferred; conjunctival pigmentation is linked to tyrosine, the common melanin precursor."},{"id":"PHARM-U16-3","ch":16,"n":3,"title":"Endogenous Catecholamines: Norepinephrine and Dopamine","sec":"Endogenous Catecholamines: Norepinephrine and Dopamine · p56","qs":["PHARM-C16-020","PHARM-C16-021","PHARM-C16-022","PHARM-C16-023","PHARM-C16-024","PHARM-C16-025","PHARM-C16-026","PHARM-C16-027","PHARM-C16-028","PHARM-C16-029","PHARM-C16-030","PHARM-C16-031","PHARM-C16-032","PHARM-C16-033","PHARM-C16-034","PHARM-C16-035","PHARM-C16-036","PHARM-C16-037","PHARM-C16-038","PHARM-C16-039"],"guide":"Norepinephrine acts on α1 and β1 and is a stronger vasoconstrictor than epinephrine because it lacks β2 vasodilation. It is given only IV for vasodilatory, cardiogenic and neurogenic shock, while IM use is contraindicated because of muscle necrosis. Dopamine is d
