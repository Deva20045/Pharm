<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE · Pharmacology — Marrow Edition 8 Companion</title>
<style>
  :root{
    --bg:#120d1a; --card:#221a30; --card2:#2b2139; --line:#3a2d52;
    --txt:#f4eefb; --mut:#a89bbd; --pink:#e0607e; --gold:#c99a4b;
    --teal:#5fd0b5; --good:#3ddc84; --bad:#ff5d6c; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 60px;}
  header.top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:#120d1af2; border-bottom:1px solid var(--line); max-width:560px; margin:0 auto;}
  header.top .brand{font-weight:800; font-size:20px; letter-spacing:.3px; flex:1;}
  header.top .back{font-size:22px; cursor:pointer; color:var(--mut); padding:2px 8px 2px 0;}
  .hstat{font-weight:800; font-size:15px; white-space:nowrap;}
  .hidden{display:none !important;}
  .hero{background:linear-gradient(160deg,#3a2547,#221a30 70%); border:1px solid var(--line);
    border-radius:22px; padding:26px 22px; margin:16px 0;}
  .hero .kick{font-size:12px; letter-spacing:2.5px; color:var(--mut);}
  .hero h1{font-family:var(--serif); font-size:42px; margin:8px 0 10px; line-height:1.05;}
  .hero p{color:#cbbfe0; font-size:15px; line-height:1.55; margin:0 0 12px;}
  .hero a{color:var(--pink); font-weight:700; text-decoration:none; font-size:15px; cursor:pointer;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px; text-align:center;}
  .stat b{font-size:22px; display:block;} .stat span{font-size:12px; color:var(--mut);}
  .btn{display:block; width:100%; margin-top:12px; padding:15px; font-size:16px; font-weight:700;
    color:#1a0f14; background:linear-gradient(135deg,#f0788f,var(--pink)); border:0; border-radius:14px; cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--txt); border:1.5px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,#e0b45f,var(--gold)); color:#1d1405;}
  h2.page{font-family:var(--serif); font-size:30px; margin:18px 0 2px;}
  p.sub{color:var(--mut); margin:0 0 14px; font-size:14px;}
  .chrow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin:10px 0; cursor:pointer;}
  .chrow.locked{opacity:.45; cursor:default;}
  .chnum{min-width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    font-weight:800; font-size:17px; background:linear-gradient(135deg,#d96a84,#b34a62); color:#fff;}
  .chrow.locked .chnum{background:#3a2f4d; color:var(--mut);}
  .chrow .t{flex:1; font-weight:700; font-size:15.5px; line-height:1.35;}
  .chrow .u{font-size:12.5px; color:var(--teal); white-space:nowrap; font-weight:700;}
  .chrow.locked .u{color:var(--mut);}
  .pathsec{text-align:center; color:var(--mut); font-size:12px; letter-spacing:2.5px; margin:26px 0 6px;
    display:flex; align-items:center; gap:10px;}
  .pathsec::before,.pathsec::after{content:""; flex:1; height:1px; background:var(--line);}
  .node{display:flex; flex-direction:column; align-items:center; position:relative; padding:10px 0 4px;}
  .node:not(:last-child)::after{content:""; width:3px; height:26px; margin-top:10px; border-radius:2px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px);}
  .ball{width:86px; height:86px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; font-weight:800; cursor:pointer; border:4px solid transparent;}
  .ball.done{background:#1d3a2a; border-color:var(--good); color:var(--good); font-size:32px;}
  .ball.current{background:radial-gradient(circle at 35% 30%,#e0b45f,var(--gold) 70%);
    color:#fff; box-shadow:0 0 0 6px #c99a4b33, 0 8px 24px #c99a4b55; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 6px #c99a4b33;}50%{box-shadow:0 0 0 11px #c99a4b22;}}
  .ball.locked{background:#241c33; border-color:#171224; color:#6f6386; cursor:default; font-size:30px;}
  .ntitle{margin-top:8px; font-weight:700; font-size:14.5px; text-align:center; max-width:230px; line-height:1.35;}
  .ncount{font-size:12px; color:var(--mut); margin-top:2px;}
  .guide{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-top:16px;}
  .guide .kick{font-size:12px; letter-spacing:2px; color:var(--gold); font-weight:800;}
  .guide h2{font-family:var(--serif); font-size:26px; margin:8px 0 10px; line-height:1.25;}
  .guide p{color:#d8cde9; line-height:1.65; font-size:15.5px;}
  .qbar{height:10px; background:var(--card2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:16px 0 14px;}
  .qbar i{display:block; height:100%; width:0; background:var(--pink); transition:width .3s;}
  .qcount{font-size:12px; letter-spacing:2px; color:var(--mut); font-weight:700;}
  .qtag{display:inline-block; font-size:11.5px; color:var(--teal); border:1px solid #5fd0b555;
    border-radius:999px; padding:3px 10px; margin-top:8px;}
  .qtext{font-family:var(--serif); font-size:25px; line-height:1.35; margin:10px 0 16px;}
  .opt{display:block; width:100%; text-align:left; margin:10px 0; padding:16px; font-size:16px;
    color:var(--txt); background:var(--card); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; line-height:1.4;}
  .opt:not(:disabled):active{border-color:var(--pink);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:#3ddc841c;}
  .opt.wrong{border-color:var(--bad); background:#ff5d6c1c;}
  .fb{margin-top:12px; padding:14px 15px; border-radius:14px; font-size:14.5px; line-height:1.6; display:none;}
  .fb.show{display:block;}
  .fb.good{background:#3ddc8412; border:1px solid #3ddc8466;}
  .fb.bad{background:#ff5d6c12; border:1px solid #ff5d6c66;}
  .donebox{text-align:center; padding:30px 10px;}
  .donebox .big{font-size:64px;}
  .donebox h2{font-family:var(--serif); font-size:30px; margin:10px 0 4px;}
  .rev{margin:8px 0; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
    font-size:13.5px; background:var(--card); line-height:1.5; text-align:left;}
  .rev b{color:var(--good);}
  footer{text-align:center; color:var(--mut); font-size:12px; margin-top:22px; line-height:1.7;}
  .float{position:fixed; font-weight:800; pointer-events:none; animation:rise 1s ease-out forwards; z-index:50;}
  @keyframes rise{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);}}
</style>
</head>
<body>
<header class="top">
  <span class="back hidden" id="backBtn" onclick="goBack()">‹</span>
  <span class="brand" id="brand">PULSE</span>
  <span class="hstat">🔥 <span id="hStreak">0</span></span>
  <span class="hstat">✦ <span id="hXP">0</span></span>
</header>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="hero">
      <div class="kick">MARROW EDITION 8 · COMPANION</div>
      <h1>Pharmacology</h1>
      <p id="heroSub"></p>
      <a onclick="show('chapters')">Browse chapters →</a>
    </div>
    <div class="stats">
      <div class="stat"><b id="sXP">0</b><span>Total XP</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="sUnits">0</b><span>Units done</span></div>
    </div>
    <button class="btn ghost" onclick="unlockAll()">🔓 Unlock all units (testing)</button>
    <button class="btn" onclick="continueLearning()">▶ Continue learning</button>
  </div>

  <!-- CHAPTERS -->
  <div id="chapters" class="hidden">
    <h2 class="page">Chapters</h2>
    <p class="sub" id="chSub"></p>
    <div id="chList"></div>
  </div>

  <!-- PATH -->
  <div id="path" class="hidden">
    <p class="sub" id="pathKick" style="margin-top:16px;"></p>
    <h2 class="page" id="pathTitle" style="margin-top:0;"></h2>
    <p class="sub" id="pathSub"></p>
    <div id="nodes"></div>
  </div>

  <!-- GUIDE -->
  <div id="guide" class="hidden">
    <div class="guide">
      <div class="kick" id="gKick"></div>
      <h2 id="gTitle"></h2>
      <p id="gText"></p>
      <p class="sub" id="gCount"></p>
      <button class="btn gold" onclick="beginUnit()">Start unit →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qbar"><i id="qbar"></i></div>
    <div class="qcount" id="qcount"></div>
    <div><span class="qtag" id="qtag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn" onclick="nextQ()">Continue →</button>
  </div>

  <!-- UNIT DONE -->
  <div id="unitdone" class="hidden">
    <div class="donebox">
      <div class="big">🎉</div>
      <h2>Unit complete!</h2>
      <p class="sub" id="dSub"></p>
      <div class="stats">
        <div class="stat"><b id="dScore">–</b><span>Score</span></div>
        <div class="stat"><b id="dXP">–</b><span>XP earned</span></div>
        <div class="stat"><b id="dAcc">–</b><span>Accuracy</span></div>
      </div>
      <div id="dRev"></div>
      <button class="btn" onclick="afterUnit()">Continue →</button>
      <button class="btn ghost" onclick="openGuide(curUnit)">↻ Redo unit</button>
    </div>
  </div>

  <footer>PULSE · Pharmacology · question order follows the book line-by-line<br>options shuffled every run · progress saved on this device</footer>
</div>

<script>
const QUESTIONS = [{"id":"PHARM-C1-001","sec":"Definitions","page":1,"q":"As defined on this page, pharmacokinetics is the study of:","opts":["Movement of drugs in the body after intake through any route","Drug-induced change in the body","Binding of drugs to their specific receptors","Variation of drug response between individuals"],"ans":0,"exp":"Pharmacokinetics = study of movement of drugs in the body after intake through any route; the drug-induced change in the body is pharmacodynamics. (Book p1)"},{"id":"PHARM-C1-002","sec":"Definitions","page":1,"q":"Pharmacodynamics is defined as:","opts":["The movement of the drug within the body after intake","The chemical breakdown of the drug in the liver","The elimination of the drug via the kidney","The drug-induced change in the body"],"ans":3,"exp":"Pharmacodynamics = drug-induced change in the body (what the drug does to the body). (Book p1)"},{"id":"PHARM-C1-003","sec":"Figure legend","page":1,"q":"In the course-of-drug flowchart, which processes are colour-coded as pharmacokinetics?","opts":["Drug, binds to target and effect","Intake, binding and onset of action","Absorption, distribution, metabolism and excretion","Adipose storage, redistribution and tubular secretion"],"ans":2,"exp":"The legend marks absorption, distribution, metabolism and excretion as pharmacokinetics; the drug, binding to target and effect are marked as pharmacodynamics. (Book p1)"},{"id":"PHARM-C1-004","sec":"Figure legend","page":1,"q":"According to the flowchart legend, which trio is treated as pharmacodynamic events?","opts":["Absorption, distribution, excretion","Distribution, metabolism, excretion","Absorption, effect, redistribution","Drug, binding to target, effect"],"ans":3,"exp":"The legend highlights the drug itself, 'binds to target' and 'effect' as pharmacodynamics. (Book p1)"},{"id":"PHARM-C1-005","sec":"Absorption & distribution","page":1,"q":"A drug is taken orally. Per the flowchart, the first pharmacokinetic step it undergoes is:","opts":["Distribution","Metabolism","Excretion","Absorption"],"ans":3,"exp":"The orally taken drug undergoes absorption first, and only then reaches the systemic circulation. (Book p1)"},{"id":"PHARM-C1-006","sec":"Absorption & distribution","page":1,"q":"Immediately after absorption, the drug enters the:","opts":["Systemic circulation","Adipose tissue","Bile","Target receptor"],"ans":0,"exp":"Absorption delivers the drug into the systemic circulation; from there it can be distributed (e.g., to adipose tissue) or carried on to the remaining drug steps. (Book p1)"},{"id":"PHARM-C1-007","sec":"Absorption & distribution","page":1,"q":"In the flowchart, the movement of drug toward the adipose tissue is labelled:","opts":["Absorption","Metabolism","Excretion","Distribution"],"ans":3,"exp":"The arrow carrying drug to the adipose tissue is labelled distribution. (Book p1)"},{"id":"PHARM-C1-008","sec":"Absorption & distribution","page":1,"q":"Some drugs reach the adipose tissue by a variant of distribution termed:","opts":["Redistribution","Reabsorption","Bioactivation","Ion trapping"],"ans":0,"exp":"The second arrow to adipose tissue reads 'Some drugs: Redistribution' — these drugs shift into fat after entering the circulation. (Book p1)"},{"id":"PHARM-C1-009","sec":"Drugs reaching adipose tissue","page":1,"q":"Which set correctly lists the features of drugs reaching adipose tissue?","opts":["Very short acting, high lipid solubility, crosses the BBB","Long acting, water soluble, confined to plasma","Very short acting, water soluble, cannot cross the BBB","Long acting, high lipid solubility, excluded from the CNS"],"ans":0,"exp":"Drugs reaching adipose tissue are very short acting, have increased lipid solubility and cross the blood–brain barrier — e.g., the anaesthetics propofol and thiopentone. (Book p1)"},{"id":"PHARM-C1-010","sec":"Drugs reaching adipose tissue","page":1,"q":"Drugs that partition into adipose tissue share which solubility profile?","opts":["High water solubility","High lipid solubility","Poor membrane permeability","Exclusive plasma protein binding"],"ans":1,"exp":"Adipose-seeking drugs have increased lipid solubility, which also lets them cross the BBB. (Book p1)"},{"id":"PHARM-C1-011","sec":"Drugs reaching adipose tissue","page":1,"q":"Owing to their high lipid solubility, the adipose-reaching anaesthetics readily cross the:","opts":["Blood–testis barrier","Blood–retinal barrier","Placental barrier only","Blood–brain barrier"],"ans":3,"exp":"Increased lipid solubility → crosses the blood–brain barrier, the property exploited by intravenous anaesthetics like propofol and thiopentone. (Book p1)"},{"id":"PHARM-C1-012","sec":"Drugs reaching adipose tissue","page":1,"q":"The intravenous anaesthetics cited as examples of drugs reaching adipose tissue are:","opts":["Ketamine and etomidate","Propofol and thiopentone","Halothane and sevoflurane","Midazolam and dexmedetomidine"],"ans":1,"exp":"The examples given are the anaesthetics propofol and thiopentone. (Book p1)"},{"id":"PHARM-C1-013","sec":"Drugs reaching adipose tissue","page":1,"q":"A patient wakes within minutes of stopping a propofol infusion. Per the flowchart, propofol's 'very short acting' behaviour is best explained by its:","opts":["Rapid hepatic acetylation","Active renal tubular secretion","Irreversible binding to its target","Redistribution into adipose tissue"],"ans":3,"exp":"Lipid-soluble anaesthetics such as propofol and thiopentone move into adipose tissue (distribution/redistribution) and are therefore very short acting. (Book p1)"},{"id":"PHARM-C1-014","sec":"Target binding & effect","page":1,"q":"In the flowchart, the systemic circulation containing the remaining drug passes it next to which event?","opts":["Binding to the target","Immediate renal excretion","Storage in bone","Conversion into a prodrug"],"ans":0,"exp":"Systemic circulation containing the remaining drug → binds to target. (Book p1)"},{"id":"PHARM-C1-015","sec":"Target binding & effect","page":1,"q":"The drug produces its clinical effect only after it:","opts":["Is excreted into the gut","Binds to its target","Reaches the adipose tissue","Becomes water soluble"],"ans":1,"exp":"'Binds to target' → 'effect': binding to the target is the pharmacodynamic step that produces the effect. (Book p1)"},{"id":"PHARM-C1-016","sec":"Target binding & effect","page":1,"q":"How do most drugs bind to their target?","opts":["Irreversibly","Covalently and permanently","Reversibly","By denaturing the receptor"],"ans":2,"exp":"Most drugs bind reversibly; hence breakdown of the bond later releases the drug back into the circulation. (Book p1)"},{"id":"PHARM-C1-017","sec":"Target binding & effect","page":1,"q":"According to the loop in the flowchart, breakdown of the drug–target bond causes the drug to:","opts":["Be destroyed immediately","Return to the systemic circulation","Deposit in adipose tissue","Lose all water solubility"],"ans":1,"exp":"Because most drugs bind reversibly, breakdown of the bond returns the drug to the systemic circulation. (Book p1)"},{"id":"PHARM-C1-018","sec":"Hepatic metabolism","page":1,"q":"Metabolism in the liver breaks the drug down and makes it more:","opts":["Lipid soluble","Protein bound","Unionized","Water soluble"],"ans":3,"exp":"Liver metabolism = breakdown that makes the drug water soluble, preparing it for excretion. (Book p1)"},{"id":"PHARM-C1-019","sec":"Hepatic metabolism","page":1,"q":"The purpose of converting the drug into a water-soluble form is to promote its:","opts":["Crossing of the BBB","Excretion from the body","Storage in adipose tissue","Binding to the target"],"ans":1,"exp":"Once made water soluble, most drugs pass via the systemic circulation to the kidney for excretion (some via the gut). (Book p1)"},{"id":"PHARM-C1-020","sec":"Excretion","page":1,"q":"Per the flowchart, most drugs are excreted through the:","opts":["Gut","Skin","Lungs","Kidney"],"ans":3,"exp":"Most drugs are excreted via the systemic circulation into the kidney; the gut handles the remainder. (Book p1)"},{"id":"PHARM-C1-021","sec":"Excretion","page":1,"q":"Besides the kidney, the other excretory route shown is the:","opts":["Gut","Sweat","Saliva","Lungs"],"ans":0,"exp":"Excretion = most drugs via systemic circulation → kidney, and some via the gut. (Book p1)"},{"id":"PHARM-C1-022","sec":"Course of drug through the body","page":1,"q":"Arrange the course of an orally administered drug in the correct order:","opts":["Absorption → systemic circulation → target binding → effect → hepatic metabolism → excretion","Absorption → hepatic metabolism → target binding → systemic circulation → effect","Systemic circulation → absorption → excretion → target binding → effect","Target binding → absorption → distribution → excretion → effect"],"ans":0,"exp":"Oral drug → absorption → systemic circulation → binds to target → effect; remaining drug is metabolised in the liver to a water-soluble form and excreted via the kidney (most drugs) or the gut. (Book p1)"},{"id":"PHARM-C2-001","sec":"Absorption","page":2,"q":"In the absorption diagram, the structure labelled 'biological membrane' separates the:","opts":["Intestinal lumen from the blood vessel lumen","Two lipid layers of the enterocyte","Carrier protein from the membrane pore","Systemic circulation from adipose tissue"],"ans":0,"exp":"The diagram shows drug in the intestinal lumen crossing the biological membrane to reach the blood vessel lumen; every absorption mechanism (i-iv) is drawn across this membrane. (Book p2)"},{"id":"PHARM-C2-002","sec":"Absorption legend","page":2,"q":"In the legend of the absorption diagram, the Y-shaped symbol represents a:","opts":["Drug molecule","Carrier protein","Membrane pore","Blood vessel"],"ans":1,"exp":"The legend at the top of the diagram labels the Y-shaped symbol as 'carrier' and the triangle as 'drug'. (Book p2)"},{"id":"PHARM-C2-003","sec":"Absorption legend","page":2,"q":"In the legend of the absorption diagram, the triangle symbol represents:","opts":["A carrier protein","A membrane pore","A drug molecule","A charged protein"],"ans":2,"exp":"The triangle is the symbol used throughout the diagram for the drug molecule, shown moving from intestinal lumen to blood vessel lumen. (Book p2)"},{"id":"PHARM-C2-004","sec":"Absorption","page":2,"q":"Which set lists the four mechanisms of absorption across the biological membrane in the order i to iv shown in the diagram?","opts":["Filtration, simple/passive diffusion, facilitated diffusion, active transport","Simple diffusion, filtration, active transport, facilitated diffusion","Active transport, facilitated diffusion, filtration, simple diffusion","Facilitated diffusion, active transport, filtration, simple diffusion"],"ans":0,"exp":"The diagram numbers the mechanisms i. Filtration, ii. Simple/passive diffusion (m/c), iii. Facilitated diffusion and iv. Active transport. (Book p2)"},{"id":"PHARM-C2-005","sec":"Absorption","page":2,"q":"The brace labelled 'ATP not required' in the absorption diagram covers which mechanisms?","opts":["Facilitated diffusion and active transport","Filtration, simple/passive diffusion and facilitated diffusion","Filtration and active transport only","Simple/passive diffusion alone"],"ans":1,"exp":"Filtration (i), simple/passive diffusion (ii) and facilitated diffusion (iii) are bracketed together as processes in which ATP is not required; only active transport needs ATP. (Book p2)"},{"id":"PHARM-C2-006","sec":"Absorption","page":2,"q":"Of the four absorption mechanisms shown, which one alone requires ATP?","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":3,"exp":"Active transport (iv) is the only mechanism annotated 'ATP required'; the other three lie inside the 'ATP not required' brace. (Book p2)"},{"id":"PHARM-C2-007","sec":"Absorption","page":2,"q":"In the absorption diagram, the mechanism marked 'm/c' (most common) is:","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":1,"exp":"Simple/passive diffusion carries the annotation 'm/c', i.e., it is the most common mechanism by which drugs cross biological membranes. (Book p2)"},{"id":"PHARM-C2-008","sec":"Filtration","page":2,"q":"In the absorption diagram, filtration (i) carries the drug across the membrane through:","opts":["Membrane pores","A carrier protein","Charged membrane proteins","The lipid bilayer itself"],"ans":0,"exp":"Filtration is drawn as a drug moving through a pore/channel in the biological membrane, with no carrier involvement. (Book p2)"},{"id":"PHARM-C2-009","sec":"Filtration","page":2,"q":"The example of a drug absorbed by filtration given in the diagram is:","opts":["Insulin given subcutaneously","Digoxin given orally","Loperamide given orally","Salbutamol given by inhalation"],"ans":0,"exp":"The diagram reads 'i. Filtration: Eg: Insulin (subcutaneous)' — insulin is the cited example of a drug absorbed through pores by filtration. (Book p2)"},{"id":"PHARM-C2-010","sec":"Filtration","page":2,"q":"Filtration as depicted in the absorption diagram requires which of the following?","opts":["ATP hydrolysis","A carrier protein","A concentration gradient but no ATP","Transport independent of any gradient"],"ans":2,"exp":"Filtration sits under the 'ATP not required' brace: drug passes down its gradient through pores without ATP or a carrier. (Book p2)"},{"id":"PHARM-C2-011","sec":"Simple/passive diffusion","page":2,"q":"The most common mechanism of drug absorption across biological membranes is:","opts":["Filtration","Active transport","Facilitated diffusion","Simple/passive diffusion"],"ans":3,"exp":"The diagram marks simple/passive diffusion as 'm/c' — the most common route of drug absorption. (Book p2)"},{"id":"PHARM-C2-012","sec":"Simple/passive diffusion","page":2,"q":"In the diagram, simple/passive diffusion (ii) is annotated as occurring:","opts":["Independent of concentration gradient","Along the concentration gradient","Against the concentration gradient using ATP","Through membrane pores only"],"ans":1,"exp":"Simple/passive diffusion is labelled 'along conc. gradient' — the drug moves from higher to lower concentration without ATP. (Book p2)"},{"id":"PHARM-C2-013","sec":"Filtration vs simple diffusion","page":2,"q":"Filtration and simple/passive diffusion share which feature in the absorption diagram?","opts":["Both require ATP","Both need a carrier protein","Both occur along the concentration gradient","Both are independent of the concentration gradient"],"ans":2,"exp":"Filtration and simple diffusion both sit under 'ATP not required' and both move drug down its concentration gradient; only filtration uses membrane pores. (Book p2)"},{"id":"PHARM-C2-014","sec":"Filtration vs simple diffusion","page":2,"q":"Unlike simple/passive diffusion, filtration requires the drug to pass through:","opts":["Membrane pores","A carrier protein","The blood-brain barrier","An ATP-dependent pump"],"ans":0,"exp":"Filtration is drawn as passage through a pore in the biological membrane, whereas simple diffusion is drawn crossing the membrane lipid directly. (Book p2)"},{"id":"PHARM-C2-015","sec":"Facilitated diffusion","page":2,"q":"Mechanism iii, facilitated diffusion, differs from simple diffusion in that it requires:","opts":["ATP","A carrier protein","A membrane pore","An electrical gradient"],"ans":1,"exp":"The diagram draws facilitated diffusion with a carrier (it lies under the 'Carrier mediated transport' bracket) while still moving drug along the concentration gradient. (Book p2)"},{"id":"PHARM-C2-016","sec":"Facilitated diffusion","page":2,"q":"The example of facilitated diffusion cited in the diagram is:","opts":["SGLT receptors","GLUT receptors","P-glycoprotein pump","Insulin absorption"],"ans":1,"exp":"The diagram reads 'iii. Facilitated diffusion: Eg: GLUT receptors' — GLUT is the cited carrier for facilitated diffusion. (Book p2)"},{"id":"PHARM-C2-017","sec":"Facilitated diffusion","page":2,"q":"GLUT-mediated absorption, as annotated in the diagram, is based on:","opts":["The concentration gradient","ATP hydrolysis","The charge of membrane proteins","Independent of concentration gradient"],"ans":0,"exp":"The annotation reads 'GLUT absorption based on gradient' — GLUT carriers move substrate down its concentration gradient without ATP. (Book p2)"},{"id":"PHARM-C2-018","sec":"Facilitated diffusion","page":2,"q":"Does facilitated diffusion consume ATP?","opts":["Yes, one ATP per molecule","Yes, but only in the intestine","No, it lies under 'ATP not required'","Only when the gradient is reversed"],"ans":2,"exp":"Facilitated diffusion sits inside the brace marked 'ATP not required' in the diagram; it uses a carrier but no energy. (Book p2)"},{"id":"PHARM-C2-019","sec":"Active transport","page":2,"q":"Mechanism iv, active transport, is characterised in the diagram as:","opts":["Along the concentration gradient, no ATP","Independent of concentration gradient and ATP","Independent of concentration gradient, ATP required","Through pores, ATP not required"],"ans":2,"exp":"Active transport is annotated 'ATP required' and 'Independent of conc. gradient' — it can move drug irrespective of its concentration gradient. (Book p2)"},{"id":"PHARM-C2-020","sec":"Active transport","page":2,"q":"The example of active transport given in the diagram is:","opts":["GLUT receptors","SGLT receptors","Membrane pores","MDR1 pump"],"ans":1,"exp":"The diagram reads 'iv. Active transport: ATP required. Eg: SGLT receptors'. (Book p2)"},{"id":"PHARM-C2-021","sec":"Active transport","page":2,"q":"According to the diagram, SGLT1 is located on the:","opts":["Renal tubules","Small intestine","Blood-brain barrier","Hepatocyte canaliculus"],"ans":1,"exp":"'SGLT 1 → On small intestine.' is written under active transport in the absorption diagram. (Book p2)"},{"id":"PHARM-C2-022","sec":"Active transport","page":2,"q":"According to the diagram, SGLT2 is located on the:","opts":["Small intestine","Renal tubules","Placenta","Blood vessel lumen"],"ans":1,"exp":"'SGLT 2 → On renal tubules.' is written under active transport in the absorption diagram. (Book p2)"},{"id":"PHARM-C2-023","sec":"Active transport","page":2,"q":"A drug is transported by SGLT1 in the small intestine. This is an example of:","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":3,"exp":"SGLT receptors are the examples of active transport (iv), the ATP-requiring, carrier-mediated mechanism that is independent of the concentration gradient. (Book p2)"},{"id":"PHARM-C2-024","sec":"Carrier mediated transport","page":2,"q":"The bracket labelled 'Carrier mediated transport' in the absorption diagram includes which mechanisms?","opts":["Facilitated diffusion and active transport","Filtration and simple diffusion","Simple diffusion and facilitated diffusion","Filtration and active transport"],"ans":0,"exp":"The carrier-mediated bracket encloses only mechanisms iii (facilitated diffusion) and iv (active transport). (Book p2)"},{"id":"PHARM-C2-025","sec":"Carrier mediated transport","page":2,"q":"Which absorption mechanism can move a drug independent of its concentration gradient?","opts":["Filtration","Simple/passive diffusion","Facilitated diffusion","Active transport"],"ans":3,"exp":"Only active transport (iv) is annotated 'independent of conc. gradient'; all the others move drug along the gradient. (Book p2)"},{"id":"PHARM-C2-026","sec":"Carrier mediated transport","page":2,"q":"Which pair of mechanisms both use a carrier protein but differ in their ATP requirement?","opts":["Filtration and simple diffusion","Simple diffusion and facilitated diffusion","Facilitated diffusion and active transport","Filtration and active transport"],"ans":2,"exp":"Facilitated diffusion and active transport are both carrier mediated, but only active transport requires ATP — the key contrast of the diagram. (Book p2)"},{"id":"PHARM-C2-027","sec":"P-glycoprotein pump","page":2,"q":"The P-glycoprotein pump (Pgp) is also known as the:","opts":["MDR1 pump","SGLT2 receptor","GLUT receptor","OATP transporter"],"ans":0,"exp":"The heading reads 'Active transport: P-glycoprotein pump (Pgp)/MDR1 pump' — Pgp and MDR1 are the same efflux pump. (Book p2)"},{"id":"PHARM-C2-028","sec":"P-glycoprotein pump","page":2,"q":"P-glycoprotein is described as the most common type of:","opts":["ABC pump","SLC transporter","Sodium-glucose cotransporter","Vesicular monoamine transporter"],"ans":0,"exp":"Below the heading the book notes 'm/c type of ABC pump' — Pgp is the most common ATP-binding cassette (ABC) pump. (Book p2)"},{"id":"PHARM-C2-029","sec":"Pgp in small intestine/liver","page":3,"q":"In the small intestine/liver diagram, most drugs cross the epithelial cell:","opts":["Along the concentration gradient","Independent of the concentration gradient with ATP","By being effluxed back into the lumen","Through the MDR1 pump"],"ans":0,"exp":"The diagram shows the upper arrow labelled 'Along the conc. gradient' ending in 'most drugs' — most drugs simply cross the epithelial cell down their gradient. (Book p3)"},{"id":"PHARM-C2-030","sec":"Pgp in small intestine/liver","page":3,"q":"In the same diagram, some drugs are pumped back out of the epithelial cell by the:","opts":["GLUT receptor","SGLT receptor","P-glycoprotein pump","Pore of the biological membrane"],"ans":2,"exp":"The lower arrow is driven by the green P-glycoprotein pump in the epithelial cell, which effluxes drug back into the intestinal lumen. (Book p3)"},{"id":"PHARM-C2-031","sec":"Pgp in small intestine/liver","page":3,"q":"Efflux of drug by Pgp in the small intestine results in:","opts":["First pass metabolism","Increased systemic bioavailability","Renal tubular secretion","Biliary concentration of the drug"],"ans":0,"exp":"The diagram links drug efflux to 'First pass metabolism — drug excreted before reaching systemic circulation'. (Book p3)"},{"id":"PHARM-C2-032","sec":"Pgp in small intestine/liver","page":3,"q":"As used in this diagram, first pass metabolism means the drug is:","opts":["Metabolised by the liver after reaching systemic circulation","Excreted before reaching the systemic circulation","Converted to a prodrug in the gut wall","Filtered at the glomerulus"],"ans":1,"exp":"The diagram defines it explicitly: 'Drug excreted before reaching systemic circulation'. (Book p3)"},{"id":"PHARM-C2-033","sec":"Pgp in small intestine/liver","page":3,"q":"In the intestinal diagram, the drug effluxed by the Pgp pump is returned to the:","opts":["Blood vessel lumen","Intestinal lumen","Bile canaliculus","Lymphatic vessel"],"ans":1,"exp":"The efflux arrow points back from the epithelial cell into the intestinal lumen, so the drug never enters the blood vessel lumen. (Book p3)"},{"id":"PHARM-C2-034","sec":"Pgp in small intestine/liver","page":3,"q":"In the diagram, the Pgp pump is depicted on which side of the epithelial cell?","opts":["The luminal border, returning drug to the intestinal lumen","The basolateral border, returning drug to blood","Inside the nucleus","On the blood vessel endothelium"],"ans":0,"exp":"The green Pgp pump is drawn at the luminal border of the epithelial cell with its efflux arrow pointing back into the intestinal lumen. (Book p3)"},{"id":"PHARM-C2-035","sec":"Pgp significance","page":3,"q":"The book's stated significance of Pgp efflux is that the dosage of which drug is calculated from the amount lost?","opts":["Loperamide","Digoxin","Cyclosporine","Phenytoin"],"ans":1,"exp":"'Eg: Digoxin dosage is calculated based on amount being lost d/t drug efflux' — digoxin dosing must allow for the fraction effluxed by Pgp. (Book p3)"},{"id":"PHARM-C2-036","sec":"Pgp significance","page":3,"q":"Why must digoxin dosage be calculated on the amount lost to drug efflux?","opts":["Because efflux converts digoxin to an active metabolite","Because part of the administered drug never reaches the systemic circulation","Because efflux increases digoxin's lipid solubility","Because efflux blocks digoxin's receptor binding"],"ans":1,"exp":"Pgp pumps digoxin back into the gut lumen so that fraction is excreted before reaching the systemic circulation; the dose is adjusted for this loss. (Book p3)"},{"id":"PHARM-C2-037","sec":"Blood-brain barrier","page":3,"q":"According to the text, mdr1 pumps are present in the:","opts":["Blood-brain barrier","Renal tubule","Adipose tissue","Synovial membrane"],"ans":0,"exp":"'mdr1 pumps are present in BBB' — the BBB uses MDR1/Pgp to keep substrate drugs out of the CNS. (Book p3)"},{"id":"PHARM-C2-038","sec":"Blood-brain barrier","page":3,"q":"Loperamide, the drug used as the BBB example, belongs to which class?","opts":["Opioid","Benzodiazepine","Anticholinergic","Beta-2 agonist"],"ans":0,"exp":"The text labels loperamide as '(opioid)' — it is an opioid that acts peripherally. (Book p3)"},{"id":"PHARM-C2-039","sec":"Blood-brain barrier","page":3,"q":"The clinical use of loperamide stated in the text is:","opts":["Diarrhoea","Constipation","Cough","Sedation"],"ans":0,"exp":"'Used in Rx: Diarrhoea' is written beside loperamide in the BBB diagram. (Book p3)"},{"id":"PHARM-C2-040","sec":"Blood-brain barrier","page":3,"q":"Loperamide is described as acting on the:","opts":["GIT","CNS","Kidney","Lung"],"ans":0,"exp":"'Acts on GIT' — loperamide acts on the gastrointestinal tract, not on the central nervous system. (Book p3)"},{"id":"PHARM-C2-041","sec":"Blood-brain barrier","page":3,"q":"Loperamide cannot cross the BBB because:","opts":["It is highly lipid soluble","mdr1 pumps in the BBB efflux it out","It is actively transported into the brain","It is too large a molecule"],"ans":1,"exp":"The diagram shows the mdr1 pump at the BBB returning loperamide back into blood, so it cannot enter the brain. (Book p3)"},{"id":"PHARM-C2-042","sec":"Blood-brain barrier","page":3,"q":"The clinical consequence of loperamide being kept out of the brain by MDR1 pumps is that at usual doses it:","opts":["Produces marked central opioid effects","Controls diarrhoea without central opioid effects","Causes respiratory depression","Is ineffective in diarrhoea"],"ans":1,"exp":"Because the BBB MDR1 pump excludes loperamide from the CNS, it acts on the GIT to control diarrhoea while producing no central opioid action. (Book p3)"},{"id":"PHARM-C2-043","sec":"Blood-brain barrier","page":3,"q":"The note in the text mentions which other cause of drugs not crossing the BBB?","opts":["Water solubility","High lipid solubility","Protein binding","Enzyme induction"],"ans":0,"exp":"'Note: Another cause of drugs not crossing BBB → water solubility' — polar, water-soluble drugs are repelled by the lipid BBB. (Book p3)"},{"id":"PHARM-C2-044","sec":"Placenta","page":3,"q":"Certain drugs cannot cross from the maternal circulation to the fetal circulation because of:","opts":["Presence of MDR1 pumps in the placenta","Absence of pores in the placenta","Low fetal plasma protein binding","The placental GLUT carriers"],"ans":0,"exp":"The text states: 'Placenta: Certain drugs cannot cross from maternal circulation to fetal circulation d/t presence of MDR1 pumps in placenta.' (Book p3)"},{"id":"PHARM-C2-045","sec":"Bile acid excretion","page":3,"q":"Bile acid excretion, as described in the text, occurs due to:","opts":["Presence of MDR1 pumps on hepatocytes","Presence of SGLT1 on enterocytes","Filtration through glomerular pores","Simple diffusion across the canaliculus"],"ans":0,"exp":"'Bile acid excretion: D/t presence of MDR1 pumps on hepatocytes' — the same efflux pump handles biliary excretion. (Book p3)"},{"id":"PHARM-C2-046","sec":"MDR1 pump sites","page":3,"q":"MDR1 pumps are described at all of the following sites EXCEPT the:","opts":["Blood-brain barrier","Placenta","Hepatocytes","Adipose tissue"],"ans":3,"exp":"The text places MDR1 pumps at the BBB, the placenta and on hepatocytes (bile acid excretion); adipose tissue is not mentioned as an MDR1 site. (Book p3)"},{"id":"PHARM-C2-047","sec":"Bacteria & tumour cells","page":3,"q":"In the flowchart for bacteria/tumour cells, the cell develops a Pgp pump which leads to:","opts":["Drug influx","Drug efflux and resistance","Increased drug accumulation","Loss of the ABC pump"],"ans":1,"exp":"The flowchart reads: Cell --develops--> Pgp pump --> Drug efflux --> Resistance. Efflux of the drug is what creates resistance. (Book p3)"},{"id":"PHARM-C2-048","sec":"Bacteria & tumour cells","page":3,"q":"According to that flowchart, resistance in bacteria and tumour cells is the end-result of:","opts":["Drug efflux by the Pgp pump","Formation of a drug depot","Increased carrier-mediated influx","Enhanced metabolic activation of the drug"],"ans":0,"exp":"The sequence ends 'Drug efflux → Resistance', i.e., the pump expels the drug and the cell survives as resistant. (Book p3)"},{"id":"PHARM-C2-049","sec":"Bacteria & tumour cells","page":3,"q":"The first step of the resistance flowchart is that the cell:","opts":["Develops a Pgp pump","Loses its MDR1 gene","Increases drug influx","Becomes water soluble"],"ans":0,"exp":"The flowchart begins 'Cell —develops→ Pgp pump', which is then followed by drug efflux and resistance. (Book p3)"},{"id":"PHARM-C2-050","sec":"Pharmacological significance","page":4,"q":"Under 'Pharmacological significance', the three categories of drugs related to the Pgp pump are:","opts":["Substrates, inducers and inhibitors","Agonists, antagonists and partial agonists","Substrates, blockers and competitors","Inducers, repressors and chelators"],"ans":0,"exp":"The page branches into three columns: Substrate (undergoes efflux by pump), Inducers (increase number of pumps) and Inhibitors (decrease number of pumps). (Book p4)"},{"id":"PHARM-C2-051","sec":"Pgp substrate","page":4,"q":"A Pgp 'substrate' is defined in the chart as a drug that:","opts":["Undergoes efflux by the pump","Increases the number of pumps","Decreases the number of pumps","Blocks the pump irreversibly"],"ans":0,"exp":"The substrate column reads 'undergoes efflux by pump' and lists loperamide, cyclosporine and digoxin. (Book p4)"},{"id":"PHARM-C2-052","sec":"Pgp substrate","page":4,"q":"Which of the following is listed as a Pgp substrate?","opts":["Rifampicin","Loperamide","Verapamil","Phenytoin"],"ans":1,"exp":"Loperamide heads the substrate list. Rifampicin and phenytoin are inducers and verapamil is an inhibitor, so they efflux poorly but modify the pump instead. (Book p4)"},{"id":"PHARM-C2-053","sec":"Pgp substrate","page":4,"q":"Which set lists the Pgp substrates given in the chart?","opts":["Loperamide, cyclosporine, digoxin","Rifampicin, phenytoin, phenobarbital","Verapamil, amiodarone, quinidine","Itraconazole, neratinib, clarithromycin"],"ans":0,"exp":"The substrate column lists loperamide, cyclosporine and digoxin — the drugs that are pumped out by Pgp. (Book p4)"},{"id":"PHARM-C2-054","sec":"Pgp inducers","page":4,"q":"Pgp inducers act by increasing the number of pumps, which causes:","opts":["Drug failure","Drug toxicity","Cholestatic jaundice","Reversal of resistance"],"ans":0,"exp":"The inducer column reads '↑ no. of pump (Causes drug failure)' — more efflux lowers drug levels and the drug fails. (Book p4)"},{"id":"PHARM-C2-055","sec":"Pgp inducers","page":4,"q":"The inducer column equates Pgp inducers with:","opts":["Enzyme inducers","Enzyme inhibitors","Competitive antagonists","Allosteric activators"],"ans":0,"exp":"'≈ Enzyme inducers' — the same drugs that induce hepatic enzymes (rifampicin, phenytoin, phenobarbital) also induce Pgp. (Book p4)"},{"id":"PHARM-C2-056","sec":"Pgp inducers","page":4,"q":"Which of the following is listed as a Pgp inducer?","opts":["Verapamil","Quinidine","Phenytoin","Neratinib"],"ans":2,"exp":"The inducers are rifampicin, phenytoin and phenobarbital; verapamil, quinidine and neratinib appear in the inhibitor column. (Book p4)"},{"id":"PHARM-C2-057","sec":"Pgp inducers","page":4,"q":"Which set lists the Pgp inducers given in the chart?","opts":["Rifampicin, phenytoin, phenobarbital","Loperamide, cyclosporine, digoxin","Verapamil, amiodarone, quinidine","Erythromycin, clarithromycin, neratinib"],"ans":0,"exp":"The inducer column lists rifampicin, phenytoin and phenobarbital — the classic enzyme inducers, which also increase Pgp number. (Book p4)"},{"id":"PHARM-C2-058","sec":"Pgp inhibitors","page":4,"q":"Pgp inhibitors decrease the number of pumps, which causes:","opts":["Drug toxicity","Drug failure","Reversal of resistance only","Increased first pass metabolism"],"ans":0,"exp":"The inhibitor column reads '↓ no. of pumps (Causes drug toxicity)' — less efflux means drug accumulates to toxic levels. (Book p4)"},{"id":"PHARM-C2-059","sec":"Pgp inhibitors","page":4,"q":"Which of the following is listed as a Pgp inhibitor?","opts":["Rifampicin","Phenobarbital","Itraconazole","Phenytoin"],"ans":2,"exp":"Itraconazole is in the inhibitor list; rifampicin, phenobarbital and phenytoin are inducers, so they act in the opposite direction. (Book p4)"},{"id":"PHARM-C2-060","sec":"Pgp inhibitors","page":4,"q":"Which drug appears in BOTH the substrate and the inhibitor lists of the chart?","opts":["Cyclosporine","Digoxin","Rifampicin","Amiodarone"],"ans":0,"exp":"Cyclosporine is listed both as a substrate (undergoes efflux) and as an inhibitor (decreases pump number) — an important dual role. (Book p4)"},{"id":"PHARM-C2-061","sec":"Pgp inhibitors","page":4,"q":"Erythromycin/clarithromycin appear in the chart under which category?","opts":["Substrate","Inducer","Inhibitor","Reversal agent"],"ans":2,"exp":"The last entry of the inhibitor column is 'Erythromycin/Clarithromycin', i.e., these macrolides inhibit Pgp and thereby cause drug toxicity. (Book p4)"},{"id":"PHARM-C2-062","sec":"Effects of blockade","page":4,"q":"As per the 'Effects of blockade' table, blockage by rifampicin results in:","opts":["Digoxin failure","Digoxin toxicity","Cholestatic jaundice","Reversal of drug resistance"],"ans":0,"exp":"The table pairs rifampicin with 'Digoxin failure' — rifampicin reduces effective digoxin availability, so digoxin fails. (Book p4)"},{"id":"PHARM-C2-063","sec":"Effects of blockade","page":4,"q":"As per the table, which drug's blockade of Pgp causes digoxin toxicity?","opts":["Rifampicin","Clarithromycin","Quinidine","Cyclosporine"],"ans":1,"exp":"The table pairs clarithromycin with 'Digoxin toxicity' — inhibiting Pgp lets digoxin accumulate to toxic levels. (Book p4)"},{"id":"PHARM-C2-064","sec":"Effects of blockade","page":4,"q":"As per the table, cyclosporine's effect through Pgp blockade is:","opts":["Cholestatic jaundice","Digoxin toxicity","Loperamide-induced central side effects","Reversal of drug resistance"],"ans":0,"exp":"The table pairs cyclosporine with 'Cholestatic jaundice' — retention of bile acids/acids due to blocked hepatic efflux explains the jaundice. (Book p4)"},{"id":"PHARM-C2-065","sec":"Effects of blockade","page":4,"q":"As per the table, verapamil's Pgp blockade is used for:","opts":["Reversal of drug resistance in cancer and bacteria","Treatment of cholestatic jaundice","Increasing digoxin levels","Suppressing loperamide's central effects"],"ans":0,"exp":"The table reads 'verapamil — used in reversal of drug resistance (Cancer, bacteria)': blocking the efflux pump restores drug accumulation in resistant cells. (Book p4)"},{"id":"PHARM-C2-066","sec":"Effects of blockade","page":4,"q":"As per the table, quinidine's Pgp blockade produces:","opts":["Loperamide induced central side effects","Digoxin failure","Cholestatic jaundice","Reversal of resistance in bacteria"],"ans":0,"exp":"The last row pairs quinidine with 'Loperamide induced central S/E' — with Pgp blocked, loperamide is no longer excluded from the CNS. (Book p4)"},{"id":"PHARM-C2-067","sec":"Effects of blockade","page":4,"q":"A patient on digoxin is started on clarithromycin and develops digoxin toxicity. The mechanism is:","opts":["Induction of Pgp increasing digoxin efflux","Blockade of Pgp reducing digoxin efflux","Displacement of digoxin from plasma proteins","Increased renal tubular secretion of digoxin"],"ans":1,"exp":"Clarithromycin blocks Pgp; with less efflux, digoxin accumulates and toxicity results — exactly as the table records 'Clarithromycin → Digoxin toxicity'. (Book p4)"},{"id":"PHARM-C2-068","sec":"Effects of blockade","page":4,"q":"A patient on digoxin is started on rifampicin and her digoxin effect is lost. As per the table this is:","opts":["Digoxin toxicity from Pgp blockade","Digoxin failure from the rifampicin-Pgp interaction","Cholestatic jaundice","Reversal of drug resistance"],"ans":1,"exp":"The table lists 'Rifampicin → Digoxin failure'; rifampicin increases Pgp-mediated digoxin efflux, so the digoxin level and effect fall. (Book p4)"},{"id":"PHARM-C2-069","sec":"Effects of blockade","page":4,"q":"Verapamil's Pgp-blocking property is exploited in which two settings, as stated in the table?","opts":["Cancer and bacteria","Diabetes and hypertension","Epilepsy and migraine","Asthma and COPD"],"ans":0,"exp":"The table specifies reversal of drug resistance in cancer and bacteria — resistant cells re-accumulate the cytotoxic/antibiotic drug when the efflux pump is blocked. (Book p4)"},{"id":"PHARM-C2-070","sec":"Effects of blockade","page":4,"q":"A patient taking loperamide for diarrhoea is given quinidine and develops central opioid side effects. The explanation is that quinidine:","opts":["Blocks the BBB Pgp pump, allowing loperamide into the CNS","Increases loperamide's water solubility","Induces hepatic metabolism of loperamide","Enhances loperamide's GIT action"],"ans":0,"exp":"Normally MDR1 pumps at the BBB exclude loperamide; quinidine blocks Pgp, so loperamide enters the brain and gives central side effects — as tabulated under quinidine. (Book p4)"},{"id":"PHARM-C2-071","sec":"Passive diffusion","page":4,"q":"In the passive diffusion diagram, the two vertical lines labelled 'Lipid' represent:","opts":["Lipid membranes the drug must cross","Lipid-soluble drug molecules","Lipid carriers in the pore","Lipid vesicles in the blood"],"ans":0,"exp":"The diagram draws drug in the intestinal lumen facing two lipid layers, labelled 'Lipid', between which the charged membrane proteins sit. (Book p4)"},{"id":"PHARM-C2-072","sec":"Passive diffusion","page":4,"q":"In the passive diffusion diagram, the ellipse labelled 'Proteins charged' indicates that the membrane proteins:","opts":["Repel polar/ionised/charged drugs","Attract water-soluble drugs","Carry non-polar drugs across","Hydrolyse ATP for transport"],"ans":0,"exp":"The charged membrane proteins are the reason a polar, ionised or charged molecule is 'Repelled' and not absorbed. (Book p4)"},{"id":"PHARM-C2-073","sec":"Passive diffusion","page":4,"q":"In the passive diffusion diagram, a polar/ionised/charged drug is shown to be:","opts":["Repelled by the membrane","Absorbed readily","Actively transported across","Filtered through pores"],"ans":0,"exp":"The upper arrow carries the label 'Repelled' back into the intestinal lumen — charged molecules cannot cross the lipid membrane by passive diffusion. (Book p4)"},{"id":"PHARM-C2-074","sec":"Passive diffusion","page":4,"q":"According to the passive diffusion diagram, the fate of a polar/ionised, water-soluble drug is that it is:","opts":["Not absorbed and is excreted","Absorbed and stored in fat","Actively secreted into blood","Converted into a lipid-soluble form"],"ans":0,"exp":"The diagram states: 'Polar/ionised/charged — water soluble: excreted' and 'Not absorbed (Lipid insoluble/water soluble)'. (Book p4)"},{"id":"PHARM-C2-075","sec":"Passive diffusion","page":4,"q":"In the passive diffusion diagram, a non-polar/unionised/neutral drug is:","opts":["Absorbed (lipid soluble)","Repelled by the charged proteins","Excreted unchanged in urine","Confined to the intestinal lumen"],"ans":0,"exp":"The lower arrow of the diagram ends in 'Absorbed (Lipid soluble)' — unionised, non-polar molecules diffuse across the lipid membrane. (Book p4)"},{"id":"PHARM-C2-076","sec":"Passive diffusion","page":4,"q":"Which property of the membrane explains why ionised drugs are not passively absorbed?","opts":["Its charged membrane proteins repel charged molecules","Its pores are too small for any ion","Its carriers only accept unionised drugs","Its inner lipid layer is water soluble"],"ans":0,"exp":"The proteins embedded in the lipid membranes are annotated 'charged', so polar/ionised/charged drugs are repelled rather than crossing. (Book p4)"},{"id":"PHARM-C2-077","sec":"Passive diffusion","page":4,"q":"Drugs described in the diagram as 'lipid insoluble/water soluble' are:","opts":["Not absorbed","Freely absorbed","Absorbed by filtration","Absorbed by active transport"],"ans":0,"exp":"The diagram equates lipid-insoluble/water-soluble character with 'Not absorbed' during passive diffusion. (Book p4)"},{"id":"PHARM-C2-078","sec":"Passive diffusion","page":4,"q":"Which of these drugs would be best absorbed by passive diffusion?","opts":["A lipid-soluble, non-polar, unionised drug","A lipid-insoluble, ionised drug","A water-soluble, charged drug","A polar drug with a high charge density"],"ans":0,"exp":"Passive diffusion requires a non-polar/unionised/neutral molecule that is lipid soluble; charged or water-soluble drugs are repelled and excreted. (Book p4)"},{"id":"PHARM-C3-001","sec":"Ionization of drugs","page":5,"q":"The criteria table on this page compares the ideal properties of a drug for which two processes?","opts":["Absorption and excretion","Distribution and metabolism","Absorption and metabolism","Distribution and excretion"],"ans":0,"exp":"The table is headed with two columns, 'Absorption' and 'Excretion', and lists the solubility, ionization, pH relation and polarity required for each. (Book p5)"},{"id":"PHARM-C3-002","sec":"Ionization of drugs","page":5,"q":"As per the criteria table, a drug should be lipid soluble for absorption and ________ for excretion.","opts":["Water soluble","Lipid soluble","Protein bound","Non polar"],"ans":0,"exp":"Solubility row: absorption requires lipid solubility, excretion requires water solubility — the basis of the WIPE mnemonic. (Book p5)"},{"id":"PHARM-C3-003","sec":"Ionization of drugs","page":5,"q":"For absorption to occur, the drug must be present in which form?","opts":["Unionised","Ionised","Protein bound","Charged"],"ans":0,"exp":"Ionization row: absorption needs the unionised form; the ionised form is required for excretion. (Book p5)"},{"id":"PHARM-C3-004","sec":"Ionization of drugs","page":5,"q":"For excretion of a drug into urine, the drug must be:","opts":["Unionised","Non polar","Ionised","Lipid soluble"],"ans":2,"exp":"The excretion column requires the ionised, polar, water-soluble form — an ionised drug is not reabsorbed and is excreted. (Book p5)"},{"id":"PHARM-C3-005","sec":"Ionization of drugs","page":5,"q":"The table states that for absorption, the relation of the pH of the medium to the pH of the drug is:","opts":["Equal","Unequal","Always higher","Always lower"],"ans":0,"exp":"Row 'Relation of pH of medium': absorption 'Equal', excretion 'Unequal' — for absorption the pH of the medium equals the pH of the drug (its pKa). (Book p5)"},{"id":"PHARM-C3-006","sec":"Ionization of drugs","page":5,"q":"For excretion, the relation of the pH of the drug to the pH of the medium is:","opts":["Equal","Unequal (different)","Non polar","Not relevant"],"ans":1,"exp":"The excretion column reads 'Unequal' — the pH of the drug and the pH of the medium are different, so the drug stays ionised in urine and is excreted. (Book p5)"},{"id":"PHARM-C3-007","sec":"Ionization of drugs","page":5,"q":"As per the criteria table, the polarity required for absorption is:","opts":["Polar","Non polar","Charged","Both polar and charged"],"ans":1,"exp":"Absorption requires a non-polar molecule (lipid soluble); excretion requires a polar (water-soluble) molecule. (Book p5)"},{"id":"PHARM-C3-008","sec":"Ionization of drugs","page":5,"q":"The mnemonic 'LUNJA' stands for the properties favouring:","opts":["Absorption","Excretion","Metabolism","Distribution"],"ans":0,"exp":"LUNJA is written under the absorption column: Lipid soluble, Unionised, Non polar, pH equal to that of the drug/medium, Absorption. (Book p5)"},{"id":"PHARM-C3-009","sec":"Ionization of drugs","page":5,"q":"The mnemonic 'WIPE' describes the properties favouring:","opts":["Absorption","Excretion","Redistribution","First pass metabolism"],"ans":1,"exp":"WIPE is written under the excretion column — Water soluble, Ionised, pH of drug and medium unequal/different, Polar. (Book p5)"},{"id":"PHARM-C3-010","sec":"Ionization of drugs","page":5,"q":"In the mnemonic WIPE, the letter 'W' stands for:","opts":["Water soluble","Weakly ionised","Widely distributed","Water insoluble"],"ans":0,"exp":"WIPE = Water soluble, Ionised, pH unequal (different), Polar — the profile that ensures the drug is excreted. (Book p5)"},{"id":"PHARM-C3-011","sec":"Unionization","page":5,"q":"An acidic drug is unionized in an:","opts":["Acidic medium such as the stomach","Basic medium such as the small intestine","Neutral medium only","Alkaline urine"],"ans":0,"exp":"'Acidic drug – Acidic medium: Stomach' — an acidic drug stays unionised in the acidic gastric medium. (Book p5)"},{"id":"PHARM-C3-012","sec":"Unionization","page":5,"q":"A basic drug is unionized in a:","opts":["Basic medium such as the small intestine","Acidic medium such as the stomach","Strongly acidic medium","Neutral medium only"],"ans":0,"exp":"'Basic drug – Basic medium: Small Intestine' — the basic drug remains unionised in the alkaline medium of the small intestine. (Book p5)"},{"id":"PHARM-C3-013","sec":"Unionization","page":5,"q":"The example given for an acidic drug that is unionized in the stomach is:","opts":["Aspirin","Amphetamine","Phenobarbital","Methotrexate"],"ans":0,"exp":"'Eg: Aspirin (Acidic drug) is unionized in stomach' — aspirin is the cited acidic drug of unionization. (Book p5)"},{"id":"PHARM-C3-014","sec":"Unionization","page":5,"q":"Although aspirin is unionized in the stomach, its maximum absorption occurs in the:","opts":["Small intestine (duodenum)","Stomach","Large intestine","Rectum"],"ans":0,"exp":"Maximum absorption of the unionized drug (both acidic and basic drugs) happens in the small intestine, chiefly the duodenum. (Book p5)"},{"id":"PHARM-C3-015","sec":"Unionization","page":5,"q":"The reason maximum absorption of unionized drug occurs in the small intestine rather than the stomach is the:","opts":["Large surface area","Acidic pH","Absence of Pgp pumps","High lipid content of the medium"],"ans":0,"exp":"The text attributes it to the duodenum's large surface area, which outweighs the stomach's favourable acidity. (Book p5)"},{"id":"PHARM-C3-016","sec":"Unionization","page":5,"q":"Which statement about absorption of unionized drug is correct as per the text?","opts":["Only acidic unionized drugs are absorbed in the small intestine","Only basic unionized drugs are absorbed in the small intestine","Both acidic and basic unionized drugs are maximally absorbed in the small intestine","Acidic drugs are maximally absorbed in the stomach"],"ans":2,"exp":"'But max absorption of unionized drug (Both Acidic & Basic) happens in Small intestine: Duodenum (D/t large surface area)'. (Book p5)"},{"id":"PHARM-C3-017","sec":"Short bowel syndrome","page":5,"q":"In short bowel syndrome, resection of the small intestine leads to:","opts":["Decreased absorption of drug","Increased absorption of drug","Unchanged absorption of drug","Increased bioavailability"],"ans":0,"exp":"'Resection of small intestine → ↓ Absorption of drug' — loss of absorptive surface reduces drug absorption. (Book p5)"},{"id":"PHARM-C3-018","sec":"Short bowel syndrome","page":5,"q":"The management of drug therapy in short bowel syndrome is to:","opts":["Increase the dosage of drug or change the route","Decrease the dosage of drug","Shift to a lipid-soluble drug","Add a Pgp inhibitor"],"ans":0,"exp":"'mx: ↑ Dosage of drug or change route' — since absorption is reduced, dose is increased or the route is changed (e.g., parenteral). (Book p5)"},{"id":"PHARM-C3-019","sec":"Short bowel syndrome","page":5,"q":"A patient with short bowel syndrome on an oral drug fails to respond. The dose-independent explanation is:","opts":["Loss of small intestinal surface area reduces absorption","Enhanced first pass metabolism","Increased gastric unionization","Renal tubular secretion of the drug"],"ans":0,"exp":"Resection of the small intestine decreases drug absorption in short bowel syndrome; the book's management is to increase dosage or change the route. (Book p5)"},{"id":"PHARM-C3-020","sec":"Ionization & excretion","page":5,"q":"Ionization for the purpose of excretion occurs when the pH of the drug and the pH of the medium are:","opts":["Different","Equal","Both acidic","Both basic"],"ans":0,"exp":"'IONIZATION (EXCRETION): pH of drug and pH of medium are different' — an un-ionisable match is required for absorption, a difference for excretion. (Book p5)"},{"id":"PHARM-C3-021","sec":"Ionization & excretion","page":5,"q":"In acidic drug toxicity, urine is made:","opts":["Basic","Acidic","Neutral","Isotonic"],"ans":0,"exp":"'Acidic drug toxicity → make urine Basic' — alkalinising urine ionizes the acidic drug and traps it for excretion. (Book p5)"},{"id":"PHARM-C3-022","sec":"Ionization & excretion","page":5,"q":"Which of the following are cited as examples of acidic drugs causing toxicity?","opts":["Aspirin, phenobarbital and methotrexate","Amphetamine and vitamin C","Digoxin and cyclosporine","Rifampicin and phenytoin"],"ans":0,"exp":"Under 'Acidic drug toxicity' the text lists aspirin, phenobarbital and methotrexate as the acidic drugs treated by alkalinising the urine. (Book p5)"},{"id":"PHARM-C3-023","sec":"Ionization & excretion","page":5,"q":"The urine alkalinizer used in acidic drug toxicity is:","opts":["Bicarbonate","Ammonium chloride","Vitamin C","Cranberry juice"],"ans":0,"exp":"'By bicarbonate: urine Alkalinizer' — sodium bicarbonate is used to alkalinise urine in aspirin/phenobarbital/methotrexate toxicity. (Book p5)"},{"id":"PHARM-C3-024","sec":"Ionization & excretion","page":5,"q":"In basic drug toxicity, the urine is made:","opts":["Acidic","Basic","Alkaline","Neutral"],"ans":0,"exp":"'Basic drug toxicity → make urine Acidic' — acidifying urine ionizes the basic drug, trapping it in the tubular fluid for excretion. (Book p5)"},{"id":"PHARM-C3-025","sec":"Ionization & excretion","page":5,"q":"The basic drug listed as an example of drug toxicity treated by acidifying urine is:","opts":["Amphetamine","Aspirin","Methotrexate","Phenobarbital"],"ans":0,"exp":"Amphetamine is the example under basic drug toxicity; aspirin, phenobarbital and methotrexate are the acidic drugs. (Book p5)"},{"id":"PHARM-C3-026","sec":"Ionization & excretion","page":5,"q":"The urine acidifier used in basic drug toxicity is:","opts":["Ammonium chloride","Bicarbonate","Sodium citrate","Acetazolamide"],"ans":0,"exp":"'By Ammonium chloride: urine Acidifier' — ammonium chloride acidifies urine to excrete basic drugs such as amphetamine. (Book p5)"},{"id":"PHARM-C3-027","sec":"Ionization & excretion","page":5,"q":"Which two agents are listed as other examples of urine acidifiers?","opts":["Vitamin C and cranberry juice","Bicarbonate and citrate","Ammonium chloride and bicarbonate","Vitamin D and cranberry juice"],"ans":0,"exp":"'Note: Other examples for urine acidifiers are Vit C, Cranberry juice.' (Book p5)"},{"id":"PHARM-C3-028","sec":"Ionization & excretion","page":5,"q":"A patient presents with salicylate (acidic drug) overdose. The most appropriate urinary measure is:","opts":["Alkalinise the urine with bicarbonate","Acidify the urine with ammonium chloride","Give vitamin C to acidify urine","Give cranberry juice"],"ans":0,"exp":"Aspirin is an acidic drug; the text advises making the urine basic with bicarbonate so the ionised drug is trapped and excreted. (Book p5)"},{"id":"PHARM-C3-029","sec":"Ionization & excretion","page":5,"q":"The rationale for alkalinising urine in acidic drug toxicity is that the drug becomes:","opts":["Ionised and is not reabsorbed","Unionised and reabsorbed","Lipid soluble and reabsorbed","Protein bound and filtered"],"ans":0,"exp":"In an alkaline urine an acidic drug is ionised; an ionised, polar drug is excreted rather than reabsorbed — the ionization criterion for excretion. (Book p5)"},{"id":"PHARM-C3-030","sec":"Ionization & excretion","page":5,"q":"In amphetamine poisoning, acidifying the urine works because in an acidic medium a basic drug is:","opts":["Ionised and rapidly excreted","Unionised and reabsorbed","Metabolised faster","Bound to plasma proteins"],"ans":0,"exp":"A basic drug placed in acidic urine becomes ionised (pH of drug and medium differ), so it is trapped and excreted — the basis of giving ammonium chloride. (Book p5)"},{"id":"PHARM-C3-031","sec":"Henderson-Hasselbalch equation","page":6,"q":"For an acidic drug, the Henderson-Hasselbalch equation as given is:","opts":["log [Unionized]/[Ionized] = pKa − pH","log [Ionized]/[Unionized] = pKa − pH","log [Ionized]/[Unionized] = pH − pKa","log [Unionized]/[Ionized] = pH + pKa"],"ans":0,"exp":"'Acidic drug → log [Unionized]/[Ionized] = pKa − pH (of medium)'. (Book p6)"},{"id":"PHARM-C3-032","sec":"Henderson-Hasselbalch equation","page":6,"q":"For a basic drug, the Henderson-Hasselbalch equation as given is:","opts":["log [Ionized]/[Unionized] = pKa − pH","log [Unionized]/[Ionized] = pKa − pH","log [Ionized]/[Unionized] = pH − pKa","log [Unionized]/[Ionized] = pH + pKa"],"ans":0,"exp":"'Basic drug → log [Ionized]/[Unionized] = pKa − pH' — note the ratio is inverted compared with an acidic drug. (Book p6)"},{"id":"PHARM-C3-033","sec":"Henderson-Hasselbalch equation","page":6,"q":"In the two equations, which component is measured 'of medium'?","opts":["pH","pKa","Unionized fraction","Ionized fraction"],"ans":0,"exp":"The equations are written as pKa − pH, with the parenthetical note '(of medium)' attached to pH — pKa belongs to the drug, pH to the medium. (Book p6)"},{"id":"PHARM-C3-034","sec":"pKa","page":6,"q":"pKa is defined in the text as the pH of the medium at which:","opts":["50% drug is ionized and 50% is unionized","100% drug is ionized","100% drug is unionized","The drug is maximally lipid soluble"],"ans":0,"exp":"'pKa: pH of the medium at which 50% drug is ionized & 50 is unionized'. (Book p6)"},{"id":"PHARM-C3-035","sec":"Henderson-Hasselbalch equation","page":6,"q":"For an acidic drug with pKa 4 in the stomach (pH 2), log [Unionized]/[Ionized] equals:","opts":["2","−2","4","0.5"],"ans":0,"exp":"log [U]/[I] = pKa − pH = 4 − 2 = 2. (Book p6)"},{"id":"PHARM-C3-036","sec":"Henderson-Hasselbalch equation","page":6,"q":"Continuing the same calculation, [Unionized]/[Ionized] equals:","opts":["100","10","2","1000"],"ans":0,"exp":"log [U]/[I] = 2 → [U]/[I] = 10² = 100. (Book p6)"},{"id":"PHARM-C3-037","sec":"Henderson-Hasselbalch equation","page":6,"q":"For an acidic drug of pKa 4 in gastric pH 2, the percentage of drug unionized and ionized is:","opts":["99% unionized and 1% ionized","50% unionized and 50% ionized","1% unionized and 99% ionized","100% unionized"],"ans":0,"exp":"A ratio of [U]/[I] = 100 means 99% of the acidic drug is unionized and only 1% ionized — hence it can be absorbed from the stomach. (Book p6)"},{"id":"PHARM-C3-038","sec":"Henderson-Hasselbalch equation","page":6,"q":"An acidic drug has pKa 4. At a medium pH of 4, the drug will be:","opts":["50% ionized and 50% unionized","99% ionized","100% unionized","Completely ionized"],"ans":0,"exp":"When pH equals pKa, log [U]/[I] = 0, so the ratio is 1:1 — this is the defining situation of pKa (50% ionized, 50% unionized). (Book p6)"},{"id":"PHARM-C3-039","sec":"Henderson-Hasselbalch equation","page":6,"q":"An acidic drug of pKa 4 is placed in a medium of pH 6. It will be predominantly:","opts":["Ionized","Unionized","Non polar","Absorbed"],"ans":0,"exp":"log [U]/[I] = 4 − 6 = −2, so [U]/[I] = 1/100 — the acidic drug is largely ionized in the more alkaline medium and is therefore poorly absorbed. (Book p6)"},{"id":"PHARM-C3-040","sec":"Henderson-Hasselbalch equation","page":6,"q":"A basic drug of pKa 8 is in the stomach (pH 2). Using log [I]/[U] = pKa − pH, the drug will be:","opts":["Almost entirely ionized","Almost entirely unionized","50% unionized","Well absorbed from the stomach"],"ans":0,"exp":"log [I]/[U] = 8 − 2 = 6, i.e., [I]/[U] = 10⁶ — a basic drug is overwhelmingly ionized in the acidic stomach and is not absorbed there. (Book p6)"},{"id":"PHARM-C3-041","sec":"Delayed absorption of oral drugs","page":6,"q":"In the oral drug flowchart, tablet/capsule is first divided into:","opts":["IR (immediate release) and ER (extended release)","SR (sustained release) and CR (controlled release)","Delayed release and enteric coated","Oral and parenteral"],"ans":0,"exp":"The flowchart splits tablet/capsule into IR (Immediate release) and ER (Extended Release); ER then further branches. (Book p6)"},{"id":"PHARM-C3-042","sec":"Delayed absorption of oral drugs","page":6,"q":"'IR' in the oral drug flowchart stands for:","opts":["Immediate release","Immediate response","Initial release","Increased release"],"ans":0,"exp":"IR = Immediate release, the conventional formulation requiring frequent dosing. (Book p6)"},{"id":"PHARM-C3-043","sec":"Delayed absorption of oral drugs","page":6,"q":"'ER' in the flowchart stands for:","opts":["Extended release","Enhanced release","Enteric release","Early release"],"ans":0,"exp":"ER = Extended release, which is further divided into SR (sustained release) and CR (controlled release). (Book p6)"},{"id":"PHARM-C3-044","sec":"Delayed absorption of oral drugs","page":6,"q":"Under extended release, the two sub-types shown are:","opts":["SR: Sustained Release and CR: Controlled Release","IR: Immediate Release and SR: Sustained Release","DR: Delayed Release and ER: Extended Release","CR: Controlled Release and DR: Delayed Release"],"ans":0,"exp":"The flowchart branches ER into 'SR: Sustained Release' and 'CR: Controlled Release'. (Book p6)"},{"id":"PHARM-C3-045","sec":"Delayed absorption of oral drugs","page":6,"q":"Which formulation is described as 'AKA zero order CR'?","opts":["Controlled release","Sustained release","Immediate release","Enteric coated"],"ans":0,"exp":"'CR: Controlled Release — AKA zero order CR': the controlled release preparation delivers drug at a constant (zero order) rate. (Book p6)"},{"id":"PHARM-C3-046","sec":"Delayed absorption of oral drugs","page":6,"q":"The plasma concentration-time curve of an IR preparation with frequent dosing shows:","opts":["Repeated sharp peaks","A single flat plateau","A steadily rising line","A shorter peak with prolonged duration"],"ans":0,"exp":"The IR graph shows two successive sharp peaks corresponding to two doses, in contrast to the flat plateau of CR. (Book p6)"},{"id":"PHARM-C3-047","sec":"Delayed absorption of oral drugs","page":6,"q":"The mechanism of an IR preparation and its consequence, as given in the flowchart, is:","opts":["Frequent dosing leading to decreased compliance","Polymer coating leading to better compliance","Zero order release leading to a plateau","Gastric protection leading to better absorption"],"ans":0,"exp":"Under the IR curve the text reads 'mechanism: Frequent dosing: ↓Compliance'. (Book p6)"},{"id":"PHARM-C3-048","sec":"Delayed absorption of oral drugs","page":6,"q":"The example given for an IR preparation dosed TID is:","opts":["Indomethacin","Zolpidem","Sulfasalazine","Omeprazole"],"ans":0,"exp":"'Example: Indomethacin TID' is written under the IR curve; indomethacin IR must be taken three times a day. (Book p6)"},{"id":"PHARM-C3-049","sec":"Delayed absorption of oral drugs","page":6,"q":"The SR plasma concentration curve, compared with IR, is described as showing:","opts":["Shorter peak and increased duration of action","Taller peak and shorter duration","Two separate peaks","A zero order plateau"],"ans":0,"exp":"The SR graph is annotated 'Shorter peak' and '↑Duration of action' — the peak is blunted but drug action lasts longer. (Book p6)"},{"id":"PHARM-C3-050","sec":"Delayed absorption of oral drugs","page":6,"q":"Which advantage of SR preparations is stated in the text?","opts":["Better compliance","100% bioavailability","Rapid onset","Zero order release"],"ans":0,"exp":"Under SR the text lists 'Better compliance' and 'Polymer coating present', with SR indomethacin as the example. (Book p6)"},{"id":"PHARM-C3-051","sec":"Delayed absorption of oral drugs","page":6,"q":"The SR formulation's release is achieved by:","opts":["A polymer coating","Frequent dosing","Gastric acid protection","Efflux pump inhibition"],"ans":0,"exp":"'Polymer coating present' — SR indomethacin uses a polymer coating to slow drug release. (Book p6)"},{"id":"PHARM-C3-052","sec":"Delayed absorption of oral drugs","page":6,"q":"The example given for a sustained release preparation is:","opts":["SR indomethacin","CR zolpidem","Enteric coated PPI","Sulfasalazine"],"ans":0,"exp":"'SR Indomethacin' is listed under the SR column, just as 'CR Zolpidem' is listed under CR. (Book p6)"},{"id":"PHARM-C3-053","sec":"Delayed absorption of oral drugs","page":6,"q":"The CR preparation achieves its profile by:","opts":["Polymer coating of pores","Frequent dosing","Enteric coating","Increased surface area"],"ans":0,"exp":"Under the CR curve the text reads 'Polymer coating of pores' — the drug diffuses out through polymer-coated pores giving zero order release. (Book p6)"},{"id":"PHARM-C3-054","sec":"Delayed absorption of oral drugs","page":6,"q":"The example given for a controlled release preparation is:","opts":["CR zolpidem","SR indomethacin","IR indomethacin","Enteric coated PPI"],"ans":0,"exp":"'CR Zolpidem' is the example written beside the CR plasma concentration graph. (Book p6)"},{"id":"PHARM-C3-055","sec":"Delayed absorption of oral drugs","page":6,"q":"Which formulation's plasma concentration-time curve shows a flat plateau with no peaks?","opts":["CR","IR","SR","Tablet given TID"],"ans":0,"exp":"The CR graph rises to a plateau and stays flat — zero order release maintains a steady plasma concentration. (Book p6)"},{"id":"PHARM-C3-056","sec":"Delayed absorption of oral drugs","page":6,"q":"A patient on indomethacin TID three times daily keeps forgetting doses. Which formulation change would best improve compliance?","opts":["Sustained release indomethacin","Subcutaneous insulin","Enteric coated preparation","A larger immediate release dose"],"ans":0,"exp":"The book contrasts IR indomethacin TID (frequent dosing, ↓compliance) with SR indomethacin, which has a polymer coating, better compliance, shorter peak and longer duration. (Book p6)"},{"id":"PHARM-C3-057","sec":"Delayed absorption of oral drugs","page":6,"q":"Which sequence correctly orders the oral formulation flowchart?","opts":["Tablet/Capsule → IR & ER; ER → SR & CR","Tablet/Capsule → SR & CR; SR → IR & ER","Tablet/Capsule → ER & DR; DR → IR & CR","Tablet/Capsule → IR & SR; IR → ER & CR"],"ans":0,"exp":"The flowchart divides tablet/capsule into IR and ER, and divides ER further into SR (sustained release) and CR (controlled release). (Book p6)"},{"id":"PHARM-C3-058","sec":"Drugs bypassing the stomach","page":7,"q":"The two categories of drugs shown bypassing the stomach are:","opts":["Delayed release and enteric coated","Sustained release and controlled release","Immediate release and extended release","Oral and sublingual"],"ans":0,"exp":"The page branches 'a. Drugs bypassing the stomach' into 'Delayed release' and 'Enteric coated'. (Book p7)"},{"id":"PHARM-C3-059","sec":"Drugs bypassing the stomach","page":7,"q":"Delayed release preparations are designed to release the drug in the:","opts":["Small intestine instead of the stomach","Stomach instead of the small intestine","Mouth","Liver"],"ans":0,"exp":"'Delayed release: Release of drug in SI instead in stomach.' (Book p7)"},{"id":"PHARM-C3-060","sec":"Drugs bypassing the stomach","page":7,"q":"The example given for a delayed release preparation is:","opts":["Sulfasalazine","Zolpidem","Indomethacin","Omeprazole"],"ans":0,"exp":"'Eg: Sulfasalazine → For ulcerative colitis' — sulfasalazine is formulated for release in the small intestine/colon. (Book p7)"},{"id":"PHARM-C3-061","sec":"Drugs bypassing the stomach","page":7,"q":"Sulfasalazine is given as a delayed release preparation for the treatment of:","opts":["Ulcerative colitis","Rheumatoid arthritis","Peptic ulcer","Migraine"],"ans":0,"exp":"The text specifies sulfasalazine for ulcerative colitis, delivered beyond the stomach. (Book p7)"},{"id":"PHARM-C3-062","sec":"Drugs bypassing the stomach","page":7,"q":"The example given for an enteric coated preparation is:","opts":["PPI","Sulfasalazine","Zolpidem","Indomethacin"],"ans":0,"exp":"'Enteric coated: Eg: PPI → Protect from gastric HCl' — the proton pump inhibitor is coated to survive gastric acid. (Book p7)"},{"id":"PHARM-C3-063","sec":"Drugs bypassing the stomach","page":7,"q":"The purpose of enteric coating a PPI is to:","opts":["Protect the drug from gastric HCl","Aid absorption in the stomach","Delay gastric emptying","Protect the stomach from the drug"],"ans":0,"exp":"The diary states 'Protect from gastric HCl' — the coating shields the acid-labile drug as it passes through the stomach. (Book p7)"},{"id":"PHARM-C3-064","sec":"Drugs bypassing the stomach","page":7,"q":"Which pair correctly matches the preparation with its purpose?","opts":["Delayed release → release drug in the small intestine","Enteric coated → release drug in the stomach","Enteric coated → slow release over 24 hours","Delayed release → protect drug from gastric HCl"],"ans":0,"exp":"Delayed release shifts release to the small intestine (e.g., sulfasalazine in ulcerative colitis); enteric coating's purpose is to protect the drug from gastric HCl (e.g., PPI). (Book p7)"},{"id":"PHARM-C3-065","sec":"Bioavailability","page":7,"q":"Bioavailability (F) is defined as the fraction of drug that:","opts":["Reaches the systemic circulation unchanged","Is absorbed from the small intestine","Escape first pass metabolism in the gut","Binds to plasma proteins"],"ans":0,"exp":"'BIOAVAILABILITY (F): Fraction of drug reaches systemic circulation unchanged.' (Book p7)"},{"id":"PHARM-C3-066","sec":"Bioavailability","page":7,"q":"According to the flowchart for factors determining F, the drug reaching the liver after 100% intestinal absorption may undergo:","opts":["First pass metabolism","Redistribution","Renal tubular secretion","Zero order release"],"ans":0,"exp":"The flowchart traces: 100% of drug → intestinal absorption → liver → fraction that reaches systemic circulation, while a fraction undergoes first pass metabolism (and a fraction is excreted). (Book p7)"},{"id":"PHARM-C3-067","sec":"Bioavailability","page":7,"q":"Which two situations increase bioavailability (F), as listed in the text?","opts":["The drug bypasses the liver, and absorption increases","The drug undergoes first pass metabolism, and absorption decreases","The drug is ionised, and urine is acidified","The drug is water soluble, and Pgp efflux increases"],"ans":0,"exp":"'↑F if → Drug bypasses liver; ↑Absorption occurs' — both raise the fraction reaching the systemic circulation. (Book p7)"},{"id":"PHARM-C3-068","sec":"Bioavailability","page":7,"q":"In the flowchart of factors determining F, the fraction of drug lost on its way to the systemic circulation includes:","opts":["Excretion of a fraction and first pass metabolism of a fraction","Only renal excretion","Only biliary excretion","Redistribution into fat"],"ans":0,"exp":"The flowchart shows that after absorption a fraction is excreted and a fraction undergoes hepatic first pass metabolism, so only the remainder reaches the systemic circulation. (Book p7)"},{"id":"PHARM-C3-069","sec":"Bioavailability","page":7,"q":"The formula for bioavailability given in the box is:","opts":["AUCoral / AUCiv × 100","AUCiv / AUCoral × 100","Cmax / Tmax × 100","Tmaxoral / Tmaxiv × 100"],"ans":0,"exp":"The box reads 'Bioavailability: AUCoral / AUCiv × 100'. (Book p7)"},{"id":"PHARM-C3-070","sec":"Bioavailability","page":7,"q":"In the concentration-time curve, the area under the curve (AUC) represents the:","opts":["Extent of drug absorption","Rate of drug absorption","Peak plasma concentration","Time to peak concentration"],"ans":0,"exp":"The text links the AUC to the 'Extent of Drug Absorption' — extent is measured by AUC, whereas rate is measured by Tmax. (Book p7)"},{"id":"PHARM-C3-071","sec":"Bioavailability","page":7,"q":"The only route of administration with 100% bioavailability is:","opts":["IV","Oral","IM","SC"],"ans":0,"exp":"'Only route with 100% B.V: I/V' — intravenous administration bypasses absorption and first pass metabolism. (Book p7)"},{"id":"PHARM-C3-072","sec":"Bioavailability","page":7,"q":"On the concentration-time curve, which route gives the immediately maximal plasma concentration at time zero?","opts":["IV","Oral","IM","SC"],"ans":0,"exp":"The curve is labelled 'IV max' at the highest point at zero time, while the oral curve rises later and shows a smaller AUC. (Book p7)"},{"id":"PHARM-C3-073","sec":"Bioavailability","page":7,"q":"The oral curve in the concentration-time graph lies below the IV curve because of:","opts":["First pass metabolism and incomplete absorption","Zero order release","Enteric coating","Pgp inhibition"],"ans":0,"exp":"The smaller (oral) AUC compared with IV reflects the fractions lost to excretion and first pass metabolism before the drug reaches the systemic circulation, giving F < 1. (Book p7)"},{"id":"PHARM-C3-074","sec":"Route & bioavailability","page":8,"q":"As per the table, the bioavailability of the IV route is:","opts":["1","0.75–1.0","0.05–1.0","0.3"],"ans":0,"exp
