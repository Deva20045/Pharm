ARM-C8-096","sec":"Gs Subtype","page":23,"q":"Ritodrine is described as a:","opts":["Tocolytic used in labor","Drug used in CHF","Bronchodilator used in asthma","Phosphodiesterase inhibitor"],"ans":0,"exp":"The pill icon for ritodrine is labelled 'Tocolytic used in labor'. (Book p23)"},{"id":"PHARM-C8-097","sec":"Gs Subtype","page":23,"q":"Ritodrine produces its tocolytic effect by acting through:","opts":["Gs (β receptors) on uterine smooth muscle","Gi receptors in the heart","Gq receptors on the uterus","Phosphodiesterase 3 inhibition"],"ans":0,"exp":"Ritodrine is shown on the Gs cascade, whose uterine effect is 'uterine relaxing'. (Book p23)"},{"id":"PHARM-C8-098","sec":"Gs Subtype","page":23,"q":"Dobutamine is used in:","opts":["CHF","Asthma","Labor tocolysis","Open-angle glaucoma"],"ans":0,"exp":"The label beside dobutamine reads 'used in CHF'. (Book p23)"},{"id":"PHARM-C8-099","sec":"Gs Subtype","page":23,"q":"Salbutamol is used in asthma and is shown on the:","opts":["Gs cascade (β2 → cAMP)","Gq cascade","Gi cascade","G12/13 cascade"],"ans":0,"exp":"Salbutamol appears among the drugs of the Gs subtype, producing bronchodilation through cAMP. (Book p23)"},{"id":"PHARM-C8-100","sec":"Gs Subtype","page":23,"q":"The side effects of salbutamol noted on the page are:","opts":["Palpitations and tremors","Bradycardia and sedation","Hypotension and diarrhoea","Hyperkalaemia and rash"],"ans":0,"exp":"Under salbutamol the page writes 'S/E : Palpitations & tremors'. (Book p23)"},{"id":"PHARM-C8-101","sec":"Gs Subtype","page":23,"q":"Theophylline is used in asthma and acts by inhibiting:","opts":["Phosphodiesterase","Adenylate cyclase","Phospholipase C","Rho-kinase"],"ans":0,"exp":"Theophylline is shown with a block (✳) on phosphodiesterase, i.e. PDE inhibition. (Book p23)"},{"id":"PHARM-C8-102","sec":"Gs Subtype","page":23,"q":"Theophylline is indicated in asthma when:","opts":["β-blockers have been used previously","β2 agonists have failed only","The patient has COPD","The patient is in labor"],"ans":0,"exp":"The bracket after theophylline reads '(if β-blocker are used previously)'. (Book p23)"},{"id":"PHARM-C8-103","sec":"Gs Subtype","page":23,"q":"Milrinone is used in:","opts":["Acute CHF (if β-blockers were used previously)","Chronic stable angina","Asthma in children","Graft versus host disease"],"ans":0,"exp":"The milrinone pill is labelled 'Acute CHF (if β-blocker are used previously)'. (Book p23)"},{"id":"PHARM-C8-104","sec":"Gs Subtype","page":23,"q":"Milrinone acts by inhibiting:","opts":["Phosphodiesterase 3","Phosphodiesterase 3 and 4","Adenylate cyclase","Phospholipase A2"],"ans":0,"exp":"The block for milrinone sits on the 'Phosphodiesterase 3 → in Heart' line, whereas theophylline blocks PDE 3, 4. (Book p23)"},{"id":"PHARM-C8-105","sec":"Gs Subtype","page":23,"q":"Phosphodiesterase 3 and 4 are located in the ____, while phosphodiesterase 3 is located in the ____:","opts":["Bronchi; heart","Heart; bronchi","Liver; kidney","Brain; lung"],"ans":0,"exp":"The page links 'Phosphodiesterase 3, 4 → in Bronchi' and 'Phosphodiesterase 3 → in Heart'. (Book p23)"},{"id":"PHARM-C8-106","sec":"Gs Subtype","page":23,"q":"Which drug is paired with the correct phosphodiesterase?","opts":["Theophylline - PDE 3, 4 in bronchi","Milrinone - PDE 3, 4 in bronchi","Theophylline - PDE 3 in heart only","Milrinone - PDE 4 in heart"],"ans":0,"exp":"Theophylline blocks PDE 3, 4 (bronchi) and milrinone blocks PDE 3 (heart). (Book p23)"},{"id":"PHARM-C8-107","sec":"Gs Subtype","page":23,"q":"The receptor subtypes feeding into Gs in the diagram are:","opts":["β1 and β2","α1, M1 and M2","M2, α2, H3 and 5HT1","G12/13 only"],"ans":0,"exp":"The small circles feeding the Gs cascade are labelled β1 and β2. (Book p23)"},{"id":"PHARM-C8-108","sec":"Gs Subtype","page":23,"q":"Both theophylline and milrinone are used when β-blockers have been given previously because they:","opts":["Act distal to the β receptor by raising cAMP","Stimulate β receptors directly","Block β receptors themselves","Increase β receptor number"],"ans":0,"exp":"By inhibiting phosphodiesterase they raise cAMP downstream of the blocked β receptor, which is why the page specifies this setting. (Book p23)"},{"id":"PHARM-C8-109","sec":"Gq Subtype","page":23,"q":"Stimulation of Gq activates:","opts":["Phospholipase C","Adenylate cyclase","Rho-kinase","Phosphodiesterase"],"ans":0,"exp":"The Gq cascade reads Gq → αq-GTP → (+) Phospholipase C. (Book p23)"},{"id":"PHARM-C8-110","sec":"Gq Subtype","page":23,"q":"Activation of phospholipase C raises:","opts":["PIP2 breakdown products (IP3 and DAG)","Cyclic AMP","Cyclic GMP","Intracellular K+"],"ans":0,"exp":"An up arrow leads from phospholipase C to PIP2, which then splits into IP3 and DAG. (Book p23)"},{"id":"PHARM-C8-111","sec":"Gq Subtype","page":23,"q":"IP3 is described in the page as a:","opts":["Secondary messenger","Primary messenger","Hormone","Enzyme"],"ans":0,"exp":"The label beside IP3 reads 'IP3 (Secondary messenger)'. (Book p23)"},{"id":"PHARM-C8-112","sec":"Gq Subtype","page":23,"q":"IP3 acts by binding to a receptor on the:","opts":["Sarcoplasmic reticulum","Cell membrane","Nucleus","Mitochondria"],"ans":0,"exp":"The cascade notes 'binds to receptor on sarcoplasmic reticulum' after IP3. (Book p23)"},{"id":"PHARM-C8-113","sec":"Gq Subtype","page":23,"q":"The consequence of IP3 action is:","opts":["↑ Ca2+ and smooth muscle constriction","↓ Ca2+ and smooth muscle relaxation","↑ cAMP and bronchodilation","↑ cGMP and vasodilation"],"ans":0,"exp":"The cascade ends '→ ↑ Ca2+ → Smooth muscle constriction'. (Book p23)"},{"id":"PHARM-C8-114","sec":"Gq Subtype","page":23,"q":"Besides IP3, the other product of PIP2 splitting is:","opts":["DAG","cAMP","cGMP","GTP"],"ans":0,"exp":"The PIP2 branch is shown dividing into IP3 and DAG. (Book p23)"},{"id":"PHARM-C8-115","sec":"Gq Subtype","page":23,"q":"Which receptors are listed as examples of Gq receptors?","opts":["Oxytocin R, angiotensin R and vasopressin 1 R","β1, β2 and β3 receptors","M2, α2, H3 and 5HT1 receptors","EGFR and VEGF-R"],"ans":0,"exp":"The list reads oxytocin R, angiotensin R and vasopressin 1 R. (Book p23)"},{"id":"PHARM-C8-116","sec":"Gq Subtype","page":23,"q":"Which Gq subtype receptors feed into the Gq cascade in the diagram?","opts":["α1, M1 and M2","β1 and β2","M2, α2, H3 and 5HT1","Only α1"],"ans":0,"exp":"The circles feeding Gq are labelled α1, M1 and M2. (Book p23)"},{"id":"PHARM-C8-117","sec":"Gq Subtype","page":23,"q":"Note on the Gq page: phospholipase A2 is responsible for:","opts":["Synthesis of prostaglandins","Formation of IP3","Hydrolysis of cAMP","Opening of K+ channels"],"ans":0,"exp":"The closing note states 'Phospholipase A2 synthesis of prostaglandins'. (Book p23)"},{"id":"PHARM-C8-118","sec":"Gq Subtype","page":23,"q":"Angiotensin receptor signalling through Gq would be expected to cause:","opts":["Smooth muscle constriction via IP3 and Ca2+","Smooth muscle relaxation via cAMP","Reduced heart rate via K+ channel opening","Increased cGMP"],"ans":0,"exp":"As a Gq receptor, angiotensin R works through phospholipase C, IP3 and a rise in Ca2+, giving constriction. (Book p23)"},{"id":"PHARM-C8-119","sec":"Gq Subtype","page":23,"q":"Vasopressin 1 receptor-mediated vasoconstriction is an example of:","opts":["Gq signalling","Gs signalling","Gi signalling","G12/13 signalling"],"ans":0,"exp":"Vasopressin 1 R is listed among the Gq receptor examples. (Book p23)"},{"id":"PHARM-C8-120","sec":"Gi Subtype","page":24,"q":"Gi is described as present in the:","opts":["Heart (↓ HR)","Bronchi (bronchodilation)","Uterus (relaxation)","Trabecular meshwork (contraction)"],"ans":0,"exp":"The Gi heading notes 'Present in the heart (↓ HR)'. (Book p24)"},{"id":"PHARM-C8-121","sec":"Gi Subtype","page":24,"q":"Which receptors are shown feeding into the Gi/Go pathway?","opts":["M2, α2, H3 and 5HT1","α1, M1 and M2","β1 and β2","H1 and H2"],"ans":0,"exp":"The four circles above Gi are labelled M2, α2, H3 and 5HT1. (Book p24)"},{"id":"PHARM-C8-122","sec":"Gi Subtype","page":24,"q":"The note states that M2, α2, H3 and 5HT1 receptors are:","opts":["Autoreceptors","Heteroreceptors only","Ion channels","Nuclear receptors"],"ans":0,"exp":"The note reads 'M2, α2, H3, 5HT1 receptors are autoreceptors'. (Book p24)"},{"id":"PHARM-C8-123","sec":"Gi Subtype","page":24,"q":"In the Gi pathway, αi-GTP causes:","opts":["↓ cyclic AMP","↑ cyclic AMP","↓ Ca2+","↑ IP3"],"ans":0,"exp":"The left branch runs αi-GTP → ↓ cyclic AMP → opens K+ channel. (Book p24)"},{"id":"PHARM-C8-124","sec":"Gi Subtype","page":24,"q":"In the Go branch of the same figure, β,γ subunits cause:","opts":["↓ Ca2+","↓ cyclic AMP","↑ IP3","↑ cGMP"],"ans":0,"exp":"The right branch runs β, γ → ↓ Ca2+ → opens K+ channel. (Book p24)"},{"id":"PHARM-C8-125","sec":"Gi Subtype","page":24,"q":"Both branches of the Gi/Go pathway finally:","opts":["Open K+ channels, causing relaxation","Close K+ channels, causing contraction","Open Ca2+ channels, causing contraction","Inhibit adenylate cyclase only"],"ans":0,"exp":"The two limbs converge on 'Opens K+ channel' and then 'Relaxation'. (Book p24)"},{"id":"PHARM-C8-126","sec":"Gi Subtype","page":24,"q":"The net effect of the Gi/Go pathway in the heart is:","opts":["Relaxation with decreased heart rate","Contraction with increased heart rate","No change in rate","Increased contractility"],"ans":0,"exp":"The Gi page states it is present in the heart with ↓ HR, converging on relaxation. (Book p24)"},{"id":"PHARM-C8-127","sec":"Gi Subtype","page":24,"q":"Stimulation of M2 receptors in the heart would:","opts":["Reduce cyclic AMP and open K+ channels","Increase cyclic AMP and open Ca2+ channels","Increase IP3 and intracellular Ca2+","Activate Rho-kinase"],"ans":0,"exp":"M2 feeds the Gi pathway, lowering cAMP and opening K+ channels to relax and slow the heart. (Book p24)"},{"id":"PHARM-C8-128","sec":"G12/13 Subtype","page":24,"q":"G12/13 signalling proceeds through:","opts":["Rho-GTP → (+) Rho-kinase","αs-GTP → adenylate cyclase","αq-GTP → phospholipase C","αi-GTP → ↓ cAMP"],"ans":0,"exp":"The cascade is written G12/13 → Rho-GTP → (+) Rho-kinase. (Book p24)"},{"id":"PHARM-C8-129","sec":"G12/13 Subtype","page":24,"q":"Activation of Rho-kinase produces:","opts":["Smooth muscle contraction, vasoconstriction and trabecular meshwork contraction","Smooth muscle relaxation and vasodilation","Bronchodilation and uterine relaxation","Increased cGMP"],"ans":0,"exp":"The three bullets under Rho-kinase read smooth muscle contraction, vasoconstriction and trabecular meshwork contraction. (Book p24)"},{"id":"PHARM-C8-130","sec":"G12/13 Subtype","page":24,"q":"Belumosudil is described as a new drug used in:","opts":["Graft versus host disease","Acute CHF","Open-angle glaucoma","Angina"],"ans":0,"exp":"The label beside belumosudil reads 'New drug used in Graft vs host disease'. (Book p24)"},{"id":"PHARM-C8-131","sec":"G12/13 Subtype","page":24,"q":"RHO kinase is noted to be involved in:","opts":["Leukocytosis","Bronchoconstriction","Platelet aggregation","Bradycardia"],"ans":0,"exp":"The bullet under belumosudil states 'RHO kinase involved in leukocytosis'. (Book p24)"},{"id":"PHARM-C8-132","sec":"G12/13 Subtype","page":24,"q":"Fasudil is used for:","opts":["Vasodilation in angina","Tocolysis in labor","Open-angle glaucoma","Graft versus host disease"],"ans":0,"exp":"The fasudil label reads 'vasodilation in Angina'. (Book p24)"},{"id":"PHARM-C8-133","sec":"G12/13 Subtype","page":24,"q":"Netarsudil increases:","opts":["Trabecular outflow","Aqueous humour production","Heart rate","Uterine tone"],"ans":0,"exp":"The netarsudil label reads '↑ Trabecular outflow'. (Book p24)"},{"id":"PHARM-C8-134","sec":"G12/13 Subtype","page":24,"q":"Netarsudil is used in:","opts":["Open-angle glaucoma","Angle-closure glaucoma","Asthma","Angina"],"ans":0,"exp":"The bullet under netarsudil states 'used in open-angle glaucoma'. (Book p24)"},{"id":"PHARM-C8-135","sec":"G12/13 Subtype","page":24,"q":"All three drugs listed - belumosudil, fasudil and netarsudil - act by inhibiting:","opts":["Rho-kinase","Phosphodiesterase 3","Adenylate cyclase","Phospholipase C"],"ans":0,"exp":"All three pill icons point to the Rho-kinase step with the (-) inhibition mark in the G12/13 cascade. (Book p24)"},{"id":"PHARM-C8-136","sec":"G12/13 Subtype","page":24,"q":"Which G protein pathway explains netarsudil's effect on the trabecular meshwork?","opts":["G12/13 - Rho-kinase","Gs - cAMP","Gq - IP3","Gi - K+ channel"],"ans":0,"exp":"Trabecular meshwork contraction is a Rho-kinase (G12/13) effect, so its inhibition by netarsudil increases trabecular outflow. (Book p24)"},{"id":"PHARM-C8-137","sec":"G12/13 Subtype","page":24,"q":"In the G12/13 cascade, the drug acts on Rho-kinase with which symbol?","opts":["(-), i.e. inhibition","(+), i.e. activation","No symbol","A question mark"],"ans":0,"exp":"A (-) mark is drawn where belumosudil, fasudil and netarsudil meet the Rho-kinase step, denoting inhibition. (Book p24)"}];
const UNITS = [{"id":"PHARM-U1-1","ch":1,"n":1,"title":"PK vs PD: The Two Definitions","sec":"INTRODUCTION TO PHARMACOKINETICS AND PHARMACODYNAMICS · p1","qs":["PHARM-C1-001","PHARM-C1-002","PHARM-C1-003","PHARM-C1-004"],"guide":"Pharmacokinetics is the study of a drug's movement through the body after intake by any route; pharmacodynamics is the change the drug induces in the body. The figure flags absorption, distribution, metabolism and excretion as the kinetic processes, and the drug, its binding to the target and the resulting effect as the dynamic events."},{"id":"PHARM-U1-2","ch":1,"n":2,"title":"Absorption → Distribution → Adipose","sec":"Course of drug through the body · p1","qs":["PHARM-C1-005","PHARM-C1-006","PHARM-C1-007","PHARM-C1-008","PHARM-C1-009","PHARM-C1-010","PHARM-C1-011","PHARM-C1-012","PHARM-C1-013"],"guide":"An oral drug is absorbed into the systemic circulation and may be distributed to adipose tissue — some drugs by redistribution. Adipose-seeking drugs are very short acting, highly lipid soluble and cross the BBB, like the anaesthetics propofol and thiopentone."},{"id":"PHARM-U1-3","ch":1,"n":3,"title":"Binding, Metabolism & Excretion","sec":"Course of drug through the body · p1","qs":["PHARM-C1-014","PHARM-C1-015","PHARM-C1-016","PHARM-C1-017","PHARM-C1-018","PHARM-C1-019","PHARM-C1-020","PHARM-C1-021","PHARM-C1-022"],"guide":"The circulating drug binds its target — most drugs bind reversibly — and the effect follows; breakdown of the bond frees the drug back into the circulation. The liver then breaks the remaining drug down to a water-soluble form, which is excreted mostly via the kidney and partly via the gut."},{"id":"PHARM-U2-1","ch":2,"n":1,"title":"Four Ways Across the Biological Membrane","sec":"Absorption · p2","qs":["PHARM-C2-001","PHARM-C2-002","PHARM-C2-003","PHARM-C2-004","PHARM-C2-005","PHARM-C2-006","PHARM-C2-007","PHARM-C2-008"],"guide":"A drug in the intestinal lumen must cross the biological membrane to reach blood. The diagram draws four mechanisms — filtration, simple/passive diffusion (the most common), facilitated diffusion and active transport — with the first three bracketed as ATP-independent and only active transport needing ATP. The legend uses a Y for carrier and a triangle for drug."},{"id":"PHARM-U2-2","ch":2,"n":2,"title":"Filtration & Simple Diffusion: The ATP-Free Routes","sec":"Absorption · p2","qs":["PHARM-C2-009","PHARM-C2-010","PHARM-C2-011","PHARM-C2-012","PHARM-C2-013","PHARM-C2-014","PHARM-C2-015"],"guide":"Filtration pushes the drug through membrane pores (example: subcutaneous insulin) with no ATP; simple/passive diffusion is the commonest mechanism of absorption and moves drug along its concentration gradient, straight through the lipid membrane rather than a pore. Neither uses a carrier and neither burns ATP."},{"id":"PHARM-U2-3","ch":2,"n":3,"title":"Facilitated Diffusion vs Active Transport","sec":"Absorption · p2","qs":["PHARM-C2-016","PHARM-C2-017","PHARM-C2-018","PHARM-C2-019","PHARM-C2-020","PHARM-C2-021","PHARM-C2-022","PHARM-C2-023","PHARM-C2-024","PHARM-C2-025","PHARM-C2-026","PHARM-C2-027"],"guide":"Facilitated diffusion (GLUT receptors) uses a carrier but still runs along the gradient with no ATP, and GLUT absorption is gradient-based. Active transport (SGLT receptors) needs ATP and is independent of the gradient — SGLT1 sits on the small intestine and SGLT2 on the renal tubules. Together these two form 'carrier mediated transport'."},{"id":"PHARM-U2-4","ch":2,"n":4,"title":"P-glycoprotein (MDR1) Pump & First-Pass Efflux","sec":"Active transport: P-glycoprotein pump · p2","qs":["PHARM-C2-028","PHARM-C2-029","PHARM-C2-030","PHARM-C2-031","PHARM-C2-032","PHARM-C2-033","PHARM-C2-034","PHARM-C2-035"],"guide":"P-glycoprotein — the most common ABC pump, also called MDR1 — is an ATP-driven efflux pump. In the small intestine/liver most drugs cross the epithelial cell along the concentration gradient, but some are pumped back into the intestinal lumen, producing first-pass metabolism: the drug is excreted before it ever reaches the systemic circulation."},{"id":"PHARM-U2-5","ch":2,"n":5,"title":"Digoxin Dosing, BBB, Placenta & Hepatocytes","sec":"Significance · p3","qs":["PHARM-C2-036","PHARM-C2-037","PHARM-C2-038","PHARM-C2-039","PHARM-C2-040","PHARM-C2-041","PHARM-C2-042","PHARM-C2-043","PHARM-C2-044","PHARM-C2-045","PHARM-C2-046","PHARM-C2-047","PHARM-C2-048","PHARM-C2-049"],"guide":"Efflux matters clinically: digoxin dosage is calculated on the amount lost to efflux. MDR1 pumps sit at the blood-brain barrier, so the opioid antidiarrhoeal loperamide acts on the GIT but cannot enter the brain; water solubility is another reason drugs stay out of the CNS. Placental MDR1 pumps protect the fetus, and hepatocyte MDR1 pumps drive bile acid excretion."},{"id":"PHARM-U2-6","ch":2,"n":6,"title":"Pgp-Driven Resistance in Bacteria & Tumour Cells","sec":"In bacteria/tumour cell · p3","qs":["PHARM-C2-050","PHARM-C2-051","PHARM-C2-052","PHARM-C2-053"],"guide":"The flowchart is short and ruthless: a bacterial or tumour cell develops a Pgp pump, the pump effluxes the drug, and the cell becomes resistant — the same pump that handles normal drugs becomes the engine of treatment failure."},{"id":"PHARM-U2-7","ch":2,"n":7,"title":"Substrates, Inducers & Inhibitors of Pgp","sec":"Pharmacological significance · p4","qs":["PHARM-C2-054","PHARM-C2-055","PHARM-C2-056","PHARM-C2-057","PHARM-C2-058","PHARM-C2-059","PHARM-C2-060","PHARM-C2-061","PHARM-C2-062","PHARM-C2-063","PHARM-C2-064","PHARM-C2-065","PHARM-C2-066","PHARM-C2-067"],"guide":"Three columns summarise Pgp pharmacology: substrates (loperamide, cyclosporine, digoxin) are pumped out; inducers (rifampicin, phenytoin, phenobarbital — like enzyme inducers) raise pump numbers and cause drug failure; inhibitors (verapamil, amiodarone, quinidine, cyclosporine, itraconazole, neratinib, erythromycin/clarithromycin) lower pump numbers and cause drug toxicity. Cyclosporine is both substrate and inhibitor."},{"id":"PHARM-U2-8","ch":2,"n":8,"title":"Effects of Pgp Blockade: The Interaction Table","sec":"Effects of blockade · p4","qs":["PHARM-C2-068","PHARM-C2-069","PHARM-C2-070","PHARM-C2-071","PHARM-C2-072","PHARM-C2-073","PHARM-C2-074","PHARM-C2-075","PHARM-C2-076"],"guide":"The blockade table is pure exam gold: rifampicin → digoxin failure, clarithromycin → digoxin toxicity, cyclosporine → cholestatic jaundice, verapamil → reversal of drug resistance in cancer and bacteria, and quinidine → loperamide-induced central side effects. Each entry is a clinical interaction driven by the efflux pump."},{"id":"PHARM-U2-9","ch":2,"n":9,"title":"Passive Diffusion: The Lipid-Solubility Rule","sec":"Passive Diffusion · p4","qs":["PHARM-C2-077","PHARM-C2-078","PHARM-C2-079","PHARM-C2-080","PHARM-C2-081","PHARM-C2-082","PHARM-C2-083","PHARM-C2-084","PHARM-C2-085"],"guide":"Passive diffusion obeys one rule: lipid-soluble wins. A non-polar, unionised, neutral drug diffuses across the lipid membrane and is absorbed; a polar, ionised or charged drug is repelled by the charged membrane proteins, is lipid insoluble/water soluble, is not absorbed and is finally excreted."},{"id":"PHARM-U3-1","ch":3,"n":1,"title":"The Criteria Table: LUNA for Absorption, WIPE for Excretion","sec":"Ionization of drugs · p5","qs":["PHARM-C3-001","PHARM-C3-002","PHARM-C3-003","PHARM-C3-004","PHARM-C3-005","PHARM-C3-006","PHARM-C3-007","PHARM-C3-008","PHARM-C3-009","PHARM-C3-010"],"guide":"One table decides everything: to be absorbed a drug must be lipid soluble, unionised, non-polar with the medium's pH equal to the drug's, and to be excreted it must be water soluble, ionised, polar with the pH of drug and medium unequal. The mnemonics are LUNA for absorption and WIPE for excretion."},{"id":"PHARM-U3-2","ch":3,"n":2,"title":"Acidic in Acid, Basic in Base — and the Duodenum Rule","sec":"Unionization · p5","qs":["PHARM-C3-011","PHARM-C3-012","PHARM-C3-013","PHARM-C3-014","PHARM-C3-015","PHARM-C3-016","PHARM-C3-017"],"guide":"An acidic drug (aspirin) is unionised in the acidic stomach and a basic drug in the basic small intestine. Yet the unionised drug is maximally absorbed in the small intestine — duodenum — simply because of its enormous surface area, which beats the stomach's favourable pH."},{"id":"PHARM-U3-3","ch":3,"n":3,"title":"Short Bowel Syndrome: Lose the Gut, Lose the Drug","sec":"Short bowel syndrome · p5","qs":["PHARM-C3-018","PHARM-C3-019","PHARM-C3-020"],"guide":"Resection of the small intestine reduces drug absorption, so an oral drug may fail. Management is to increase the dose or change the route — a direct clinical application of surface-area-driven absorption."},{"id":"PHARM-U3-4","ch":3,"n":4,"title":"Ion Trapping: Alkalinise for Acid, Acidify for Base","sec":"Ionization (excretion) · p5","qs":["PHARM-C3-021","PHARM-C3-022","PHARM-C3-023","PHARM-C3-024","PHARM-C3-025","PHARM-C3-026","PHARM-C3-027","PHARM-C3-028","PHARM-C3-029","PHARM-C3-030","PHARM-C3-031"],"guide":"Excretion needs the drug ionised, hence the pH of drug and medium must differ. Acidic drug toxicity (aspirin, phenobarbital, methotrexate) is treated by alkalinising urine with bicarbonate; basic drug toxicity (amphetamine) by acidifying urine with ammonium chloride — vitamin C and cranberry juice are other urine acidifiers. Ionised drug is trapped and excreted."},{"id":"PHARM-U3-5","ch":3,"n":5,"title":"Henderson-Hasselbalch: Quantifying Ionization","sec":"Henderson - Hasselbach Equation · p6","qs":["PHARM-C3-032","PHARM-C3-033","PHARM-C3-034","PHARM-C3-035","PHARM-C3-036","PHARM-C3-037","PHARM-C3-038","PHARM-C3-039","PHARM-C3-040","PHARM-C3-041"],"guide":"For an acidic drug log [U]/[I] = pKa − pH; for a basic drug the ratio is inverted as log [I]/[U] = pKa − pH. pKa is the pH at which half the drug is ionised. An acidic drug of pKa 4 in gastric pH 2 gives a ratio of 100 — 99% unionised and 1% ionised, which is why absorption can occur."},{"id":"PHARM-U3-6","ch":3,"n":6,"title":"IR, SR and CR: Three Shapes of a Release Curve","sec":"Absorption of oral drugs · p6","qs":["PHARM-C3-042","PHARM-C3-043","PHARM-C3-044","PHARM-C3-045","PHARM-C3-046","PHARM-C3-047","PHARM-C3-048","PHARM-C3-049","PHARM-C3-050","PHARM-C3-051","PHARM-C3-052","PHARM-C3-053","PHARM-C3-054","PHARM-C3-055","PHARM-C3-056","PHARM-C3-057","PHARM-C3-058"],"guide":"A tablet is either immediate release (IR) or extended release (ER), and ER splits into sustained release (SR) and controlled release (CR), the latter also called zero order CR. IR gives repeated sharp peaks with frequent dosing (indomethacin TID) and poor compliance; SR uses a polymer coating for a shorter peak and longer duration; CR coats the pores to give a flat plateau."},{"id":"PHARM-U3-7","ch":3,"n":7,"title":"Bypassing the Stomach: Delayed Release & Enteric Coating","sec":"a. Drugs bypassing the stomach · p7","qs":["PHARM-C3-059","PHARM-C3-060","PHARM-C3-061","PHARM-C3-062","PHARM-C3-063","PHARM-C3-064","PHARM-C3-065"],"guide":"Two tricks avoid the stomach: delayed release, which delivers the drug to the small intestine (sulfasalazine for ulcerative colitis), and enteric coating, which shields an acid-labile drug from gastric HCl (PPIs). One moves the release site, the other protects the drug."},{"id":"PHARM-U3-8","ch":3,"n":8,"title":"Bioavailability: Definition, Factors and the AUC Formula","sec":"BIOAVAILABILITY (F) · p7","qs":["PHARM-C3-066","PHARM-C3-067","PHARM-C3-068","PHARM-C3-069","PHARM-C3-070","PHARM-C3-071","PHARM-C3-072","PHARM-C3-073","PHARM-C3-074"],"guide":"Bioavailability is the fraction of drug reaching the systemic circulation unchanged. From 100% intestinal absorption, a fraction is excreted and a fraction undergoes hepatic first pass metabolism, leaving only the rest in circulation. F = AUCoral/AUCiv × 100; AUC is the extent of absorption, and IV is the only route with 100% bioavailability."},{"id":"PHARM-U3-9","ch":3,"n":9,"title":"Route by Route: Bioavailability Table","sec":"Route of administration · p8","qs":["PHARM-C3-075","PHARM-C3-076","PHARM-C3-077","PHARM-C3-078","PHARM-C3-079"],"guide":"IV bioavailability is 1, im/sc 0.75–1.0, and oral the widest range of 0.05–1.0 because first pass metabolism varies by drug. Remember the note: F tells you the extent, never the rate, of absorption."},{"id":"PHARM-U3-10","ch":3,"n":10,"title":"Cmax & Tmax: Rate Versus Extent","sec":"RATE OF DRUG ABSORPTION · p8","qs":["PHARM-C3-080","PHARM-C3-081","PHARM-C3-082","PHARM-C3-083","PHARM-C3-084"],"guide":"On a plasma concentration-time curve, Cmax is the highest concentration achieved and Tmax is the time at which it occurs. Tmax is the marker of the rate of absorption, while AUC gives the extent — two different questions answered by two different parameters."},{"id":"PHARM-U3-11","ch":3,"n":11,"title":"Bioequivalence: Branded, Generic, ANDA & the ±20% Rule","sec":"Bioequivalence in drug industry · p8","qs":["PHARM-C3-085","PHARM-C3-086","PHARM-C3-087","PHARM-C3-088","PHARM-C3-089","PHARM-C3-090","PHARM-C3-091","PHARM-C3-092","PHARM-C3-093"],"guide":"Bioequivalence means two pharmaceutically equivalent products with similar rate (Tmax) and extent (AUC) of absorption. The branded drug is invented and patented for 20 years; the generic is a legal copy marketed after patent expiry, cheaper, approved through ANDA provided it is bioequivalent to the branded drug within ±20%."},{"id":"PHARM-U4-1","ch":4,"n":1,"title":"Apparent Volume of Distribution: Definition","sec":"Apparent Volume of Distribution (AVd) · p9","qs":["PHARM-C4-001","PHARM-C4-002","PHARM-C4-003","PHARM-C4-004","PHARM-C4-005"],"guide":"AVD is the hypothetical volume of plasma in litres needed to account for all the drug in the body, intravascular and extravascular. A drug with a high AVD sits mainly in tissue; one with a low AVD stays in the systemic circulation. That is why it is only an 'apparent' volume."},{"id":"PHARM-U4-2","ch":4,"n":2,"title":"AVD and the Loading Dose Formulas","sec":"Calculation · p9","qs":["PHARM-C4-006","PHARM-C4-007","PHARM-C4-008","PHARM-C4-009","PHARM-C4-010","PHARM-C4-011","PHARM-C4-012","PHARM-C4-013","PHARM-C4-014"],"guide":"AVD = D/C0 × f, where C0 is the initial plasma concentration and f is bioavailability (f = 1 for the IV route). Rearranged for practice, loading dose D = AVD × CT/f, so D ∝ AVD/f: a larger volume of distribution or lower bioavailability demands a bigger loading dose to hit the target concentration."},{"id":"PHARM-U4-3","ch":4,"n":3,"title":"What Determines the Volume of Distribution?","sec":"Factors determining AVd · p9","qs":["PHARM-C4-015","PHARM-C4-016","PHARM-C4-017","PHARM-C4-018","PHARM-C4-019","PHARM-C4-020","PHARM-C4-021","PHARM-C4-022","PHARM-C4-023"],"guide":"Fat content drives vd: obesity raises it, athletes lower it, and women have more than men because of higher fat content. Lipid solubility raises vd, albumin binding lowers it (binding ∝ 1/vd) and tissue binding raises it. The drug's own chemistry and the patient's body composition both matter."},{"id":"PHARM-U4-4","ch":4,"n":4,"title":"Digoxin: Distributed to Muscle, Dosed on Lean Mass","sec":"AVd — eg: Digoxin · p9","qs":["PHARM-C4-024","PHARM-C4-025","PHARM-C4-026","PHARM-C4-027","PHARM-C4-028"],"guide":"Digoxin leaves plasma for skeletal muscle, which outweighs the heart even though the heart is the target organ. Consequently digoxin's loading dose is calculated from lean body mass, not total body mass — dosing an obese patient on total weight overshoots."},{"id":"PHARM-U4-5","ch":4,"n":5,"title":"High AVD = Dialysis Is a Waste of Time","sec":"Significance in toxicity · p9","qs":["PHARM-C4-029","PHARM-C4-030","PHARM-C4-031","PHARM-C4-032"],"guide":"With a very high vd the extravascular concentration is high and intravascular concentration is low, so dialysis can clear almost none of the drug — it is ineffective. Antidotes, not dialysis, are the treatment of poisoning by such drugs."},{"id":"PHARM-U4-6","ch":4,"n":6,"title":"BADDOC: Drugs With High vd, and Their Antidotes","sec":"Drugs with ↑ vd · p10","qs":["PHARM-C4-033","PHARM-C4-034","PHARM-C4-035","PHARM-C4-036","PHARM-C4-037","PHARM-C4-038","PHARM-C4-039","PHARM-C4-040","PHARM-C4-041","PHARM-C4-042","PHARM-C4-043","PHARM-C4-044","PHARM-C4-045","PHARM-C4-046","PHARM-C4-047","PHARM-C4-048","PHARM-C4-049","PHARM-C4-050"],"guide":"Remember BADDOC — Benzodiazepines, Beta blockers, Amphetamines, Digoxin, Opioids, Calcium channel blockers (with organophosphates alongside). These are not cleared by dialysis, so each has a specific antidote: flumazenil, glucagon (raises cAMP), ammonium chloride, digibind, naloxone, calcium gluconate and atropine."},{"id":"PHARM-U4-7","ch":4,"n":7,"title":"Albumin vs α1 Acid Glycoprotein: Who Binds What","sec":"Plasma protein binding · p10","qs":["PHARM-C4-051","PHARM-C4-052","PHARM-C4-053","PHARM-C4-054","PHARM-C4-055","PHARM-C4-056","PHARM-C4-057","PHARM-C4-058","PHARM-C4-059","PHARM-C4-060"],"guide":"Albumin is the commonest plasma protein and binds acidic drugs — antipsychotics, antidepressants, antiepileptics, sulfonamides, warfarin and aspirin. α1 acid glycoprotein binds basic drugs — tricyclic antidepressants, opioids and antiarrhythmics such as beta blockers, amiodarone and lidocaine."},{"id":"PHARM-U4-8","ch":4,"n":8,"title":"Displacement: Why Warfarin Plus Aspirin Bleeds","sec":"Plasma protein binding · p10","qs":["PHARM-C4-061","PHARM-C4-062"],"guide":"Warfarin and aspirin are both albumin bound. Given together they displace each other, each raising the other's plasma concentration of free drug — and the clinical result written in the margin is increased bleeding."},{"id":"PHARM-U4-9","ch":4,"n":9,"title":"Low Albumin Causes Toxicity, High AGP Causes Failure","sec":"Effect on drugs · p10","qs":["PHARM-C4-063","PHARM-C4-064","PHARM-C4-065","PHARM-C4-066","PHARM-C4-067","PHARM-C4-068"],"guide":"A fall in albumin leaves more free drug and so more toxicity; a rise in α1 acid glycoprotein binds more drug and so lowers free drug and effect. The same principle explains why heavily albumin-bound drugs have a low volume of distribution — they stay in the plasma."},{"id":"PHARM-U4-10","ch":4,"n":10,"title":"Clinical Applications: Nephrotic, Cirrhotic, Inflamed, Infarcted","sec":"Clinical Application · p10","qs":["PHARM-C4-069","PHARM-C4-070","PHARM-C4-071","PHARM-C4-072","PHARM-C4-073","PHARM-C4-074","PHARM-C4-075","PHARM-C4-076","PHARM-C4-077","PHARM-C4-078"],"guide":"Albumin falls in nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus — predict toxicity of albumin-bound drugs. α1 glycoprotein rises in inflammation (rheumatoid arthritis, inflammatory bowel disease) and myocardial infarction — predict reduced free drug and reduced effect, as with lidocaine in MI."},{"id":"PHARM-U5-1","ch":5,"n":1,"title":"Phase I and Phase II Metabolism: Two Steps to Excretion","sec":"PHARMACOKINETICS: METABOLISM · p11","qs":["PHARM-C5-001","PHARM-C5-002","PHARM-C5-003","PHARM-C5-004","PHARM-C5-005","PHARM-C5-006","PHARM-C5-007","PHARM-C5-008"],"guide":"Phase I breaks the drug down to yield a functional group, activating a prodrug or inactivating an active drug; Phase II then conjugates that group with a negatively charged moiety, making the drug ionized, water soluble and easily excreted. Placebo, by contrast, contains no drug at all."},{"id":"PHARM-U5-2","ch":5,"n":2,"title":"Prodrugs: The Full List","sec":"Prodrugs · p11","qs":["PHARM-C5-009","PHARM-C5-010","PHARM-C5-011","PHARM-C5-012","PHARM-C5-013","PHARM-C5-014","PHARM-C5-015","PHARM-C5-016"],"guide":"Prodrugs are inactive as given and require metabolism for activation: proguanil, ramipril and other ACE inhibitors (except captopril and lisinopril), oxcarbazepine, omeprazole, dipivefrine, levodopa, racecadotril, 5-fluorouracil and gemcitabine. Knowing the exceptions and the drug classes is what makes this list clinically usable."},{"id":"PHARM-U5-3","ch":5,"n":3,"title":"Phase I Reactions (ORCHAD) and Phase II Conjugations","sec":"Reactions of drugs in the phases · p11","qs":["PHARM-C5-017","PHARM-C5-018","PHARM-C5-019","PHARM-C5-020","PHARM-C5-021","PHARM-C5-022","PHARM-C5-023","PHARM-C5-024","PHARM-C5-025"],"guide":"Phase I reactions follow ORCHAD — Oxidation (m/c), Reduction, Cyclization, Hydrolysis, Aliphatic and Aromatic hydroxylation, Deamination — all enabled by microsomal CYP450 enzymes. Phase II reactions are named after the conjugate added; glucuronidation is the most common and the only microsomal one, while glycination, glutathionation, acetylation, methylation and sulfation are non-microsomal."},{"id":"PHARM-U5-4","ch":5,"n":4,"title":"CYP450 Nomenclature and the Enzyme Group","sec":"CYP450 enzyme group · p12","qs":["PHARM-C5-026","PHARM-C5-027","PHARM-C5-028","PHARM-C5-029","PHARM-C5-030"],"guide":"Cytochrome is a haem protein that binds oxygen and facilitates metabolism; the 450 refers to the 450 nm light absorbed by these enzymes first found in plant pigment. In CYP1A2 the number denotes the family, the letter the subfamily and the final number the geneisoform."},{"id":"PHARM-U5-5","ch":5,"n":5,"title":"Substrate Map of the CYP Isoforms","sec":"Drugs metabolised in phase I (by CYP450 types) · p12","qs":["PHARM-C5-031","PHARM-C5-032","PHARM-C5-033","PHARM-C5-034","PHARM-C5-035","PHARM-C5-036","PHARM-C5-037","PHARM-C5-038"],"guide":"CYP1A2 handles paracetamol, tacrine and theophylline; CYP2B6 handles 6-mercaptopurine and methyldopa; CYP2C9 handles phenytoin and warfarin. CYP2C19 metabolises omeprazole but activates clopidogrel, and the two compete, so omeprazole decreases the effect of clopidogrel; CYP2D6 metabolises psychiatric drugs, opioids and β-blockers and activates tamoxifen."},{"id":"PHARM-U5-6","ch":5,"n":6,"title":"Ethanol, Paracetamol and the CYP3A4 Rule","sec":"CYP2E1 and CYP3A4 · p12","qs":["PHARM-C5-039","PHARM-C5-040","PHARM-C5-041","PHARM-C5-042","PHARM-C5-043","PHARM-C5-044","PHARM-C5-045"],"guide":"Chronic ethanol consumption upregulates CYP2E1, which metabolises paracetamol far more than CYP1A2 does, so more NAPQI is generated and hepatotoxicity follows. CYP3A4 is the most common isoform, metabolising more than 50% of drugs — mifepristone being the quoted example."},{"id":"PHARM-U5-7","ch":5,"n":7,"title":"Glucuronidation and Crigler Najjar Syndrome","sec":"Drugs metabolised in phase II: Glucuronidation · p13","qs":["PHARM-C5-046","PHARM-C5-047","PHARM-C5-048"],"guide":"Glucuronidation handles atazanavir, which can cause Steven Johnson syndrome, and irinotecan, which causes toxicity. Because the pathway itself is deficient in Crigler Najjar syndrome, both drugs are contraindicated in that condition."},{"id":"PHARM-U5-8","ch":5,"n":8,"title":"Estrogen, Enterohepatic Circulation and OCP Failure","sec":"Estrogen enterohepatic circulation · p13","qs":["PHARM-C5-049","PHARM-C5-050","PHARM-C5-051","PHARM-C5-052","PHARM-C5-053","PHARM-C5-054","PHARM-C5-055","PHARM-C5-056"],"guide":"Estrogen is metabolised in the liver by Phase I (CYP3A4) and Phase II glucuronidation to a water-soluble conjugate that enters the small intestine. There gut bacterial glucuronidase releases lipid-soluble estrogen, which is reabsorbed — enterohepatic circulation extending its normal T½. Antibiotics kill these bacteria, shorten the T½ and cause OCP failure."},{"id":"PHARM-U5-9","ch":5,"n":9,"title":"Acetylation and Drug-Induced SLE (HIPS Dance)","sec":"Acetylation · p13","qs":["PHARM-C5-057","PHARM-C5-058","PHARM-C5-059","PHARM-C5-060"],"guide":"Acetylation substrates follow the mnemonic HIPS Dance — Hydralazine, Isoniazid, Procainamide, Sulfonamide and Dapsone — and all of them can cause drug induced SLE, often with arthralgia, rash and a positive ANA."},{"id":"PHARM-U5-10","ch":5,"n":10,"title":"Enzyme Inducers vs Inhibitors: The Interaction Table","sec":"Drug interactions · p14","qs":["PHARM-C5-061","PHARM-C5-062","PHARM-C5-063","PHARM-C5-064","PHARM-C5-065","PHARM-C5-066","PHARM-C5-067","PHARM-C5-068","PHARM-C5-069","PHARM-C5-070","PHARM-C5-071","PHARM-C5-072","PHARM-C5-073","PHARM-C5-074"],"guide":"Inducers raise enzyme amount, increase metabolism and lower plasma concentration producing drug failure; inhibitors do the reverse and produce toxicity. Inducers: griseofulvin, rifampicin, chronic alcohol, benzopyrene, phenobarbital, carbamazepine, St. John's wort. Inhibitors: acute alcohol, quinidine, isoniazid, cimetidine, ciprofloxacin, ketoconazole, valproate, erythromycin/clarithromycin, grapefruit juice, diethylcarbamazine."},{"id":"PHARM-U5-11","ch":5,"n":11,"title":"Clinical Significance: OCP Failure, Theophylline and Statin Toxicity","sec":"Clinical significance · p14","qs":["PHARM-C5-075","PHARM-C5-076","PHARM-C5-077","PHARM-C5-078","PHARM-C5-079","PHARM-C5-080"],"guide":"When rifampicin causes OCP failure the options are to change the contraceptive method (IUD or condoms), avoid enzyme inducers, or increase the dose of the interacting drug as with phenytoin and retigabine. Inhibitor toxicity is shown by erythromycin causing theophylline toxicity with arrhythmia and fibrillation, and clarithromycin causing statin toxicity."},{"id":"PHARM-U6-1","ch":6,"n":1,"title":"Excretion: The Drug That Leaves the Body","sec":"PHARMACOKINETICS: EXCRETION · p15","qs":["PHARM-C6-001","PHARM-C6-002","PHARM-C6-003","PHARM-C6-004"],"guide":"Only the ionised, water-soluble, polar drug is excreted. The major organs are the kidneys — the most common organ of excretion — and the liver, which is the most common organ of metabolism, while saliva and sweat handle small amounts."},{"id":"PHARM-U6-2","ch":6,"n":2,"title":"Filtration (20%) vs Tubular Secretion (80%)","sec":"Filtration vs tubular secretion · p15","qs":["PHARM-C6-005","PHARM-C6-006","PHARM-C6-007","PHARM-C6-008","PHARM-C6-009","PHARM-C6-010","PHARM-C6-011","PHARM-C6-012","PHARM-C6-013"],"guide":"Tubular secretion (80%) dominates over filtration (20%). Only unbound drug is filtered; protein-bound drug, because of the negative charge of the basement membrane, is not filtered but is still secreted. Filtration depends on GFR and therefore gives a constant rate of excretion, so kidney disease directly reduces it."},{"id":"PHARM-U6-3","ch":6,"n":3,"title":"Rate of Drug Elimination and Clearance","sec":"Rate of drug elimination · p15","qs":["PHARM-C6-014","PHARM-C6-015","PHARM-C6-016","PHARM-C6-017","PHARM-C6-018"],"guide":"Rate of drug elimination is the amount of drug eliminated per hour (mg/hr) and equals plasma concentration (mg/ml) × clearance (ml/hr). Clearance is the volume of plasma cleared of drug per hour, not an amount of drug."},{"id":"PHARM-U6-4","ch":6,"n":4,"title":"Two Ways to Dose: Infusion and Intermittent","sec":"Drug dosing · p15","qs":["PHARM-C6-019","PHARM-C6-020"],"guide":"Drugs are dosed either by continuous IV infusion or intermittently. The infusion (dosing) rate is also called the loading dose, while the repeated intermittent dose is the maintenance dose."},{"id":"PHARM-U6-5","ch":6,"n":5,"title":"The Concentration-Time Curve of an Infusion","sec":"Concentration-time curve · p16","qs":["PHARM-C6-021","PHARM-C6-022","PHARM-C6-023","PHARM-C6-024","PHARM-C6-025","PHARM-C6-026","PHARM-C6-027","PHARM-C6-028"],"guide":"The curve has three phases: I the slowly rising state where absorption exceeds excretion, II the steady state plateau where infusion rate equals the rate of drug elimination, and III the declining state where excretion exceeds absorption. Infusion rate = plasma concentration × clearance, 4–5 half-lives are needed to reach steady state, and the dose depends on volume of distribution."},{"id":"PHARM-U6-6","ch":6,"n":6,"title":"Maintenance Dose and the Bioavailability Factor","sec":"Intermittent dosing · p16","qs":["PHARM-C6-029","PHARM-C6-030","PHARM-C6-031","PHARM-C6-032","PHARM-C6-033","PHARM-C6-034","PHARM-C6-035"],"guide":"The intermittent dose, a.k.a. maintenance dose, is given at intervals to hold plasma concentration in steady state and depends on clearance. Maintenance dose = PC × CL × Time / f, where f is bioavailability (f = 1 for IV routes), so oral doses must be larger when bioavailability is incomplete."},{"id":"PHARM-U6-7","ch":6,"n":7,"title":"Half-Life, Volume of Distribution and Clearance","sec":"Half-life · p16","qs":["PHARM-C6-036","PHARM-C6-037","PHARM-C6-038","PHARM-C6-039","PHARM-C6-040","PHARM-C6-041","PHARM-C6-042"],"guide":"Half-life is the time taken for the plasma level to fall by 50% and is proportional to volume of distribution ÷ clearance: T1/2 = 0.693 × vd/Cl = 0.693/kel, while kel = Cl/vd. Rising vd or falling clearance (as in renal failure) prolongs the half-life."},{"id":"PHARM-U6-8","ch":6,"n":8,"title":"Zero Order vs First Order Kinetics (Table)","sec":"Kinetics of drug elimination · p17","qs":["PHARM-C6-043","PHARM-C6-044","PHARM-C6-045","PHARM-C6-046","PHARM-C6-047","PHARM-C6-048","PHARM-C6-049"],"guide":"Zero order eliminates a constant amount of drug per hour (n = 0, RDE = constant); first order eliminates a constant proportion per hour (n = 1, RDE ∝ PC) as expressed in RDE = (PC)^n × Cl. Most drugs follow first order."},{"id":"PHARM-U6-9","ch":6,"n":9,"title":"What Happens When the Dose Is Increased","sec":"Effect of increasing dose · p17","qs":["PHARM-C6-050","PHARM-C6-051","PHARM-C6-052","PHARM-C6-053","PHARM-C6-054","PHARM-C6-055","PHARM-C6-056","PHARM-C6-057"],"guide":"With increasing dose, zero order shows rising T1/2, falling clearance and a disproportionate rise in plasma concentration with risk of toxicity; first order keeps T1/2 and clearance constant and the plasma concentration rises proportionately."},{"id":"PHARM-U6-10","ch":6,"n":10,"title":"Saturation of Elimination and Pseudozero Order","sec":"Saturation of elimination · p17","qs":["PHARM-C6-058","PHARM-C6-059","PHARM-C6-060","PHARM-C6-061","PHARM-C6-062","PHARM-C6-063"],"guide":"Zero order kinetics reflects early saturation of elimination, first order reflects late saturation. The exceptions are the key exam points: zero order drugs follow first order at lower doses until saturation and are hence called pseudozero order, while first order drugs switch to zero order at higher doses after saturation."},{"id":"PHARM-U6-11","ch":6,"n":11,"title":"The Example List: Alcohol, Phenytoin and the Rest","sec":"Examples of elimination kinetics · p17","qs":["PHARM-C6-064","PHARM-C6-065","PHARM-C6-066","PHARM-C6-067","PHARM-C6-068","PHARM-C6-069"],"guide":"Zero order drugs are alcohol (true zero order), theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin; first order kinetics applies to most drugs. This is why a small phenytoin increment can cause toxicity and why alcohol levels fall linearly at a fixed amount per hour."},{"id":"PHARM-U7-1","ch":7,"n":1,"title":"Affinity, Efficacy and Potency","sec":"Affinity, Efficacy and Potency · p18","qs":["PHARM-C7-001","PHARM-C7-002","PHARM-C7-003","PHARM-C7-004","PHARM-C7-005","PHARM-C7-006"],"guide":"A drug's tendency to bind its target is affinity; the maximum effect it produces is efficacy, and efficacy is the clinically most important property because it fixes the ceiling of benefit. Potency is a different matter - the relative dose needed for a given effect, so the lesser the dose, the greater the potency. A graded (quantified) response, such as a change in BP, HR or blood glucose, is studied in an individual."},{"id":"PHARM-U7-2","ch":7,"n":2,"title":"Quantal DRC: ED50, TD50 and LD50","sec":"Quantal DRC · p18","qs":["PHARM-C7-007","PHARM-C7-008","PHARM-C7-009","PHARM-C7-010","PHARM-C7-011","PHARM-C7-012","PHARM-C7-013","PHARM-C7-014","PHARM-C7-015","PHARM-C7-016","PHARM-C7-017"],"guide":"The quantal DRC records a binary, all-or-none response (sedation, fertility) in a population, plotting the percentage of responders against log dose. ED50 is the dose at which half the population gets a therapeutic effect and marks potency, while TD50 (toxic) and LD50 (lethal, in animals) mark toxicity; on the graph the therapeutic curve sits leftmost and the lethal curve furthest right."},{"id":"PHARM-U7-3","ch":7,"n":3,"title":"Therapeutic Index and Therapeutic Window","sec":"Therapeutic Index · p18","qs":["PHARM-C7-018","PHARM-C7-019","PHARM-C7-020","PHARM-C7-021","PHARM-C7-022","PHARM-C7-023","PHARM-C7-024","PHARM-C7-025","PHARM-C7-026","PHARM-C7-027","PHARM-C7-028","PHARM-C7-029"],"guide":"The therapeutic index measures safety: TD50/ED50 in humans and LD50/ED50 in animals. A low index, as with lithium, means safety only within a narrow dosage range and a high chance of toxicity, whereas a high index allows a wide range. The therapeutic window is the corridor between the minimum effective concentration (0.6 meq/L for lithium) and the minimum toxic concentration (1.5 meq/L) - below it there is no effect and above it toxicity."},{"id":"PHARM-U7-4","ch":7,"n":4,"title":"Graded DRC: Height, Position and Parallel Lines","sec":"Graded DRC · p19","qs":["PHARM-C7-030","PHARM-C7-031","PHARM-C7-032","PHARM-C7-033","PHARM-C7-034","PHARM-C7-035","PHARM-C7-036","PHARM-C7-037","PHARM-C7-038","PHARM-C7-039","PHARM-C7-040","PHARM-C7-041","PHARM-C7-042","PHARM-C7-043"],"guide":"On the graded DRC (response versus log dose in an individual) efficacy is read from the height of the curve and potency from its position - more to the left means more potent. In the figure, efficacy runs B > A > C and potency PA > PB > PC, so drug A is the most potent yet B the most efficacious. Affinity is comparable only between drugs of the same MOA and only between parallel lines, which is why C is excluded and the order is A > B."},{"id":"PHARM-U7-5","ch":7,"n":5,"title":"Full, Partial, Antagonist, Inverse: The Table","sec":"Drug Receptor Interactions · p19","qs":["PHARM-C7-044","PHARM-C7-045","PHARM-C7-046","PHARM-C7-047","PHARM-C7-048","PHARM-C7-049","PHARM-C7-050","PHARM-C7-051","PHARM-C7-052","PHARM-C7-053","PHARM-C7-054","PHARM-C7-055","PHARM-C7-056","PHARM-C7-057"],"guide":"The interaction table grades four behaviours: a full agonist gives a maximum effect (+1 intrinsic efficacy), a partial agonist a submaximal effect (between 1 and 0), an antagonist no effect (0) and an inverse agonist an effect opposite to the receptor's nature (-1). Against endogenous full agonists these translate into mild, moderate and severe antagonism respectively. On the figure, A rises to maximal, B plateaus submaximally, C stays flat and D dips below the no-effect line."},{"id":"PHARM-U7-6","ch":7,"n":6,"title":"Clinical Reading of Agonists and Antagonists","sec":"Drug Receptor Interactions · p19","qs":["PHARM-C7-058","PHARM-C7-059","PHARM-C7-060"],"guide":"The single most useful clinical fact from this table is its footnote: antagonists are the most commonly used drugs, even though they exert no effect of their own. Adding a partial agonist to a patient already on a full agonist yields only mild antagonism, because a partial agonist can never match a full agonist's maximal response."},{"id":"PHARM-U8-1","ch":8,"n":1,"title":"Types of Antagonism","sec":"Types of Antagonism · p20","qs":["PHARM-C8-001","PHARM-C8-002","PHARM-C8-003","PHARM-C8-004","PHARM-C8-005","PHARM-C8-006","PHARM-C8-007","PHARM-C8-008","PHARM-C8-009","PHARM-C8-010","PHARM-C8-011","PHARM-C8-012","PHARM-C8-013","PHARM-C8-014","PHARM-C8-015","PHARM-C8-016","PHARM-C8-017"],"guide":"Antagonism is classified by mechanism, not by receptor: physical antagonism binds the substance (charcoal adsorbs alcohol from the intestine), chemical antagonism binds and neutralises it (heparin, an acid/-ve, is neutralised by protamine sulphate, a base/+ve; iron is chelated by dexrazoxane or deferiprone), and physiological antagonism uses opposite receptors - histamine via H1 constricts bronchi while adrenaline/salbutamol via β2 dilate them. Salbutamol is the best bronchodilator in asthma, but in COPD ipratropium or tiotropium is preferred instead because of cholinergic effects."},{"id":"PHARM-U8-2","ch":8,"n":2,"title":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism · p20","qs":["PHARM-C8-018","PHARM-C8-019","PHARM-C8-020","PHARM-C8-021","PHARM-C8-022","PHARM-C8-023","PHARM-C8-024","PHARM-C8-025","PHARM-C8-026","PHARM-C8-027","PHARM-C8-028","PHARM-C8-029","PHARM-C8-030","PHARM-C8-031","PHARM-C8-032","PHARM-C8-033","PHARM-C8-034","PHARM-C8-035","PHARM-C8-036","PHARM-C8-037"],"guide":"The table follows drug (A) through three rows: its normal effect, the addition of antagonist (B), and the effect of raising (A). In competitive reversible antagonism (A) and (B) compete for the same (enzymatic) site, so raising (A) restores the effect, Km rises, potency falls and Vmax/efficacy is unchanged. In competitive irreversible and non-competitive antagonism (B) occupies the allosteric part, raising (A) gives 'no reversal of antagonism', Vmax falls while Km and potency show no change."},{"id":"PHARM-U8-3","ch":8,"n":3,"title":"Michaelis-Menten Note: Vmax and Km","sec":"Michaelis-Menten Note: Vmax and Km · p21","qs":["PHARM-C8-038","PHARM-C8-039","PHARM-C8-040","PHARM-C8-041","PHARM-C8-042","PHARM-C8-043"],"guide":"The Michaelis-Menten equation is used to read the same table numerically: Vmax is the maximum velocity of the reaction between enzyme and drug (substrate) and stands for maximum effect, i.e. efficacy; Km is the concentration of drug at which the reaction velocity is half of Vmax and is proportional to 1/potency. So a competitive antagonist raises Km (potency falls) with Vmax untouched, while a non-competitive antagonist lowers Vmax with Km unchanged."},{"id":"PHARM-U8-4","ch":8,"n":4,"title":"Receptors: Ligand Gated Ion Channel Receptors","sec":"Receptors: Ligand Gated Ion Channel Receptors · p21","qs":["PHARM-C8-044","PHARM-C8-045","PHARM-C8-046","PHARM-C8-047","PHARM-C8-048","PHARM-C8-049","PHARM-C8-050"],"guide":"Receptors begin with the fastest acting type, the ligand gated ion channel receptors (LGICR). Their examples are tabulated by substrate: GABA-A conducts chloride, glutamate has the NMDA, AMPA and kainate subtypes, while the nicotinic receptor and 5-HT3 are listed with a dash. The note to remember is that GABA-B is a GPCR, not an ion channel."},{"id":"PHARM-U8-5","ch":8,"n":5,"title":"Nicotinic Receptor Structure","sec":"Nicotinic Receptor Structure · p21","qs":["PHARM-C8-051","PHARM-C8-052","PHARM-C8-053","PHARM-C8-054","PHARM-C8-055","PHARM-C8-056","PHARM-C8-057"],"guide":"The nicotinic receptor is a pentamer of α, α, β, δ and ε subunits surrounding a lumen through which Na+ enters. Acetylcholine acts on the α subunit to open the channel, which is why the α subunit is marked most important in a receptor. Functionally, the same receptor gives contraction on muscle and depolarisation on a ganglion."},{"id":"PHARM-U8-6","ch":8,"n":6,"title":"Enzymatic Receptor","sec":"Enzymatic Receptor · p22","qs":["PHARM-C8-058","PHARM-C8-059","PHARM-C8-060","PHARM-C8-061","PHARM-C8-062","PHARM-C8-063","PHARM-C8-064","PHARM-C8-065","PHARM-C8-066","PHARM-C8-067","PHARM-C8-068"],"guide":"An enzymatic receptor carries an intracellular enzymatic domain; the ligand binds the receptor and the enzyme acts, the classic example being tyrosine kinase, where phosphorylation of tyrosine leads to cell proliferation. The four tabulated types are tyrosine kinase receptors (EGFR, VEGF-R, Her-2/neu R, insulin/IGF R), Janus kinase receptors (leptin/cytokine, prolactin, growth hormone), STKR (TGFR) and the guanylate cyclase receptor (ANP, BNP → ↑ cGMP → vasodilation)."},{"id":"PHARM-U8-7","ch":8,"n":7,"title":"Nuclear Receptor (NRT)","sec":"Nuclear Receptor (NRT) · p22","qs":["PHARM-C8-069","PHARM-C8-070","PHARM-C8-071","PHARM-C8-072","PHARM-C8-073","PHARM-C8-074","PHARM-C8-075","PHARM-C8-076","PHARM-C8-077"],"guide":"Nuclear receptors are the slowest acting receptors because they work on gene transcription. Some already sit in the nucleus - estrogen, progesterone, vitamin A, T3/T4 and PPAR (α, δ, γ) receptors - while others (androgen, mineralocorticoid, glucocorticoid and vitamin D receptors) wait in the cytoplasm and translocate to the nucleus only upon ligand binding."},{"id":"PHARM-U8-8","ch":8,"n":8,"title":"G Protein Coupled Receptor (GPCR)","sec":"G Protein Coupled Receptor (GPCR) · p22","qs":["PHARM-C8-078","PHARM-C8-079","PHARM-C8-080","PHARM-C8-081","PHARM-C8-082","PHARM-C8-083","PHARM-C8-084","PHARM-C8-085","PHARM-C8-086","PHARM-C8-087","PHARM-C8-088"],"guide":"GPCRs - also called serpentine, 7 transmembrane or heptahelical receptors - are the most common target for drugs. The α subunit is the most important and carries intrinsic GTPase activity; activation exchanges GDP for GTP and hydrolysis of GTP switches the signal off. GPCRs are classified by their α subtypes: s → Gs, q → Gq and i → Gi."},{"id":"PHARM-U8-9","ch":8,"n":9,"title":"Gs Subtype","sec":"Gs Subtype · p23","qs":["PHARM-C8-089","PHARM-C8-090","PHARM-C8-091","PHARM-C8-092","PHARM-C8-093","PHARM-C8-094","PHARM-C8-095","PHARM-C8-096","PHARM-C8-097","PHARM-C8-098","PHARM-C8-099","PHARM-C8-100","PHARM-C8-101","PHARM-C8-102","PHARM-C8-103","PHARM-C8-104","PHARM-C8-105","PHARM-C8-106","PHARM-C8-107","PHARM-C8-108"],"guide":"Gs signals through αs-GTP to activate adenylate cyclase, raising cyclic AMP, which phosphodiesterase then metabolises. In cardiac and skeletal muscle cAMP causes contraction through calcium channel phosphorylation, while in smooth muscle it causes relaxation (myosin light chain phosphorylase activation and myosin light chain kinase inhibition) giving bronchodilation, vasodilation and uterine relaxation - the basis for ritodrine in labor, dobutamine in CHF and salbutamol in asthma (palpitations and tremors). Theophylline blocks phosphodiesterase 3, 4 in bronchi and milrinone blocks phosphodiesterase 3 in the heart, both used when β-blockers have already been given."},{"id":"PHARM-U8-10","ch":8,"n":10,"title":"Gq Subtype","sec":"Gq Subtype · p23","qs":["PHARM-C8-109","PHARM-C8-110","PHARM-C8-111","PHARM-C8-112","PHARM-C8-113","PHARM-C8-114","PHARM-C8-115","PHARM-C8-116","PHARM-C8-117","PHARM-C8-118","PHARM-C8-119"],"guide":"Gq works through αq-GTP to activate phospholipase C, which raises PIP2 and splits it into IP3 (a secondary messenger) and DAG. IP3 binds a receptor on the sarcoplasmic reticulum, releasing Ca2+ and causing smooth muscle constriction - the pathway behind oxytocin, angiotensin and vasopressin 1 receptor effects, with α1, M1 and M2 as the feeding receptors. A separate note records that phospholipase A2 is responsible for the synthesis of prostaglandins."},{"id":"PHARM-U8-11","ch":8,"n":11,"title":"Gi Subtype","sec":"Gi Subtype · p24","qs":["PHARM-C8-120","PHARM-C8-121","PHARM-C8-122","PHARM-C8-123","PHARM-C8-124","PHARM-C8-125","PHARM-C8-126","PHARM-C8-127"],"guide":"Gi is present in the heart, where it lowers heart rate. Its receptors - M2, α2, H3 and 5HT1 - are autoreceptors. The αi-GTP limb lowers cyclic AMP while the Go limb (β, γ) lowers Ca2+; both converge on opening K+ channels and so produce relaxation."},{"id":"PHARM-U8-12","ch":8,"n":12,"title":"G12/13 Subtype","sec":"G12/13 Subtype · p24","qs":["PHARM-C8-128","PHARM-C8-129","PHARM-C8-130","PHARM-C8-131","PHARM-C8-132","PHARM-C8-133","PHARM-C8-134","PHARM-C8-135","PHARM-C8-136","PHARM-C8-137"],"guide":"G12/13 signals through Rho-GTP, which activates Rho-kinase and produces smooth muscle contraction, vasoconstriction and trabecular meshwork contraction. Three Rho-kinase inhibitors are shown: belumosudil, a new drug for graft versus host disease (RHO kinase is involved in leukocytosis), fasudil for vasodilation in angina, and netarsudil, which increases trabecular outflow and is used in open-angle glaucoma."}];

function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_xp')||0;}, set xp(v){store('pulse_xp',v);},
  get done(){return store('pulse_done')||[];}, set done(v){store('pulse_done',v);},
  get unlock(){return !!store('pulse_unlock');}, set unlock(v){store('pulse_unlock',v);},
  streak(){const t=store('pulse_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_streak',s);return s.n;}
};
const nav={stack:['home']};
function show(id){nav.stack.push(id);render();}
function goBack(){if(nav.stack.length>1)nav.stack.pop();render();}
function render(){
  const cur=nav.stack[nav.stack.length-1];
  ['home','chapters','path','guide','quiz','unitdone'].forEach(s=>$(s).classList.toggle('hidden',s!==cur));
  $('backBtn').classList.toggle('hidden',cur==='home');
  $('brand').textContent = cur==='home'?'PULSE':'PULSE';
  refreshStats();
  if(cur==='home')renderHome();
  if(cur==='chapters')renderChapters();
  if(cur==='path')renderPath();
}
function refreshStats(){
  $('hXP').textContent=S.xp; $('hStreak').textContent=S.streak().n;
  $('sXP').textContent=S.xp; $('sStreak').textContent=S.streak().n; $('sUnits').textContent=S.done.length;
}
function renderHome(){
  const live=CHAPTERS.filter(c=>c.live).length;
  $('heroSub').textContent=live+' of '+CHAPTERS.length+' chapters built so far — original questions, guides, and unit-by-unit mastery for each.';
}
function unitsOf(ch){return UNITS.filter(u=>u.ch===ch).sort((a,b)=>a.n-b.n);}
function renderChapters(){
  $('chSub').textContent=CHAPTERS.length+' chapters · Full chapter-by-chapter exam pass';
  const box=$('chList'); box.innerHTML='';
  CHAPTERS.forEach(c=>{
    const us=c.live?unitsOf(c.n):[];
    const dn=us.filter(u=>S.done.includes(u.id)).length;
    const d=document.createElement('div');
    d.className='chrow'+(c.live?'':' locked');
    d.innerHTML='<div class="chnum">'+c.n+'</div><div class="t">'+escapeHtml(c.t)+'</div><div class="u">'+(c.live?dn+'/'+us.length+' units':'Soon')+'</div>';
    if(c.live)d.onclick=()=>{curCh=c.n;show('path');};
    box.appendChild(d);
  });
}
let curCh=1, curUnit=null;
function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';
  const i=us.findIndex(x=>x.id===u.id);
  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}

  let lastSec='';

    d.innerHTML='<div class="ball '+st+'">'+(st==='done'?'✓':st==='locked'?'🔒':u.n)+'</div><div class="ntitle">'+escapeHtml(u.title)+'</div><div class="ncount">'+u.qs.length+' questions</div>';
    if(st!=='locked')d.querySelector('.ball').onclick=()=>openGuide(u);
    box.appendChild(d);
  });
}
function openGuide(u){curUnit=u;
  $('gKick').textContent='CHAPTER '+u.ch+' · UNIT '+u.n+' · '+u.sec.toUpperCase();
  $('gTitle').textContent=u.title;
  $('gText').textContent=u.guide;
  $('gCount').textContent=u.qs.length+' questions · follows the book line-by-line';
  show('guide');
}
let order=[],idx=0,xpGain=0,streak=0,correct=0,wrongList=[],locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function beginUnit(){
  // FIXED book order — only options shuffle (anti-bias)
  order=curUnit.qs.map(id=>{const q=QBYID[id];return {q,opts:shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))};});
  idx=0;xpGain=0;streak=0;correct=0;wrongList=[];
  show('quiz');renderQ();
}
function renderQ(){
  locked=false;
  const cur=order[idx],q=cur.q;
  $('qbar').style.width=(idx/order.length*100)+'%';
  $('qcount').textContent='QUESTION '+(idx+1)+' OF '+order.length;
  $('qtag').textContent=q.sec+' · Book p'+q.page;
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  cur.opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(o,b);box.appendChild(b);
  });
  $('fb').className='fb';$('fb').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent=idx===order.length-1?'Finish ✓':'Continue →';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function answer(o,btn){
  if(locked)return;locked=true;
  const cur=order[idx],q=cur.q,btns=$('opts').children;
  const rightIdx=cur.opts.findIndex(x=>x.ok);
  [...btns].forEach(b=>b.disabled=true);
  btns[rightIdx].classList.add('correct');
  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
</body>
</html>
