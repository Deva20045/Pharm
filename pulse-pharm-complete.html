":"The Criteria Table: LUNA vs WIPE","sec":"Ionization of drugs · p5","qs":["PHARM-C3-001","PHARM-C3-002","PHARM-C3-003","PHARM-C3-004","PHARM-C3-005","PHARM-C3-006","PHARM-C3-007"],"guide":"A single table decides whether a drug is absorbed or excreted. Absorption demands lipid solubility, the unionised form, a pH of medium equal to that of the drug and non-polar character - the mnemonic LUNA; excretion demands water solubility, the ionised form, unequal pH and polar character - WIPE."},{"id":"PHARM-U3-2","ch":3,"n":2,"title":"Unionization: Stomach vs Small Intestine","sec":"Unionization · p5","qs":["PHARM-C3-008","PHARM-C3-009","PHARM-C3-010","PHARM-C3-011","PHARM-C3-012","PHARM-C3-013"],"guide":"An acidic drug is unionised in the acidic stomach and a basic drug in the basic small intestine, so aspirin is unionised in gastric acid. Despite this, maximum absorption of any unionised drug occurs in the duodenum because of its enormous surface area - and when the small intestine is resected, as in short bowel syndrome, absorption falls and the dose must be raised or the route changed."},{"id":"PHARM-U3-3","ch":3,"n":3,"title":"Ionization for Excretion: Urine pH Manipulation","sec":"Ionization (excretion) · p5","qs":["PHARM-C3-014","PHARM-C3-015","PHARM-C3-016","PHARM-C3-017","PHARM-C3-018","PHARM-C3-019"],"guide":"When the pH of the drug differs from that of the medium the drug is ionised and excreted. Acidic drug toxicity - aspirin, phenobarbital, methotrexate - is treated by alkalinizing urine with bicarbonate, while basic drug toxicity - amphetamine - is treated by acidifying urine with ammonium chloride; vitamin C and cranberry juice are other urine acidifiers."},{"id":"PHARM-U3-4","ch":3,"n":4,"title":"Henderson-Hasselbalch: Quantifying Ionization","sec":"Henderson - Hasselbach Equation · p6","qs":["PHARM-C3-020","PHARM-C3-021","PHARM-C3-022","PHARM-C3-023","PHARM-C3-024"],"guide":"For an acidic drug log [unionized]/[ionized] = pKa - pH, and for a basic drug log [ionized]/[unionized] = pKa - pH. An acidic drug of pKa 4 in gastric pH 2 gives a ratio of 100, i.e. 99% unionised and 1% ionised. pKa itself is the pH at which half the drug is ionised and half unionised."},{"id":"PHARM-U3-5","ch":3,"n":5,"title":"IR, SR and CR Oral Formulations","sec":"Absorption of oral drugs · p6","qs":["PHARM-C3-025","PHARM-C3-026","PHARM-C3-027","PHARM-C3-028","PHARM-C3-029","PHARM-C3-030","PHARM-C3-031","PHARM-C3-032","PHARM-C3-033","PHARM-C3-034"],"guide":"Tablets and capsules come as immediate release, which needs frequent dosing (indomethacin TID), or extended release, which splits into sustained release and controlled release. SR gives a shorter peak with longer duration of action, better compliance and a polymer coat (SR indomethacin); CR is zero order release from polymer-coated pores (CR zolpidem), drawn as a flat plateau on the concentration-time curve."},{"id":"PHARM-U3-6","ch":3,"n":6,"title":"Drugs Bypassing the Stomach","sec":"Drugs bypassing the stomach · p7","qs":["PHARM-C3-035","PHARM-C3-036","PHARM-C3-037"],"guide":"Delayed release formulations liberate the drug in the small intestine rather than the stomach - sulfasalazine for ulcerative colitis - while enteric coating is used to protect acid-labile drugs such as proton pump inhibitors from gastric HCl."},{"id":"PHARM-U3-7","ch":3,"n":7,"title":"Bioavailability: Definition and Formula","sec":"Rate and Extent of Absorption · p7","qs":["PHARM-C3-038","PHARM-C3-039","PHARM-C3-040","PHARM-C3-041","PHARM-C3-042","PHARM-C3-043","PHARM-C3-044"],"guide":"Bioavailability (f) is the fraction of drug reaching the systemic circulation unchanged. Of 100% drug absorbed, a fraction is excreted and a fraction is lost to first pass metabolism in the liver; f rises if the drug bypasses the liver or absorption increases. It is calculated as AUC oral/AUC IV x 100, reflects the extent of absorption, and is 100% only for the intravenous route."},{"id":"PHARM-U3-8","ch":3,"n":8,"title":"f by Route, Cmax and Tmax","sec":"Bioavailability by route · p8","qs":["PHARM-C3-045","PHARM-C3-046","PHARM-C3-047","PHARM-C3-048","PHARM-C3-049","PHARM-C3-050","PHARM-C3-051"],"guide":"The route table gives IV bioavailability 1, IM/SC 0.75-1.0 and oral 0.05-1.0. Crucially f tells only the extent, not the rate of absorption; the rate is judged from Tmax and the height of the curve by Cmax, the maximum plasma concentration achieved."},{"id":"PHARM-U3-9","ch":3,"n":9,"title":"Branded, Generic and Bioequivalence","sec":"Bioequivalence · p8","qs":["PHARM-C3-052","PHARM-C3-053","PHARM-C3-054","PHARM-C3-055","PHARM-C3-056"],"guide":"Bioequivalence means two pharmaceutically equivalent products share a similar rate (Tmax) and extent (AUC) of absorption. A branded drug is the invented molecule patented for 20 years; a generic is a legal, cheaper copy made after patent expiry and approved through an ANDA, provided it is bioequivalent to the branded drug within +/- 20%."},{"id":"PHARM-U4-1","ch":4,"n":1,"title":"Apparent Volume of Distribution: The Concept","sec":"Apparent Volume of Distribution (AVd) · p9","qs":["PHARM-C4-001","PHARM-C4-002","PHARM-C4-003"],"guide":"Apparent volume of distribution is the hypothetical volume of plasma in litres required to account for the total drug in the body, intravascular plus extravascular. A drug with a high AVd hides in tissue, while a drug with a low AVd stays in the systemic circulation."},{"id":"PHARM-U4-2","ch":4,"n":2,"title":"Calculating AVd and Loading Dose","sec":"Calculation of AVd · p9","qs":["PHARM-C4-004","PHARM-C4-005","PHARM-C4-006","PHARM-C4-007","PHARM-C4-008","PHARM-C4-009","PHARM-C4-010"],"guide":"AVd = dose/C0 x f, with C0 the initial plasma concentration and f the bioavailability (f = 1 for IV). The loading dose needed to hit a target concentration CT is D = AVd x CT/f, so D is proportional to AVd/f - when AVd rises, the dose must rise with it to keep the target concentration."},{"id":"PHARM-U4-3","ch":4,"n":3,"title":"What Determines vd: Fat, pKa, Binding","sec":"Factors determining AVd · p9","qs":["PHARM-C4-011","PHARM-C4-012","PHARM-C4-013","PHARM-C4-014","PHARM-C4-015","PHARM-C4-016"],"guide":"Body fat content drives vd upwards in obesity and downwards in athletes, and females with more fat have a higher vd than males. Lipid solubility (pKa) and tissue binding increase vd, whereas plasma albumin binding is inversely proportional to vd because it keeps the drug inside the vessels."},{"id":"PHARM-U4-4","ch":4,"n":4,"title":"Digoxin: Muscle Mass and Lean Body Weight","sec":"Factors determining AVd · p9","qs":["PHARM-C4-017","PHARM-C4-018"],"guide":"Digoxin distributes to skeletal muscle far more than to the heart because skeletal muscle has the greater mass, even though the heart is the target organ. Consequently the loading dose of digoxin is calculated on lean body mass and not on total body mass."},{"id":"PHARM-U4-5","ch":4,"n":5,"title":"High vd: Why Dialysis Fails","sec":"Significance in toxicity · p9","qs":["PHARM-C4-019","PHARM-C4-020"],"guide":"When vd is very high, the drug concentrates in tissue, so intravascular levels are low and removal methods like dialysis clear almost nothing; this makes dialysis ineffective. Toxicity of such drugs is therefore managed with specific antidotes."},{"id":"PHARM-U4-6","ch":4,"n":6,"title":"BADDOC and the Antidote Table","sec":"Drugs with increased vd · p10","qs":["PHARM-C4-021","PHARM-C4-022","PHARM-C4-023","PHARM-C4-024","PHARM-C4-025","PHARM-C4-026","PHARM-C4-027","PHARM-C4-028","PHARM-C4-029","PHARM-C4-030"],"guide":"BADDOC - benzodiazepines, beta blockers, amphetamines, digoxin, opioids, organophosphates and calcium channel blockers - are the drugs with an increased vd that dialysis cannot clear, so each has an antidote: flumazenil, glucagon (which raises cAMP), ammonium chloride, Digibind, naloxone, atropine and calcium gluconate respectively."},{"id":"PHARM-U4-7","ch":4,"n":7,"title":"Albumin and Alpha-1 Acid Glycoprotein","sec":"Plasma protein binding · p10","qs":["PHARM-C4-031","PHARM-C4-032","PHARM-C4-033","PHARM-C4-034","PHARM-C4-035"],"guide":"Albumin, the commonest carrier, binds acidic drugs - antipsychotics, antidepressants, antiepileptics, sulfonamides, warfarin and aspirin - while alpha-1 acid glycoprotein binds basic drugs such as tricyclic antidepressants, opioids and the antiarrhythmics beta blockers, amiodarone and lidocaine. Two albumin-bound drugs used together, classically warfarin and aspirin, raise each other's plasma concentration and cause bleeding."},{"id":"PHARM-U4-8","ch":4,"n":8,"title":"Hypoalbuminaemia, Inflammation and Drug Effect","sec":"Plasma protein binding · p10","qs":["PHARM-C4-036","PHARM-C4-037","PHARM-C4-038","PHARM-C4-039","PHARM-C4-040","PHARM-C4-041","PHARM-C4-042"],"guide":"Falling albumin leaves more free drug and increases the risk of toxicity, and albumin is low in nephrotic syndrome, CKD, liver cirrhosis and diabetes mellitus. Conversely inflammation and myocardial infarction raise alpha-1 acid glycoprotein, which binds basic drugs more avidly, lowering free drug and the effect - the same disease state can therefore alter drug handling in opposite directions depending on which protein binds it."},{"id":"PHARM-U5-1","ch":5,"n":1,"title":"Phase I and Phase II: The Two Steps","sec":"Phase I · p11","qs":["PHARM-C5-001","PHARM-C5-002","PHARM-C5-003","PHARM-C5-004","PHARM-C5-005","PHARM-C5-006","PHARM-C5-007","PHARM-C5-008"],"guide":"Phase I either activates an inactive prodrug or inactivates a drug, and always leaves it with a functional group. Phase II then attaches a negatively charged conjugate to give a drug + functional group + conjugate that is ionized and water soluble and therefore easily excreted. A placebo, by definition, contains no drug at all."},{"id":"PHARM-U5-2","ch":5,"n":2,"title":"Prodrugs and Their Examples","sec":"Prodrugs · p11","qs":["PHARM-C5-009","PHARM-C5-010","PHARM-C5-011","PHARM-C5-012","PHARM-C5-013","PHARM-C5-014","PHARM-C5-015"],"guide":"Prodrugs are inactive as given and need metabolic activation: proguanil, ramipril and other ACE inhibitors except captopril and lisinopril, oxcarbazepine, omeprazole, dipivefrine, levodopa, racecadotril, 5-fluorouracil and gemcitabine."},{"id":"PHARM-U5-3","ch":5,"n":3,"title":"ORCHAD and the Phase II Conjugations","sec":"Reactions of Drugs in the Phases · p11","qs":["PHARM-C5-016","PHARM-C5-017","PHARM-C5-018","PHARM-C5-019","PHARM-C5-020","PHARM-C5-021","PHARM-C5-022","PHARM-C5-023"],"guide":"Phase I reactions follow ORCHAD - oxidation (commonest), reduction, cyclization, hydrolysis, aliphatic hydroxylation, aromatic hydroxylation and deamination - and are enabled by microsomal CYP450 enzymes. Phase II reactions are named after the conjugate: glucuronidation is the commonest and is microsomal, while glycination, glutathionation, acetylation, methylation and sulfation are non-microsomal."},{"id":"PHARM-U5-4","ch":5,"n":4,"title":"CYP450: What the Name Means","sec":"CYP450 enzyme group · p12","qs":["PHARM-C5-024","PHARM-C5-025","PHARM-C5-026","PHARM-C5-027"],"guide":"CY is a cytochrome - a heme protein that binds oxygen and so facilitates metabolism - and the P450 tag comes from enzymes discovered in plant pigment that absorb light at 450 nm. In CYP1A2 the numerals and letter read as family 1, subfamily A and gene/isoform number 2."},{"id":"PHARM-U5-5","ch":5,"n":5,"title":"Isoform by Isoform: 1A2, 2B6 and 2C9","sec":"Drugs metabolised in phase I · p12","qs":["PHARM-C5-028","PHARM-C5-029","PHARM-C5-030"],"guide":"CYP1A2 metabolises paracetamol, tacrine and theophylline; CYP2B6 metabolises 6-mercaptopurine and methyldopa; CYP2C9 metabolises phenytoin and warfarin."},{"id":"PHARM-U5-6","ch":5,"n":6,"title":"CYP2C19: Omeprazole vs Clopidogrel","sec":"CYP2C19 · p12","qs":["PHARM-C5-031","PHARM-C5-032","PHARM-C5-033"],"guide":"CYP2C19 both metabolises omeprazole and activates the prodrug clopidogrel. Because both are substrates competing for a limited amount of enzyme, omeprazole behaves as a competitive inhibitor and decreases the effect of clopidogrel - so the combination loses antiplatelet protection."},{"id":"PHARM-U5-7","ch":5,"n":7,"title":"CYP2D6 and Tamoxifen Activation","sec":"CYP2D6 · p12","qs":["PHARM-C5-034","PHARM-C5-035","PHARM-C5-036"],"guide":"CYP2D6 metabolises psychiatric drugs (antidepressants and antipsychotics), opioids and beta blockers, and it activates tamoxifen. Inhibiting CYP2D6 therefore deprives the patient of tamoxifen's active metabolite and reduces its efficacy."},{"id":"PHARM-U5-8","ch":5,"n":8,"title":"CYP2E1, Alcohol and Paracetamol","sec":"CYP2E1 · p12","qs":["PHARM-C5-037","PHARM-C5-038","PHARM-C5-039","PHARM-C5-040"],"guide":"Chronic alcohol consumption upregulates CYP2E1, and paracetamol is metabolised by CYP2E1 far more than by CYP1A2. The induced enzyme diverts paracetamol into its toxic metabolite NAPQI, so a chronic alcoholic taking paracetamol develops hepatotoxicity at doses that would otherwise be safe."},{"id":"PHARM-U5-9","ch":5,"n":9,"title":"CYP3A4: The Commonest Isoform","sec":"CYP3A4 · p12","qs":["PHARM-C5-041","PHARM-C5-042","PHARM-C5-043"],"guide":"CYP3A4 is the commonest CYP enzyme, metabolising more than 50% of all drugs - mifepristone is the example given. Putting the isoforms side by side, methyldopa belongs to CYP2B6, theophylline to CYP1A2, mifepristone to CYP3A4 and warfarin to CYP2C9."},{"id":"PHARM-U5-10","ch":5,"n":10,"title":"Glucuronidation Failure: Crigler Najjar","sec":"Glucuronidation · p13","qs":["PHARM-C5-044","PHARM-C5-045","PHARM-C5-046","PHARM-C5-047"],"guide":"Glucuronidation is the phase II reaction of concern in two drugs: atazanavir, an antiviral that causes Steven Johnson syndrome, and irinotecan, an anticancer drug that causes toxicity. Both are contraindicated in Crigler Najjar syndrome, in which glucuronidation is defective and the drugs cannot be cleared safely."},{"id":"PHARM-U5-11","ch":5,"n":11,"title":"Enterohepatic Circulation of Estrogen","sec":"Estrogen · p13","qs":["PHARM-C5-048","PHARM-C5-049","PHARM-C5-050","PHARM-C5-051","PHARM-C5-052","PHARM-C5-053","PHARM-C5-054"],"guide":"Estrogen is handled in the liver by phase I CYP3A4 then phase II glucuronidation, yielding the water-soluble estrogen-glucuronic acid. Gut bacterial glucuronidase liberates lipid-soluble estrogen that is reabsorbed - enterohepatic circulation, which extends the normal half-life. Antibiotics kill those bacteria, so enterohepatic circulation and T1/2 fall and the oral contraceptive fails."},{"id":"PHARM-U5-12","ch":5,"n":12,"title":"HIPS Dance: Acetylation and Drug-Induced SLE","sec":"Acetylation · p13","qs":["PHARM-C5-055","PHARM-C5-056","PHARM-C5-057","PHARM-C5-058"],"guide":"Acetylation is a non-microsomal phase II reaction, and the drugs that undergo it are recalled by HIPS Dance: Hydralazine, Isoniazid, Procainamide, Sulfonamide and Dapsone. All five can produce drug-induced systemic lupus erythematosus - so arthralgia, fever and a positive ANA in a patient on isoniazid should raise that possibility."},{"id":"PHARM-U5-13","ch":5,"n":13,"title":"Induction vs Inhibition: The Core Effect","sec":"Drug Interactions · p14","qs":["PHARM-C5-059","PHARM-C5-060","PHARM-C5-061","PHARM-C5-062"],"guide":"Microsomal enzyme induction raises enzyme amount and metabolism, lowers plasma concentration and causes drug failure; enzyme inhibition does the reverse - less metabolism, higher plasma concentration and drug toxicity. Every interaction in this table is read off that single axis."},{"id":"PHARM-U5-14","ch":5,"n":14,"title":"The Inducer List","sec":"Enzyme inducers · p14","qs":["PHARM-C5-063","PHARM-C5-064","PHARM-C5-065","PHARM-C5-066"],"guide":"Enzyme inducers are griseofulvin, rifampicin, chronic alcohol, benzopyrene (cigarette smoke), phenobarbital, carbamazepine and St. John's wort - the plant used to treat depression. Recognizing them matters because they silently produce therapeutic failure of co-prescribed drugs."},{"id":"PHARM-U5-15","ch":5,"n":15,"title":"The Inhibitor List and Alcohol's Two Faces","sec":"Enzyme inhibitors · p14","qs":["PHARM-C5-067","PHARM-C5-068","PHARM-C5-069","PHARM-C5-070","PHARM-C5-071"],"guide":"Enzyme inhibitors include acute alcohol consumption, quinidine, isoniazid, cimetidine, ciprofloxacin, ketoconazole, valproate, erythromycin/clarithromycin, grapefruit juice and diethylcarbamazine. Alcohol is unique in appearing on both sides: acute intake inhibits while chronic intake induces."},{"id":"PHARM-U5-16","ch":5,"n":16,"title":"Clinical Payoff: OCP Failure, Theophylline and Statins","sec":"Clinical Significance · p14","qs":["PHARM-C5-072","PHARM-C5-073","PHARM-C5-074","PHARM-C5-075","PHARM-C5-076","PHARM-C5-077","PHARM-C5-078","PHARM-C5-079","PHARM-C5-080"],"guide":"The clinical payoff of this table is memorised as four vignettes: rifampicin induces enzymes and causes OCP failure - manage by switching to an IUD or condoms, avoiding inducers, or raising the dose of drugs such as phenytoin and retigabine; erythromycin causes theophylline toxicity with ventricular arrhythmia and fibrillation; clarithromycin causes statin toxicity; and alcohol's effect depends on whether intake is acute or chronic."},{"id":"PHARM-U6-1","ch":6,"n":1,"title":"The Rules of Excretion","sec":"Excretion · p15","qs":["PHARM-C6-001","PHARM-C6-002"],"guide":"A drug can only leave the body when it is ionised, water soluble and polar - the mirror image of the rules for absorption. The kidney is the commonest organ of excretion and the liver the commonest organ of metabolism."},{"id":"PHARM-U6-2","ch":6,"n":2,"title":"Filtration vs Tubular Secretion","sec":"Renal excretion · p15","qs":["PHARM-C6-003","PHARM-C6-004","PHARM-C6-005","PHARM-C6-006","PHARM-C6-007","PHARM-C6-008","PHARM-C6-009"],"guide":"Renal excretion splits into filtration (20%) and tubular secretion (80%). Filtration only handles unbound drug and fails for protein-bound drug because the negatively charged basement membrane repels it - such drug is instead cleared by tubular secretion. Minor routes include saliva and sweat, and because filtration depends on GFR it proceeds at a constant rate."},{"id":"PHARM-U6-3","ch":6,"n":3,"title":"Rate of Drug Elimination and Clearance","sec":"Rate of drug elimination · p15","qs":["PHARM-C6-010","PHARM-C6-011","PHARM-C6-012","PHARM-C6-013","PHARM-C6-014","PHARM-C6-015"],"guide":"RDE is the amount of drug eliminated per hour and equals plasma concentration x clearance, in units mg/hr = mg/ml x ml/hr. Plasma concentration is the drug per ml of plasma, while clearance is the volume of plasma cleared of drug each hour. Dosing is achieved either by continuous IV infusion or intermittent dosing."},{"id":"PHARM-U6-4","ch":6,"n":4,"title":"The Three Phases of an Infusion Curve","sec":"Continuous IV infusion · p16","qs":["PHARM-C6-016","PHARM-C6-017","PHARM-C6-018"],"guide":"An infusion curve has three phases: phase I, the slowly rising state in which absorption exceeds excretion; phase II, the steady state in which infusion rate exactly equals the rate of drug elimination; and phase III, the declining state of elimination in which excretion exceeds absorption."},{"id":"PHARM-U6-5","ch":6,"n":5,"title":"Infusion Rate, Steady State and 4-5 Half-Lives","sec":"Continuous IV infusion · p16","qs":["PHARM-C6-019","PHARM-C6-020","PHARM-C6-021","PHARM-C6-022"],"guide":"Infusion rate (the dosing rate) equals plasma concentration x clearance, which rearranges so that steady state concentration falls when clearance rises. Steady state takes 4-5 half-lives to be attained, and the book adds that it depends on the volume of distribution."},{"id":"PHARM-U6-6","ch":6,"n":6,"title":"Maintenance Dose and Its Formula","sec":"Intermittent dosing · p16","qs":["PHARM-C6-023","PHARM-C6-024","PHARM-C6-025","PHARM-C6-026","PHARM-C6-027"],"guide":"Intermittent dosing is the maintenance dose: it is repeated at fixed intervals to hold the plasma concentration in steady state and depends on clearance, being calculated as PC x CL x Time/f. Here f is bioavailability and equals 1 for intravenous routes."},{"id":"PHARM-U6-7","ch":6,"n":7,"title":"Half Life and the Elimination Constant","sec":"Half life (T1/2) · p16","qs":["PHARM-C6-028","PHARM-C6-029","PHARM-C6-030","PHARM-C6-031","PHARM-C6-032"],"guide":"Half life is the time for plasma drug to fall by 50% and is calculated as 0.693 x vd/CL, so it is proportional to volume of distribution and inversely related to clearance - a bigger vd with the same clearance means a longer half-life. The elimination constant Kel is the reciprocal idea, CL/vd."},{"id":"PHARM-U6-8","ch":6,"n":8,"title":"Zero vs First Order: Reading the Table","sec":"Kinetics of drug elimination · p17","qs":["PHARM-C6-033","PHARM-C6-034","PHARM-C6-035","PHARM-C6-036","PHARM-C6-037","PHARM-C6-038","PHARM-C6-039","PHARM-C6-040"],"guide":"Zero order elimination removes a constant amount per hour and first order a constant proportion per hour, expressed as n = 0 and n = 1 in RDE = (PC)^n x CL. Doubling the dose in zero order lengthens the half-life and raises plasma concentration disproportionately - hence toxicity - while first order kinetics stay proportionate. Zero order reflects early saturation of elimination and first order late saturation; zero order drugs behave as first order at low doses (pseudozero order), and first order drugs become zero order once saturated at high doses."},{"id":"PHARM-U6-9","ch":6,"n":9,"title":"Zero-Order Drugs: Examples and Danger","sec":"Examples · p17","qs":["PHARM-C6-041","PHARM-C6-042","PHARM-C6-043","PHARM-C6-044","PHARM-C6-045"],"guide":"The zero order list is alcohol (true zero order), theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin, while most other drugs are first order. The danger is clinical: a small increment of phenytoin can push a saturated enzyme system and cause a disproportionate rise in plasma level with toxicity."},{"id":"PHARM-U7-1","ch":7,"n":1,"title":"Affinity, Efficacy and Potency","sec":"Affinity, Efficacy and Potency · p18","qs":["PHARM-C7-001","PHARM-C7-002","PHARM-C7-003","PHARM-C7-004","PHARM-C7-005","PHARM-C7-006"],"guide":"A drug's tendency to bind its target is affinity; the maximum effect it produces is efficacy, and efficacy is the clinically most important property because it fixes the ceiling of benefit. Potency is a different matter - the relative dose needed for a given effect, so the lesser the dose, the greater the potency. A graded (quantified) response, such as a change in BP, HR or blood glucose, is studied in an individual."},{"id":"PHARM-U7-2","ch":7,"n":2,"title":"Quantal DRC: ED50, TD50 and LD50","sec":"Quantal DRC · p18","qs":["PHARM-C7-007","PHARM-C7-008","PHARM-C7-009","PHARM-C7-010","PHARM-C7-011","PHARM-C7-012","PHARM-C7-013","PHARM-C7-014","PHARM-C7-015","PHARM-C7-016","PHARM-C7-017"],"guide":"The quantal DRC records a binary, all-or-none response (sedation, fertility) in a population, plotting the percentage of responders against log dose. ED50 is the dose at which half the population gets a therapeutic effect and marks potency, while TD50 (toxic) and LD50 (lethal, in animals) mark toxicity; on the graph the therapeutic curve sits leftmost and the lethal curve furthest right."},{"id":"PHARM-U7-3","ch":7,"n":3,"title":"Therapeutic Index and Therapeutic Window","sec":"Therapeutic Index · p18","qs":["PHARM-C7-018","PHARM-C7-019","PHARM-C7-020","PHARM-C7-021","PHARM-C7-022","PHARM-C7-023","PHARM-C7-024","PHARM-C7-025","PHARM-C7-026","PHARM-C7-027","PHARM-C7-028","PHARM-C7-029"],"guide":"The therapeutic index measures safety: TD50/ED50 in humans and LD50/ED50 in animals. A low index, as with lithium, means safety only within a narrow dosage range and a high chance of toxicity, whereas a high index allows a wide range. The therapeutic window is the corridor between the minimum effective concentration (0.6 meq/L for lithium) and the minimum toxic concentration (1.5 meq/L) - below it there is no effect and above it toxicity."},{"id":"PHARM-U7-4","ch":7,"n":4,"title":"Graded DRC: Height, Position and Parallel Lines","sec":"Graded DRC · p19","qs":["PHARM-C7-030","PHARM-C7-031","PHARM-C7-032","PHARM-C7-033","PHARM-C7-034","PHARM-C7-035","PHARM-C7-036","PHARM-C7-037","PHARM-C7-038","PHARM-C7-039","PHARM-C7-040","PHARM-C7-041","PHARM-C7-042","PHARM-C7-043"],"guide":"On the graded DRC (response versus log dose in an individual) efficacy is read from the height of the curve and potency from its position - more to the left means more potent. In the figure, efficacy runs B > A > C and potency PA > PB > PC, so drug A is the most potent yet B the most efficacious. Affinity is comparable only between drugs of the same MOA and only between parallel lines, which is why C is excluded and the order is A > B."},{"id":"PHARM-U7-5","ch":7,"n":5,"title":"Full, Partial, Antagonist, Inverse: The Table","sec":"Drug Receptor Interactions · p19","qs":["PHARM-C7-044","PHARM-C7-045","PHARM-C7-046","PHARM-C7-047","PHARM-C7-048","PHARM-C7-049","PHARM-C7-050","PHARM-C7-051","PHARM-C7-052","PHARM-C7-053","PHARM-C7-054","PHARM-C7-055","PHARM-C7-056","PHARM-C7-057"],"guide":"The interaction table grades four behaviours: a full agonist gives a maximum effect (+1 intrinsic efficacy), a partial agonist a submaximal effect (between 1 and 0), an antagonist no effect (0) and an inverse agonist an effect opposite to the receptor's nature (-1). Against endogenous full agonists these translate into mild, moderate and severe antagonism respectively. On the figure, A rises to maximal, B plateaus submaximally, C stays flat and D dips below the no-effect line."},{"id":"PHARM-U7-6","ch":7,"n":6,"title":"Clinical Reading of Agonists and Antagonists","sec":"Drug Receptor Interactions · p19","qs":["PHARM-C7-058","PHARM-C7-059","PHARM-C7-060"],"guide":"The single most useful clinical fact from this table is its footnote: antagonists are the most commonly used drugs, even though they exert no effect of their own. Adding a partial agonist to a patient already on a full agonist yields only mild antagonism, because a partial agonist can never match a full agonist's maximal response."}];

function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_xp')||0;}, set xp(v){store('pulse_xp',v);},
  get done(){return store('pulse_done')||[];}, set done(v){store('pulse_done',v);},
  get unlock(){return !!store('pulse_unlock');}, set unlock(v){store('pulse_unlock',v);},
  streak(){const t=store('pulse_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_streak',s);return s.n;}
};

function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';

  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}

      const s=document.createElement('div');s.className='pathsec';s.textContent=u.sec;box.appendChild(s);}

}

  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
</body>
