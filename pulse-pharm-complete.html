","page":15,"q":"Plasma proteins carry which charge?","opts":["Negative charge","Positive charge","Neutral charge","Variable charge, depending on the drug"],"ans":0,"exp":"The table specifies 'Plasma protein (negative charge) bound drug' — albumin and other plasma proteins are negatively charged. (Book p15)"},{"id":"PHARM-C6-011","sec":"Filtration vs tubular secretion","page":15,"q":"A patient with hypoalbuminaemia has more unbound drug in plasma. For a drug cleared mainly by filtration, the effect is:","opts":["Increased filtration and greater excretion of the drug","Decreased filtration and drug accumulation","No change, since filtration depends only on GFR","Increased tubular secretion only"],"ans":0,"exp":"It is the unbound fraction that is filtered (+); when plasma protein is low, more drug is unbound, so more is filtered and excreted — the basis for altered dosing in nephrotic syndrome. (Book p15)"},{"id":"PHARM-C6-012","sec":"Filtration vs tubular secretion","page":15,"q":"Filtration as a mechanism of drug excretion is dependent on:","opts":["GFR, giving a constant rate of excretion","Plasma protein binding, giving a variable rate","Tubular reabsorption, giving a zero-order rate","Hepatic blood flow, giving a first-order rate"],"ans":0,"exp":"Note: 'Filtration is dependent on GFR → Constant rate of excretion' — as long as GFR is stable, the filtered amount per unit time stays constant. (Book p15)"},{"id":"PHARM-C6-013","sec":"Filtration vs tubular secretion","page":15,"q":"A patient with chronic kidney disease has a markedly reduced GFR. Which mechanism of drug excretion is most affected?","opts":["Filtration","Tubular secretion","Biliary excretion","Salivary excretion"],"ans":0,"exp":"Filtration is dependent on GFR, so a fall in GFR directly lowers filtration-based excretion — the reason doses of renally excreted drugs must be reduced. (Book p15)"},{"id":"PHARM-C6-014","sec":"Rate of drug elimination","page":15,"q":"Rate of drug elimination (RDE) is defined as the:","opts":["Amount of drug eliminated per hour from the body","Time taken for the drug to fall by half","Fraction of the dose reaching systemic circulation","Volume of plasma cleared of drug per hour"],"ans":0,"exp":"'Amount of drug eliminated per hour from the body' — RDE is expressed in mg/hr. (Book p15)"},{"id":"PHARM-C6-015","sec":"Rate of drug elimination","page":15,"q":"RDE is calculated as:","opts":["Plasma concentration × Clearance","Clearance ÷ Plasma concentration","Volume of distribution × Clearance","Plasma concentration ÷ Volume of distribution"],"ans":0,"exp":"RDE = plasma concentration × Clearance, with the units (mg/hr) = (mg/ml) × (ml/hr). (Book p15)"},{"id":"PHARM-C6-016","sec":"Rate of drug elimination","page":15,"q":"The units of plasma concentration, clearance and RDE respectively are:","opts":["mg/ml, ml/hr and mg/hr","mg/hr, mg/ml and ml/hr","ml/hr, mg/hr and mg/ml","mg, ml and mg/hr"],"ans":0,"exp":"The book writes (mg/hr) under RDE, (mg/ml) under plasma concentration and (ml/hr) under clearance — these units are how the three quantities fit together. (Book p15)"},{"id":"PHARM-C6-017","sec":"Rate of drug elimination","page":15,"q":"Plasma concentration is defined as the:","opts":["Concentration of drug present in each ml of plasma, in mg/ml","Total amount of drug in the body in mg","Volume of plasma containing 1 mg of drug","Amount of drug bound to plasma proteins"],"ans":0,"exp":"'Plasma conc: Conc of drug present in each ml of plasma → mg/ml.' (Book p15)"},{"id":"PHARM-C6-018","sec":"Rate of drug elimination","page":15,"q":"Drug clearance is defined as the:","opts":["Amount of plasma being cleared of the drug per hour","Amount of drug eliminated per hour from the body","Volume of distribution of the drug","Rate of glomerular filtration"],"ans":0,"exp":"'Drug clearance: Amount of plasma being cleared of the drugs per hour' — clearance is a volume per unit time, not an amount of drug. (Book p15)"},{"id":"PHARM-C6-019","sec":"Drug dosing modes","page":15,"q":"The two modes of drug dosing described are:","opts":["Continuous IV infusion and intermittent dosing","Oral and rectal dosing","Loading and rescue dosing","Intramuscular and subcutaneous dosing"],"ans":0,"exp":"Under DRUG DOSING the two headings are (a) continuous IV infusion and (b) intermittent dosing. (Book p15)"},{"id":"PHARM-C6-020","sec":"Drug dosing modes","page":16,"q":"Infusion rate / dosing rate is also known as the:","opts":["Loading dose","Maintenance dose","Therapeutic index","Steady state dose"],"ans":0,"exp":"'Infusion rate / dosing rate: AKA loading dose' — a continuous infusion sets up the desired plasma level, whereas the repeated dose that sustains it is the maintenance dose. (Book p16)"},{"id":"PHARM-C6-021","sec":"Concentration-time curve","page":16,"q":"In the concentration-time curve of an IV infusion, phase I represents:","opts":["Slowly rising state (infusion), where absorption > excretion","Steady state plasma concentration","Declining state (elimination)","A loading dose given as a bolus"],"ans":0,"exp":"Phase I is the slowly rising state of infusion, during which absorption exceeds excretion so plasma concentration climbs. (Book p16)"},{"id":"PHARM-C6-022","sec":"Concentration-time curve","page":16,"q":"Phase II of the concentration-time curve represents:","opts":["Steady state plasma concentration","Slowly rising concentration during infusion","Declining state after stopping infusion","Peak concentration after a bolus dose"],"ans":0,"exp":"Phase II is the flat plateau — steady state plasma concentration, where infusion rate equals the rate of drug elimination. (Book p16)"},{"id":"PHARM-C6-023","sec":"Concentration-time curve","page":16,"q":"At the plateau of the infusion curve, the relationship between infusion and elimination is:","opts":["Infusion rate = rate of drug elimination","Infusion rate > rate of drug elimination","Infusion rate < rate of drug elimination","Both rates become zero"],"ans":0,"exp":"The plateau is labelled 'Infusion rate = Rate of drug elimination' — the amount entering the body each hour equals the amount leaving, so the concentration stays steady. (Book p16)"},{"id":"PHARM-C6-024","sec":"Concentration-time curve","page":16,"q":"Phase III of the curve is the declining state because:","opts":["Excretion > Absorption","Absorption > Excretion","Absorption equals Excretion","The drug is redistributed to fat"],"ans":0,"exp":"Phase III is labelled 'Excretion > Absorption' — elimination now exceeds input, so plasma concentration falls. (Book p16)"},{"id":"PHARM-C6-025","sec":"Concentration-time curve","page":16,"q":"The infusion rate required to maintain a desired plasma concentration is calculated as:","opts":["Plasma concentration × clearance","Plasma concentration ÷ clearance","Clearance ÷ plasma concentration","Volume of distribution × plasma concentration"],"ans":0,"exp":"'Infusion rate = Plasma concentration × clearance' — the same relationship as RDE, since at steady state infusion must match elimination. (Book p16)"},{"id":"PHARM-C6-026","sec":"Concentration-time curve","page":16,"q":"How many half-lives are required to attain steady state plasma concentration?","opts":["4–5 T1/2","1–2 T1/2","10 T1/2","Half of one T1/2"],"ans":0,"exp":"'4–5 T1/2 are required to attain steady state plasma concentration' — this is why a loading dose is given when an immediate effect is needed. (Book p16)"},{"id":"PHARM-C6-027","sec":"Concentration-time curve","page":16,"q":"Continuous infusion dosing is stated to depend on:","opts":["Volume of distribution","Clearance alone","Bioavailability alone","Plasma protein binding"],"ans":0,"exp":"Under the infusion curve, the bullet 'Depends on volume of distribution' applies to the infusion/loading dose, while the maintenance dose depends on clearance. (Book p16)"},{"id":"PHARM-C6-028","sec":"Continuous IV infusion","page":16,"q":"According to the page, attainment of steady state depends on:","opts":["Volume of distribution","Bioavailability alone","The infusion volume","Protein binding"],"ans":0,"exp":"For continuous IV infusion the page states that steady state depends on volume of distribution. (Book p16)"},{"id":"PHARM-C6-029","sec":"Intermittent dosing","page":16,"q":"Intermittent dosing is also known as:","opts":["Maintenance dose","Loading dose","Infusion rate","Elimination dose"],"ans":0,"exp":"'Intermittent dosing: AKA maintenance dose' — the dose is repeated at intervals to hold the plasma concentration steady. (Book p16)"},{"id":"PHARM-C6-030","sec":"Intermittent dosing","page":16,"q":"The purpose of the intermittent (maintenance) dose is to:","opts":["Maintain plasma concentration in steady state","Achieve a rapid therapeutic concentration","Saturate plasma protein binding sites","Increase the volume of distribution"],"ans":0,"exp":"'Dose given after a certain period of time to maintain plasma concentration in steady state' — maintenance dosing sustains, rather than establishes, the level. (Book p16)"},{"id":"PHARM-C6-031","sec":"Intermittent dosing","page":16,"q":"The maintenance dose depends on:","opts":["Clearance","Volume of distribution","Half-life alone","Plasma protein binding"],"ans":0,"exp":"'Depends on Clearance' — clearance governs how much drug must be replaced per unit time, whereas volume of distribution governs the loading dose. (Book p16)"},{"id":"PHARM-C6-032","sec":"Maintenance dose formula","page":16,"q":"The maintenance dose is calculated by the formula:","opts":["PC × CL × Time ÷ f","PC × CL × Time × f","PC × vd × Time ÷ f","CL ÷ (PC × Time)"],"ans":0,"exp":"Boxed formula: maintenance dose = PC × CL × Time / f, where f is bioavailability. (Book p16)"},{"id":"PHARM-C6-033","sec":"Maintenance dose formula","page":16,"q":"In the maintenance dose formula, 'f' denotes:","opts":["Bioavailability","Elimination constant","Fraction bound to protein","Frequency of dosing"],"ans":0,"exp":"[f: Bioavailability] — the fraction of the administered dose that reaches the systemic circulation. (Book p16)"},{"id":"PHARM-C6-034","sec":"Maintenance dose formula","page":16,"q":"For intravenous routes, the value of f is:","opts":["1","0","0.5","It varies with each drug"],"ans":0,"exp":"'f = 1 in IV routes' — intravenous administration bypasses absorption barriers, so the entire dose reaches the systemic circulation. (Book p16)"},{"id":"PHARM-C6-035","sec":"Maintenance dose formula","page":16,"q":"A drug with a bioavailability of 0.5 is to be given orally instead of intravenously. To maintain the same plasma concentration, the oral dose must be:","opts":["Doubled","Halved","Unchanged","Quadrupled"],"ans":0,"exp":"Since dose = PC × CL × Time / f and f falls from 1 to 0.5, the required dose doubles — oral doses are higher than IV doses for this reason. (Book p16)"},{"id":"PHARM-C6-036","sec":"Half-life","page":16,"q":"Half-life (T1/2) is defined as the time taken by a drug to:","opts":["Decrease by 50% in plasma","Increase by 50% in plasma","Be completely eliminated from the body","Reach steady state plasma concentration"],"ans":0,"exp":"'Time taken by a drug to decrease by 50% in plasma.' (Book p16)"},{"id":"PHARM-C6-037","sec":"Half-life","page":16,"q":"Half-life is directly proportional to:","opts":["Volume of distribution and inversely proportional to clearance","Clearance and inversely proportional to volume of distribution","Both volume of distribution and clearance","Neither volume of distribution nor clearance"],"ans":0,"exp":"T1/2 ∝ volume of distribution (vd) / Clearance (Cl) — a larger distribution volume prolongs half-life; a higher clearance shortens it. (Book p16)"},{"id":"PHARM-C6-038","sec":"Half-life","page":16,"q":"The formula relating half-life to volume of distribution and clearance is:","opts":["T1/2 = 0.693 × vd / Cl","T1/2 = vd / (0.693 × Cl)","T1/2 = 0.693 × Cl / vd","T1/2 = vd × Cl / 0.693"],"ans":0,"exp":"T1/2 = 0.693 × vd/Cl — the constant 0.693 (ln 2) converts the first-order rate constant into half-life. (Book p16)"},{"id":"PHARM-C6-039","sec":"Half-life","page":16,"q":"Half-life equals 0.693 divided by:","opts":["The elimination constant (kel)","The volume of distribution","The clearance","The plasma concentration"],"ans":0,"exp":"T1/2 = 0.693 / kel — half-life and the elimination rate constant are reciprocally related. (Book p16)"},{"id":"PHARM-C6-040","sec":"Half-life","page":16,"q":"The elimination constant (kel) is equal to:","opts":["Cl / vd","vd / Cl","Cl × vd","0.693 × Cl / vd"],"ans":0,"exp":"'Elimination constant (kel) = Cl / vd' — the fraction of the distribution volume cleared per unit time. (Book p16)"},{"id":"PHARM-C6-041","sec":"Half-life","page":16,"q":"If the volume of distribution of a drug increases while clearance remains unchanged, the half-life will:","opts":["Increase","Decrease","Remain unchanged","Become zero"],"ans":0,"exp":"Since T1/2 = 0.693 × vd/Cl, a rise in vd with constant Cl lengthens the half-life — the drug is spread over a larger volume and cleared more slowly relative to its load. (Book p16)"},{"id":"PHARM-C6-042","sec":"Half-life","page":16,"q":"In a patient with renal failure, clearance of a renally excreted drug falls. The expected effect on the drug is:","opts":["Prolonged half-life, requiring dose adjustment","Shortened half-life with loss of effect","No change in half-life","Reduced volume of distribution only"],"ans":0,"exp":"Because T1/2 ∝ vd/Cl, a fall in clearance prolongs T1/2; the drug stays in the body longer, so dose or interval must be adjusted. (Book p16)"},{"id":"PHARM-C6-043","sec":"Kinetics of elimination","page":17,"q":"Zero order kinetics means elimination of a:","opts":["Constant amount of drug per hour","Constant proportion of drug per hour","Increasing amount of drug per hour","Constant proportion of the dose per half-life"],"ans":0,"exp":"Table row 'elimination of': zero order = constant amount of drug per hour; first order = constant proportion of drug per hour. (Book p17)"},{"id":"PHARM-C6-044","sec":"Kinetics of elimination","page":17,"q":"First order kinetics means elimination of a:","opts":["Constant proportion of drug per hour","Constant amount of drug per hour","Amount independent of plasma concentration","Saturating amount of drug per hour"],"ans":0,"exp":"First order: a constant proportion (fraction) of the drug present is eliminated per unit time, so the rate falls as concentration falls. (Book p17)"},{"id":"PHARM-C6-045","sec":"Kinetics of elimination","page":17,"q":"In the equation RDE = (PC)^n × Cl, the value of n for zero order kinetics is:","opts":["n = 0","n = 1","n = 2","n = 0.5"],"ans":0,"exp":"For zero order kinetics the table gives n = 0, so RDE becomes independent of plasma concentration (PC^0 = 1). (Book p17)"},{"id":"PHARM-C6-046","sec":"Kinetics of elimination","page":17,"q":"In the equation RDE = (PC)^n × Cl, the value of n for first order kinetics is:","opts":["n = 1","n = 0","n = 2","n = −1"],"ans":0,"exp":"For first order kinetics n = 1, so RDE ∝ PC — the rate of elimination is directly proportional to the plasma concentration. (Book p17)"},{"id":"PHARM-C6-047","sec":"Kinetics of elimination","page":17,"q":"When the dose is constant (Cl constant), zero order kinetics gives:","opts":["RDE = constant","RDE ∝ PC","RDE ∝ PC²","RDE = zero"],"ans":0,"exp":"With constant dose and clearance: zero order → RDE = constant, because a fixed amount is eliminated per hour irrespective of concentration. (Book p17)"},{"id":"PHARM-C6-048","sec":"Kinetics of elimination","page":17,"q":"When the dose is constant (Cl constant), first order kinetics gives:","opts":["RDE ∝ PC","RDE = constant","RDE ∝ 1/PC","RDE is independent of PC"],"ans":0,"exp":"For first order kinetics RDE ∝ PC — elimination rate changes with concentration, unlike zero order where RDE stays constant. (Book p17)"},{"id":"PHARM-C6-049","sec":"Clinical kinetics","page":17,"q":"Which statement comparing zero order and first order kinetics is correct?","opts":["Zero order eliminates a constant amount per hour; first order a constant proportion per hour","Zero order eliminates a constant proportion per hour; first order a constant amount per hour","Both eliminate a constant proportion per hour","Both eliminate a constant amount per hour"],"ans":0,"exp":"The first row of the table contrasts exactly this: zero order = constant amount per hour; first order = constant proportion per hour. (Book p17)"},{"id":"PHARM-C6-050","sec":"Effect of increasing dose","page":17,"q":"If the dose is increased, the half-life in zero order kinetics:","opts":["Increases","Remains constant","Decreases","Becomes zero"],"ans":0,"exp":"In the zero order column of the 'if dose increases' row, T1/2 shows an upward arrow — with a fixed amount eliminated per hour, a bigger dose takes longer to fall by half. (Book p17)"},{"id":"PHARM-C6-051","sec":"Effect of increasing dose","page":17,"q":"If the dose is increased, the half-life in first order kinetics:","opts":["Remains constant","Increases","Decreases","Doubles"],"ans":0,"exp":"In first order kinetics T1/2 is constant — half-life does not change with dose or concentration, which is why it is a characteristic value for the drug. (Book p17)"},{"id":"PHARM-C6-052","sec":"Effect of increasing dose","page":17,"q":"If the dose is increased, clearance in zero order kinetics:","opts":["Decreases","Remains constant","Increases proportionately","Increases disproportionately"],"ans":0,"exp":"The zero order column of the 'if dose increases' row shows CL with a downward arrow — because the eliminating system is saturated, clearance falls as the dose rises. (Book p17)"},{"id":"PHARM-C6-053","sec":"Effect of increasing dose","page":17,"q":"If the dose is increased, clearance in first order kinetics:","opts":["Remains constant","Decreases","Increases","Becomes zero"],"ans":0,"exp":"In first order kinetics CL is constant; clearance is a fixed volume of plasma cleared per hour regardless of dose. (Book p17)"},{"id":"PHARM-C6-054","sec":"Effect of increasing dose","page":17,"q":"With increasing dose, the rise in plasma concentration in zero order kinetics is:","opts":["Disproportionate, with risk of toxicity","Proportionate to the dose","Less than proportionate to the dose","Unrelated to the dose"],"ans":0,"exp":"Zero order: ↑ in PC is disproportionate (risk of toxicity) — because clearance falls with dose, a small dose increment can cause a large, dangerous rise in plasma level. (Book p17)"},{"id":"PHARM-C6-055","sec":"Effect of increasing dose","page":17,"q":"With increasing dose, the rise in plasma concentration in first order kinetics is:","opts":["Proportionate","Disproportionate with risk of toxicity","Independent of the dose","Exponential"],"ans":0,"exp":"First order: ↑ in PC is proportionate — doubling the dose doubles the plasma concentration, so toxicity risk is predictable. (Book p17)"},{"id":"PHARM-C6-056","sec":"Clinical kinetics","page":17,"q":"In first order kinetics, if the dose is doubled the plasma concentration roughly:","opts":["Doubles, in proportion to the dose","Increases disproportionately, risking toxicity","Remains the same","Falls by half"],"ans":0,"exp":"First order gives a proportionate rise in PC with dose; the disproportionate, toxicity-prone rise belongs to zero order drugs. (Book p17)"},{"id":"PHARM-C6-057","sec":"Kinetics of elimination","page":17,"q":"Which variable is CONSTANT with increasing dose in first order but CHANGES (↑ T1/2, ↓ CL) in zero order kinetics?","opts":["Both half-life and clearance","Only the rate of drug elimination","Only the plasma concentration","Volume of distribution"],"ans":0,"exp":"In the 'if dose increases' row, first order keeps T1/2 and CL constant, whereas zero order shows T1/2 rising and clearance falling with dose. (Book p17)"},{"id":"PHARM-C6-058","sec":"Saturation of elimination","page":17,"q":"Zero order kinetics is seen in drugs with:","opts":["Early saturation of elimination","Late saturation of elimination","No saturation of elimination","Renal excretion only"],"ans":0,"exp":"Table row 'seen in drugs with': zero order — early saturation of elimination; the eliminating enzymes/transporters are overwhelmed even at ordinary doses. (Book p17)"},{"id":"PHARM-C6-059","sec":"Saturation of elimination","page":17,"q":"First order kinetics is seen in drugs with:","opts":["Late saturation of elimination","Early saturation of elimination","Saturation at all doses","Zero clearance"],"ans":0,"exp":"First order kinetics is seen in drugs with late saturation of elimination — the eliminating systems have ample capacity at usual doses. (Book p17)"},{"id":"PHARM-C6-060","sec":"Saturation of elimination","page":17,"q":"For a drug following zero order kinetics, the 'exception to the rule' occurs at:","opts":["Lower doses, where it follows first order kinetics until saturation — hence a.k.a. pseudozero order","Higher doses, where it follows first order kinetics after saturation","Lower doses, where it becomes truly zero order","All doses equally, as no exception exists"],"ans":0,"exp":"Zero order column, exception row: at lower doses these drugs follow first order kinetics until saturation, and are hence also called pseudozero order. (Book p17)"},{"id":"PHARM-C6-061","sec":"Saturation of elimination","page":17,"q":"For a drug following first order kinetics, the 'exception to the rule' occurs at:","opts":["Higher doses, where it follows zero order after saturation","Lower doses, where it follows zero order before saturation","Higher doses, where it becomes pseudozero order before saturation","No dose, since first order never changes"],"ans":0,"exp":"First order column, exception row: at higher doses it follows zero order after saturation — once the enzymes saturate, elimination becomes a fixed amount per hour. (Book p17)"},{"id":"PHARM-C6-062","sec":"Saturation of elimination","page":17,"q":"'Pseudozero order' is the term applied to drugs that:","opts":["Follow first order kinetics at lower doses until saturation","Follow zero order kinetics at all doses","Never reach saturation","Are excreted unchanged by the kidney"],"ans":0,"exp":"Zero order column: at lower doses they follow first order kinetics until saturation — hence aka pseudozero order; true zero order over the whole dose range is rare. (Book p17)"},{"id":"PHARM-C6-063","sec":"Clinical kinetics","page":17,"q":"Elimination kinetics of a drug whose eliminating system is saturated even at therapeutic doses is best described as:","opts":["Zero order, because a constant amount is eliminated per hour","First order, because a constant proportion is eliminated per hour","Zero order only after a further rise in dose","Independent of dose and concentration"],"ans":0,"exp":"Early saturation of elimination produces zero order kinetics — a constant amount per hour — with a disproportionate rise in plasma concentration as the dose increases. (Book p17)"},{"id":"PHARM-C6-064","sec":"Zero order drugs","page":17,"q":"Which drug is specified as following TRUE zero order kinetics?","opts":["Alcohol","Phenytoin","Warfarin","Heparin"],"ans":0,"exp":"The zero order example list writes 'Alcohol (true zero order)' — alcohol is eliminated at a fixed amount per hour at all relevant doses. (Book p17)"},{"id":"PHARM-C6-065","sec":"Zero order drugs","page":17,"q":"Which of the following sets are examples of zero order kinetics?","opts":["Alcohol, theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin","Paracetamol, digoxin, ramipril and loperamide","Most drugs used in clinical practice","Only alcohol and methanol"],"ans":0,"exp":"Zero order examples: alcohol (true zero order), theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin. (Book p17)"},{"id":"PHARM-C6-066","sec":"First order drugs","page":17,"q":"The examples given for first order kinetics are:","opts":["Most drugs","Alcohol, phenytoin and heparin","Theophylline and tolbutamide only","Warfarin and methanol only"],"ans":0,"exp":"First order column, examples row: 'most drugs' — the great majority of drugs are eliminated by first order kinetics. (Book p17)"},{"id":"PHARM-C6-067","sec":"Clinical kinetics","page":17,"q":"A patient on phenytoin has the dose increased and develops nystagmus and ataxia. The likely explanation is:","opts":["Zero order kinetics giving a disproportionate rise in plasma concentration","First order kinetics with a proportionate rise in concentration","Reduced bioavailability of phenytoin","Induction of phenytoin metabolism"],"ans":0,"exp":"Phenytoin is listed among zero order drugs; here an increase in dose raises PC disproportionately (risk of toxicity) — the classic reason phenytoin needs careful, small dose increments. (Book p17)"},{"id":"PHARM-C6-068","sec":"Clinical kinetics","page":17,"q":"In a patient with a very high blood alcohol level, the rate of fall of alcohol concentration is:","opts":["Constant per hour, regardless of concentration","Proportional to the concentration","Faster at higher concentrations","Zero until the liver is saturated"],"ans":0,"exp":"Alcohol follows true zero order kinetics — a constant amount is eliminated per hour, so concentration falls linearly rather than exponentially. (Book p17)"},{"id":"PHARM-C6-069","sec":"Kinetics of elimination","page":17,"q":"The zero order examples theophylline, tolbutamide, phenytoin, heparin, methanol and warfarin are grouped because their elimination shows:","opts":["Early saturation of elimination","Late saturation of elimination","No saturation of elimination","Renal tubular secretion only"],"ans":0,"exp":"The table lists these drugs under zero order kinetics, which is seen in drugs with early saturation of elimination. (Book p17)"},{"id":"PHARM-C7-001","sec":"Affinity, Efficacy and Potency","page":18,"q":"Affinity of a drug refers to its:","opts":["Tendency to bind to the target","Maximum effect produced at the target","Relative dose required for a given effect","Duration of action at the receptor"],"ans":0,"exp":"In the flowchart, 'drug binds to target' corresponds to tendency to bind = affinity. (Book p18)"},{"id":"PHARM-C7-002","sec":"Affinity, Efficacy and Potency","page":18,"q":"Efficacy of a drug is defined as the:","opts":["Maximum effect produced","Tendency of the drug to bind its target","Relative dose needed to produce an effect","Safety of the drug in a population"],"ans":0,"exp":"The flowchart links 'produces effect' to the maximum effect produced, i.e. efficacy - which the book marks as clinically most important. (Book p18)"},{"id":"PHARM-C7-003","sec":"Affinity, Efficacy and Potency","page":18,"q":"Of affinity, efficacy and potency, which is described as clinically most important?","opts":["Efficacy","Affinity","Potency","All three are equally important"],"ans":0,"exp":"The page marks efficacy with the note 'clinically most important', because it decides the maximum benefit a drug can give. (Book p18)"},{"id":"PHARM-C7-004","sec":"Affinity, Efficacy and Potency","page":18,"q":"Potency of a drug refers to the:","opts":["Relative dose of a drug required to produce a particular effect","Maximum effect the drug can produce","Tendency to bind to its receptor","Therapeutic index of the drug"],"ans":0,"exp":"Potency = relative dose of a drug required to produce a particular effect. (Book p18)"},{"id":"PHARM-C7-005","sec":"Affinity, Efficacy and Potency","page":18,"q":"A drug that produces the same effect at a LOWER dose is said to have:","opts":["Higher potency","Higher efficacy","Higher affinity but lower potency","A higher therapeutic index"],"ans":0,"exp":"The lesser the dose needed to bring about the effect, the greater the potency - potency and dose requirement are inversely related. (Book p18)"},{"id":"PHARM-C7-006","sec":"Affinity, Efficacy and Potency","page":18,"q":"Which statement about potency and efficacy is correct?","opts":["Potency is a matter of dose, efficacy is a matter of the maximum response attainable","Potency is the maximum response and efficacy is the dose required","Both describe the same property of a drug","Both are independent of dose and response"],"ans":0,"exp":"Potency concerns the dose needed for a given effect, while efficacy is the maximum effect produced - two separate properties. (Book p18)"},{"id":"PHARM-C7-007","sec":"Quantal DRC","page":18,"q":"A quantal dose response curve records a response which is:","opts":["Binary (present/absent)","Graded and quantified","Continuous with dose","Inversely related to dose"],"ans":0,"exp":"Quantal DRC: response is binary (present/absent), e.g. sedatives and fertility drugs, and is studied in a population. (Book p18)"},{"id":"PHARM-C7-008","sec":"Quantal DRC","page":18,"q":"Which drugs are given as examples for a quantal response?","opts":["Sedatives and fertility drugs","Drugs modifying blood pressure and heart rate","Drugs lowering blood glucose","Diuretics and antihypertensives"],"ans":0,"exp":"The examples given under quantal DRC are sedatives and fertility drugs, where the effect either occurs or does not. (Book p18)"},{"id":"PHARM-C7-009","sec":"Quantal DRC","page":18,"q":"The quantal dose response curve is studied in:","opts":["A population","An individual","An isolated tissue only","A single receptor preparation"],"ans":0,"exp":"The quantal DRC is studied in a population, in contrast to the graded DRC which is studied in an individual. (Book p18)"},{"id":"PHARM-C7-010","sec":"Quantal DRC","page":18,"q":"ED50 is the dose at which 50% of the population experiences:","opts":["Therapeutic effects","Toxic effects","Lethal effects","No effect at all"],"ans":0,"exp":"ED50 is the dose at which 50% of the population experiences therapeutic effects. (Book p18)"},{"id":"PHARM-C7-011","sec":"Quantal DRC","page":18,"q":"TD50 is the dose at which 50% of the population experiences:","opts":["Toxic effects","Therapeutic effects","Lethal effects on animals","Submaximal effects"],"ans":0,"exp":"TD50 is the dose at which 50% of the population experiences toxic effects. (Book p18)"},{"id":"PHARM-C7-012","sec":"Quantal DRC","page":18,"q":"LD50 is the dose at which 50% experience:","opts":["Lethal effects on animals","Toxic effects in humans","Therapeutic effects","Receptor blockade"],"ans":0,"exp":"LD50 is the dose at which 50% of animals experience lethal effects. (Book p18)"},{"id":"PHARM-C7-013","sec":"Quantal DRC","page":18,"q":"In the quantal DRC table, ED50 is used as a marker of:","opts":["Potency","Toxicity","Efficacy","Affinity"],"ans":0,"exp":"The table marks ED50 as the marker of potency; TD50 and LD50 are markers of toxicity. (Book p18)"},{"id":"PHARM-C7-014","sec":"Quantal DRC","page":18,"q":"Which parameters are used as markers of toxicity in the quantal DRC?","opts":["TD50 and LD50","ED50 and TD50","ED50 only","LD50 only, since TD50 is not used"],"ans":0,"exp":"The marker column shows potency opposite ED50 and toxicity opposite both TD50 and LD50. (Book p18)"},{"id":"PHARM-C7-015","sec":"Quantal DRC","page":18,"q":"On the quantal dose response graph, response in % of population is plotted against:","opts":["Log dose","Plasma concentration","Time","Receptor occupancy"],"ans":0,"exp":"The graph plots response in % population on the y-axis against log dose on the x-axis, with therapeutic, toxic and lethal curves and the ED50, TD50 and LD50 marked at the 50% line. (Book p18)"},{"id":"PHARM-C7-016","sec":"Quantal DRC","page":18,"q":"On the quantal graph, the curve lying to the LEFT is that of:","opts":["Therapeutic effects","Toxicity","Lethal effects","Inverse agonist effect"],"ans":0,"exp":"The therapeutic effects curve is leftmost since lower doses produce benefit, with toxicity and then lethal effects appearing further to the right. (Book p18)"},{"id":"PHARM-C7-017","sec":"Quantal DRC","page":18,"q":"The lethal effects curve on the quantal graph is:","opts":["Furthest to the right, because animals die only at the highest doses","Leftmost, because death occurs at low doses","Identical to the therapeutic curve","Absent, because lethality is not studied"],"ans":0,"exp":"With log dose on the x-axis, lethal effects (in animals) appear furthest right, after the toxic effects curve. (Book p18)"},{"id":"PHARM-C7-018","sec":"Therapeutic Index","page":18,"q":"Therapeutic index (TI) is a measurement of:","opts":["The safety of a drug","The potency of a drug","The efficacy of a drug","The affinity of a drug"],"ans":0,"exp":"The page describes TI as measurement of the safety of a drug. (Book p18)"},{"id":"PHARM-C7-019","sec":"Therapeutic Index","page":18,"q":"In HUMANS the therapeutic index is calculated as:","opts":["TD50/ED50","LD50/ED50","ED50/TD50","TD50 x ED50"],"ans":0,"exp":"The book gives humans: TD50/ED50 and animals: LD50/ED50 for the therapeutic index. (Book p18)"},{"id":"PHARM-C7-020","sec":"Therapeutic Index","page":18,"q":"In ANIMALS the therapeutic index is calculated as:","opts":["LD50/ED50","TD50/ED50","ED50/LD50","LD50 x ED50"],"ans":0,"exp":"For animals the therapeutic index is LD50/ED50, whereas in humans it is TD50/ED50. (Book p18)"},{"id":"PHARM-C7-021","sec":"Therapeutic Index","page":18,"q":"A drug with a LOW therapeutic index:","opts":["Is safe only in a narrow dosage range and has an increased chance of toxicity","Is safe over a wide dosage range","Has high efficacy but low potency","Cannot produce toxicity at any dose"],"ans":0,"exp":"Low TI means the drug is safe only in a narrow dosage range, with an increased chance of toxicity - lithium is the example given. (Book p18)"},{"id":"PHARM-C7-022","sec":"Therapeutic Index","page":18,"q":"A drug with a HIGH therapeutic index is:","opts":["Safe in a wide dosage range","Safe only in a narrow dosage range","Associated with frequent toxicity","Shown by lithium"],"ans":0,"exp":"High TI means the drug is safe in a wide dosage range; low TI (lithium) means safety only in a narrow range. (Book p18)"},{"id":"PHARM-C7-023","sec":"Therapeutic Index","page":18,"q":"Which drug is quoted as the example of a low therapeutic index?","opts":["Lithium","Paracetamol","Penicillin","Atenolol"],"ans":0,"exp":"Lithium is the example given for a low TI, which is why its plasma levels must be monitored. (Book p18)"},{"id":"PHARM-C7-024","sec":"Therapeutic window","page":18,"q":"In the lithium concentration-time curve, the therapeutic window lies between:","opts":["0.6 meq/L and 1.5 meq/L","0.6 meq/L and 3.0 meq/L","1.5 meq/L and 3.0 meq/L","0.1 meq/L and 0.6 meq/L"],"ans":0,"exp":"The figure marks lithium's therapeutic window from 0.6 meq/L (minimum effective concentration) up to 1.5 meq/L (minimum toxic concentration). (Book p18)"},{"id":"PHARM-C7-025","sec":"Therapeutic window","page":18,"q":"The lower boundary of the therapeutic window is the:","opts":["Minimum effective concentration","Minimum toxic concentration","Maximum effective concentration","Steady state concentration"],"ans":0,"exp":"The lower dashed line is the minimum effective concentration - below it there is no effect. (Book p18)"},{"id":"PHARM-C7-026","sec":"Therapeutic window","page":18,"q":"The upper boundary of the therapeutic window is the:","opts":["Minimum toxic concentration","Minimum effective concentration","Maximum safe dose","Peak plasma concentration"],"ans":0,"exp":"The upper dashed line is the minimum toxic concentration; above it, toxicity occurs. (Book p18)"},{"id":"PHARM-C7-027","sec":"Therapeutic window","page":18,"q":"In the therapeutic window figure, the zone below the minimum effective concentration of lithium is labelled:","opts":["No effect","Toxicity","Therapeutic window","Steady state"],"ans":0,"exp":"The grey zone below 0.6 meq/L is labelled 'no effect', the green zone is the therapeutic window and the red zone above 1.5 meq/L is toxicity. (Book p18)"},{"id":"PHARM-C7-028","sec":"Therapeutic window","page":18,"q":"What is the plasma concentration range of lithium that is toxic?","opts":["Above 1.5 meq/L","Below 0.6 meq/L","Between 0.6 and 1.5 meq/L","Above 0.6 meq/L"],"ans":0,"exp":"Plasma lithium above the minimum toxic concentration of 1.5 meq/L lies in the toxicity band of the figure. (Book p18)"},{"id":"PHARM-C7-029","sec":"Therapeutic window","page":18,"q":"The therapeutic window is best defined as the:","opts":["Range of plasma concentration between the minimum effective and minimum toxic concentrations","Ratio of TD50 to ED50","Dose at which 50% of a population responds","Range of doses with no effect"],"ans":0,"exp":"The figure shows the therapeutic window as the band of plasma concentration between the minimum effective concentration and the minimum toxic concentration. (Book p18)"},{"id":"PHARM-C7-030","sec":"Graded DRC","page":19,"q":"A graded (quantified) response is seen with drugs modifying:","opts":["Blood pressure, heart rate and blood glucose levels","Sedation in a population","Fertility in a population","Lethality in animals"],"ans":0,"exp":"Graded response = quantified response, e.g. drugs modifying BP, HR and blood glucose levels, and it is studied in an individual. (Book p19)"},{"id":"PHARM-C7-031","sec":"Graded DRC","page":19,"q":"The graded dose response curve is studied in:","opts":["An individual","A population","An isolated receptor only","Animals only"],"ans":0,"exp":"The graded DRC is studied in an individual, whereas the quantal DRC is studied in a population. (Book p19)"},{"id":"PHARM-C7-032","sec":"Graded DRC","page":19,"q":"On the graded DRC, the response is plotted on the y-axis and ______ on the x-axis.","opts":["Log dose","Log time","Percentage of population","Plasma clearance"],"ans":0,"exp":"The graded DRC graph plots response (0-100) against log dose, with the three sigmoid curves of drugs A, B and C. (Book p19)"},{"id":"PHARM-C7-033","sec":"Graded DRC","page":19,"q":"In the graded DRC table, efficacy is described as:","opts":["Determined by response, the more the height the greater the efficacy","Determined by the dose, the further left the greater the efficacy","Comparable only between parallel lines","More to the right meaning greater potency"],"ans":0,"exp":"Efficacy is read off the height of the curve: more the height, greater the efficacy, giving the comparative order B > A > C. (Book p19)"},{"id":"PHARM-C7-034","sec":"Graded DRC","page":19,"q":"According to the graded DRC table, the comparative order of efficacy is:","opts":["B > A > C","A > B > C","PA > PB > PC","C > A > B"],"ans":0,"exp":"The table's comparative column for efficacy reads B > A > C, following the heights of the three curves. (Book p19)"},{"id":"PHARM-C7-035","sec":"Graded DRC","page":19,"q":"In the graded DRC table, potency is determined by:","opts":["A lesser dose producing the same effect - the more to the left, the greater the potency","The maximum height of the curve","The slope of the curve","Comparison between non-parallel lines"],"ans":0,"exp":"Potency: lesser dose for the same effect means greater potency, and graphically 'more to the left = higher potency'. (Book p19)"},{"id":"PHARM-C7-036","sec":"Graded DRC","page":19,"q":"The comparative order of potency in the graded DRC table is:","opts":["PA > PB > PC","PB > PA > PC","PC > PB > PA","A > B > C"],"ans":0,"exp":"The comparative column for potency reads PA > PB > PC, i.e. drug A is the most potent because its curve lies furthest left. (Book p19)"},{"id":"PHARM-C7-037","sec":"Graded DRC","page":19,"q":"On the graded DRC, drug A is:","opts":["The most potent (leftmost) but not the most efficacious","The most efficacious (highest) but not the most potent","Both the most potent and the most efficacious","The least potent and the least efficacious"],"ans":0,"exp":"Drug A lies furthest left (highest potency, PA > PB > PC) while drug B gives the greatest height (highest efficacy, B > A > C). (Book p19)"},{"id":"PHARM-C7-038","sec":"Graded DRC","page":19,"q":"On the graded DRC, drug B has:","opts":["The greatest efficacy","The greatest potency","The greatest affinity","The lowest efficacy"],"ans":0,"exp":"Efficacy follows the height of the curve, and B has the greatest height, giving the order B > A > C for efficacy. (Book p19)"},{"id":"PHARM-C7-039","sec":"Graded DRC","page":19,"q":"In the graded DRC table, affinity is described as:","opts":["Comparable between drugs of the same mechanism of action","Comparable between drugs of different mechanisms of action","Determined by the height of the curve","Independent of the position of the curve"],"ans":0,"exp":"Affinity is comparable between drugs of the same MOA, and only between parallel lines; more to the left means higher affinity. (Book p19)"},{"id":"PHARM-C7-040","sec":"Graded DRC","page":19,"q":"As per the affinity column, affinity can be compared only between:","opts":["Parallel lines","Non-parallel lines","The highest curves","The leftmost curves"],"ans":0,"exp":"The table notes affinity is comparable between drugs of the same MOA - determined graphically 'only comparable between parallel lines'. (Book p19)"},{"id":"PHARM-C7-041","sec":"Graded DRC","page":19,"q":"In the graded DRC table, the comparative order of affinity is:","opts":["A > B, because drug C is not parallel","B > A > C","PA > PB > PC","C > A > B"],"ans":0,"exp":"With C not parallel to the others, affinity can only be compared between A and B - the table gives A > B. (Book p19)"},{"id":"PHARM-C7-042","sec":"Graded DRC","page":19,"q":"Drug C in the graded DRC is excluded from the affinity comparison because:","opts":["C is not parallel to the other curves","C has the lowest efficacy","C is the least potent","C is an antagonist"],"ans":0,"exp":"The affinity column states the comparison holds only between parallel lines, and the table records 'A > B (C is not parallel)'. (Book p19)"},{"id":"PHARM-C7-043","sec":"Graded DRC","page":19,"q":"Which statement correctly distinguishes efficacy from potency on a graded DRC?","opts":["Efficacy is judged by the height of the curve and potency by its position on the x-axis","Efficacy is judged by the position and potency by the height","Both are judged by the height of the curve","Both are judged by the slope of the curve"],"ans":0,"exp":"Height of the curve gives efficacy, while position along the log dose axis gives potency - the further left, the more potent. (Book p19)"},{"id":"PHARM-C7-044","sec":"Drug Receptor Interactions","page":19,"q":"The effect of a full agonist upon binding to its receptor is:","opts":["Maximum effect","Submaximal effect","No effect","Opposite to the nature of the receptor"],"ans":0,"exp":"The drug receptor interaction table gives full agonists a maximum effect (curve A). (Book p19)"},{"id":"PHARM-C7-045","sec":"Drug Receptor Interactions","page":19,"q":"The effect of a partial agonist upon binding to its receptor is:","opts":["Submaximal effect","Maximum effect","No effect","Opposite effect"],"ans":0,"exp":"Partial agonists produce a submaximal effect (curve B), less than a full agonist whatever the dose. (Book p19)"},{"id":"PHARM-C7-046","sec":"Drug Receptor Interactions","page":19,"q":"An antagonist, upon binding to its receptor, produces:","opts":["No effect","Maximum effect","Submaximal effect","An effect opposite to the receptor's nature"],"ans":0,"exp":"Antagonists have no effect of their own upon binding (curve C) - their action is seen only in the presence of an agonist. (Book p19)"},{"id":"PHARM-C7-047","sec":"Drug Receptor Interactions","page":19,"q":"An inverse agonist, upon binding to its receptor, produces:","opts":["An effect opposite to the nature of the receptor","No effect","A submaximal effect","A maximal effect"],"ans":0,"exp":"The inverse agonist produces an effect opposite to the nature of the receptors (curve D), falling below the baseline of no effect. (Book p19)"},{"id":"PHARM-C7-048","sec":"Drug Receptor Interactions","page":19,"q":"In terms of net effect in the body when endogenous full agonists are present, a partial agonist produces:","opts":["Mild antagonism (opposite effect)","Moderate antagonism","Severe antagonism","No antagonism at all"],"ans":0,"exp":"With endogenous full agonists present, partial agonists give mild antagonism, antagonists moderate antagonism and inverse agonists severe antagonism. (Book p19)"},{"id":"PHARM-C7-049","sec":"Drug Receptor Interactions","page":19,"q":"Which agent produces moderate antagonism of endogenous full agonists?","opts":["Antagonist","Partial agonist","Inverse agonist","Full agonist"],"ans":0,"exp":"The table's net effect row reads: partial agonist - mild antagonism, antagonist - moderate antagonism, inverse agonist - severe antagonism. (Book p19)"},{"id":"PHARM-C7-050","sec":"Drug Receptor Interactions","page":19,"q":"Which agent produces severe antagonism of endogenous full agonists?","opts":["Inverse agonist","Antagonist","Partial agonist","Full agonist"],"ans":0,"exp":"Inverse agonists produce an effect opposite to the receptor's nature, which in the presence of endogenous full agonists amounts to severe antagonism. (Book p19)"},{"id":"PHARM-C7-051","sec":"Drug Receptor Interactions","page":19,"q":"Intrinsic efficacy, the mathematical representation of efficacy, for a FULL agonist is:","opts":["+1","0","Between 1 and 0","-1"],"ans":0,"exp":"The table assigns intrinsic efficacy +1 to full agonists, between 1 and 0 to partial agonists, 0 to antagonists and -1 to inverse agonists. (Book p19)"},{"id":"PHARM-C7-052","sec":"Drug Receptor Interactions","page":19,"q":"The intrinsic efficacy of a partial agonist lies:","opts":["Between 1 and 0","Exactly 1","Exactly 0","Exactly -1"],"ans":0,"exp":"Partial agonists have an intrinsic efficacy between 1 and 0 - more than an antagonist but less than a full agonist. (Book p19)"},{"id":"PHARM-C7-053","sec":"Drug Receptor Interactions","page":19,"q":"The intrinsic efficacy of an antagonist is:","opts":["0","+1","-1","Between 1 and 0"],"ans":0,"exp":"Antagonists have an intrinsic efficacy of 0, which corresponds to producing no effect upon binding. (Book p19)"},{"id":"PHARM-C7-054","sec":"Drug Receptor Interactions","page":19,"q":"The intrinsic efficacy of an inverse agonist is:","opts":["-1","0","+1","Between 1 and 0"],"ans":0,"exp":"Inverse agonists are given an intrinsic efficacy of -1, matching their effect opposite to the nature of the receptor. (Book p19)"},{"id":"PHARM-C7-055","sec":"Drug Receptor Interactions","page":19,"q":"On the dose-response figure of drug receptor interactions, the curve that dips below the baseline of no effect represents:","opts":["Inverse agonist (D)","Full agonist (A)","Partial agonist (B)","Antagonist (C)"],"ans":0,"exp":"Curve A is maximal (full agonist), B submaximal (partial agonist), C flat at no effect (antagonist) and D falls to the opposite effect (inverse agonist). (Book p19)"},{"id":"PHARM-C7-056","sec":"Drug Receptor Interactions","page":19,"q":"On the drug receptor interaction graph, the flat line at the level of no effect represents:","opts":["Antagonist (C)","Partial agonist (B)","Inverse agonist (D)","Full agonist (A)"],"ans":0,"exp":"Curve C stays at 'no effect' across the dose range - the antagonist, which produces no action of its own. (Book p19)"},{"id":"PHARM-C7-057","sec":"Drug Receptor Interactions","page":19,"q":"According to the note on this page, the type of drug most commonly used among these is:","opts":["Antagonists","Full agonists","Partial agonists","Inverse agonists"],"ans":0,"exp":"The note box states that antagonists are the m/c used, even though they produce no effect of their own. (Book p19)"},{"id":"PHARM-C7-058","sec":"Drug Receptor Interactions","page":19,"q":"Which pair of agents and intrinsic efficacy is correctly matched?","opts":["Partial agonist - between 1 and 0","Full agonist - 0","Antagonist - -1","Inverse agonist - +1"],"ans":0,"exp":"Correct values are +1 for full agonists, between 1 and 0 for partial agonists, 0 for antagonists and -1 for inverse agonists. (Book p19)"},{"id":"PHARM-C7-059","sec":"Drug Receptor Interactions","page":19,"q":"A patient on a full agonist for asthma is given a partial agonist at the same receptor. Which effect is expected?","opts":["Mild antagonism, because the partial agonist produces only a submaximal effect","Severe antagonism with complete loss of effect","No change, because both are agonists","An effect opposite to the receptor's nature"],"ans":0,"exp":"With an endogenous full agonist present, a partial agonist produces only a submaximal effect and therefore mild antagonism. (Book p19)"},{"id":"PHARM-C7-060","sec":"Drug Receptor Interactions","page":19,"q":"Comparing curves, which statement about a full versus a partial agonist is correct?","opts":["A full agonist reaches a maximal effect while a partial agonist plateaus at a submaximal effect","A partial agonist reaches a maximal effect while a full agonist is submaximal","Both reach the same maximal effect at different doses","Neither can be compared on a graded dose response curve"],"ans":0,"exp":"In the figure, A (full agonist) rises to maximal, B (partial agonist) plateaus at submaximal, C (antagonist) stays at no effect and D (inverse agonist) moves to the opposite effect. (Book p19)"},{"id":"PHARM-C8-001","sec":"Types of Antagonism","page":20,"q":"Physical antagonism produces its effect by:","opts":["Physical binding to the substance","Binding and neutralising the substance","Acting on a receptor opposite to the agonist","Inhibiting the metabolising enzyme"],"ans":0,"exp":"The page defines physical antagonism as an effect produced by physical binding to the substance, without any chemical reaction or receptor involvement. (Book p20)"},{"id":"PHARM-C8-002","sec":"Types of Antagonism","page":20,"q":"Charcoal given in alcohol toxicity is an example of:","opts":["Physical antagonism","Chemical antagonism","Physiological antagonism","Non-competitive antagonism"],"ans":0,"exp":"The book's example under physical antagonism is charcoal in alcohol toxicity, where charcoal simply binds (adsorbs) alcohol. (Book p20)"},{"id":"PHARM-C8-003","sec":"Types of Antagonism","page":20,"q":"How does charcoal act in alcohol toxicity?","opts":["It adsorbs alcohol from the intestine","It neutralises alcohol chemically in the stomach","It blocks alcohol receptors in the brain","It increases alcohol metabolism in the liver"],"ans":0,"exp":"The bracket after the example reads 'charcoal adsorbs alcohol from intestine' - a purely physical, adsorptive binding. (Book p20)"},{"id":"PHARM-C8-004","sec":"Types of Antagonism","page":20,"q":"Chemical antagonism means the antagonist:","opts":["Binds and neutralises the substance","Binds the substance physically without reaction","Acts through a receptor of opposite type","Displaces the agonist from its receptor"],"ans":0,"exp":"The heading 'Chemical Antagonism' is explained as 'Effect by binding & neutralizing the substance'. (Book p20)"},{"id":"PHARM-C8-005","sec":"Types of Antagonism","page":20,"q":"Heparin is neutralised by:","opts":["Protamine sulphate","Charcoal","Salbutamol","Calcium gluconate"],"ans":0,"exp":"The diagram shows heparin (acid, -ve) being neutralised by protamine sulphate (base, +ve) - the classic chemical antagonism. (Book p20)"},{"id":"PHARM-C8-006","sec":"Types of Antagonism","page":20,"q":"In the heparin-protamine pair, heparin is ____ and protamine sulphate is ____:","opts":["Acid (-ve); base (+ve)","Base (+ve); acid (-ve)","Acid (+ve); base (-ve)","Neutral; charged"],"ans":0,"exp":"The page marks heparin as 'Acid : -ve' and protamine sulphate as 'Base : +ve', which is why the two combine chemically. (Book p20)"},{"id":"PHARM-C8-007","sec":"Types of Antagonism","page":20,"q":"Which cells are noted to contain heparin?","opts":["Mast cells","Hepatocytes","Platelets only","Plasma cells"],"ans":0,"exp":"The note under chemical antagonism states 'mast cells contain heparin'. (Book p20)"},{"id":"PHARM-C8-008","sec":"Types of Antagonism","page":20,"q":"Which of the following is the example of a chelating agent for iron?","opts":["Deferiprone","Protamine sulphate","Charcoal","Ipratropium"],"ans":0,"exp":"Under 'Chelating agents' the book lists Fe : Dexrazoxane, Deferiprone - both are iron chelators. (Book p20)"},{"id":"PHARM-C8-009","sec":"Types of Antagonism","page":20,"q":"Copper is removed using:","opts":["Copper chelating agents","Protamine sulphate","Charcoal adsorption","β2 agonists"],"ans":0,"exp":"The chelating agent list on the page gives 'Copper : Copper chelating agents'. (Book p20)"},{"id":"PHARM-C8-010","sec":"Types of Antagonism","page":20,"q":"Physiological antagonism is defined as:","opts":["Opposite effect produced by acting on different receptors","Binding of the drug to a physiological salt","Neutralisation of the drug by a chemical","Irreversible binding to the same receptor"],"ans":0,"exp":"The page defines physiological antagonism as 'Opposite effect by acting on the different receptors'. (Book p20)"},{"id":"PHARM-C8-011","sec":"Types of Antagonism","page":20,"q":"Histamine acting on H1 receptors causes:","opts":["Bronchoconstriction","Bronchodilation","Vasodilation of bronchial vessels","Uterine relaxation"],"ans":0,"exp":"In the physiological antagonism example, 'Histamine -(+)→ H1 causes → Bronchoconstriction'. (Book p20)"},{"id":"PHARM-C8-012","sec":"Types of Antagonism","page":20,"q":"Which pair is used as the example of physiological antagonism of histamine?","opts":["Adrenaline and salbutamol acting on β2","Heparin and protamine sulphate","Charcoal and alcohol","M1 and M2 receptors"],"ans":0,"exp":"Both adrenaline and salbutamol are shown acting on β2 receptors to cause bronchodilation, opposing the H1-mediated bronchoconstriction. (Book p20)"},{"id":"PHARM-C8-013","sec":"Types of Antagonism","page":20,"q":"In the page's flow, histamine causes bronchoconstriction while adrenaline and salbutamol cause:","opts":["Bronchodilation via β2","Bronchoconstriction via β2","Bronchodilation via H1","Mucus secretion via M3"],"ans":0,"exp":"The two arms of the example meet at the airway: H1 → bronchoconstriction, β2 → bronchodilation. (Book p20)"},{"id":"PHARM-C8-014","sec":"Types of Antagonism","page":20,"q":"Which drug does the page call the best bronchodilator in asthma?","opts":["Salbutamol","Ipratropium","Tiotropium","Theophylline"],"ans":0,"exp":"An arrow from the salbutamol/adrenaline line carries the note 'Best bronchodilator in Asthma'. (Book p20)"},{"id":"PHARM-C8-015","sec":"Types of Antagonism","page":20,"q":"Why is salbutamol NOT the best bronchodilator in COPD?","opts":["Because of cholinergic effects","Because it is a β2 blocker","Because it has no bronchodilator action in COPD","Because it causes bronchoconstriction"],"ans":0,"exp":"The note says 'Salbutamol not the best bronchodilator in COPD due to cholinergic effects'. (Book p20)"},{"id":"PHARM-C8-016","sec":"Types of Antagonism","page":20,"q":"Instead of salbutamol, which drug class is preferred for bronchodilation in COPD?","opts":["Parasympathetic blockers such as ipratropium/tiotropium","β2 agonists such as ritodrine","Phosphodiesterase 3 inhibitors such as milrinone","Iron chelators"],"ans":0,"exp":"The note advises 'use Ipratropium/Tiotropium instead (Parasympathetic blocker)'. (Book p20)"},{"id":"PHARM-C8-017","sec":"Types of Antagonism","page":20,"q":"Which of the following is a physical antagonist?","opts":["Charcoal","Protamine sulphate","Ipratropium","Fasudil"],"ans":0,"exp":"Only charcoal acts by physical binding/adsorption; protamine is a chemical antagonist and ipratropium/fasudil act through receptors/enzymes. (Book p20)"},{"id":"PHARM-C8-018","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":20,"q":"In the antagonism table, row (a) depicts:","opts":["Normal effect with drug (A)","Addition of antagonist drug (B)","Effect on (A) of increasing drug (A)","Effect of enzyme inhibition"],"ans":0,"exp":"Row 'a' of the two-column table is headed 'Normal effect with drug (A)', showing the baseline response. (Book p20)"},{"id":"PHARM-C8-019","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":20,"q":"On the receptor drawing, drug (A) normally binds to the:","opts":["Enzymatic part","Allosteric part","Lipid bilayer","G-protein subunit"],"ans":0,"exp":"In row (a) the labelled arrow from (A) points to the 'Enzymatic part' of the receptor, while the lower site is marked 'Allosteric part'. (Book p20)"},{"id":"PHARM-C8-020","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":20,"q":"In competitive reversible antagonism, the antagonist (B) binds at the:","opts":["Same site as the agonist (A)","Allosteric site only","Second messenger","GTP binding site"],"ans":0,"exp":"Row (b) shows (A) and (B) competing for the same binding site of the receptor. (Book p20)"},{"id":"PHARM-C8-021","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":20,"q":"In non-competitive (and competitive irreversible) antagonism, the antagonist (B) binds at the:","opts":["Allosteric part","Enzymatic part","Same site as (A)","Receptor's lipid tail"],"ans":0,"exp":"Row (b) of the non-competitive column shows (A) at the enzymatic part and (B) binding the allosteric part. (Book p20)"},{"id":"PHARM-C8-022","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":20,"q":"Row (c) of the table studies:","opts":["Effect on (A) of increasing the dose of drug (A)","Effect of adding a second antagonist","Effect of removing drug (A)","Effect of adding an enzyme inducer"],"ans":0,"exp":"Row 'c' is headed 'Effect on A of ↑ drug (A)' - i.e. what happens when the agonist concentration is raised. (Book p20)"},{"id":"PHARM-C8-023","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":20,"q":"On increasing drug (A) in reversible competitive antagonism, the response:","opts":["Returns, because the antagonism is surmountable","Remains fully blocked","Is permanently abolished","Becomes toxic"],"ans":0,"exp":"Row (c) of the reversible column shows more (A) molecules out-competing (B), so the effect can be restored by raising the agonist dose. (Book p20)"},{"id":"PHARM-C8-024","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":20,"q":"On increasing drug (A) in competitive irreversible/non-competitive antagonism, the result written is:","opts":["'B - No change'","'Full reversal of blockade'","'Increased efficacy'","'Decreased Km'"],"ans":0,"exp":"The bottom cell of the non-competitive column carries the note '(B) No change' - raising (A) cannot overcome the block. (Book p20)"},{"id":"PHARM-C8-025","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"In the continued table, the 'net effect of drug (A)' in reversible competitive antagonism shows:","opts":["An upward arrow (effect restored)","No change","A downward arrow","A biphasic response"],"ans":0,"exp":"The 'Net effect of drug (A)' row has an up arrow under reversible competitive antagonism and 'No change' under the other column. (Book p21)"},{"id":"PHARM-C8-026","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"In the continued table, the 'net effect of drug (A)' with irreversible/non-competitive antagonism shows:","opts":["No change","Increase","Decrease to zero only","Reversal of antagonism"],"ans":0,"exp":"The row 'Net effect of drug (A)' reads 'No change' in the irreversible/non-competitive column. (Book p21)"},{"id":"PHARM-C8-027","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"The dose-response curves drawn for reversible competitive antagonism shift:","opts":["To the right, with the maximum preserved","To the left, with a higher maximum","Downwards only","Do not shift at all"],"ans":0,"exp":"Curves a, b and c are shown moving progressively right with the same height, i.e. a parallel rightward shift of the DRC. (Book p21)"},{"id":"PHARM-C8-028","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"The dose-response curves for competitive irreversible/non-competitive antagonism are labelled:","opts":["'No reversal of antagonism'","'Reversible shift'","'Increase in efficacy'","'Km unchanged'"],"ans":0,"exp":"The right-hand panel writes 'No reversal of antagonism' next to the family of curves a, b, c. (Book p21)"},{"id":"PHARM-C8-029","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"In reversible competitive antagonism, Vmax (α efficacy) shows:","opts":["No change","A fall","A rise","A fall then rise"],"ans":0,"exp":"The Vmax row is 'No change' for competitive reversible antagonism - efficacy is preserved. (Book p21)"},{"id":"PHARM-C8-030","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"In competitive irreversible/non-competitive antagonism, Vmax (α efficacy):","opts":["Falls","Rises","Is unchanged","Doubles"],"ans":0,"exp":"The Vmax row carries a downward arrow in the irreversible/non-competitive column, i.e. efficacy is reduced. (Book p21)"},{"id":"PHARM-C8-031","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"In reversible competitive antagonism, Km (α 1/Potency):","opts":["Increases","Decreases","Is unchanged","Becomes zero"],"ans":0,"exp":"The Km row has an upward arrow for reversible competitive antagonism, while it stays 'No change' for the other column. (Book p21)"},{"id":"PHARM-C8-032","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"In competitive irreversible/non-competitive antagonism, Km (α 1/Potency):","opts":["Shows no change","Increases","Decreases","Becomes infinite"],"ans":0,"exp":"The Km row is 'No change' in the irreversible/non-competitive column; only Vmax falls. (Book p21)"},{"id":"PHARM-C8-033","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"Potency in reversible competitive antagonism:","opts":["Decreases","Increases","Is unchanged","Becomes zero"],"ans":0,"exp":"The final row of the table shows a downward arrow for potency in reversible competitive antagonism (Km ↑ so potency ↓). (Book p21)"},{"id":"PHARM-C8-034","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"Potency in competitive irreversible/non-competitive antagonism:","opts":["Shows no change","Falls","Rises","Rises then falls"],"ans":0,"exp":"The potency row reads 'No change' for the irreversible/non-competitive column. (Book p21)"},{"id":"PHARM-C8-035","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"Which single statement correctly contrasts the two antagonism columns?","opts":["Reversible competitive lowers potency; irreversible/non-competitive lowers efficacy","Reversible competitive lowers efficacy; irreversible/non-competitive lowers potency","Both lower efficacy only","Both lower potency only"],"ans":0,"exp":"Reading the whole table: reversible competitive antagonist → Km ↑, potency ↓, Vmax unchanged; irreversible/non-competitive → Vmax ↓ (efficacy ↓), Km and potency unchanged. (Book p21)"},{"id":"PHARM-C8-036","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"A competitive antagonist shifts the dose-response curve to the right. This means the agonist:","opts":["Needs a higher dose for the same effect","Can never produce its maximal effect","Becomes more potent","Has increased efficacy"],"ans":0,"exp":"A parallel rightward shift means lower potency (higher dose required) while the maximum (efficacy) is still achievable. (Book p21)"},{"id":"PHARM-C8-037","sec":"Competitive Reversible vs Irreversible and Non-competitive Antagonism","page":21,"q":"Which type of antagonism can be surmounted by increasing the agonist dose?","opts":["Competitive reversible","Competitive irreversible","Non-competitive","Neither can be surmounted"],"ans":0,"exp":"Only in the reversible competitive column does raising drug (A) restore the response; irreversible and non-competitive blockade stays. (Book p21)"},{"id":"PHARM-C8-038","sec":"Michaelis-Menten Note: Vmax and Km","page":21,"q":"The note relates the Michaelis-Menten equation to:","opts":["Vmax = maximum effect = efficacy","Vmax = potency","Km = efficacy","Km = clearance"],"ans":0,"exp":"The note reads 'Michaelis-Menten equation → Vmax α maximum effect → Efficacy'. (Book p21)"},{"id":"PHARM-C8-039","sec":"Michaelis-Menten Note: Vmax and Km","page":21,"q":"Vmax is defined as the:","opts":["Maximum velocity of reaction between enzyme and drug (substrate)","Concentration of drug giving half of maximum velocity","Dose of drug producing 50% mortality","Rate of drug elimination"],"ans":0,"exp":"The bullet defines Vmax as 'maximum velocity of reaction between enzyme & drug (substrate)'. (Book p21)"},{"id":"PHARM-C8-040","sec":"Michaelis-Menten Note: Vmax and Km","page":21,"q":"Km is defined as the:","opts":["Concentration of drug at which the speed of reaction is half of its Vmax","Maximum velocity of the enzyme reaction","Dose producing the maximum effect","Concentration of antagonist needed to double the dose ratio"],"ans":0,"exp":"The bullet defines Km as 'conc of drug at which speed of reaction (v) is half of its Vmax'. (Book p21)"},{"id":"PHARM-C8-041","sec":"Michaelis-Menten Note: Vmax and Km","page":21,"q":"In the table, Km is written as being proportional to:","opts":["1/Potency","Efficacy","Vmax","Affinity constant"],"ans":0,"exp":"The row label reads 'Km (α 1/Potency)', linking a higher Km to lower potency. (Book p21)"},{"id":"PHARM-C8-042","sec":"Michaelis-Menten Note: Vmax and Km","page":21,"q":"The relationship Vmax α maximum effect implies that Vmax reflects the drug's:","opts":["Efficacy","Potency","Bioavailability","Half-life"],"ans":0,"exp":"Since maximum effect is efficacy (from the earlier chapter), Vmax is used here as the efficacy marker. (Book p21)"},{"id":"PHARM-C8-043","sec":"Michaelis-Menten Note: Vmax and Km","page":21,"q":"If a drug's Km rises while Vmax stays the same, the drug's potency:","opts":["Falls","Rises","Is unchanged","Becomes zero"],"ans":0,"exp":"Km is inversely proportional to potency, so a rise in Km with unchanged Vmax means reduced potency - the signature of competitive antagonism in the table. (Book p21)"},{"id":"PHARM-C8-044","sec":"Receptors: Ligand Gated Ion Channel Receptors","page":21,"q":"Which receptors are described as the fastest acting receptors?","opts":["Ligand gated ion channel receptors","G protein coupled receptors","Nuclear receptors","Enzymatic receptors"],"ans":0,"exp":"The first point under LGIC receptors states 'Fastest acting receptors'. (Book p21)"},{"id":"PHARM-C8-045","sec":"Receptors: Ligand Gated Ion Channel Receptors","page":21,"q":"The substrate for the GABA-A receptor in the table is:","opts":["Chloride ion channel","Sodium channel","Potassium channel","Calcium channel"],"ans":0,"exp":"The examples table lists GABA-A with substrate 'Chloride ion channel'. (Book p21)"},{"id":"PHARM-C8-046","sec":"Receptors: Ligand Gated Ion Channel Receptors","page":21,"q":"Which of these are listed as glutamate receptor subtypes?","opts":["NMDA, AMPA and kainate","M1, M2 and M3","α1, α2 and β","H1, H2 and H3"],"ans":0,"exp":"Under the Glu receptor the table lists NMDA, AMPA and kainate. (Book p21)"},{"id":"PHARM-C8-047","sec":"Receptors: Ligand Gated Ion Channel Receptors","page":21,"q":"Nicotinic receptor and 5-HT3 receptor, in the substrate column, are shown as:","opts":["Dash (-), i.e. no separate substrate named","Chloride ion channel","NMDA","Guanylate cyclase"],"ans":0,"exp":"For both 'Nicotinic receptor' and '5-HT3' the substrate column simply carries a dash. (Book p21)"},{"id":"PHARM-C8-048","sec":"Receptors: Ligand Gated Ion Channel Receptors","page":21,"q":"GABA-B receptor is a:","opts":["GPCR receptor","Ligand gated ion channel","Nuclear receptor","Tyrosine kinase receptor"],"ans":0,"exp":"The note beside the table clarifies 'GABA-B : GPCR receptor', in contrast -C8-084","sec":"G Protein Coupled Receptor (GPCR)","page":22,"q":"Termination of the G protein signal occurs by:","opts":["Hydrolysis of GTP by the intrinsic GTPase of α","Dephosphorylation of the receptor by a kinase","Reuptake into the nucleus","Degradation of cAMP by adenylate cyclase"],"ans":0,"exp":"The curved arrow labelled 'Intrinsic GTPase activity of (α)' shows GTP hydrolysis turning the G protein off. (Book p22)"},{"id":"PHARM-C8-085","sec":"G Protein Coupled Receptor (GPCR)","page":22,"q":"GPCRs are classified based on:","opts":["Their α subunits (subtypes)","The number of transmembrane domains","The type of ion conducted","The nuclear site of action"],"ans":0,"exp":"The note states 'GPCRs are classified based on subtypes' and the accompanying table maps α subtypes to GPCR types. (Book p22)"},{"id":"PHARM-C8-086","sec":"G Protein Coupled Receptor (GPCR)","page":22,"q":"The α subtype 's' corresponds to which GPCR type?","opts":["Gs","Gq","Gi","G12/13"],"ans":0,"exp":"The table pairs the α subtypes column (s, q, i) with GPCR types Gs, Gq and Gi respectively. (Book p22)"},{"id":"PHARM-C8-087","sec":"G Protein Coupled Receptor (GPCR)","page":22,"q":"The α subtype 'q' corresponds to which GPCR type?","opts":["Gq","Gs","Gi","Go"],"ans":0,"exp":"The α subtype table maps q → Gq. (Book p22)"},{"id":"PHARM-C8-088","sec":"G Protein Coupled Receptor (GPCR)","page":22,"q":"The α subtype 'i' corresponds to which GPCR type?","opts":["Gi","Gs","Gq","G12/13"],"ans":0,"exp":"The α subtype table maps i → Gi. (Book p22)"},{"id":"PHARM-C8-089","sec":"Gs Subtype","page":23,"q":"Stimulation of Gs leads to activation of:","opts":["Adenylate cyclase","Phospholipase C","Rho-kinase","Guanylate cyclase"],"ans":0,"exp":"The Gs cascade runs Gs → αs-GTP → (+) Adenylate cyclase. (Book p23)"},{"id":"PHARM-C8-090","sec":"Gs Subtype","page":23,"q":"In the Gs pathway, the immediate effect of adenylate cyclase is:","opts":["↑ Cyclic AMP","↓ Cyclic AMP","↑ IP3","↓ Ca2+"],"ans":0,"exp":"The ne const UNITS = [{"id":"PHARM-U1-1","ch":1,"n":1,"title":"PK vs PD: The Two Definitions","sec":"INTRODUCTION TO PHARMACOKINETICS AND PHARMACODYNAMICS · p1","qs":["PHARM-C1-001","PHARM-C1-002","PHARM-C1-003","PHARM-C1-004"],"guide":"Pharmacokinetics is the study of a drug's movement through the body after intake by any route; pharmacodynamics is the change the drug induces in the body. The figure flags absorption, distribution, metabolism and excretion as the kinetic processes, and the drug, its binding to the target and the resulting effect as the dynamic events."},{"id":"PHARM-U1-2","ch":1,"n":2,"title":"Absorption → Distribution → Adipose","sec":"Course of drug through the body · p1","qs":["PHARM-C1-005","PHARM-C1-006","PHARM-C1-007","PHARM-C1-008","PHARM-C1-009","PHARM-C1-010","PHARM-C1-011","PHARM-C1-012","PHARM-C1-013"],"guide":"An oral drug is absorbed into the systemic circulation and may be distributed to adipose tissue — some drugs by redistribution. Adipose-seeking drugs are very short acting, highly lipid soluble and cross the BBB, like the anaesthetics propofol and thiopentone."},{"id":"PHARM-U1-3","ch":1,"n":3,"title":"Binding, Metabolism & Excretion","sec":"Course of drug through the body · p1","qs":["PHARM-C1-014","PHARM-C1-015","PHARM-C1-016","PHARM-C1-017","PHARM-C1-018","PHARM-C1-019","PHARM-C1-020","PHARM-C1-021","PHARM-C1-022"],"guide":"The circulating drug binds its target — most drugs bind reversibly — and the effect follows; breakdown of the bond frees the drug back into the circulation. The liver then breaks the remaining drug down to a water-soluble form, which is excreted mostly via the kidney and partly via the gut."},{"id":"PHARM-U2-1","ch":2,"n":1,"title":"Four Ways Across the Biological Membrane","sec":"Absorption · p2","qs":["PHARM-C2-001","PHARM-C2-002","PHARM-C2-003","PHARM-C2-004","PHARM-C2-005","PHARM-C2-006","PHARM-C2-007","PHARM-C2-008"],"guide":"A drug in the intestinal lumen must cross the biological membrane to reach blood. The diagram draws four mechanisms — filtration, simple/passive diffusion (the most common), facilitated diffusion and active transport — with the first three bracketed as ATP-independent and only active transport needing ATP. The legend uses a Y for carrier and a triangle for drug."},{"id":"PHARM-U2-2","ch":2,"n":2,"title":"Filtration & Simple Diffusion: The ATP-Free Routes","sec":"Absorption · p2","qs":["PHARM-C2-009","PHARM-C2-010","PHARM-C2-011","PHARM-C2-012","PHARM-C2-013","PHARM-C2-014","PHARM-C2-015"],"guide":"Filtration pushes the drug through membrane pores (example: subcutaneous insulin) with no ATP; simple/passive diffusion is the commonest mechanism of absorption and moves drug along its concentration gradient, straight through the lipid membrane rather than a pore. Neither uses a carrier and neither burns ATP."},{"id":"PHARM-U2-3","ch":2,"n":3,"title":"Facilitated Diffusion vs Active Transport","sec":"Absorption · p2","qs":["PHARM-C2-016","PHARM-C2-017","PHARM-C2-018","PHARM-C2-019","PHARM-C2-020","PHARM-C2-021","PHARM-C2-022","PHARM-C2-023","PHARM-C2-024","PHARM-C2-025","PHARM-C2-026","PHARM-C2-027"],"guide":"Facilitated diffusion (GLUT receptors) uses a carrier but still runs along the gradient with no ATP, and GLUT absorption is gradient-based. Active transport (SGLT receptors) needs ATP and is independent of the gradient — SGLT1 sits on the small intestine and SGLT2 on the renal tubules. Together these two form 'carrier mediated transport'."},{"id":"PHARM-U2-4","ch":2,"n":4,"title":"P-glycoprotein (MDR1) Pump & First-Pass Efflux","sec":"Active transport: P-glycoprotein pump · p2","qs":["PHARM-C2-028","PHARM-C2-029","PHARM-C2-030","PHARM-C2-031","PHARM-C2-032","PHARM-C2-033","PHARM-C2-034","PHARM-C2-035"],"guide":"P-glycoprotein — the most common ABC pump, also called MDR1 — is an ATP-driven efflux pump. In the small intestine/liver most drugs cross the epithelial cell along the concentration gradient, but some are pumped back into the intestinal lumen, producing first-pass metabolism: the drug is excreted before it ever reaches the systemic circulation."},{"id":"PHARM-U2-5","ch":2,"n":5,"title":"Digoxin Dosing, BBB, Placenta & Hepatocytes","sec":"Significance · p3","qs":["PHARM-C2-036","PHARM-C2-037","PHARM-C2-038","PHARM-C2-039","PHARM-C2-040","PHARM-C2-041","PHARM-C2-042","PHARM-C2-043","PHARM-C2-044","PHARM-C2-045","PHARM-C2-046","PHARM-C2-047","PHARM-C2-048","PHARM-C2-049"],"guide":"Efflux matters clinically: digoxin dosage is calculated on the amount lost to efflux. MDR1 pumps sit at the blood-brain barrier, so the opioid antidiarrhoeal loperamide acts on the GIT but cannot enter the brain; water solubility is another reason drugs stay out of the CNS. Placental MDR1 pumps protect the fetus, and hepatocyte MDR1 pumps drive bile acid excretion."},{"id":"PHARM-U2-6","ch":2,"n":6,"title":"Pgp-Driven Resistance in Bacteria & Tumour Cells","sec":"In bacteria/tumour cell · p3","qs":["PHARM-C2-050","PHARM-C2-051","PHARM-C2-052","PHARM-C2-053"],"guide":"The flowchart is short and ruthless: a bacterial or tumour cell develops a Pgp pump, the pump effluxes the drug, and the cell becomes resistant — the same pump that handles normal drugs becomes the engine of treatment failure."},{"id":"PHARM-U2-7","ch":2,"n":7,"title":"Substrates, Inducers & Inhibitors of Pgp","sec":"Pharmacological significance · p4","qs":["PHARM-C2-054","PHARM-C2-055","PHARM-C2-056","PHARM-C2-057","PHARM-C2-058","PHARM-C2-059","PHARM-C2-060","PHARM-C2-061","PHARM-C2-062","PHARM-C2-063","PHARM-C2-064","PHARM-C2-065","PHARM-C2-066","PHARM-C2-067"],"guide":"Three columns summarise Pgp pharmacology: substrates (loperamide, cyclosporine, digoxin) are pumped out; inducers (rifampicin, phenytoin, phenobarbital — like enzyme inducers) raise pump numbers and cause drug failure; inhibitors (verapamil, amiodarone, quinidine, cyclosporine, itraconazole, neratinib, erythromycin/clarithromycin) lower pump numbers and cause drug toxicity. Cyclosporine is both substrate and inhibitor."},{"id":"PHARM-U2-8","ch":2,"n":8,"title":"Effects of Pgp Blockade: The Interaction Table","sec":"Effects of blockade · p4","qs":["PHARM-C2-068","PHARM-C2-069","PHARM-C2-070","PHARM-C2-071","PHARM-C2-072","PHARM-C2-073","PHARM-C2-074","PHARM-C2-075","PHARM-C2-076"],"guide":"The blockade table is pure exam gold: rifampicin → digoxin failure, clarithromycin → digoxin toxicity, cyclosporine → cholestatic jaundice, verapamil → reversal of drug resistance in cancer and bacteria, and quinidine → loperamide-induced central side effects. Each entry is a clinical interaction driven by the efflux pump."},{"id":"PHARM-U2-9","ch":2,"n":9,"title":"Passive Diffusion: The Lipid-Solubility Rule","sec":"Passive Diffusion · p4","qs":["PHARM-C2-077","PHARM-C2-078","PHARM-C2-079","PHARM-C2-080","PHARM-C2-081","PHARM-C2-082","PHARM-C2-083","PHARM-C2-084","PHARM-C2-085"],"guide":"Passive diffusion obeys one rule: lipid-soluble wins. A non-polar, unionised, neutral drug diffuses across the lipid membrane and is absorbed; a polar, ionised or charged drug is repelled by the charged membrane proteins, is lipid insoluble/water soluble, is not absorbed and is finally excreted."},{"id":"PHARM-U3-1","ch":3,"n":1,"title":"The Criteria Table: LUNA for Absorption, WIPE for Excretion","sec":"Ionization of drugs · p5","qs":["PHARM-C3-001","PHARM-C3-002","PHARM-C3-003","PHARM-C3-004","PHARM-C3-005","PHARM-C3-006","PHARM-C3-007","PHARM-C3-008","PHARM-C3-009","PHARM-C3-010"],"guide":"One table decides everything: to be absorbed a drug must be lipid soluble, unionised, non-polar with the medium's pH equal to the drug's, and to be excreted it must be water soluble, ionised, polar with the pH of drug and medium unequal. The mnemonics are LUNA for absorption and WIPE for excretion."},{"id":"PHARM-U3-2","ch":3,"n":2,"title":"Acidic in Acid, Basic in Base — and the Duodenum Rule","sec":"Unionization · p5","qs":["PHARM-C3-011","PHARM-C3-012","PHARM-C3-013","PHARM-C3-014","PHARM-C3-015","PHARM-C3-016","PHARM-C3-017"],"guide":"An acidic drug (aspirin) is unionised in the acidic stomach and a basic drug in the basic small intestine. Yet the unionised drug is maximally absorbed in the small intestine — duodenum — simply because of its enormous surface area, which beats the stomach's favourable pH."},{"id":"PHARM-U3-3","ch":3,"n":3,"title":"Short Bowel Syndrome: Lose the Gut, Lose the Drug","sec":"Short bowel syndrome · p5","qs":["PHARM-C3-018","PHARM-C3-019","PHARM-C3-020"],"guide":"Resection of the small intestine reduces drug absorption, so an oral drug may fail. Management is to increase the dose or change the route — a direct clinical application of surface-area-driven absorption."},{"id":"PHARM-U3-4","ch":3,"n":4,"title":"Ion Trapping: Alkalinise for Acid, Acidify for Base","sec":"Ionization (excretion) · p5","qs":["PHARM-C3-021","PHARM-C3-022","PHARM-C3-023","PHARM-C3-024","PHARM-C3-025","PHARM-C3-026","PHARM-C3-027","PHARM-C3-028","PHARM-C3-029","PHARM-C3-030","PHARM-C3-031"],"guide":"Excretion needs the drug ionised, hence the pH of drug and medium must differ. Acidic drug toxicity (aspirin, phenobarbital, methotrexate) is treated by alkalinising urine with bicarbonate; basic drug toxicity (amphetamine) by acidifying urine with ammonium chloride — vitamin C and cranberry juice are other urine acidifiers. Ionised drug is trapped and excreted."},{"id":"PHARM-U3-5","ch":3,"n":5,"title":"Henderson-Hasselbalch: Quantifying Ionization","sec":"Henderson - Hasselbach Equation · p6","qs":["PHARM-C3-032","PHARM-C3-033","PHARM-C3-034","PHARM-C3-035","PHARM-C3-036","PHARM-C3-037","PHARM-C3-038","PHARM-C3-039","PHARM-C3-040","PHARM-C3-041"],"guide":"For an acidic drug log [U]/[I] = pKa − pH; for a basic drug the ratio is inverted as log [I]/[U] = pKa − pH. pKa is the pH at which half the drug is ionised. An acidic drug of pKa 4 in gastric pH 2 gives a ratio of 100 — 99% unionised and 1% ionised, which is why absorption can occur."},{"id":"PHARM-U3-6","ch":3,"n
